<title>Verstecken</title>
<style>
:root{
  --bg:#F6F8FB; --card:#FFFFFF; --line:#D6DDE8; --text:#172033; --muted:#586477;
  --acc:#2C7A3F; --acc-soft:#DDEFE1; --on-acc:#FFFFFF;
  --warn:#B93A22; --warn-soft:#F8E7E3;
  --field:#F0F4F9; --shadow:0 1px 0 rgba(23,32,51,.06);
  --head:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light dark;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0E1626; --card:#162136; --line:#2B3A57; --text:#EDF1F8; --muted:#A7B3C6;
    --acc:#7FD99A; --acc-soft:#17362A; --on-acc:#0E1626;
    --warn:#FF8C74; --warn-soft:#3A2329;
    --field:#1B2740; --shadow:none;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 var(--body);-webkit-text-size-adjust:100%;overflow-x:hidden}
body{padding-top:env(safe-area-inset-top,0px)}
body.lock{overflow:hidden}
button,a,input{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button{cursor:pointer;font-family:var(--body)}
.wrap{max-width:560px;margin:0 auto;padding:4px 16px calc(40px + env(safe-area-inset-bottom,0px))}
.top{display:flex;align-items:center;gap:4px;min-height:56px;margin:0 -8px 4px}
.top .ttl{flex:1;min-width:0}
.top h1{margin:0;font:700 20px/1.15 var(--head);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .sub{display:block;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iconbtn{min-width:44px;height:44px;border:0;background:transparent;color:var(--acc);font:600 22px var(--body);border-radius:12px;display:inline-flex;align-items:center;justify-content:center;padding:0 10px;text-decoration:none}
.iconbtn:active{background:var(--line)}
.iconbtn.home{padding:0}
.iconbtn.home svg{width:22px;height:22px}

<body>
<div class="wrap">
  <div class="top">
    <a class="iconbtn home" href="index.html" aria-label="Zur App-Übersicht"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11.2 12 4.5l8 6.7"/><path d="M6.2 9.8V19a1 1 0 0 0 1 1h9.6a1 1 0 0 0 1-1V9.8"/><path d="M10 20v-5h4v5"/></svg></a>
    <div class="ttl"><h1 id="ttl">Verstecken</h1><span class="sub" id="sub"></span></div>
    <span class="syncpill" id="sync"></span>

  <div class="sheetbg" data-act="sheetBg"></div>

</div>
<div id="toast"></div>

<script>
'use strict';
/* ==== Verstecken – Suchen und Verstecken mit Standort-Abfrage ====
   Ein Spiel ist ein Datensatz in „trips“ auf dem Pi (verschlüsselt). Der Session-Code ist das Geheimnis:
   PBKDF2 (200.000 Runden) → HKDF → Datensatz-ID, Zugangsnachweis (X-Trip-Auth), AES-GCM-Schlüssel, Push-Geheimnis.
   Jeder Spieler schreibt seinen Standort in einen eigenen Datensatz (ID aus Code + Spieler-ID), damit sich
   gleichzeitiges Senden nicht überschreibt. Die Abfragen kommen als geplante Mitteilungen vom Push-Dienst. */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const te = t => new TextEncoder().encode(t);
const b64e = u8 => { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); };
const b64d = str => { str = String(str).replace(/-/g, '+').replace(/_/g, '/'); while (str.length % 4) str += '='; const b = atob(str), u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; };
const LS = {
  get(k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  raw(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
};
const now = () => Date.now();
const ANDROID = /Android/i.test(navigator.userAgent);
if (ANDROID) {
  document.documentElement.classList.add('android');
  document.getElementById('menuBtn').textContent = '⋮';
  document.querySelectorAll('meta[name=theme-color]').forEach(m => { m.content = /dark/.test(m.media) ? '#101510' : '#F6FBF4'; });
}
const rnd = n => b64e(crypto.getRandomValues(new Uint8Array(n)));
const DEFAULT_SERVER = 'https://kostenpi.tail281e3e.ts.net';
const server = () => LS.raw('verstecken-server') || DEFAULT_SERVER;
const pushServer = () => LS.raw('push-server') || DEFAULT_SERVER + '/push';
const HIST = 12, POLL = 5000, AHEAD = 24, MAX_AGE = 24 * 3600e3;

let S = LS.get('verstecken-state') || {};
if (!S.me || !S.me.id) S.me = { id: rnd(9), name: '' };
if (!S.ui) S.ui = { layer: 'osm' };
const persist = () => LS.set('verstecken-state', S);

/* ---------- Schlüssel ---------- */
const CODE_ABC = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const normCode = s => String(s || '').toUpperCase().split('').filter(c => CODE_ABC.includes(c)).join('').slice(0, 6);
const newCode = () => Array.from(crypto.getRandomValues(new Uint8Array(6)), b => CODE_ABC[b % 32]).join('');
const ID_ABC = 'abcdefghijklmnopqrstuvwxyz0123456789';
const keyCache = new Map();
function keysFor(code) {
  if (!keyCache.has(code)) keyCache.set(code, (async () => {
    const salt = te('verstecken-v1');
    const pw = await crypto.subtle.importKey('raw', te(code), 'PBKDF2', false, ['deriveBits']);
    const master = await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt, iterations: 200000 }, pw, 256);
    const base = await crypto.subtle.importKey('raw', master, 'HKDF', false, ['deriveKey', 'deriveBits']);
    const bits = async info => new Uint8Array(await crypto.subtle.deriveBits({ name: 'HKDF', hash: 'SHA-256', salt, info: te(info) }, base, 256));
    const toId = u => { let s = ''; for (let i = 0; i < 15; i++) s += ID_ABC[u[i] % 36]; return s; };
    const enc = await crypto.subtle.deriveKey({ name: 'HKDF', hash: 'SHA-256', salt, info: te('enc') }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
    const locIds = new Map();
    const locId = pid => { if (!locIds.has(pid)) locIds.set(pid, bits('loc|' + pid).then(toId)); return locIds.get(pid); };
    const push = b64e(await bits('push'));
    return { enc, auth: b64e(await bits('auth')), id: toId(await bits('id')), locId, hide: await chan(push, 'verstecken:hide'), seek: await chan(push, 'verstecken:seek') };
  })());
  return keyCache.get(code);
}
/* Push-Kanal wie im gemeinsamen Mitteilungs-Modul: ID und Schlüssel per HKDF (Salt „push-v1“) */
async function chan(secret, label) {
  const base = await crypto.subtle.importKey('raw', te(secret), 'HKDF', false, ['deriveBits']);
  const bits = async n => new Uint8Array(await crypto.subtle.deriveBits({ name: 'HKDF', hash: 'SHA-256', salt: te('push-v1'), info: te(label + '|' + n) }, base, 256));
  return { id: b64e((await bits('id')).subarray(0, 24)), key: b64e(await bits('key')) };
}
async function encrypt(key, obj) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  return 'v1.' + b64e(iv) + '.' + b64e(new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, te(JSON.stringify(obj)))));
}
async function decrypt(key, str) {
  const p = String(str || '').split('.'); if (p.length !== 3 || p[0] !== 'v1') throw new Error('Unbekanntes Datenformat');
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64d(p[1]) }, key, b64d(p[2]))));
}
async function api(method, path, auth, body) {
  const h = {}; if (auth) h['X-Trip-Auth'] = auth; if (body) h['Content-Type'] = 'application/json';
  const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 15000);
  try {
    const r = await fetch(server() + '/api/collections/trips/records' + path, { method, headers: h, body: body ? JSON.stringify(body) : undefined, cache: 'no-store', signal: ctl.signal });
    let j = null; try { j = await r.json(); } catch (e) {}
    return { status: r.status, json: j };
  } finally { clearTimeout(to); }
}
const errText = e => e && e.name === 'AbortError' ? 'Zeitüberschreitung' : (e && e.message && !/fetch|network|load failed/i.test(e.message) ? e.message : 'keine Verbindung');

/* ---------- Mitteilungen (eigener Geräte-Eintrag beim Push-Dienst, Art „spiele“) ---------- */
const VPush = (() => {
  let st = LS.get('verstecken-push') || {};
  if (!st.dev) st.dev = { id: rnd(18), secret: rnd(24) };
  const save = () => LS.set('verstecken-push', st);
  const standalone = () => { try { return window.navigator.standalone === true || matchMedia('(display-mode: standalone)').matches; } catch (e) { return false; } };
  const supported = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
  async function papi(path, body) {
    const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 15000);
    try {
      const r = await fetch(pushServer() + path, { method: body ? 'POST' : 'GET', headers: body ? { 'Content-Type': 'application/json' } : {}, body: body ? JSON.stringify(body) : undefined, cache: 'no-store', signal: ctl.signal });
      let j = null; try { j = await r.json(); } catch (e) {}
      if (!r.ok) throw new Error((j && j.error) || ('Push-Dienst antwortet mit ' + r.status));
      return j;
    } finally { clearTimeout(to); }
  }
  async function reg() {
    const r = (await navigator.serviceWorker.getRegistration()) || (await navigator.serviceWorker.register('sw.js'));
    await navigator.serviceWorker.ready; return r;
  }
  async function subscription(create) {
    const r = await reg(); let s = await r.pushManager.getSubscription();
    if (!s && create) { const { publicKey } = await papi('/vapid'); s = await r.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64d(publicKey) }); }
    return s;
  }
  function status() {
    if (!supported()) return { state: 'no', text: standalone() || ANDROID ? 'Dieser Browser unterstützt keine Mitteilungen (Chrome verwenden).' : 'Nur in der App vom Home-Bildschirm (Teilen → „Zum Home-Bildschirm“).' };
    if (Notification.permission === 'denied') return { state: 'no', text: ANDROID ? 'Abgelehnt – über das Schloss neben der Adresse bzw. App-Info → Benachrichtigungen erlauben.' : 'Abgelehnt – in den iPhone-Einstellungen unter Mitteilungen erlauben.' };
    if (Notification.permission === 'granted' && st.on) return { state: 'on', text: st.err ? 'Aktiv, letzter Abgleich fehlgeschlagen' : 'Aktiv' };
    return { state: 'off', text: 'Aus' };
  }
  /* aus einem Tipp heraus aufrufen (iOS fragt dann nach der Erlaubnis) */
  async function enable() {
    if (!supported()) throw new Error(status().text);
    if ((await Notification.requestPermission()) !== 'granted') throw new Error('Ohne Erlaubnis keine Mitteilungen.');
    await subscription(true);
    st.on = true; st.sig = ''; save();
  }
  function idb() { return new Promise((res, rej) => { const r = indexedDB.open('verstecken-keys', 1); r.onupgradeneeded = () => r.result.createObjectStore('k'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
  async function storeKeys(map) {
    const db = await idb();
    await new Promise((res, rej) => { const tx = db.transaction('k', 'readwrite'), s = tx.objectStore('k'); s.clear(); Object.entries(map).forEach(([k, v]) => s.put(v, k)); tx.oncomplete = res; tx.onerror = () => rej(tx.error); });
    db.close();
  }
  let busy = null;
  /* gewünschte Kanäle beim Pi hinterlegen: chs = [{id, key}] */
  function sync(chs) {
    if (busy) return busy.then(() => sync(chs));
    const p = (async () => {
      try {
        if (!supported() || Notification.permission !== 'granted') { if (st.on) { st.on = false; save(); } return false; }
        const sub = await subscription(false);
        if (!sub) { if (st.on) { st.on = false; st.sig = ''; save(); } return false; }
        st.on = true;
        const sj = sub.toJSON(), channels = {}; chs.forEach(c => { channels[c.id] = ['spiele']; });
        const sig = chs.length ? JSON.stringify([sj.endpoint, Object.keys(channels).sort()]) : '';

        await storeKeys(Object.fromEntries(chs.map(c => [c.id, c.key])));

<script>
/* ===== Neue Version (gemeinsam für alle Apps, Quelle: essensplanung-quellcode/sw-update.js) =====
   Die App startet sofort aus dem Offline-Speicher; der Service Worker lädt im Hintergrund nach und
   meldet {type:'sw-update'}, wenn eine neuere Fassung bereitliegt. Dann erscheint oben „Neue Version · Neu laden“. */
(function () {
  if (!('serviceWorker' in navigator)) return;
  var shown = false;
  navigator.serviceWorker.addEventListener('message', function (ev) {
    var d = ev.data;
    if (!d || d.type !== 'sw-update' || shown) return;
    var here = location.pathname.replace(/\/$/, '/index.html');
    if (d.page && here.slice(-d.page.length) !== d.page) return;
    shown = true;
    var st = document.createElement('style');
    st.textContent = '#sw-update{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 8px);transform:translateX(-50%);z-index:2147483000;display:flex;align-items:center;gap:6px;min-height:44px;max-width:calc(100vw - 32px);padding:0 18px;border:0;border-radius:22px;font:600 15px/1.2 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#fff;background:#1F2937;box-shadow:0 8px 28px rgba(0,0,0,.28);cursor:pointer;white-space:nowrap;animation:swup .25s ease-out}'
      + '#sw-update b{font-weight:800}#sw-update:active{transform:translateX(-50%) scale(.97)}'
      + '@keyframes swup{from{opacity:0;transform:translate(-50%,-12px)}to{opacity:1;transform:translate(-50%,0)}}'
      + '@media (prefers-color-scheme:dark){#sw-update{color:#111827;background:#F3F4F6}}';
    document.head.appendChild(st);
    var b = document.createElement('button');
    b.id = 'sw-update'; b.type = 'button';
    b.innerHTML = 'Neue Version <b>· Neu laden</b>';
    b.onclick = function () { location.reload(); };
    document.body.appendChild(b);
  });
})();
</script>
</body>
</html>
