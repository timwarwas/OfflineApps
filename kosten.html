<title>Kostenaufteilung</title>
<style>
:root{
  --bg:#F6F8FB; --card:#FFFFFF; --line:#D6DDE8; --text:#172033; --muted:#586477;
  --petrol:#0E6B63; --petrol-ink:#0E6B63; --petrol-soft:#DCEEEA; --on-petrol:#FFFFFF;
  --tomato:#B93A22; --basil:#2B7249; --mustard:#8A5F00;
  --orange:#B93A22; --orange-ink:#B93A22; --orange-soft:#F8E7E3;
  --field:#F0F4F9; --shadow:0 1px 0 rgba(23,32,51,.06);
  --blue:#1E4FA0; --red:#B93A22;
  --barb:max(6px,calc(env(safe-area-inset-bottom,0px) - 20px));
  --head:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light dark;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0E1626; --card:#162136; --line:#2B3A57; --text:#EDF1F8; --muted:#A7B3C6;
    --petrol:#5CC8BB; --petrol-ink:#5CC8BB; --petrol-soft:#15343A; --on-petrol:#0E1626;
    --tomato:#FF8C74; --basil:#72D39B; --mustard:#F0C45C;
    --orange:#FF8C74; --orange-ink:#FF8C74; --orange-soft:#3A2329;
    --field:#1B2740; --shadow:none;
    --blue:#86AAEE; --red:#FF8C74;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 var(--body);-webkit-text-size-adjust:100%;overflow-x:hidden}
body{padding-top:env(safe-area-inset-top,0px)}
body.lock{overflow:hidden}
button,a,input,select{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button{cursor:pointer;font-family:var(--body)}
.wrap{max-width:560px;margin:0 auto;padding:4px 16px calc(144px + env(safe-area-inset-bottom,0px))}
.wrap.exp{padding-bottom:calc(160px + env(safe-area-inset-bottom,0px))}
.top{display:flex;align-items:center;gap:4px;min-height:56px;margin:0 -8px 4px}
.top .ttl{flex:1;min-width:0}
.top h1{margin:0;font:700 20px/1.15 var(--head);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .sub{display:block;font-size:13px;color:var(--muted)}
.iconbtn{min-width:44px;height:44px;border:0;background:transparent;color:var(--petrol-ink);font:600 16px var(--body);border-radius:12px;display:inline-flex;align-items:center;justify-content:center;padding:0 10px;text-decoration:none;flex:none}
.iconbtn:active{background:var(--line)}
.iconbtn.del{color:var(--muted);font-size:18px}
h1.title{font:800 34px/1.05 var(--head);letter-spacing:-.02em;margin:6px 0 8px}
.lead{margin:0 0 18px;color:var(--muted);max-width:34em}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin:0 0 12px;box-shadow:var(--shadow)}
.card h2{margin:0 0 10px;font:700 17px/1.2 var(--head)}
.card h2 .opt{font:500 13px var(--body);color:var(--muted)}
.btn{min-height:48px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--text);font:600 16px var(--body);padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-align:center}
.btn.primary{background:var(--petrol);border-color:var(--petrol);color:#fff}
.btn.danger{background:var(--orange-soft);border-color:transparent;color:var(--orange-ink)}
.btn.block{display:flex;width:100%}
.btn.block+.btn.block{margin-top:8px}
.btn:disabled{opacity:.45}
.btn.sm{min-height:44px;padding:0 12px;font-size:15px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.btnrow .btn{flex:1 1 140px}
.linkbtn{background:none;border:0;color:var(--petrol-ink);font:600 14px var(--body);min-height:44px;padding:0 4px;text-decoration:underline}
label.fl{display:block;font:600 13px var(--body);color:var(--muted);margin:10px 0 6px}
label.fl:first-child{margin-top:0}
.in{width:100%;min-width:0;min-height:48px;border:1px solid var(--line);border-radius:12px;background:var(--field);color:var(--text);font:16px var(--body);padding:0 12px;-webkit-appearance:none;appearance:none}
.in:focus{outline:2px solid var(--petrol);outline-offset:-1px}
.in.big{font:700 24px var(--head)}
input[type=date].in{line-height:46px}
select.in{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 21px,calc(100% - 13px) 21px;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--field);color:var(--text);font:600 15px var(--body);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.on{background:var(--petrol);border-color:var(--petrol);color:#fff}
#catChips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
#catChips .chip{border-radius:14px;white-space:normal;line-height:1.2;text-align:left;padding:6px 10px;font-size:14.5px;display:flex;align-items:center;gap:6px}
.chips.sm .chip{min-height:44px;font-size:14px;padding:0 12px}
.modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.modes .chip{border-radius:12px;padding:0 4px;font-size:14px;white-space:normal;line-height:1.15}
.hint{margin:10px 0 4px}
.muted{color:var(--muted)}
.small{font-size:13px}
.pos{color:var(--petrol-ink)}
.neg{color:var(--orange-ink)}
.note{background:var(--orange-soft);color:var(--orange-ink);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-weight:600;font-size:14px}

/* Aufteilung */
.srow{display:flex;align-items:center;gap:10px;min-height:52px;border-top:1px solid var(--line);padding:4px 0;width:100%}
.srow:first-child{border-top:0}
.srow .nm{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .amt{flex:none;width:86px;text-align:right;font-variant-numeric:tabular-nums;font-size:15px}
.eqrow{background:none;border:0;border-top:1px solid var(--line);color:inherit;font:inherit;text-align:left}
.check{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:inline-flex;align-items:center;justify-content:center;color:transparent;flex:none;font-weight:800;font-size:15px}
.eqrow.on .check{background:var(--petrol);border-color:var(--petrol);color:#fff}
.eqrow:not(.on) .nm{color:var(--muted);font-weight:500}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--field);flex:none}
.stepper button{width:44px;height:44px;border:0;background:transparent;color:var(--petrol-ink);font:700 22px var(--body);line-height:1}
.stepper button:active{background:var(--line)}
.stepper .v{min-width:40px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.minput{width:92px;flex:none;text-align:right;min-height:44px}
.pwrap{display:flex;align-items:center;gap:4px;flex:none}
.pwrap .minput{width:76px}
.item{border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:10px;background:var(--field)}
.item .ih{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.item .ih .in{background:var(--card)}
.item .ih .grow1{flex:1}
.checkline{margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--petrol-soft);color:var(--petrol-ink);font-weight:600;font-size:14px}
.checkline.bad{background:var(--orange-soft);color:var(--orange-ink)}
.quick{display:flex;gap:8px;margin-top:8px}
.quick .btn{flex:1}
.savebar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:8px 16px calc(10px + env(safe-area-inset-bottom,0px));z-index:20}
.savebar .in2{max-width:528px;margin:0 auto}
#saveMsg{color:var(--orange-ink);font-weight:600;min-height:18px;margin-bottom:6px}
#saveMsg:empty{display:none}

/* Übersicht */
.hero .lbl{color:var(--muted);font-size:13px;font-weight:600}
.hero .big{font:800 36px/1.05 var(--head);font-variant-numeric:tabular-nums;letter-spacing:-.02em;margin:2px 0 2px}
.mine{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin-top:12px}
.mine>div{background:var(--field);border-radius:14px;padding:10px 12px}
.mine .mv{font:800 22px/1.15 var(--head);font-variant-numeric:tabular-nums}
.day{font:700 14px var(--body);color:var(--muted);margin:18px 4px 8px}
.entry{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px;margin-bottom:8px;color:inherit;font:inherit;min-height:64px}
.ico{width:40px;height:40px;border-radius:12px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.entry .mid,.grow .mid{flex:1;min-width:0}
.entry .t{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.entry .s{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.entry .r{text-align:right;flex:none;font-variant-numeric:tabular-nums}
.entry .r b{display:block}
.entry .r span{font-size:13px;color:var(--muted)}
.empty{text-align:center;padding:22px 16px}
.empty p{margin:0 0 12px}
.fab{position:fixed;right:max(16px,calc(50vw - 264px));bottom:calc(72px + var(--barb));min-height:56px;padding:0 22px;border-radius:28px;background:var(--petrol);color:#fff;border:0;font:700 17px var(--body);box-shadow:0 6px 18px rgba(14,107,99,.35);z-index:11}
/* Untere Navigation: schwebende Glas-Leiste („Liquid Glass“) */
.tabbar{position:fixed;left:12px;right:12px;bottom:var(--barb);max-width:520px;margin:0 auto;border-radius:28px;padding:4px;z-index:10;
  background:color-mix(in srgb,var(--card) 24%,transparent);
  border:1px solid color-mix(in srgb,#fff 60%,transparent);border-top-color:color-mix(in srgb,#fff 80%,transparent);
  -webkit-backdrop-filter:blur(14px) saturate(200%) brightness(1.04);backdrop-filter:blur(14px) saturate(200%) brightness(1.04);
  box-shadow:0 10px 30px rgba(15,25,45,.16),0 1px 3px rgba(15,25,45,.08),inset 0 1px 0 rgba(255,255,255,.55)}
.tabbar .in2{display:flex;gap:2px}
.tab{flex:1;min-width:0;min-height:50px;border:0;border-radius:24px;background:none;color:var(--muted);font:600 12px var(--body);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:5px 2px 4px;transition:background .2s,color .2s}
.tab .ti{display:block;width:24px;height:24px}
.tab .ti svg{display:block;width:24px;height:24px}
.tab.on{color:var(--petrol-ink);background:color-mix(in srgb,var(--petrol) 13%,transparent)}
@media (prefers-color-scheme: dark){
  .tabbar{background:color-mix(in srgb,var(--card) 36%,transparent);border-color:rgba(255,255,255,.14);border-top-color:rgba(255,255,255,.22);
    box-shadow:0 10px 30px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.08)}
  .tab.on{background:color-mix(in srgb,var(--petrol) 24%,transparent)}
}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.tabbar{background:var(--card)}}
@media (prefers-reduced-transparency: reduce){.tabbar{background:var(--card);-webkit-backdrop-filter:none;backdrop-filter:none}}

/* Reisen */
.grow{display:flex;align-items:center;gap:12px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:10px;text-align:left;color:inherit;font:inherit;min-height:72px}
.grow .t{font:700 19px/1.2 var(--head)}
.chev{color:var(--muted);font-size:26px;flex:none}
details.arch{margin-top:18px}
details.arch summary{min-height:44px;display:flex;align-items:center;font-weight:700;color:var(--muted);cursor:pointer}
.foot{text-align:center;color:var(--muted);font-size:13px;margin-top:22px}

/* Abrechnung */
.bal{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.bal:first-of-type{border-top:0}
.bal .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bal .v{font-weight:700;font-variant-numeric:tabular-nums}
.bar{grid-column:1/-1;position:relative;height:10px;border-radius:5px;background:var(--field);border:1px solid var(--line)}
.bar::after{content:"";position:absolute;left:50%;top:-4px;bottom:-4px;width:2px;margin-left:-1px;background:var(--muted);opacity:.5}
.bar i{position:absolute;top:0;bottom:0}
.bar i.p{left:50%;background:var(--petrol);border-radius:0 5px 5px 0}
.bar i.n{right:50%;background:var(--orange);border-radius:5px 0 0 5px}
.sumline{margin:0 0 6px}
.tr{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.tr:first-of-type{border-top:0}
.tr .who{flex:1;min-width:0}
.tr .btn.pp{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:#003087;border-color:#9DB8E8;flex:none}
.tr .btn.pp svg{width:18px;height:18px}
.badge.pp{background:#E5EDFA;color:#003087;margin-left:6px}
.pphint{margin:8px 0 0}
.pphint .btn{margin-top:8px}
@media (prefers-color-scheme:dark){.tr .btn.pp{color:#9DC1FF;border-color:#33507F}.badge.pp{background:#1D2C47;color:#9DC1FF}}
.tr .who .n{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr .who .a{font:800 18px var(--head);font-variant-numeric:tabular-nums}
.done .a{font-weight:600;font-size:15px;color:var(--muted)}

/* Personen */
.addrow{display:flex;gap:8px}
.addrow .in{flex:1}
.mrow{padding:8px 0 12px;border-top:1px solid var(--line)}
.mrow:first-of-type{border-top:0}
.mrow .h{display:flex;align-items:center;gap:8px}
.nmb{flex:1;min-width:0;text-align:left;background:none;border:0;color:inherit;font:700 17px var(--body);min-height:44px;padding:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--petrol-soft);color:var(--petrol-ink);flex:none}
.ctl{display:flex;gap:14px;flex-wrap:wrap;margin-top:4px}
.ctl .lab{font-size:12px;color:var(--muted);font-weight:600;margin-bottom:4px}

/* Blätter und Dialoge */
#sheet-root,#ask-root,#pick-root{position:fixed;inset:0;z-index:50;display:none}
#ask-root{z-index:60}
#pick-root{z-index:65}
#sheet-root.open,#ask-root.open,#pick-root.open{display:block}
.scrim{position:absolute;inset:0;background:rgba(20,16,12,.45)}
.sheet{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;max-height:88vh;max-height:88dvh;overflow-y:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:8px 16px calc(16px + env(safe-area-inset-bottom,0px));animation:up .2s ease-out}
.grip{height:24px;margin:-8px -16px 6px;display:flex;align-items:center;justify-content:center;cursor:grab;touch-action:none}
.grip::before{content:"";width:40px;height:5px;border-radius:3px;background:var(--line)}
.datebtn{display:flex;align-items:center;text-align:left;cursor:pointer;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.datebtn .muted{font-weight:400}
.cal{padding:14px 12px}
.calhead{display:flex;align-items:center;justify-content:space-between;gap:4px}
.calhead b{font:700 18px var(--head)}
.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;margin-top:6px}
.calgrid .wd{font-size:12px;font-weight:700;color:var(--muted);text-align:center;padding:4px 0}
.cday{height:44px;min-width:0;border:0;border-radius:12px;background:none;color:var(--text);font:600 16px var(--body);font-variant-numeric:tabular-nums}
.cday.today{box-shadow:inset 0 0 0 1.5px var(--petrol)}
.cday.range{background:var(--petrol-soft);color:var(--petrol-ink)}
.cday.sel{background:var(--petrol);color:#fff}
.cday:disabled{opacity:.28}
.calfoot{display:flex;gap:8px;margin-top:10px}
.calfoot .btn{flex:1;min-height:44px;padding:0 8px;font-size:15px;margin:0}
.sheet h2,.dialog h2{font:700 20px/1.2 var(--head);margin:4px 0 10px}
.dialog{position:absolute;left:16px;right:16px;top:50%;transform:translateY(-50%);max-width:420px;margin:0 auto;background:var(--card);border-radius:20px;padding:18px;border:1px solid var(--line)}
.dialog p{margin:0 0 8px;color:var(--muted)}
.dialog .btn{width:100%;margin-top:8px}
textarea.in{min-height:220px;padding:10px 12px;font:16px/1.4 ui-monospace,Menlo,monospace}
@keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.sheet{animation:none}}
#toast{position:fixed;left:50%;bottom:calc(140px + var(--barb));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;max-width:calc(100% - 32px);opacity:0;pointer-events:none;transition:opacity .2s;z-index:70;text-align:center}
#toast.show{opacity:1}
#toast.act{pointer-events:auto;display:flex;align-items:center;gap:14px;padding:6px 6px 6px 16px;text-align:left;width:max-content}
#toast .undo{flex:none;min-height:44px;padding:0 14px;border:0;border-radius:10px;font:700 15px var(--body);color:inherit;background:color-mix(in srgb,var(--bg) 18%,transparent)}
#toast .undo:active{background:color-mix(in srgb,var(--bg) 30%,transparent)}
.tres{padding:8px 0;border-top:1px solid var(--line)}
.tres b{display:block}

.fxbox{margin-top:10px;padding:10px;border-radius:14px;background:var(--field);border:1px solid var(--line)}
.fxbox .in{background:var(--card)}
textarea.in.note{min-height:96px;padding:10px 12px;font:16px/1.4 var(--body);resize:vertical}
.defrow{display:flex;flex-wrap:wrap;align-items:center;gap:0 12px;margin-top:6px}
.filt{padding:10px}
.hits{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:2px 4px 0}
.entry .r span{display:block}
.kpis{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.kpis>div{background:var(--field);border-radius:14px;padding:10px 12px;min-width:0}
.kpis b{display:block;font:800 20px/1.2 var(--head);font-variant-numeric:tabular-nums}
.cstat{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);color:inherit;font:inherit;padding:10px 0;min-height:44px}
.cstat:first-of-type{border-top:0}
.card h2+.cstat,.legend+.cstat{border-top:0}
.top2{display:flex;justify-content:space-between;gap:8px;font-weight:600}
.top2>span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top2>span:last-child{flex:none;font-variant-numeric:tabular-nums}
.hbar{height:10px;border-radius:5px;background:var(--field);margin-top:6px;overflow:hidden}
.hbar i{display:block;height:100%;background:var(--petrol);border-radius:5px}
.hbar.share i{background:var(--muted)}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted);margin-bottom:4px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.cols{display:flex;gap:6px;align-items:flex-end;overflow-x:auto;padding-bottom:4px}
.col{flex:1 0 30px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.colbar{height:120px;width:100%;display:flex;align-items:flex-end;background:var(--field);border-radius:6px;overflow:hidden}
.colbar i{display:block;width:100%;background:var(--petrol);border-radius:6px 6px 0 0}
#syncBadge .sync{white-space:nowrap}
.sync.ok{color:var(--petrol-ink)}
.sync.busy{color:var(--muted)}
.sync.err{color:var(--orange-ink)}
#shareLink{font-size:16px}
/* Menüs: Zeilen mit getönter Symbolkachel */
.mopt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;min-height:56px;padding:9px 14px;border-radius:14px;background:var(--card);border:1px solid var(--line);margin-top:8px;color:var(--text);font:600 16px var(--body)}
.mopt:first-child{margin-top:0}
.mopt .oic{flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--tc);background:color-mix(in srgb,var(--tc) 14%,transparent)}
.mopt .oic svg{width:21px;height:21px}
.mopt .olbl{flex:1;min-width:0}
.mopt small{display:block;font-weight:400;color:var(--muted);font-size:13px;margin-top:1px}
.mopt:active{transform:scale(.985);background:var(--field)}
.tone-petrol{--tc:var(--petrol-ink)}.tone-blue{--tc:var(--blue)}.tone-red{--tc:var(--red)}.tone-grey{--tc:var(--muted)}
.mopt.tone-petrol .olbl{color:var(--petrol-ink)}
.mopt.tone-red .olbl{color:var(--red)}
.mopt.tone-red{border-color:color-mix(in srgb,var(--red) 35%,var(--line))}
.optgap{height:10px}
.sheet .msub{margin:-4px 0 12px;color:var(--muted);font-size:14px}
.sheetfoot{margin-top:14px}
/* Verwaltung im iOS-Listenstil */
.ihead{margin:22px 0 6px 16px;font:600 13px var(--body);text-transform:uppercase;letter-spacing:.03em;color:var(--muted)}
.ihead:first-child{margin-top:6px}
.ilist{background:var(--card);border-radius:18px;overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--line)}
.ifoot{margin:6px 16px 0;font-size:13px;color:var(--muted)}
.gi{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:0 0 0 14px;min-height:52px;color:var(--text);background:none;border:0;font:inherit}
button.gi:active{background:var(--field)}
.gic{width:30px;height:30px;border-radius:8px;flex:none;display:grid;place-items:center;background:var(--c);color:#fff;font:700 15px var(--body)}
.gic svg{width:19px;height:19px}
.gbody{flex:1;min-width:0;display:flex;align-items:center;gap:10px;min-height:52px;padding:8px 14px 8px 0}
.gi+.gi .gbody,.gi+.gperson .gbody,.gperson+.gi .gbody,.gperson+.gperson .gbody{border-top:1px solid var(--line)}
.glbl{flex:1;min-width:0;font-size:16px;font-weight:500;overflow:hidden;text-overflow:ellipsis}
.glbl small{display:block;font-size:13px;color:var(--muted);font-weight:400;margin-top:1px}
.glbl.danger{color:var(--red)}
.gval{color:var(--muted);font-size:15px;text-align:right;white-space:nowrap;max-width:45%;overflow:hidden;text-overflow:ellipsis}
.gchev{width:15px;height:15px;color:var(--muted);opacity:.6;flex:none}
.gi .in{background:var(--field)}
.gform{padding:12px 14px}
.gperson{display:flex;align-items:flex-start;gap:14px;padding:0 0 0 14px}
.gperson .gic{margin-top:11px}
.gperson .gbody{display:block;padding:4px 8px 12px 0}
.gperson .h{display:flex;align-items:center;gap:6px;min-height:44px}
.gperson .nmb{font-size:17px}
.gperson .ctl{gap:12px 16px}
.gperson .iconbtn{color:var(--muted)}
.ilist .linkrow{padding:12px 14px 4px}
.ilist .statusrow{padding:0 14px 12px}
.ilist .statusrow .checkline{margin-top:6px}
.linkrow+.gi .gbody{border-top:1px solid var(--line)}
.statusrow:has(#shareStatus:empty){display:none}
/* Einladen per Benutzername */
.invrow{display:flex;gap:8px;align-items:center}
.invrow .in{flex:1}
.invrow .btn{flex:none}
.invcheck{margin-top:8px;font-size:14px;font-weight:600;color:var(--muted);overflow-wrap:anywhere}
.invcheck:empty{display:none}
.invcheck.ok{color:var(--petrol-ink)}
.invcheck.bad{color:var(--orange-ink)}
.gi .btn.sm{flex:none}
.ifoot+.ilist,.ilist+.ilist{margin-top:22px}
.more{margin-top:8px}
.more .ihead:first-child{margin-top:22px}
.iconbtn svg{width:22px;height:22px}
@media (min-width:800px){
  .wrap{max-width:1180px;padding:12px 28px 48px}
  .wrap.exp{padding-bottom:0}
  .tabbar,.fab{display:none}
  h1.title{font-size:44px}
  .top{margin:0 0 8px}
  .top h1{font-size:24px}
  .top .btn.sm{margin-right:2px;flex:none}
  .glist{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px;margin-bottom:12px}
  .glist .grow{margin:0}
  .btnrow{max-width:640px}
  .more,.ilist,.ihead,.ifoot{max-width:640px}
  .cols2{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:24px;align-items:start}
  .colR{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow-y:auto;padding:0 4px 12px 0;scrollbar-width:thin}
  .seg{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:12px}
  .segb{flex:1;min-height:44px;border:0;border-radius:10px;background:none;color:var(--muted);font:600 15px var(--body);cursor:pointer}
  .segb.on{background:var(--petrol);color:#fff}
  .sheet{top:8vh;bottom:auto;max-height:84vh;border-radius:22px;max-width:520px;padding-top:18px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
  .grip{display:none}
  #toast{bottom:32px}
  .xmodal{position:fixed;inset:0;z-index:40}
  .xscrim{position:absolute;inset:0;background:rgba(20,16,12,.45)}
  .xdlg{position:absolute;left:50%;top:4vh;transform:translateX(-50%);width:min(680px,calc(100vw - 48px));max-height:92vh;overflow-y:auto;background:var(--bg);border-radius:22px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
  .xdlg.anim{animation:fadein .15s ease-out}
  .xdlg .wrap.exp{max-width:none;padding:8px 20px 0}
  .xdlg .savebar{position:sticky;bottom:0;left:auto;right:auto;padding:10px 20px 14px}
  .xdlg .savebar .in2{max-width:none}
  body.xlock{overflow:hidden}
}
@keyframes fadein{from{opacity:0}to{opacity:1}}
/* ==== Querformat: Rand für Notch/Kamera und niedrige Bildschirme (iPhone quer) ==== */
.wrap{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
@media (min-width:800px){.wrap{padding-left:max(28px,env(safe-area-inset-left));padding-right:max(28px,env(safe-area-inset-right))}}
@media (min-width:800px) and (max-height:520px){
  .xdlg{top:0;max-height:100dvh;border-radius:0 0 22px 22px}
  .sheet{top:0;max-height:100dvh;border-radius:0 0 22px 22px}
  .colR{position:static;max-height:none;overflow:visible}
  h1.title{font-size:34px}
}
@media (hover:hover){
  .entry:hover,.grow:hover,.cstat:hover{border-color:var(--petrol)}
  .chip:hover:not(.on){border-color:var(--petrol)}
  .btn:hover{filter:brightness(1.06)}
  .cday:hover:not(:disabled):not(.sel){background:var(--field)}
}
/* ==== Gemeinsamer Stil der Sammlung ==== */
html,body{font:16px/1.45 var(--body)}
body{overflow-x:clip} /* „hidden“ machte body zum Scroll-Container, dann klebt die Kopfzeile nicht */
:focus-visible{outline:3px solid var(--petrol);outline-offset:2px}
/* Kopfzeile wie .top der Essensplanung */
.top{position:sticky;top:0;z-index:20;background:var(--bg);margin:0 -16px 14px;padding:8px 10px 6px 6px;min-height:60px;gap:6px;border-bottom:1px solid var(--line)}
.top h1{font:600 21px/1.2 var(--head);letter-spacing:0}
.top .sub{font-size:13px;color:var(--muted);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iconbtn{color:var(--petrol-ink);font:600 16px var(--body)}
.iconbtn:active{background:var(--petrol-soft)}
.iconbtn.back{gap:2px;padding:0 10px 0 4px}
.iconbtn.back svg{width:24px;height:24px;stroke-width:2.4;flex:none}
.iconbtn.del{color:var(--muted)}
h1.title{font:600 34px/1.1 var(--head);letter-spacing:0;margin:8px 0 8px}
.lead{color:var(--muted);font-size:16px}
/* Karten */
.card{border-radius:16px;padding:14px 16px;box-shadow:var(--shadow)}
.card h2{font:600 19px/1.2 var(--head)}
.card h2 .opt{font:500 13px var(--body)}
/* Knöpfe */
.btn{border:1.5px solid var(--line);background:var(--card);font:700 16px var(--body)}
.btn.primary{background:var(--petrol);border-color:var(--petrol);color:var(--on-petrol)}
.btn.danger{background:color-mix(in srgb,var(--tomato) 9%,var(--card));border-color:color-mix(in srgb,var(--tomato) 35%,var(--line));color:var(--tomato)}
.btn.sm{font-size:15px}
.linkbtn{color:var(--petrol-ink)}
/* Eingaben */
label.fl{font:600 14px var(--body);color:var(--muted)}
.in{background:var(--card);border:1.5px solid var(--line);border-radius:12px;color:var(--text)}
.in:focus{outline:none;border-color:var(--petrol);box-shadow:0 0 0 3px color-mix(in srgb,var(--petrol) 22%,transparent)}
.in.big{font:600 26px var(--head)}
.item .ih .in,.fxbox .in,.gi .in{background:var(--card)}
/* Chips */
.chip{border:1.5px solid var(--line);background:var(--card);color:var(--text);font:600 15px var(--body)}

<script id="logic">
/* ===== Reine Rechenlogik (ohne DOM, in Node testbar) ===== */
function uid(){
  try{ if(typeof crypto!=='undefined'&&crypto.randomUUID) return crypto.randomUUID(); }catch(e){}
  let b;
  try{ b=crypto.getRandomValues(new Uint8Array(16)); }catch(e){ b=Array.from({length:16},()=>Math.floor(Math.random()*256)); }
  b[6]=b[6]&15|64; b[8]=b[8]&63|128;
  const h=Array.from(b,x=>x.toString(16).padStart(2,'0')).join('');
  return h.slice(0,8)+'-'+h.slice(8,12)+'-'+h.slice(12,16)+'-'+h.slice(16,20)+'-'+h.slice(20);
}

/* "1.530,00" / "12,5" / "12.50" / "1530" -> Cent; ungültig/negativ -> null */
function parseEuro(s){
  if(s==null) return null;
  s=String(s).replace(/[\s€\u00a0]/g,'');
  if(!s||s[0]==='-') return null;
  if(s.includes(',')) s=s.replace(/\./g,'').replace(',','.');
  else if(/^\d{1,3}(\.\d{3})+$/.test(s)) s=s.replace(/\./g,'');
  const m=/^(\d+)(?:\.(\d{0,2}))?$/.exec(s);
  if(!m) return null;
  const c=parseInt(m[1],10)*100+parseInt(((m[2]||'')+'00').slice(0,2),10);
  return Number.isSafeInteger(c)&&c<=1e10?c:null;
}
/* Dezimalzahl mit höchstens 2 Nachkommastellen; leer -> null, ungültig -> NaN */
function parseNum(s){
  s=String(s??'').trim().replace(',','.');
  if(!s) return null;
  return /^\d+(\.\d{1,2})?$/.test(s)?parseFloat(s):NaN;
}
function fmtEuro(c,signed){
  const neg=c<0, a=Math.abs(c);
  const e=String(Math.floor(a/100)).replace(/\B(?=(\d{3})+(?!\d))/g,'.');
  return (neg?'−':(signed&&c>0?'+':''))+e+','+String(a%100).padStart(2,'0')+'\u00a0€';
}
function fmtPlain(c){ return Math.floor(c/100)+','+String(c%100).padStart(2,'0'); }
function fmtNum(n){ return String(Math.round(n*100)/100).replace('.',','); }

/* Ganzzahlige Gewichte -> Cent-Beträge; Restcent nach größtem Nachkommaanteil, bei Gleichstand nach Reihenfolge */
function distribute(total,ws){
  const W=ws.reduce((a,b)=>a+b,0);
  if(W<=0) return null;
  const base=ws.map(w=>Math.floor(total*w/W));
  const rem=ws.map(w=>(total*w)%W);
  let left=total-base.reduce((a,b)=>a+b,0);
  const idx=ws.map((_,i)=>i).sort((a,b)=>rem[b]-rem[a]||a-b);
  for(let k=0;k<left;k++) base[idx[k]]++;
  return base;
}

/* split = {mode, weights:{memberId:wert}, items:[{name, priceCents, memberIds}]} */
function computeSplit(total,split,members){
  const ids=members.map(m=>m.id);
  const nameOf=id=>(members.find(m=>m.id===id)||{}).name||'?';
  const w=(split&&split.weights)||{};
  const mode=split&&split.mode;
  const res={ok:false,shares:{},msg:'',info:''};
  ids.forEach(id=>res.shares[id]=0);
  if(!ids.length){res.msg='Es gibt noch keine Personen.';return res;}
  if(mode!=='items'&&!(total>0)){res.msg='Bitte einen Betrag eingeben.';return res;}
  const put=(list,vals)=>list.forEach((id,i)=>res.shares[id]+=vals[i]);

  if(mode==='equal'||mode==='weights'||mode==='nights'){
    let vals=ids.map(id=>{const v=Number(w[id]);return Number.isFinite(v)&&v>0?v:0;});
    if(mode==='equal') vals=vals.map(v=>v>0?1:0);
    const ints=vals.map(v=>Math.round(v*100));
    if(!ints.some(x=>x>0)){
      res.msg=mode==='equal'?'Wähle mindestens eine beteiligte Person.':mode==='weights'?'Die Summe der Anteile ist 0.':'Die Summe der Nächte ist 0.';
      return res;
    }
    put(ids,distribute(total,ints));
    const sum=vals.reduce((a,b)=>a+b,0);
    const unit=total/sum, approx=Number.isInteger(unit)?'':'≈ ';
    const word=mode==='equal'?(sum===1?'Person':'Personen'):mode==='weights'?(sum===1?'Anteil':'Anteile'):(sum===1?'Nacht':'Nächte');
    const per=mode==='equal'?'je Person':mode==='weights'?'je Anteil':'je Nacht';
    res.info=`${fmtNum(sum)} ${word} · ${approx}${fmtEuro(Math.round(unit))} ${per} · Summe ${fmtEuro(total)}`;
    res.ok=true; return res;
  }

  if(mode==='fixed'){
    let fixed=0; const rest=[];
    for(const id of ids){
      const v=w[id];
      if(v==null||v===''){rest.push(id);continue;}
      if(!Number.isSafeInteger(v)||v<0){res.msg=`Ungültiger Betrag bei ${nameOf(id)}.`;return res;}
      res.shares[id]=v; fixed+=v;
    }
    if(fixed>total){res.msg=`Es sind ${fmtEuro(fixed-total)} zu viel verteilt.`;return res;}
    const r=total-fixed;
    if(r>0){
      if(!rest.length){res.msg=`Es sind noch ${fmtEuro(r)} nicht verteilt.`;return res;}
      put(rest,distribute(r,rest.map(()=>1)));
    }
    res.info=`Fest ${fmtEuro(fixed)} · Rest ${fmtEuro(r)}${r>0?` auf ${rest.length} ${rest.length===1?'Person':'Personen'}`:''} · Summe ${fmtEuro(total)}`;
    res.ok=true; return res;
  }

  if(mode==='percent'){
    const ints=[];
    for(const id of ids){
      const v=w[id];
      if(v==null){ints.push(0);continue;}
      if(!Number.isFinite(v)||v<0){res.msg=`Ungültige Prozentangabe bei ${nameOf(id)}.`;return res;}
      ints.push(Math.round(v*100));
    }
    const s=ints.reduce((a,b)=>a+b,0);
    if(s<10000){res.msg=`Es fehlen noch ${fmtNum((10000-s)/100)} %.`;return res;}
    if(s>10000){res.msg=`Es sind ${fmtNum((s-10000)/100)} % zu viel.`;return res;}
    put(ids,distribute(total,ints));
    res.info=`Summe 100 % · ${fmtEuro(total)}`;
    res.ok=true; return res;
  }

  if(mode==='items'){
    const items=(split&&split.items)||[];
    if(!items.length){res.msg='Füge mindestens einen Posten hinzu.';return res;}
    let sum=0;
    for(let i=0;i<items.length;i++){
      const it=items[i], label=`„${(it.name||'').trim()||'Posten '+(i+1)}“`;
      if(!Number.isSafeInteger(it.priceCents)||it.priceCents<=0){res.msg=`Preis fehlt bei ${label}.`;return res;}
      const who=ids.filter(id=>(it.memberIds||[]).includes(id));
      if(!who.length){res.msg=`${label} ist niemandem zugeordnet.`;return res;}
      put(who,distribute(it.priceCents,who.map(()=>1)));
      sum+=it.priceCents;
    }
    res.itemSum=sum;
    if(!(total>0)){res.msg=`Die Posten ergeben ${fmtEuro(sum)}. Bitte den Betrag eintragen.`;return res;}
    if(sum!==total){
      const d=total-sum;
      res.msg=d>0?`Es sind noch ${fmtEuro(d)} nicht verteilt (Posten ${fmtEuro(sum)}, Betrag ${fmtEuro(total)}).`
                 :`Die Posten ergeben ${fmtEuro(-d)} mehr als der Betrag (${fmtEuro(sum)} statt ${fmtEuro(total)}).`;
      return res;
    }
    res.info=`${items.length} ${items.length===1?'Posten':'Posten'} · Summe ${fmtEuro(total)}`;
    res.ok=true; return res;
  }
  res.msg='Unbekannte Aufteilungsart.'; return res;
}

/* Wer wie viel bezahlt hat: mehrere Zahler (payers) oder ein Zahler (paidBy) */
function paidMap(e){
  if(e.payers&&typeof e.payers==='object'&&Object.keys(e.payers).length) return e.payers;
  return {[e.paidBy]:e.amountCents};
}
function balances(g){
  const b={}; g.members.forEach(m=>b[m.id]=0);
  for(const e of g.entries){
    if(e.type==='expense'){
      const p=paidMap(e);
      for(const id in p) b[id]=(b[id]||0)+p[id];
      for(const id in e.shares) b[id]=(b[id]||0)-e.shares[id];
    }else if(e.type==='settlement'){
      b[e.paidBy]=(b[e.paidBy]||0)+e.amountCents;
      b[e.paidTo]=(b[e.paidTo]||0)-e.amountCents;
    }
  }
  return b;
}
function totalExpenses(g){ return g.entries.reduce((s,e)=>s+(e.type==='expense'?e.amountCents:0),0); }
/* Einzelschulden ohne Vereinfachung: pro Ausgabe schuldet jede beteiligte Person dem Zahler (bzw. den Zahlern) etwas */
function naiveDebtCount(g){
  let n=0;
  for(const e of g.entries) if(e.type==='expense'){
    const p=paidMap(e), ids=new Set(Object.keys(p).concat(Object.keys(e.shares||{})));
    const list=[...ids].map(id=>({id,c:(p[id]||0)-((e.shares||{})[id]||0)})).filter(x=>x.c);
    n+=greedy(list).length;
  }
  return n;
}
function greedy(list){
  const a=list.map(x=>({id:x.id,c:x.c})), out=[];
  for(let guard=0;guard<10000;guard++){
    let mi=-1,ma=-1;
    a.forEach((x,i)=>{ if(x.c<0&&(mi<0||x.c<a[mi].c))mi=i; if(x.c>0&&(ma<0||x.c>a[ma].c))ma=i; });
    if(mi<0||ma<0) break;
    const t=Math.min(-a[mi].c,a[ma].c);
    out.push({from:a[mi].id,to:a[ma].id,cents:t});
    a[mi].c+=t; a[ma].c-=t;
  }
  return out;
}
/* Minimale Überweisungen: n − k, k = max. Zahl an Nullsummen-Teilgruppen (Bitmasken-DP bis 15 Personen) */
function minTransfers(bal,order){
  const list=order.filter(id=>bal[id]).map(id=>({id,c:bal[id]}));
  const n=list.length;
  if(!n) return {transfers:[],exact:true,groups:0};
  if(n>15) return {transfers:greedy(list),exact:false,groups:null};
  const N=1<<n, sum=new Float64Array(N), dp=new Int8Array(N), ch=new Int8Array(N);
  for(let m=1;m<N;m++){
    const low=m&-m, i=31-Math.clz32(low);
    sum[m]=sum[m^low]+list[i].c;
    let best=-1,bi=0;
    for(let j=0;j<n;j++) if(m>>j&1){const v=dp[m^(1<<j)]; if(v>best){best=v;bi=j;}}
    dp[m]=best+(sum[m]===0?1:0); ch[m]=bi;
  }
  const groups=[]; let m=N-1, cur=[];
  while(m){ const j=ch[m]; cur.push(j); m^=1<<j; if(sum[m]===0){groups.push(cur);cur=[];} }
  const transfers=[];
  for(const grp of groups){ grp.sort((a,b)=>a-b); transfers.push(...greedy(grp.map(j=>list[j]))); }
  return {transfers,exact:true,groups:groups.length};
}

/* Wechselkurs "1,07" -> 1.07; bis 6 Nachkommastellen; ungültig -> null */
function parseRate(s){
  s=String(s??'').trim().replace(',','.');
  if(!/^\d+(\.\d{1,6})?$/.test(s)) return null;
  const r=parseFloat(s); return r>0&&r<1e6?r:null;
}
function fmtRate(r){ return String(r).replace('.',','); }
function fmtMoney(c,code){ return fmtEuro(c).replace('€',code); }
function pad2(n){ return String(n).padStart(2,'0'); }
function addPeriod(iso,freq,k){
  const [y,m,d]=iso.split('-').map(Number);
  if(freq==='monthly'){
    const mm=m-1+k, yy=y+Math.floor(mm/12), mo=((mm%12)+12)%12;
    const last=new Date(Date.UTC(yy,mo+1,0)).getUTCDate();
    return yy+'-'+pad2(mo+1)+'-'+pad2(Math.min(d,last));
  }
  const x=new Date(Date.UTC(y,m-1,d)+k*(freq==='weekly'?7:1)*864e5);
  return x.toISOString().slice(0,10);
}
/* Wiederkehrende Ausgaben: fehlende Einträge bis heute anlegen. Gibt die Zahl neuer Einträge zurück. */
function expandRecurring(g,today,idFn){
  idFn=idFn||uid; let added=0;
  for(const src of g.entries.slice()){
    if(src.type!=='expense'||!src.repeat||!src.repeat.freq) continue;
    const have=new Set(g.entries.filter(e=>e.seriesId===src.id).map(e=>e.date));
    const skip=new Set(src.repeat.skipped||[]);
    for(let k=1;k<=500;k++){
      const d=addPeriod(src.date,src.repeat.freq,k);
      if(d>today||(src.repeat.until&&d>src.repeat.until)) break;
      const cid=src.id+'@'+d;
      if(have.has(d)||skip.has(d)||(g.deleted&&g.deleted[cid])||g.entries.some(e=>e.id===cid)) continue;
      const c=JSON.parse(JSON.stringify(src));
      delete c.repeat; c.id=cid; c.seriesId=src.id; c.date=d;
      c.createdAt=c.updatedAt=src.updatedAt||src.createdAt||d+'T00:00:00.000Z';
      g.entries.push(c); added++;
    }
  }
  return added;
}

function isoDate(s){ return typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s)?s:null; }
function tripNights(g){
  if(!g.startDate||!g.endDate) return null;
  const p=s=>{const [y,m,d]=s.split('-').map(Number);return Date.UTC(y,m-1,d);};
  const n=Math.round((p(g.endDate)-p(g.startDate))/864e5);
  return n>=0?n:null;
}

/* Import prüfen und bereinigen */
function normalizeGroup(raw){
  if(!raw||typeof raw!=='object'||typeof raw.id!=='string'||!Array.isArray(raw.members)) return null;
  const members=raw.members.filter(m=>m&&typeof m.id==='string'&&typeof m.name==='string').map(m=>({
    id:m.id, name:m.name.trim().slice(0,40)||'?',
    defaultWeight:Number.isFinite(+m.defaultWeight)&&+m.defaultWeight>=0?Math.round(+m.defaultWeight*2)/2:1,
    nights:m.nights==null?null:(Number.isInteger(+m.nights)&&+m.nights>=0?+m.nights:null)
  }));
  raw.members.forEach(m=>{const t=members.find(x=>x&&m&&x.id===m.id);if(!t)return;
    if(typeof m.createdAt==='string') t.createdAt=m.createdAt; if(typeof m.updatedAt==='string') t.updatedAt=m.updatedAt;});
  const ids=new Set(members.map(m=>m.id));
  const entries=[]; let dropped=0;
  for(const e of Array.isArray(raw.entries)?raw.entries:[]){
    if(!e||typeof e.id!=='string'||!Number.isSafeInteger(e.amountCents)||e.amountCents<=0||!ids.has(e.paidBy)){dropped++;continue;}
    if(e.type==='settlement'){
      if(!ids.has(e.paidTo)||e.paidTo===e.paidBy){dropped++;continue;}
      entries.push({id:e.id,type:'settlement',date:isoDate(e.date)||'1970-01-01',amountCents:e.amountCents,paidBy:e.paidBy,paidTo:e.paidTo,createdAt:e.createdAt||null});
      continue;
    }
    if(e.type!=='expense'){dropped++;continue;}
    let shares=e.shares&&typeof e.shares==='object'?e.shares:null;
    const valid=shares&&Object.keys(shares).every(k=>ids.has(k)&&Number.isSafeInteger(shares[k])&&shares[k]>=0)
      &&Object.values(shares).reduce((a,b)=>a+b,0)===e.amountCents;
    if(!valid){ const r=computeSplit(e.amountCents,e.split||{},members); if(!r.ok){dropped++;continue;} shares=r.shares; }
    let payers=null;
    if(e.payers!=null){
      const p=e.payers;
      const ok=p&&typeof p==='object'&&Object.keys(p).length&&Object.keys(p).every(k=>ids.has(k)&&Number.isSafeInteger(p[k])&&p[k]>=0)
        &&Object.values(p).reduce((a,b)=>a+b,0)===e.amountCents;
      if(!ok){dropped++;continue;}

/* ===== Geteilte Reisen: Zusammenführen ===== */
function stampOf(x){ return (x&&(x.updatedAt||x.createdAt))||''; }
function pickNewer(a,b){
  const sa=stampOf(a), sb=stampOf(b);
  if(sa!==sb) return sa>sb?a:b;
  return stable(a)>=stable(b)?a:b;   // Gleichstand: auf allen Geräten dieselbe Wahl
}
/* Der Teil einer Reise, der geteilt wird (ohne lokale Felder wie Teilen-Schlüssel, Archiv, "Ich bin") */
function sharedPayload(g){
  return {v:1,gid:g.id,
    meta:{name:g.name,startDate:g.startDate||null,endDate:g.endDate||null,defaultSplit:g.defaultSplit||null,rates:g.rates||null,updatedAt:g.metaUpdatedAt||''},
    members:g.members||[],entries:g.entries||[],deleted:g.deleted||{}};
}
function sanitizePayload(p){
  if(!p||typeof p!=='object'||!p.meta||typeof p.gid!=='string') return null;
  const r=normalizeGroup({id:p.gid,name:p.meta.name,startDate:p.meta.startDate,endDate:p.meta.endDate,defaultSplit:p.meta.defaultSplit,rates:p.meta.rates,
    metaUpdatedAt:p.meta.updatedAt,members:p.members||[],entries:p.entries||[],deleted:p.deleted});
  return r?sharedPayload(r.group):null;
}
function mergePayloads(a,b,nowMs){
  const cut=new Date((nowMs||Date.now())-120*864e5).toISOString();
  const del={};
  for(const src of [b.deleted||{},a.deleted||{}]) for(const k in src){const v=src[k]; if(typeof v==='string'&&v>=cut&&(!del[k]||v>del[k])) del[k]=v;}

    const m=new Map(), order=[];
    for(const x of lb.concat(la)){ if(!m.has(x.id)){order.push(x.id);m.set(x.id,x);} else m.set(x.id,pickNewer(m.get(x.id),x)); }
    return order.map(id=>m.get(id));
  };
  const entries=merge(a.entries||[],b.entries||[]).filter(x=>!(del[x.id]&&del[x.id]>=stampOf(x)));
  const used=new Set();
  for(const e of entries){ used.add(e.paidBy); if(e.paidTo) used.add(e.paidTo); for(const k in (e.payers||{})) used.add(k); for(const k in (e.shares||{})) if(e.shares[k]>0) used.add(k); }
  const members=merge(a.members||[],b.members||[]).filter(x=>used.has(x.id)||!(del[x.id]&&del[x.id]>=stampOf(x)));
  members.sort((x,y)=>(x.createdAt||'')<(y.createdAt||'')?-1:(x.createdAt||'')>(y.createdAt||'')?1:0);
  const out={v:1,gid:b.gid||a.gid,meta:pickNewer(a.meta,b.meta),members,entries,deleted:del};
  return sanitizePayload(out)||out;
}
function applyPayload(g,p){
  const out=Object.assign({},g,{id:p.gid,name:p.meta.name,startDate:p.meta.startDate||null,endDate:p.meta.endDate||null,
    metaUpdatedAt:p.meta.updatedAt||'',members:p.members,entries:p.entries,deleted:p.deleted});
  if(p.meta.defaultSplit) out.defaultSplit=p.meta.defaultSplit; else delete out.defaultSplit;
  if(p.meta.rates) out.rates=p.meta.rates; else delete out.rates;
  return out;
}
/* Vergleichsform: Reihenfolge der Listen spielt keine Rolle */
function canon(p){
  const byId=(x,y)=>x.id<y.id?-1:x.id>y.id?1:0;
  return stable(Object.assign({},p,{members:p.members.slice().sort(byId),entries:p.entries.slice().sort(byId)}));

    if (!out) {   // manche Geräte liefern das Ergebnis erst bei der ersten Anmeldung
      const a = await navigator.credentials.get({ publicKey: { challenge: crypto.getRandomValues(new Uint8Array(32)), rpId: rpId(), userVerification: 'required',
        allowCredentials: [{ type: 'public-key', id: cred.rawId }], extensions: { prf: { eval: { first: PRF_SALT } } } } });
      out = prfOut(a);
    }
    if (!out) throw new Error('Dieses Gerät unterstützt die Anmeldung per Face ID für Web-Apps noch nicht (nötig: iOS 18 oder neuer).');
    const secret = b64e(out), pk = await pkKeys(secret);
    const r = await api('POST', '', null, { id: pk.id, auth: pk.auth, data: await encrypt(pk.enc, { user: s.user, master: s.master }), rev: 1 });
    if (r.status !== 200 && r.status !== 400) throw fail(r);
    const v = cache(); const cid = b64e(new Uint8Array(cred.rawId));
    v.passkeys[cid] = { secret, createdAt: nowIso(), device: (navigator.platform || 'Gerät') };
    ls.set('konto-cache', v); await sync();
    ls.set('konto-passkey', true);
    return true;
  }
  async function loginWithPasskey() {
    const a = await navigator.credentials.get({ publicKey: { challenge: crypto.getRandomValues(new Uint8Array(32)), rpId: rpId(), userVerification: 'required',
      extensions: { prf: { eval: { first: PRF_SALT } } } }, mediation: 'optional' });
    const out = prfOut(a);
    if (!out) throw new Error('Face ID hat keinen Schlüssel geliefert. Bitte mit Passwort anmelden.');
    const pk = await pkKeys(b64e(out));
    const r = await api('GET', '/' + pk.id, pk.auth);
    if (r.status === 404) throw new Error('Für diesen Passkey ist kein Konto hinterlegt. Bitte mit Passwort anmelden und Face ID neu einrichten.');
    if (r.status !== 200 || !r.json) throw fail(r);
    const d = await decrypt(pk.enc, r.json.data);
    const f = await fetchVault(d.master);
    if (!f) throw new Error('Konto nicht gefunden.');
    ls.set('konto', { user: d.user, master: d.master, at: nowIso() });
    ls.set('konto-cache', f.vault);
    emit();
    return { ok: true };
  }

  /* ---------- Profil, Postfach, Einladungen ---------- */
  const INVITE_DAYS = 7;
  async function nameKeys(user, salt) {
    const h = new Uint8Array(await crypto.subtle.digest('SHA-256', te(salt + '|' + normUser(user))));
    return keys(b64e(h), salt);
  }
  const profileKeys = user => nameKeys(user, 'konto-profil-v1');
  const inboxKeys = user => nameKeys(user, 'konto-postfach-v1');
  const ECDH = { name: 'ECDH', namedCurve: 'P-256' }, ECDSA = { name: 'ECDSA', namedCurve: 'P-256' };
  async function readRec(k) {
    const r = await api('GET', '/' + k.id, k.auth);
    if (r.status === 404) return null;
    if (r.status !== 200 || !r.json) throw fail(r);
    return { data: await decrypt(k.enc, r.json.data), rev: +r.json.rev || 0 };
  }
  /* Schlüsselpaare anlegen (einmal pro Konto) und Profil + Postfach veröffentlichen */
  async function ensureProfile() {
    const s = session(); if (!s) return null;
    let v = cache();
    if (!v.keys) {
      const e = await crypto.subtle.generateKey(ECDH, true, ['deriveBits']);
      const g = await crypto.subtle.generateKey(ECDSA, true, ['sign', 'verify']);
      v.keys = { createdAt: nowIso(), encPub: await crypto.subtle.exportKey('jwk', e.publicKey), encPriv: await crypto.subtle.exportKey('jwk', e.privateKey),
        sigPub: await crypto.subtle.exportKey('jwk', g.publicKey), sigPriv: await crypto.subtle.exportKey('jwk', g.privateKey) };
      ls.set('konto-cache', v);
      v = await sync();
    }
    const pk = await profileKeys(s.user), cur = await readRec(pk);
    const prof = { user: s.user, encPub: v.keys.encPub, sigPub: v.keys.sigPub };
    if (!cur || canon(cur.data) !== canon(prof)) await upsert(pk, prof);
    const ik = await inboxKeys(s.user);
    if (!(await readRec(ik))) await upsert(ik, { entries: {} });
    return prof;
  }
  /* Gibt es ein Konto mit genau diesem Namen? → Profil (mit richtiger Schreibweise) oder null */
  async function findUser(name) { const p = await readRec(await profileKeys(String(name || '').trim())); return p ? p.data : null; }
  async function sealFor(prof, payload) {
    const eph = await crypto.subtle.generateKey(ECDH, true, ['deriveBits']);
    const pub = await crypto.subtle.importKey('jwk', prof.encPub, ECDH, false, []);
    const bits = await crypto.subtle.deriveBits({ name: 'ECDH', public: pub }, eph.privateKey, 256);
    const key = (await keys(b64e(new Uint8Array(bits)), 'konto-einladung-v1')).enc;
    return { epk: await crypto.subtle.exportKey('jwk', eph.publicKey), box: await encrypt(key, payload) };
  }
  async function openSealed(sealed, encPriv) {
    const priv = await crypto.subtle.importKey('jwk', encPriv, ECDH, false, ['deriveBits']);
    const pub = await crypto.subtle.importKey('jwk', sealed.epk, ECDH, false, []);
    const bits = await crypto.subtle.deriveBits({ name: 'ECDH', public: pub }, priv, 256);
    return decrypt((await keys(b64e(new Uint8Array(bits)), 'konto-einladung-v1')).enc, sealed.box);
  }
  async function signBody(body, sigPriv) {
    const k = await crypto.subtle.importKey('jwk', sigPriv, ECDSA, false, ['sign']);
    return b64e(new Uint8Array(await crypto.subtle.sign({ name: 'ECDSA', hash: 'SHA-256' }, k, te(canon(body)))));
  }
  async function verifyBody(body, sig, sigPub) {
    try { const k = await crypto.subtle.importKey('jwk', sigPub, ECDSA, false, ['verify']); return await crypto.subtle.verify({ name: 'ECDSA', hash: 'SHA-256' }, k, b64d(sig), te(canon(body))); }
    catch (e) { return false; }
  }
  async function editInbox(user, fn) {
    const ik = await inboxKeys(user);
    for (let i = 0; i < 3; i++) {
      const cur = await readRec(ik);
      if (!cur) throw new Error('Postfach nicht gefunden');
      const entries = Object.assign({}, cur.data.entries || {});
      const now = nowIso();
      for (const k in entries) if ((entries[k].expiresAt || '') < now) delete entries[k];   // Abgelaufenes aufräumen
      if (fn(entries) === false) return;
      const u = await api('PATCH', '/' + ik.id, ik.auth, { data: await encrypt(ik.enc, { entries }), rev: cur.rev + 1 });
      if (u.status === 200) return;
    }
    throw new Error('Postfach gerade nicht beschreibbar');
  }
  /* Einladung senden: item = {app, id, secret, label} (wie im Schlüsselbund) */
  async function invite(toName, key, item, days) {
    const s = session(); if (!s) throw new Error('Bitte zuerst anmelden.');
    await ensureProfile();
    const prof = await findUser(toName);
    if (!prof) { const e = new Error(`Kein Konto „${String(toName).trim()}“ gefunden. Stimmt die Schreibweise?`); e.notFound = true; throw e; }
    if (normUser(prof.user) === normUser(s.user)) throw new Error('Du kannst dich nicht selbst einladen.');
    const iid = b64e(crypto.getRandomValues(new Uint8Array(12)));
    const createdAt = nowIso(), expiresAt = new Date(Date.now() + (days || INVITE_DAYS) * 864e5).toISOString();
    const body = { iid, from: s.user, to: prof.user, key, item, createdAt, expiresAt };
    const sig = await signBody(body, cache().keys.sigPriv);
    const sealed = await sealFor(prof, { body, sig });
    await editInbox(prof.user, e => { e[iid] = { sealed, expiresAt }; });
    const v = cache(); v.sent[iid] = { to: prof.user, app: item.app, label: item.label || '', key, createdAt, expiresAt };
    ls.set('konto-cache', v); sync().catch(() => {});
    return { iid, to: prof.user, expiresAt };
  }
  async function withdraw(iid) {
    const v = cache(), x = v.sent[iid]; if (!x) return false;
    try { await editInbox(x.to, e => { if (!e[iid]) return false; delete e[iid]; }); } catch (e) { if (!/Postfach nicht gefunden/.test(e.message)) throw e; }
    delete v.sent[iid]; v.deleted['sent:' + iid] = nowIso(); ls.set('konto-cache', v); sync().catch(() => {});
    return true;
  }
  /* gesendete Einladungen mit Stand: offen | abgelaufen | erledigt (angenommen/abgelehnt) */
  async function sentList(app) {
    const v = cache(), now = nowIso(), out = [];
    const byUser = {};
    for (const iid in v.sent) { const x = v.sent[iid]; if (app && x.app !== app) continue; (byUser[x.to] = byUser[x.to] || []).push(Object.assign({ iid }, x)); }
    for (const u in byUser) {
      let entries = null;
      try { const r = await readRec(await inboxKeys(u)); entries = r ? r.data.entries || {} : {}; } catch (e) { entries = null; }
      byUser[u].forEach(x => out.push(Object.assign(x, { status: x.expiresAt < now ? 'abgelaufen' : entries === null ? 'unbekannt' : entries[x.iid] ? 'offen' : 'erledigt' })));
    }
    return out.sort((a, b) => b.createdAt.localeCompare(a.createdAt));
  }
  function forget(iid) { const v = cache(); if (!v.sent[iid]) return; delete v.sent[iid]; v.deleted['sent:' + iid] = nowIso(); ls.set('konto-cache', v); sync().catch(() => {}); }
  /* eigene Einladungen lesen (geprüft: Signatur des Absenders, nicht abgelaufen) */
  async function inbox() {
    const s = session(); if (!s) return [];
    await ensureProfile();
    const r = await readRec(await inboxKeys(s.user)); if (!r) return [];
    const now = nowIso(), keysV = cache().keys, out = [];
    for (const iid in r.data.entries || {}) {
      const e = r.data.entries[iid]; if ((e.expiresAt || '') < now) continue;
      try {
        const { body, sig } = await openSealed(e.sealed, keysV.encPriv);
        if (body.iid !== iid || normUser(body.to) !== normUser(s.user) || body.expiresAt < now) continue;
        const sender = await findUser(body.from);
        if (!sender || !(await verifyBody(body, sig, sender.sigPub))) continue;
        out.push(Object.assign({}, body, { from: sender.user }));
      } catch (err) { /* nicht für uns / beschädigt */ }
    }
    ls.set('konto-inbox', out.map(x => ({ iid: x.iid, from: x.from, app: x.item.app, label: x.item.label, expiresAt: x.expiresAt })));
    emit();
    return out.sort((a, b) => b.createdAt.localeCompare(a.createdAt));
  }
  async function accept(inv) {
    put(inv.key, Object.assign({}, inv.item, { invitedBy: inv.from }));
    await editInbox(user(), e => { if (!e[inv.iid]) return false; delete e[inv.iid]; });
    await sync().catch(() => {});
    inbox().catch(() => {});
  }
  async function decline(inv) { await editInbox(user(), e => { if (!e[inv.iid]) return false; delete e[inv.iid]; }); inbox().catch(() => {}); }
  const user = () => (session() || {}).user || '';

  return {
    session, user, loggedIn: () => !!session(), state: () => ls.get('konto-state') || {},
    login, register, logout, changePassword, sync, items, put, remove, onChange: fn => listeners.add(fn),
    passkeySupported, enablePasskey, loginWithPasskey, hasPasskey: () => Object.keys(cache().passkeys).length > 0,
    setRecovery, removeRecovery, getQuestion, recover,
    ensureProfile, findUser, invite, withdraw, sentList, forget, inbox, accept, decline, inviteDays: INVITE_DAYS,
    inboxCount: () => (ls.get('konto-inbox') || []).filter(x => x.expiresAt >= nowIso()).length, hasRecovery: () => !!cache().recovery, recoveryQuestion: () => (cache().recovery || {}).question || '',
    _merge: merge,
    _forge: async (prof, body, sig) => { const sealed = await sealFor(prof, { body, sig }); await editInbox(prof.user, e => { e[body.iid] = { sealed, expiresAt: body.expiresAt }; }); },
  };
})();
</script>

<script>
/* ==== Mitteilungen der Anwendungssammlung (gleicher Code in allen Apps) ====
   Web-Push über den Push-Dienst auf dem Pi (…/push). Funktioniert auf dem iPhone nur in einer App
   vom Home-Bildschirm (ab iOS 16.4). Kanäle werden aus den Geheimnissen der Apps abgeleitet, Texte
   sind mit einem Kanalschlüssel verschlüsselt – der Pi sieht weder Namen noch Inhalte. Der Service
   Worker (sw.js) entschlüsselt sie mit den Schlüsseln aus IndexedDB „push-keys“ und zeigt sie an.
   Welche Arten ein Gerät bekommt, steht in localStorage „push-prefs“ und wird beim Pi hinterlegt. */
const Push = (() => {
  const DEFAULT = 'https://kostenpi.tail281e3e.ts.net/push';
  const KINDS = [
    { key: 'timer', label: 'Kochtimer', sub: 'Wenn ein Timer der Kochansicht abläuft', def: true },
    { key: 'remind', label: 'Kocherinnerung', sub: 'Am Kochtag: „Heute: Spaghetti Bolognese“', def: false },
    { key: 'einkauf', label: 'Einkaufsliste', sub: 'Jemand im Haushalt ergänzt die Einkaufsliste', def: true },
    { key: 'plan', label: 'Wochenplan', sub: 'Jemand im Haushalt übernimmt einen neuen Wochenplan', def: false },
    { key: 'invite', label: 'Einladungen', sub: 'Jemand lädt dich per Benutzername ein', def: true },
    { key: 'kosten', label: 'Neue Ausgaben', sub: 'Jemand trägt in einer geteilten Reise etwas ein', def: true },
    { key: 'spiele', label: 'Spiele', sub: 'Neue Partie im Verlauf der Spielgruppe', def: false },
    { key: 'cocktails', label: 'Cocktails', sub: 'Änderungen an geteilten Cocktail-Projekten', def: false },
  ];
  const APP_KINDS = { essen: ['einkauf', 'plan'], kosten: ['kosten'], spiele: ['spiele'], cocktails: ['cocktails'] };
  const te = t => new TextEncoder().encode(t);
  const b64e = u8 => { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); };
  const b64d = str => { str = String(str).replace(/-/g, '+').replace(/_/g, '/'); while (str.length % 4) str += '='; const b = atob(str), u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; };
  const ls = {
    get(k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
    del(k) { try { localStorage.removeItem(k); } catch (e) {} },
  };
  const server = () => { try { return localStorage.getItem('push-server') || DEFAULT; } catch (e) { return DEFAULT; } };
  const rnd = n => b64e(crypto.getRandomValues(new Uint8Array(n)));
  function device() {
    let d = ls.get('push-device');
    if (!d || !d.id) { d = { id: rnd(18), secret: rnd(24), ch: rnd(32) }; ls.set('push-device', d); }
    return d;
  }
  function prefs() {
    const p = Object.assign({ remindTime: '16:30' }, ls.get('push-prefs') || {});
    KINDS.forEach(k => { if (typeof p[k.key] !== 'boolean') p[k.key] = k.def; });
    return p;
  }
  const listeners = new Set(); const emit = () => listeners.forEach(f => { try { f(); } catch (e) {} });

  /* ---------- Kanäle ---------- */
  const chanCache = new Map();
  function chan(secret, label) {
    const ck = label + '|' + secret;
    if (!chanCache.has(ck)) chanCache.set(ck, (async () => {
      const base = await crypto.subtle.importKey('raw', te(secret), 'HKDF', false, ['deriveBits']);
      const bits = n => crypto.subtle.deriveBits({ name: 'HKDF', hash: 'SHA-256', salt: te('push-v1'), info: te(label + '|' + n) }, base, 256);
      return { id: b64e(new Uint8Array(await bits('id')).subarray(0, 24)), key: b64e(new Uint8Array(await bits('key'))) };
    })());
    return chanCache.get(ck);
  }
  const normUser = u => String(u || '').trim().toLowerCase();
  const itemChan = it => chan(it.secret, it.app + ':' + it.id);
  const userChan = name => chan('konto-postfach|' + normUser(name), 'inbox');
  const devChan = () => chan(device().ch, 'device');
  async function encrypt(keyB64, obj) {
    const key = await crypto.subtle.importKey('raw', b64d(keyB64), 'AES-GCM', false, ['encrypt']);
    const iv = crypto.getRandomValues(new Uint8Array(12));
    return 'v1.' + b64e(iv) + '.' + b64e(new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, te(JSON.stringify(obj)))));
  }
  /* Kanalschlüssel für den Service Worker ablegen */
  function idb() {
    return new Promise((res, rej) => { const r = indexedDB.open('push-keys', 1); r.onupgradeneeded = () => r.result.createObjectStore('k'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  }
  async function storeKeys(map) {
    const db = await idb();
    await new Promise((res, rej) => { const tx = db.transaction('k', 'readwrite'), st = tx.objectStore('k'); st.clear(); Object.entries(map).forEach(([k, v]) => st.put(v, k)); tx.oncomplete = res; tx.onerror = () => rej(tx.error); });
    db.close();
  }
  async function channels() {
    const p = prefs(), out = {}, keys = {};
    const add = (c, kinds) => { if (!kinds.length) return; out[c.id] = (out[c.id] || []).concat(kinds); keys[c.id] = c.key; };
    add(await devChan(), ['test'].concat(['timer', 'remind'].filter(k => p[k])));   // „test“ immer, damit die Testmitteilung ankommt
    const K = typeof Konto !== 'undefined' && Konto.loggedIn() ? Konto : null;
    if (K) {
      if (p.invite) add(await userChan(K.user()), ['invite']);
      for (const it of K.items()) { const kinds = (APP_KINDS[it.app] || []).filter(k => p[k]); if (kinds.length && it.secret) add(await itemChan(it), kinds); }
    }
    return { out, keys };
  }

  /* ---------- Server ---------- */
  async function api(path, body) {
    const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 15000);
    try {
      const r = await fetch(server() + path, { method: body ? 'POST' : 'GET', headers: body ? { 'Content-Type': 'application/json' } : {}, body: body ? JSON.stringify(body) : undefined, cache: 'no-store', signal: ctl.signal });
      let j = null; try { j = await r.json(); } catch (e) {}
      if (!r.ok) { const e = new Error((j && j.error) || ('Push-Dienst antwortet mit ' + r.status)); e.status = r.status; throw e; }
      return j;
    } catch (e) { if (e.status) throw e; const err = new Error('Push-Dienst nicht erreichbar'); err.offline = true; throw err; }
    finally { clearTimeout(to); }
  }

  /* ---------- Abo ---------- */
  const standalone = () => { try { return window.navigator.standalone === true || matchMedia('(display-mode: standalone)').matches; } catch (e) { return false; } };
  const supported = () => typeof window !== 'undefined' && 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
  function status() {
    if (!supported()) return { state: standalone() ? 'unsupported' : 'notInstalled', text: standalone() ? 'Dieses Gerät unterstützt keine Mitteilungen für Web-Apps (iOS 16.4 oder neuer nötig).' : 'Mitteilungen gehen nur in der App vom Home-Bildschirm (Teilen → „Zum Home-Bildschirm“).' };
    if (Notification.permission === 'denied') return { state: 'denied', text: 'Mitteilungen sind abgelehnt. Erlauben unter iPhone-Einstellungen → Mitteilungen → diese App.' };
    const s = ls.get('push-state') || {};
    if (Notification.permission === 'granted' && s.on) return { state: 'on', text: s.err ? 'Aktiv – letzter Abgleich fehlgeschlagen: ' + s.err : 'Aktiv auf diesem Gerät' };
    return { state: 'off', text: 'Aus' };
  }
  async function swReg() {
    const reg = (await navigator.serviceWorker.getRegistration()) || (await navigator.serviceWorker.register('sw.js'));
    return navigator.serviceWorker.ready.then(() => reg);
  }
  /* Einschalten – muss aus einem Tipp heraus aufgerufen werden (iOS fragt dann nach der Erlaubnis) */
  async function enable() {
    if (!supported()) throw new Error(status().text);
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') throw new Error('Ohne Erlaubnis keine Mitteilungen.');
    const { publicKey } = await api('/vapid');
    const reg = await swReg();
    let sub = await reg.pushManager.getSubscription();
    if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64d(publicKey) });
    ls.set('push-state', { on: true, err: '' });
    await sync(true);
    emit();
    return true;
  }
  async function disable() {
    try { const reg = await navigator.serviceWorker.getRegistration(); const sub = reg && await reg.pushManager.getSubscription(); if (sub) await sub.unsubscribe(); } catch (e) {}
    const d = device();
    try { await api('/unsubscribe', { device: d.id, secret: d.secret }); } catch (e) {}
    ls.set('push-state', { on: false }); ls.del('push-sig'); emit();
  }
  let syncing = null;
  /* Kanäle und Arten beim Pi aktualisieren (nur wenn sich etwas geändert hat) */
  async function sync(force) {
    const st = ls.get('push-state') || {};
    if (!st.on || !supported() || Notification.permission !== 'granted') return false;
    if (syncing) return syncing;
    syncing = (async () => {
      try {
        const reg = await swReg();
        const sub = await reg.pushManager.getSubscription();
        if (!sub) { ls.set('push-state', { on: false }); emit(); return false; }
        const { out, keys } = await channels();
        await storeKeys(keys);
        const sj = sub.toJSON(), sig = JSON.stringify([sj.endpoint, out]);
        if (!force && ls.get('push-sig') === sig) return true;
        const d = device();
        await api('/subscribe', { device: d.id, secret: d.secret, sub: { endpoint: sj.endpoint, keys: sj.keys }, channels: out });
        ls.set('push-sig', sig); ls.set('push-state', { on: true, err: '' });
        return true;
      } catch (e) { ls.set('push-state', { on: true, err: e.message }); throw e; }
      finally { syncing = null; emit(); }
    })();
    return syncing;
  }
  function setPrefs(p) { ls.set('push-prefs', Object.assign(prefs(), p)); emit(); return sync().catch(() => {}); }

  /* ---------- Senden ---------- */
  /* an alle Geräte eines geteilten Dings (außer diesem): item = {app, id, secret} */
  async function notify(item, kind, title, body, url) {
    if (!item || !item.secret || !item.id) return false;
    try {
      const c = await itemChan(item);
      await api('/send', { channels: [c.id], kind, boxes: { '*': await encrypt(c.key, { title, body, url: url || null, tag: kind + ':' + item.id }) }, exclude: device().id });
      return true;
    } catch (e) { return false; }
  }
  async function notifyUser(name, kind, title, body, url) {
    try { const c = await userChan(name); await api('/send', { channels: [c.id], kind, boxes: { '*': await encrypt(c.key, { title, body, url: url || null }) } }); return true; }
    catch (e) { return false; }
  }
  /* an dieses Gerät zu einem Zeitpunkt (Kochtimer, Kocherinnerung); gleicher tag ersetzt */
  async function schedule(tag, at, kind, title, body, url) {
    if (!(ls.get('push-state') || {}).on) return false;
    try {
      const c = await devChan();
      await api('/send', { channels: [c.id], kind, tag, at: new Date(at).toISOString(), ttl: 3600, boxes: { '*': await encrypt(c.key, { title, body, url: url || null, tag }) } });
      return true;

/* Rückgängig nach dem Löschen: Stand einer Reise merken und Fehlendes wiederherstellen.
   Wiederhergestellte Einträge/Personen bekommen einen neuen Zeitstempel (später als der Grabstein),
   damit der Abgleich sie auf allen Geräten wieder aufnimmt statt sie erneut zu löschen. */
function snapGroup(g,touched){return {gid:g.id,idx:S.groups.indexOf(g),g:JSON.parse(JSON.stringify(g)),me:S.ui.meByGroup[g.id]||null,touched:new Set(touched||[])};}
function laterThan(prev){let t=nowISO();if(prev&&t<=prev)t=new Date(Date.parse(prev)+1).toISOString();return t;}
function restoreSnap(sn){
  let g=byGid(sn.gid);
  if(!g){
    g=JSON.parse(JSON.stringify(sn.g));
    if(g.share) delete g.share.konto;   // wieder ins Konto eintragen
    S.groups.splice(Math.min(Math.max(0,sn.idx),S.groups.length),0,g);
  }else{
    for(const key of ['members','entries']){
      const cur=new Map(g[key].map(x=>[x.id,x])), out=[];
      for(const o of sn.g[key]){
        const c=cur.get(o.id); cur.delete(o.id);
        if(c&&!sn.touched.has(o.id)){out.push(c);continue;}
        if(c&&stable(c)===stable(o)){out.push(c);continue;}
        const n=JSON.parse(JSON.stringify(o)); n.updatedAt=laterThan(g.deleted&&g.deleted[o.id]);
        if(g.deleted) delete g.deleted[o.id];
        out.push(n);
      }
      cur.forEach(x=>out.push(x));
      g[key]=out;
    }
    if(stable(g.defaultSplit||null)!==stable(sn.g.defaultSplit||null)){
      if(sn.g.defaultSplit) g.defaultSplit=JSON.parse(JSON.stringify(sn.g.defaultSplit)); else delete g.defaultSplit;
      g.metaUpdatedAt=laterThan(g.metaUpdatedAt);
    }
  }
  if(sn.me&&!meId(g)&&g.members.some(m=>m.id===sn.me)) S.ui.meByGroup[g.id]=sn.me;
  if(g.share){g.share.dirty=true;scheduleSync(g.id,300);}
  persist();
  return g;
}
function undoNotice(txt,sn,after){
