const isWide=()=>{try{return matchMedia('(min-width: 800px)').matches;}catch(e){return false;}};
let SIDE='settle';
function render(keep){
  const y=window.scrollY, oldDlg=document.querySelector('.xdlg'), dy=oldDlg?oldDlg.scrollTop:0;
  if(V.name!=='groups'&&V.name!=='tests'&&!grp()) V={name:'groups'};
  if(V.name==='expense'&&!D) V={name:'group',tab:'overview'};
  const wideExp=V.name==='expense'&&isWide();
  const html=wideExp?vGroup(V.under||'overview')+`<div class="xmodal"><div class="xscrim" data-act="cancelExpense"></div><div class="xdlg${oldDlg?'':' anim'}" role="dialog" aria-modal="true" aria-label="Ausgabe">${vExpense()}</div></div>`
    :V.name==='group'?vGroup():V.name==='expense'?vExpense():V.name==='tests'?vTests():vGroups();
  byId('app').innerHTML=html;
  document.body.classList.toggle('xlock',wideExp);
  window.scrollTo(0,(keep||wideExp)?y:0);
  const nd=document.querySelector('.xdlg'); if(nd&&keep) nd.scrollTop=dy;
  if(V.name==='expense') updatePreview();
}

function vGroups(){
  const act=S.groups.filter(g=>!g.archived), arc=S.groups.filter(g=>g.archived);
  const row=g=>`<button class="grow" data-act="openGroup" data-id="${g.id}"><div class="mid"><div class="t">${g.share?'🔗 ':''}${esc(g.name)}</div><div class="small muted">${esc([fmtRange(g),g.members.length+(g.members.length===1?' Person':' Personen'),fmtEuro(totalExpenses(g))].filter(Boolean).join(' · '))}</div></div><span class="chev" aria-hidden="true">›</span></button>`;
  return `<div class="wrap">
  <div class="top"><a class="iconbtn back" href="./index.html">${IC.back}Sammlung</a><div class="ttl"></div></div>
  <h1 class="title">Kosten&shy;aufteilung</h1>
  <p class="lead">Ausgaben einer Reise erfassen, fair aufteilen und am Ende mit möglichst wenigen Überweisungen ausgleichen.</p>
  ${act.length?`<div class="glist">${act.map(row).join('')}</div>`:`<div class="card empty"><p>Noch keine Reise angelegt. Leg eine neue an oder probier die Beispielreise aus.</p><button class="btn block" data-act="loadExample">Beispielreise „Hütte Tirol“ laden</button></div>`}
  <div class="btnrow"><button class="btn primary" data-act="newGroup">+ Neue Reise</button></div>
  ${arc.length?`<details class="arch"><summary>Archiviert (${arc.length})</summary><div class="glist">${arc.map(row).join('')}</div></details>`:''}
  <div class="more">${gGroup('',[kontoRow(),pushRow(),gRow({icon:'paypal',color:'#003087',label:'Meine PayPal.Me',sub:'Wird in deinen Reisen bei „Ich“ eingetragen',value:S.ui.myPaypal||'Keine',act:'myPaypal'})])}${gGroup('Weitere',[
    gRow({icon:'link',color:'#0A84FF',label:'Geteilte Reise öffnen',sub:'Mit einem Link von Mitreisenden',act:'openJoin'}),
    gRow({icon:'up',color:'#8E8E93',label:'Datei importieren',sub:'Reise aus einer JSON-Datei',act:'importPick'}),
    gRow({icon:'check',color:'#34C759',label:'Selbsttest',sub:'Rechenregeln und Abgleich prüfen',act:'showTests'})
  ],(Konto.loggedIn()?'Angemeldet werden Reisen automatisch verschlüsselt geteilt und erscheinen auf deinen anderen Geräten.':'Die Daten bleiben auf diesem Gerät, außer du teilst eine Reise.')+' Zum Sichern eine Reise exportieren (•••-Menü der Reise).')}</div>
  </div>`;
}

function vGroup(tabArg){
  const g=grp(), tab=tabArg||V.tab||'overview', wide=isWide();
  if(wide&&tab!=='members'){
    if(tab==='stats'||tab==='settle') SIDE=tab;
    const note=g.archived?'<div class="note">Diese Reise ist archiviert. Wiederkehrende Ausgaben werden nicht mehr ergänzt.</div>':'';
    return `<div class="wrap wide">
    <div class="top"><button class="iconbtn back" data-act="goGroups">${IC.back}Reisen</button><div class="ttl"><h1>${esc(g.name)}</h1>${(fmtRange(g)||g.share)?`<span class="sub">${fmtRange(g)}${fmtRange(g)&&g.share?' · ':''}<span id="syncBadge">${badgeHtml(g)}</span></span>`:''}</div><button class="btn primary sm" data-act="newExpense">+ Ausgabe</button><button class="iconbtn" data-act="groupMenu" aria-label="Reise bearbeiten, exportieren oder löschen">•••</button></div>
    ${note}
    <div class="cols2"><section class="colL" aria-label="Ausgaben">${vOverview(g)}</section>
    <section class="colR"><div class="seg" role="tablist">${[['settle','⚖️ Abrechnung'],['stats','📊 Auswertung']].map(([k,l])=>`<button class="segb ${SIDE===k?'on':''}" data-act="side" data-side="${k}" role="tab" aria-selected="${SIDE===k}">${l}</button>`).join('')}</div>${SIDE==='stats'?vStats(g):vSettle(g)}</section></div>
    </div>`;
  }
  const body=tab==='settle'?vSettle(g):tab==='members'?vMembers(g):tab==='stats'?vStats(g):vOverview(g);
  const tabs=[['overview','Ausgaben','receipt'],['stats','Auswertung','chart'],['settle','Abrechnung','scale']];
  return `<div class="wrap">
  <div class="top">${tab==='members'?'<button class="iconbtn back" data-act="tab" data-tab="overview">'+IC.back+'Zurück</button>':'<button class="iconbtn back" data-act="goGroups">'+IC.back+'Reisen</button>'}<div class="ttl"><h1>${tab==='members'?'Personen':esc(g.name)}</h1>${tab==='members'?`<span class="sub">${esc(g.name)}</span>`:(fmtRange(g)||g.share)?`<span class="sub">${fmtRange(g)}${fmtRange(g)&&g.share?' · ':''}<span id="syncBadge">${badgeHtml(g)}</span></span>`:''}</div><button class="iconbtn" data-act="groupMenu" aria-label="Reise bearbeiten, exportieren oder löschen">•••</button></div>
  ${g.archived?'<div class="note">Diese Reise ist archiviert. Wiederkehrende Ausgaben werden nicht mehr ergänzt.</div>':''}
  ${body}
  </div>
  ${tab==='overview'?'<button class="fab" data-act="newExpense">+ Ausgabe</button>':''}
  <nav class="tabbar"><div class="in2">${tabs.map(([k,l,i])=>`<button class="tab ${tab===k?'on':''}" data-act="tab" data-tab="${k}" aria-current="${tab===k?'page':'false'}"><span class="ti" aria-hidden="true">${IC[i]}</span>${l}</button>`).join('')}</div></nav>`;
}

function vOverview(g){
  const me=meId(g), b=balances(g), exp=g.entries.filter(e=>e.type==='expense');
  let h=`<div class="card hero"><div class="lbl">Gesamtausgaben</div><div class="big">${fmtEuro(totalExpenses(g))}</div><div class="small muted">${exp.length} ${exp.length===1?'Ausgabe':'Ausgaben'}</div>`;
  if(g.members.length){
    h+=`<label class="fl" for="meSel" style="margin-top:14px">Ich bin</label><select id="meSel" class="in" data-ch="me"><option value="">Person wählen</option>${g.members.map(m=>`<option value="${m.id}" ${m.id===me?'selected':''}>${esc(m.name)}</option>`).join('')}</select>`;
    if(me){
      const v=b[me]||0, mine=exp.reduce((s,e)=>s+(e.shares[me]||0),0);
      h+=`<div class="mine"><div><div class="small muted">Mein Saldo</div><div class="mv ${v>0?'pos':v<0?'neg':''}">${fmtEuro(v,true)}</div><div class="small muted">${v>0?'bekomme ich zurück':v<0?'schulde ich':'ausgeglichen'}</div></div><div><div class="small muted">Mein Anteil</div><div class="mv">${fmtEuro(mine)}</div><div class="small muted">an allen Ausgaben</div></div></div>`;
    }
  }
  h+='</div>';
  if(g.members.length<2){
    h+=`<div class="card empty"><p>Füge zuerst die Personen hinzu, die mitreisen.</p><button class="btn primary block" data-act="tab" data-tab="members">Personen hinzufügen</button></div>`;
  }else if(!exp.length){
    h+=`<div class="card empty"><p>Noch keine Ausgaben. Tippe auf „+ Ausgabe“, um die erste zu erfassen.</p></div>`;
  }
  if(exp.length){
    const usedCats=new Set(exp.map(e=>e.category||'none'));
    h+=`<div class="card filt"><input id="q" class="in" type="search" data-s="q" placeholder="Suchen: Titel, Notiz, Person …" value="${esc(F.q)}" enterkeyhint="search" autocomplete="off" aria-label="Ausgaben durchsuchen">
    <div class="two" style="margin-top:8px"><select class="in" data-ch="fcat" aria-label="Nach Kategorie filtern"><option value="">Alle Kategorien</option>${CATS.filter(c=>usedCats.has(c[0])).map(c=>`<option value="${c[0]}" ${F.cat===c[0]?'selected':''}>${c[2]} ${c[1]}</option>`).join('')}${usedCats.has('none')?`<option value="none" ${F.cat==='none'?'selected':''}>Ohne Kategorie</option>`:''}</select>
    <select class="in" data-ch="fperson" aria-label="Nach Person filtern"><option value="">Alle Personen</option>${g.members.map(m=>`<option value="${m.id}" ${F.person===m.id?'selected':''}>${esc(m.name)}</option>`).join('')}</select></div></div>
    <div id="list">${listHtml(g)}</div>`;
  }
  return h;
}
function matches(g,e){
  if(F.cat&&(F.cat==='none'?!!e.category:e.category!==F.cat)) return false;
  if(F.person&&!(paidMap(e)[F.person]>0)&&!(e.shares[F.person]>0)) return false;
  const q=F.q.trim().toLowerCase();
  if(q){
    const cat=CATS.find(c=>c[0]===e.category);
    const hay=[e.title,e.note,payerNames(g,e),cat&&cat[1],e.fx&&e.fx.currency,fmtPlain(e.amountCents)].join(' ').toLowerCase();
    if(!hay.includes(q)) return false;
  }
  return true;
}
function listHtml(g){
  const me=meId(g);
  const all=g.entries.filter(e=>e.type==='expense').sort((a,b)=>b.date.localeCompare(a.date)||String(b.createdAt||'').localeCompare(String(a.createdAt||'')));
  const shown=all.filter(e=>matches(g,e)), filtered=!!(F.q.trim()||F.cat||F.person);
  let h='';
  if(filtered){
    const sum=shown.reduce((s,e)=>s+e.amountCents,0);
    h+=`<div class="hits small muted"><span>${shown.length} Treffer · ${fmtEuro(sum)}</span><button class="linkbtn" data-act="clearFilter">Filter zurücksetzen</button></div>`;
    if(!shown.length) h+=`<div class="card empty"><p>Keine Ausgabe passt zur Suche.</p></div>`;
  }
  let lastDay='';
  for(const e of shown){
    if(e.date!==lastDay){h+=`<div class="day">${esc(dayLabel(e.date))}</div>`;lastDay=e.date;}
    const cat=CATS.find(c=>c[0]===e.category), n=payerIds(e).length;
    const src=e.seriesId&&g.entries.find(x=>x.id===e.seriesId);
    const rep=e.repeat?FREQ_SHORT[e.repeat.freq]:src&&src.repeat?FREQ_SHORT[src.repeat.freq]:e.seriesId?'Serie':'';
    const sub=[`${payerNames(g,e)} ${n>1?'zahlten':'zahlte'}`,MODE_SHORT[e.split&&e.split.mode]||'',rep?'↻ '+rep:'',e.note?'📝':''].filter(Boolean).join(' · ');
    h+=`<button class="entry" data-act="editExpense" data-id="${e.id}"><span class="ico" aria-hidden="true">${cat?cat[2]:'💶'}</span><div class="mid"><div class="t">${esc(e.title)}</div><div class="s">${esc(sub)}</div></div><div class="r"><b>${fmtEuro(e.amountCents)}</b>${e.fx?`<span>${fmtMoney(e.fx.amountCents,e.fx.currency)}</span>`:''}${me?`<span>Mein Anteil ${fmtEuro(e.shares[me]||0)}</span>`:''}</div></button>`;
  }
  return h;
}
function updateList(){const el=byId('list'),g=grp();if(el&&g)el.innerHTML=listHtml(g);}

function vStats(g){
  const exp=g.entries.filter(e=>e.type==='expense');
  if(!exp.length) return `<div class="card empty"><p>Noch keine Ausgaben. Die Auswertung erscheint, sobald etwas erfasst ist.</p></div>`;
  const total=totalExpenses(g);
  // Tage
  const byDay=new Map(); exp.forEach(e=>byDay.set(e.date,(byDay.get(e.date)||0)+e.amountCents));
  let days=[...byDay.keys()];
  const tn=tripNights(g);
  if(tn!=null&&tn<=60){for(let k=0;k<=tn;k++){const d=addPeriod(g.startDate,'daily',k);if(!byDay.has(d))days.push(d);}}
  days=[...new Set(days)].sort();
  const maxD=Math.max(1,...days.map(d=>byDay.get(d)||0));
  const topDay=[...byDay].sort((a,b)=>b[1]-a[1])[0];
  let h=`<div class="card"><h2>Überblick</h2><div class="kpis"><div><span class="small muted">Gesamt</span><b>${fmtEuro(total)}</b></div><div><span class="small muted">pro Person</span><b>${fmtEuro(Math.round(total/Math.max(1,g.members.length)))}</b></div><div><span class="small muted">pro Tag (${days.length} ${days.length===1?'Tag':'Tage'})</span><b>${fmtEuro(Math.round(total/Math.max(1,days.length)))}</b></div><div><span class="small muted">teuerster Tag</span><b>${fmtDate(topDay[0],true)}</b><span class="small muted">${fmtEuro(topDay[1])}</span></div></div></div>`;
  // Kategorien
  const byCat=new Map(); exp.forEach(e=>{const k=e.category||'none';byCat.set(k,(byCat.get(k)||0)+e.amountCents);});
  const cats=[...byCat].sort((a,b)=>b[1]-a[1]), maxC=cats[0][1];
  h+=`<div class="card"><h2>Nach Kategorie</h2>${cats.map(([k,v])=>{const c=CATS.find(x=>x[0]===k);return `<button class="cstat" data-act="filterCat" data-id="${k}" aria-label="Ausgaben der Kategorie ${c?c[1]:'ohne Kategorie'} anzeigen"><div class="top2"><span>${c?c[2]+' '+c[1]:'💶 Ohne Kategorie'}</span><span>${fmtEuro(v)} <span class="muted small">${Math.round(v/total*100)} %</span></span></div><div class="hbar"><i style="width:${(v/maxC*100).toFixed(1)}%"></i></div></button>`;}).join('')}<p class="small muted" style="margin:8px 0 0">Tippe auf eine Kategorie, um ihre Ausgaben zu sehen.</p>${(()=>{const n=exp.filter(e=>!e.category&&guessCat(e.title)).length;return n?`<button class="btn block" data-act="autoCats" style="margin-top:10px">${n} ohne Kategorie automatisch zuordnen</button>`:'';})()}</div>`;
  // Personen
  const paid={},share={}; g.members.forEach(m=>{paid[m.id]=0;share[m.id]=0;});
  exp.forEach(e=>{const p=paidMap(e);for(const k in p)paid[k]=(paid[k]||0)+p[k];for(const k in e.shares)share[k]=(share[k]||0)+e.shares[k];});
  const maxP=Math.max(1,...g.members.map(m=>Math.max(paid[m.id],share[m.id])));
  h+=`<div class="card"><h2>Nach Person</h2><div class="legend"><span><i style="background:var(--petrol)"></i>bezahlt</span><span><i style="background:var(--muted)"></i>eigener Anteil</span></div>${g.members.map(m=>`<div class="cstat"><div class="top2"><span>${esc(m.name)}</span></div><div class="hbar"><i style="width:${(paid[m.id]/maxP*100).toFixed(1)}%"></i></div><div class="hbar share"><i style="width:${(share[m.id]/maxP*100).toFixed(1)}%"></i></div><div class="small muted" style="margin-top:4px">bezahlt ${fmtEuro(paid[m.id])} · Anteil ${fmtEuro(share[m.id])}</div></div>`).join('')}</div>`;
  // Tage
  h+=`<div class="card"><h2>Nach Tag</h2><div class="cols" role="list">${days.map(d=>{const v=byDay.get(d)||0;return `<div class="col" role="listitem" aria-label="${fmtDate(d)}: ${fmtEuro(v)}"><div class="colbar"><i style="height:${v?Math.max(2,v/maxD*100).toFixed(1):0}%"></i></div><span>${d.slice(8,10)}.${d.slice(5,7)}.</span></div>`;}).join('')}</div><p class="small muted" style="margin:8px 0 0">Höchster Wert: ${fmtEuro(maxD)} am ${fmtDate(topDay[0])}.</p></div>`;
  return h;
}

function vSettle(g){
  if(!g.members.length) return `<div class="card empty"><p>Noch keine Personen.</p><button class="btn primary block" data-act="tab" data-tab="members">Personen hinzufügen</button></div>`;
  const b=balances(g), order=g.members.map(m=>m.id);
  const max=Math.max(1,...order.map(id=>Math.abs(b[id]||0)));
  let h=`<div class="card"><h2>Salden</h2>`;
  for(const m of g.members){
    const v=b[m.id]||0, pct=Math.abs(v)/max*50;
    h+=`<div class="bal"><div class="nm">${esc(m.name)}</div><div class="v ${v>0?'pos':v<0?'neg':'muted'}">${fmtEuro(v,true)}</div><div class="bar" aria-hidden="true">${v?`<i class="${v>0?'p':'n'}" style="width:${pct.toFixed(2)}%"></i>`:''}</div></div>`;
  }
  h+=`<p class="small muted" style="margin:10px 0 0">Plus: bekommt Geld zurück. Minus: schuldet Geld.</p></div>`;

  const mt=minTransfers(b,order); lastTransfers=mt.transfers;
  const naive=naiveDebtCount(g), n=mt.transfers.length;
  h+=`<div class="card"><h2>Vorschlag zum Ausgleich</h2>`;
  if(!n){
    h+=`<p class="muted" style="margin:0">${g.entries.length?'Alles ausgeglichen. Niemand schuldet noch etwas.':'Noch nichts abzurechnen.'}</p>`;
  }else{
    h+=`<p class="sumline"><b>${n} ${n===1?'Überweisung':'Überweisungen'}</b>${naive>n?` <span class="muted">statt ${naive} Einzelschulden</span>`:''}</p>`;
    mt.transfers.forEach((t,i)=>{
      const pp=paypalOf(g,t.to);
      h+=`<div class="tr"><div class="who"><div class="n">${esc(nameOf(g,t.from))} → ${esc(nameOf(g,t.to))}</div><div class="a">${fmtEuro(t.cents)}</div></div>${pp?`<a class="btn sm pp" href="${esc(paypalUrl(pp,t.cents))}" target="_blank" rel="noopener" aria-label="${esc(fmtEuro(t.cents))} an ${esc(nameOf(g,t.to))} mit PayPal senden">${IC.paypal}PayPal</a>`:''}<button class="btn sm" data-act="markPaid" data-i="${i}">Bezahlt</button></div>`;
    });
    const noPP=[...new Set(mt.transfers.map(t=>t.to))].filter(id=>!paypalOf(g,id));
    if(noPP.length) h+=`<p class="small muted pphint">PayPal-Knopf: ${noPP.map(id=>esc(nameOf(g,id))).join(', ')} ${noPP.length===1?'hat':'haben'} noch keinen PayPal.Me-Namen. <br><button class="btn sm" data-act="tab" data-tab="members">Bei „Personen“ eintragen</button></p>`;
    else h+=`<p class="small muted pphint">„PayPal“ öffnet PayPal mit Empfänger und Betrag. Danach hier „Bezahlt“ antippen.</p>`;
    if(!mt.exact) h+=`<p class="small muted">Bei mehr als 15 Personen mit offenem Saldo wird ein schnelles Näherungsverfahren genutzt.</p>`;
  }
  h+=`<button class="btn block" data-act="newPayment" style="margin-top:10px">+ Andere Zahlung erfassen</button></div>`;
  const st=g.entries.filter(e=>e.type==='settlement').sort((a,b)=>b.date.localeCompare(a.date)||String(b.createdAt||'').localeCompare(String(a.createdAt||'')));
  if(st.length){
    h+=`<div class="card"><h2>Erledigte Zahlungen</h2>`;
    st.forEach(e=>{h+=`<div class="tr done"><div class="who"><div class="n">${esc(nameOf(g,e.paidBy))} → ${esc(nameOf(g,e.paidTo))}</div><div class="a">${fmtEuro(e.amountCents)} · ${fmtDate(e.date)}</div></div><button class="btn sm" data-act="editPayment" data-id="${e.id}">Bearbeiten</button></div>`;});
    h+=`</div>`;
  }
  h+=`<div class="btnrow"><button class="btn" data-act="copyText">Als Text kopieren</button>${navigator.share?'<button class="btn" data-act="shareText">Teilen</button>':''}</div>`;
  return h;
}
function paySheet(g,o){
  const opts=sel=>g.members.map(m=>`<option value="${m.id}" ${m.id===sel?'selected':''}>${esc(m.name)}</option>`).join('');
  openSheet(`<h2>${o.id?'Zahlung bearbeiten':o.suggested?'Als bezahlt markieren':'Zahlung erfassen'}</h2>
  <div class="two"><div><label class="fl" for="pFrom">Von</label><select id="pFrom" class="in">${opts(o.from)}</select></div><div><label class="fl" for="pTo">An</label><select id="pTo" class="in">${opts(o.to)}</select></div></div>
  <div class="two"><div><label class="fl" for="pAmt">Betrag in €</label><input id="pAmt" class="in big" inputmode="decimal" value="${o.cents?fmtPlain(o.cents):''}" placeholder="0,00" autocomplete="off"></div><div><label class="fl" for="pDate-btn">Datum</label>${dateField('pDate',o.date,{label:'Datum der Zahlung'})}</div></div>
  <p class="small muted">${o.suggested?'Nur einen Teil überwiesen? Betrag anpassen, der Rest bleibt offen.':'Eine Zahlung zwischen zwei Personen verändert nur die Salden, nicht die Gesamtausgaben.'}</p>
  <div class="btnrow"><button class="btn" data-act="closeSheet">Abbrechen</button><button class="btn primary" data-act="savePayment" data-id="${o.id||''}">${o.suggested?'Als bezahlt speichern':'Zahlung speichern'}</button></div>
  ${o.id?`<button class="btn danger block" data-act="delPayment" data-id="${o.id}" style="margin-top:8px">Zahlung löschen</button>`:''}`);
}

function stepper(kind,id,val,label){
  return `<div class="stepper"><button data-act="step" data-k="${kind}" data-id="${id}" data-d="-1" aria-label="${esc(label)} verringern">−</button><span class="v" id="${kind}-${id}">${val}</span><button data-act="step" data-k="${kind}" data-id="${id}" data-d="1" aria-label="${esc(label)} erhöhen">+</button></div>`;
}
const PCOL=['#0A84FF','#FF9500','#34C759','#AF52DE','#5856D6','#30B0C7','#FF2D55'];
function vMembers(g){
  const me=meId(g), tn=tripNights(g), n=g.members.length;
  const rows=g.members.map((m,i)=>`<div class="gperson"><span class="gic" style="--c:${PCOL[i%PCOL.length]}" aria-hidden="true">${esc((m.name.trim()[0]||'?').toUpperCase())}</span><div class="gbody"><div class="h"><button class="nmb" data-act="memberMenu" data-id="${m.id}">${esc(m.name)}</button>${m.id===me?'<span class="badge">Ich</span>':''}${m.paypal?'<span class="badge pp" title="PayPal.Me hinterlegt">PayPal</span>':''}<button class="iconbtn" data-act="memberMenu" data-id="${m.id}" aria-label="Aktionen für ${esc(m.name)}">${IC.dots}</button></div>

/* Ausgabe erfassen */
function fillSplit(d,g,s,isDefault){
  const w=s.weights||{};
  d.mode=MODE_SHORT[s.mode]?s.mode:'equal';
  if(isDefault&&!DEFAULT_MODES.includes(d.mode)){d.mode='equal';return;}
  g.members.forEach(m=>{
    const has=m.id in w, v=w[m.id];
    if(!has&&isDefault) return;
    if(d.mode==='equal') d.eq[m.id]=v>0;
    if(d.mode==='weights') d.wt[m.id]=+v||0;
    if(d.mode==='nights') d.nt[m.id]=+v||0;
    if(d.mode==='fixed') d.fx[m.id]=has?(v==null?'':fmtPlain(v)):'0';
    if(d.mode==='percent') d.pc[m.id]=v==null?'':fmtNum(v);
  });
  if(d.mode==='items'&&!isDefault) d.items=(s.items||[]).map(it=>({name:it.name||'',price:it.priceCents!=null?fmtPlain(it.priceCents):'',members:(it.memberIds||[]).slice()}));
}
function newDraft(g,e){
  const tn=tripNights(g);
  const d={id:null,createdAt:null,title:'',amount:'',date:todayISO(),paidBy:meId(g),category:null,mode:'equal',eq:{},wt:{},nt:{},fx:{},pc:{},items:[],
    multi:false,pay:{},curOn:false,curCode:'CHF',curAmt:'',curRate:'',freq:'',until:'',skipped:[],note:'',seriesId:null};
  g.members.forEach(m=>{d.eq[m.id]=true;d.wt[m.id]=m.defaultWeight??1;d.nt[m.id]=m.nights??tn??1;d.fx[m.id]='';d.pc[m.id]='';d.pay[m.id]='';});
  if(!e&&g.defaultSplit) fillSplit(d,g,g.defaultSplit,true);
  if(e){
    Object.assign(d,{id:e.id,createdAt:e.createdAt||null,title:e.title||'',amount:fmtPlain(e.amountCents),date:e.date,paidBy:e.paidBy,category:e.category||null,catManual:!!e.category,note:e.note||'',seriesId:e.seriesId||null});
    fillSplit(d,g,e.split||{mode:'equal',weights:{}},false);
    if(e.payers&&payerIds(e).length>1){d.multi=true;for(const k in e.payers) if(e.payers[k]>0) d.pay[k]=fmtPlain(e.payers[k]);}
    if(e.fx){d.curOn=true;d.curCode=e.fx.currency;d.curAmt=fmtPlain(e.fx.amountCents);d.curRate=fmtRate(e.fx.rate);}
    if(e.repeat){d.freq=e.repeat.freq;d.until=e.repeat.until||'';d.skipped=(e.repeat.skipped||[]).slice();}
  }
  if(!d.items.length) d.items=[{name:'',price:'',members:g.members.map(m=>m.id)}];
  return d;
}
function draftSplit(g,d){
  const w={};
  g.members.forEach(m=>{
    const id=m.id;
    if(d.mode==='equal') w[id]=d.eq[id]?1:0;
    else if(d.mode==='weights') w[id]=+d.wt[id]||0;
    else if(d.mode==='nights') w[id]=+d.nt[id]||0;
    else if(d.mode==='fixed'){const s=String(d.fx[id]??'').trim();w[id]=s===''?null:(parseEuro(s)??NaN);}
    else if(d.mode==='percent') w[id]=parseNum(d.pc[id]);
  });
  const items=d.mode==='items'?d.items.map(it=>({name:it.name.trim(),priceCents:String(it.price).trim()===''?null:(parseEuro(it.price)??NaN),memberIds:it.members.filter(id=>g.members.some(m=>m.id===id))})):[];
  return {mode:d.mode,weights:d.mode==='items'?{}:w,items};
}
function evalDraft(g,d){
  let amount=parseEuro(d.amount), curMsg='';
  if(d.curOn){
    const fa=parseEuro(d.curAmt), rate=parseRate(d.curRate);
    amount=fa>0&&rate?Math.round(fa*rate):null;
    if(!(fa>0)) curMsg=String(d.curAmt).trim()?`Der Betrag in ${d.curCode} ist ungültig.`:`Betrag in ${d.curCode} fehlt.`;
    else if(!rate) curMsg=String(d.curRate).trim()?'Der Kurs ist ungültig.':'Kurs fehlt.';
  }
  const split=computeSplit(amount||0,draftSplit(g,d),g.members);
  let payers=null, paidBy=d.paidBy, payMsg='', payInfo='';
  if(d.multi){
    payers={}; let sum=0, bad=null;
    g.members.forEach(m=>{const s=String(d.pay[m.id]??'').trim(); if(!s) return; const c=parseEuro(s); if(c==null){bad=bad||m.name;return;} if(c>0){payers[m.id]=c;sum+=c;}});
    const ids=Object.keys(payers);
    if(bad) payMsg=`Ungültiger Betrag bei ${bad}.`;
    else if(!ids.length) payMsg='Trag ein, wer wie viel bezahlt hat.';
    else if(amount>0&&sum!==amount) payMsg=sum<amount?`Es fehlen noch ${fmtEuro(amount-sum)} (bezahlt ${fmtEuro(sum)} von ${fmtEuro(amount)}).`:`Das sind ${fmtEuro(sum-amount)} zu viel (${fmtEuro(sum)} statt ${fmtEuro(amount)}).`;
    else payInfo=`${ids.length} ${ids.length===1?'Person':'Personen'} · zusammen ${fmtEuro(sum)}`;
    paidBy=ids.sort((a,b)=>payers[b]-payers[a])[0]||null;
    if(ids.length<2) payers=null;
  }
  let msg='';
  if(!d.title.trim()) msg='Titel fehlt.';
  else if(curMsg) msg=curMsg;
  else if(!(amount>0)) msg=String(d.amount).trim()?'Der Betrag ist ungültig.':'Betrag fehlt.';
  else if(d.multi&&payMsg) msg=payMsg;
  else if(!paidBy||!g.members.some(m=>m.id===paidBy)) msg='Wähle, wer bezahlt hat.';
  else if(!/^\d{4}-\d{2}-\d{2}$/.test(d.date||'')) msg='Datum fehlt.';
  else if(!split.ok) msg=split.msg;
  else if(d.freq&&d.until&&d.until<d.date) msg='Das Ende der Wiederholung liegt vor dem Datum.';
  return {ok:!msg,msg,amount,split,payers,paidBy,payMsg,payInfo};
}

function settlementText(g){
  const b=balances(g), order=g.members.map(m=>m.id), mt=minTransfers(b,order), n=mt.transfers.length, naive=naiveDebtCount(g);
  const sp=s=>s.replace(/\u00a0/g,' ');
  const L=[`Abrechnung „${g.name}“`];
  const meta=[fmtRange(g),g.members.length+' Personen'].filter(Boolean).join(' · ');
  L.push(meta, `Gesamtausgaben: ${sp(fmtEuro(totalExpenses(g)))}`, '', 'Salden');
  g.members.forEach(m=>L.push(`${m.name}: ${sp(fmtEuro(b[m.id]||0,true))}`));
  L.push('');
  if(!n) L.push('Alles ausgeglichen.');
  else{
    L.push(`Überweisungen (${n}${naive>n?` statt ${naive} Einzelschulden`:''})`);
    mt.transfers.forEach(t=>{L.push(`${nameOf(g,t.from)} → ${nameOf(g,t.to)}: ${sp(fmtEuro(t.cents))}`);const pp=paypalOf(g,t.to);if(pp)L.push(`   PayPal: ${paypalUrl(pp,t.cents)}`);});
  }
  return L.join('\n');
}

async function exportGroup(g){
  const clean=Object.assign({},g); delete clean.share;
  const txt=JSON.stringify({version:1,type:'kostenaufteilung-reise',exportedAt:new Date().toISOString(),group:clean},null,2);
  const name=`kosten-${slug(g.name)}-${todayISO()}.json`;
  const blob=new Blob([txt],{type:'application/json'});
  try{
    const file=new File([blob],name,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return;}
  }catch(e){ if(e&&e.name==='AbortError') return; }
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);
  notify('Export gespeichert');
}
async function importData(data){
  let list=[];
  if(data&&data.group) list=[data.group]; else if(data&&Array.isArray(data.groups)) list=data.groups;
  if(!list.length){await info('Import nicht möglich','In der Datei wurde keine Reise gefunden.');return;}
  let n=0,last=null,dropped=0;
  for(const raw of list){
    const res=normalizeGroup(raw); if(!res) continue;
    let g=res.group; dropped+=res.dropped;
    const i=S.groups.findIndex(x=>x.id===g.id);
    if(i>=0){
      const c=await ask({title:'Reise schon vorhanden',text:`„${S.groups[i].name}“ gibt es bereits auf diesem Gerät. Ersetzen überschreibt den Stand hier mit dem aus der Datei. Eine Kopie lässt beide nebeneinander bestehen.`,
        buttons:[{label:'Mit Datei ersetzen',value:'replace',style:'danger'},{label:'Als Kopie anlegen',value:'copy',style:'primary'},{label:'Abbrechen',value:null}]});
      if(c==='replace') S.groups[i]=g;
      else if(c==='copy'){g=cloneGroup(g);g.name+=' (Kopie)';S.groups.push(g);}
      else continue;
    }else S.groups.push(g);
    n++; last=g;
  }
  runRecurring(); save();
  if(n===1){S.ui.activeGroupId=last.id;save();F={q:'',cat:'',person:''};V={name:'group',tab:'overview'};}
  render();
  notify(n?`${n===1?'Reise':n+' Reisen'} importiert${dropped?` (${dropped} fehlerhafte Einträge übersprungen)`:''}`:'Nichts importiert');
}

/* ===== Teilen & Abgleich über den Pi (PocketBase) ===== */
const DEFAULT_SERVER='https://kostenpi.tail281e3e.ts.net';
function server(){try{return localStorage.getItem('kosten-server')||DEFAULT_SERVER;}catch(e){return DEFAULT_SERVER;}}
function b64e(u8){let s='';for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
function b64d(str){str=str.replace(/-/g,'+').replace(/_/g,'/');while(str.length%4)str+='=';const b=atob(str),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
const keyCache=new Map();
function keysFor(secret){
  if(!keyCache.has(secret)) keyCache.set(secret,(async()=>{
    const te=t=>new TextEncoder().encode(t), salt=te('kostenaufteilung-v1');
    const base=await crypto.subtle.importKey('raw',b64d(secret),'HKDF',false,['deriveKey','deriveBits']);
    const enc=await crypto.subtle.deriveKey({name:'HKDF',hash:'SHA-256',salt,info:te('enc')},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
    const bits=await crypto.subtle.deriveBits({name:'HKDF',hash:'SHA-256',salt,info:te('auth')},base,256);
    return {enc,auth:b64e(new Uint8Array(bits))};
  })());
  return keyCache.get(secret);
}
async function encryptPayload(key,obj){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(JSON.stringify(obj)));
  return 'v1.'+b64e(iv)+'.'+b64e(new Uint8Array(ct));
}
async function decryptPayload(key,str){
  const p=String(str||'').split('.'); if(p.length!==3||p[0]!=='v1') throw new Error('Unbekanntes Datenformat');
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(p[1])},key,b64d(p[2]));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function api(method,path,auth,body){
  const h={}; if(auth) h['X-Trip-Auth']=auth; if(body) h['Content-Type']='application/json';
  const ctl=new AbortController(), to=setTimeout(()=>ctl.abort(),15000);
  try{
    const r=await fetch(server()+'/api/collections/trips/records'+path,{method,headers:h,body:body?JSON.stringify(body):undefined,cache:'no-store',signal:ctl.signal});
    let j=null; try{j=await r.json();}catch(e){}
    return {status:r.status,json:j};
  }finally{clearTimeout(to);}
}
const syncing=new Set(), pendingSync=new Set(), syncTimers={};
let pendingRender=false;
function scheduleSync(id,ms){
  clearTimeout(syncTimers[id]);
  syncTimers[id]=setTimeout(()=>{ if(syncing.has(id)) pendingSync.add(id); else syncGroup(id); },ms??1200);
}
function syncAll(){ S.groups.forEach(g=>{ if(g.share&&!g.archived&&!syncing.has(g.id)) syncGroup(g.id); }); }
const byGid=id=>S.groups.find(x=>x.id===id);
function shareEnded(g,msg){
  kontoRemove(g.share&&g.share.id); g.noAutoShare=true;
  delete g.share; persist(); setBadge(g.id); render(true);
  info('Teilen beendet',msg||`„${g.name}“ wird nicht mehr geteilt, zum Beispiel weil jemand das Teilen für alle beendet hat. Deine Kopie bleibt auf diesem Gerät erhalten.`);
}
function remoteChanged(id){
  const a=document.activeElement, typing=a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName);
  if(V.name==='groups'||(V.name==='group'&&S.ui.activeGroupId===id)){ if(typing) pendingRender=true; else render(true); }
}
async function syncGroup(id){
  let g=byGid(id); if(!g||!g.share||syncing.has(id)) return;
  syncing.add(id); setBadge(id);
  try{
    const k=await keysFor(g.share.secret);
    for(let round=0;round<5;round++){
      g=byGid(id); if(!g||!g.share) return;
      const r=await api('GET','/'+g.share.id,k.auth);
      g=byGid(id); if(!g||!g.share) return;
      if(r.status===404){shareEnded(g);return;}
      if(r.status!==200||!r.json) throw new Error('Server antwortet mit '+r.status);
      const rec=r.json;
      if(rec.updated===g.share.seen&&!g.share.dirty) break;
      const remote=sanitizePayload(await decryptPayload(k.enc,rec.data));
      if(!remote) throw new Error('Daten auf dem Server sind ungültig');
      g=byGid(id); if(!g||!g.share) return;
      g.share.dirty=false;
      const local=sanitizePayload(sharedPayload(g)), merged=mergePayloads(local,remote);
      if(canon(merged)!==canon(local)){ const ng=applyPayload(g,merged); S.groups[S.groups.indexOf(g)]=ng; g=ng; persist(); remoteChanged(id); }
      if(canon(merged)===canon(remote)){ g.share.seen=rec.updated; persist(); break; }
      const data=await encryptPayload(k.enc,merged);
      const u=await api('PATCH','/'+g.share.id,k.auth,{data,rev:(+rec.rev||0)+1});
      g=byGid(id); if(!g||!g.share) return;
      if(u.status===404){shareEnded(g);return;}
      if(u.status!==200||!u.json) throw new Error('Server antwortet mit '+u.status);
      g.share.seen=u.json.updated; persist();
    }
    g=byGid(id); if(g&&g.share){g.share.at=nowISO();g.share.err='';persist();kontoApply();}
  }catch(e){
    const g2=byGid(id); if(g2&&g2.share){g2.share.dirty=true;g2.share.err=e&&e.name==='AbortError'?'Zeitüberschreitung':(e&&e.message)||'Keine Verbindung';persist();}
  }finally{
    syncing.delete(id); setBadge(id); updateShareStatus();
    if(pendingSync.has(id)){pendingSync.delete(id);scheduleSync(id,300);}
  }
}
function badgeHtml(g){

/* Wie „Reise teilen“, nur still (ohne Rückfrage); wartet auf ein laufendes automatisches Teilen */
async function ensureShared(gid){
  for(let t=0;kontoSharing.has(gid)&&t<150;t++) await new Promise(r=>setTimeout(r,100));
  let g=byGid(gid); if(!g) throw new Error('Reise nicht gefunden');
  if(g.share) return g;
  kontoSharing.add(gid);
  try{
    const secret=b64e(crypto.getRandomValues(new Uint8Array(32))), k=await keysFor(secret);
    const p=sanitizePayload(sharedPayload(g)); if(!p) throw new Error('Daten ungültig');
    const r=await api('POST','',null,{auth:k.auth,data:await encryptPayload(k.enc,p),rev:1});
    if(r.status!==200||!r.json||!r.json.id) throw new Error('Server antwortet mit '+r.status);
    const cur=byGid(gid); if(!cur) throw new Error('Reise nicht gefunden');
    if(cur.share) return cur;
    cur.share={id:r.json.id,secret,seen:r.json.updated,at:nowISO(),err:'',dirty:true}; delete cur.noAutoShare;
    persist(); setBadge(gid); remoteChanged(gid); kontoApply(); syncGroup(gid);
    return cur;
  }finally{kontoSharing.delete(gid);}
}

/* ===== Zentrales Konto: Reisen automatisch mit dem Konto verknüpfen =====
   Nur wenn angemeldet. Schlüssel „kosten:<shareId>“ → {app,id,secret,label}.
   g.share.konto = Benutzer, für den die Reise schon eingetragen wurde (lokal; fehlt der Eintrag danach im Konto,
   wurde er auf einem anderen Gerät entfernt und wird hier nicht erneut eingetragen). Archiv-Status wird nicht geteilt. */
const kontoKey=id=>'kosten:'+id;
const kontoJoining=new Set(), kontoSharing=new Set();
function kontoItem(g){return {app:'kosten',id:g.share.id,secret:g.share.secret,label:g.name};}
function kontoRemove(shareId){try{if(shareId&&Konto.loggedIn())Konto.remove(kontoKey(shareId));}catch(e){}}
function kontoApply(){
  if(!Konto.loggedIn()) return;
  const user=Konto.user(), items=Konto.items('kosten'), have=new Map(items.map(i=>[i.key,i]));
  let changed=false;
  for(const it of items){
    if(!it.id||!it.secret||S.groups.some(g=>g.share&&g.share.id===it.id)) continue;
    joinSilent(it);
  }
  for(const g of S.groups){
    if(g.share){
      const it=have.get(kontoKey(g.share.id));
      if(it){
        if(it.label!==g.name||it.secret!==g.share.secret) Konto.put(kontoKey(g.share.id),kontoItem(g));
        if(g.share.konto!==user){g.share.konto=user;changed=true;}
      }else if(g.share.konto!==user){
        Konto.put(kontoKey(g.share.id),kontoItem(g)); g.share.konto=user; changed=true;
      }
    }else if(!g.archived&&!g.noAutoShare&&g.members.length>=1) autoShare(g.id);
  }
  if(changed) persist();
}
function kontoRefresh(){
  if(!Konto.loggedIn()) return;
  kontoApply();
  Konto.sync().then(kontoApply).catch(()=>{});
}
/* Wie „Reise teilen“, nur still: verschlüsselten Datensatz anlegen und ins Konto eintragen */
async function autoShare(gid){
  if(kontoSharing.has(gid)) return;
  kontoSharing.add(gid);
  try{
    const g=byGid(gid); if(!g||g.share||g.archived||g.noAutoShare||!Konto.loggedIn()) return;
    const secret=b64e(crypto.getRandomValues(new Uint8Array(32))), k=await keysFor(secret);
    const p=sanitizePayload(sharedPayload(g)); if(!p) return;
    const r=await api('POST','',null,{auth:k.auth,data:await encryptPayload(k.enc,p),rev:1});
    if(r.status!==200||!r.json||!r.json.id) return;
    const cur=byGid(gid); if(!cur||cur.share) return;
    cur.share={id:r.json.id,secret,seen:r.json.updated,at:nowISO(),err:'',dirty:true};
    persist(); setBadge(gid); remoteChanged(gid);
    if(Konto.loggedIn()){Konto.put(kontoKey(cur.share.id),kontoItem(cur));cur.share.konto=Konto.user();persist();}
    syncGroup(gid);   // Änderungen während des Hochladens nachziehen
  }catch(e){}finally{kontoSharing.delete(gid);}
}
/* Wie joinTrip, nur ohne Navigation und Hinweise; „Wer bist du?“ erst beim Öffnen der Reise */
async function joinSilent(it){
  if(kontoJoining.has(it.id)) return;
  kontoJoining.add(it.id);
  try{
    const k=await keysFor(it.secret), r=await api('GET','/'+it.id,k.auth);
    if(r.status===404){kontoRemove(it.id);return;}
    if(r.status!==200||!r.json) return;
    const p=sanitizePayload(await decryptPayload(k.enc,r.json.data)); if(!p) return;
    if(!Konto.loggedIn()||S.groups.some(x=>x.share&&x.share.id===it.id)) return;
    const i=S.groups.findIndex(x=>x.id===p.gid);
    const base=i>=0?S.groups[i]:{id:p.gid,archived:false,members:[],entries:[],createdAt:nowISO()};
    const merged=i>=0?mergePayloads(sanitizePayload(sharedPayload(base)),p):p;
    const g=applyPayload(base,merged);
    g.share={id:it.id,secret:it.secret,seen:r.json.updated,at:nowISO(),err:'',dirty:i>=0,konto:Konto.user()};
    if(i>=0) S.groups[i]=g; else S.groups.push(g);
    if(!meId(g)){S.ui.askMe=S.ui.askMe||{};S.ui.askMe[g.id]=true;}

/* ===== Datumsauswahl (eigener Kalender: schließt nach dem Antippen eines Tages) ===== */
const WD=['So','Mo','Di','Mi','Do','Fr','Sa'];
function fmtDateLong(iso){const[y,m,d]=iso.split('-').map(Number);return WD[new Date(y,m-1,d).getDay()]+', '+fmtDate(iso);}
/* opt: {f, label, optional, min, pair, placeholder} – min/pair sind IDs anderer Datumsfelder */
function dateField(id,value,o){
  o=o||{};
  return `<input type="hidden" id="${id}" value="${esc(value||'')}"${o.f?` data-f="${o.f}"`:''}>`
   +`<button type="button" class="in datebtn" id="${id}-btn" data-act="pickDate" data-target="${id}" data-label="${esc(o.label||'Datum')}"${o.optional?' data-opt="1"':''}${o.min?` data-min="${o.min}"`:''}${o.pair?` data-pair="${o.pair}"`:''} data-ph="${esc(o.placeholder||'Datum wählen')}">`
   +(value?esc(fmtDateLong(value)):`<span class="muted">${esc(o.placeholder||'Datum wählen')}</span>`)+`</button>`;
}
function setDate(id,v){
  const inp=byId(id), btn=byId(id+'-btn'); if(!inp) return;
  inp.value=v||'';
  if(btn) btn.innerHTML=v?esc(fmtDateLong(v)):`<span class="muted">${esc(btn.dataset.ph||'Datum wählen')}</span>`;
  inp.dispatchEvent(new Event('input',{bubbles:true}));
}
let P=null;
function openPicker(btn){
  const id=btn.dataset.target, val=byId(id).value;
  const minEl=btn.dataset.min&&byId(btn.dataset.min), pairEl=btn.dataset.pair&&byId(btn.dataset.pair);
  const min=minEl&&minEl.value||'';
  const start=val||min||todayISO();
  P={id,label:btn.dataset.label,opt:!!btn.dataset.opt,min,pair:pairEl&&pairEl.value||'',month:start.slice(0,7)};
  renderPicker();
  byId('pick-root').classList.add('open'); document.body.classList.add('lock');
}
function renderPicker(){
  const [y,m]=P.month.split('-').map(Number), val=byId(P.id).value;
  const first=new Date(y,m-1,1), lead=(first.getDay()+6)%7, days=new Date(y,m,0).getDate();
  let name=''; try{name=first.toLocaleDateString('de-DE',{month:'long',year:'numeric'});}catch(e){name=m+'/'+y;}
  const lo=[val,P.pair].filter(Boolean).sort()[0], hi=[val,P.pair].filter(Boolean).sort().pop();
  let cells=['Mo','Di','Mi','Do','Fr','Sa','So'].map(w=>`<span class="wd">${w}</span>`).join('')+'<span></span>'.repeat(lead);
  for(let d=1;d<=days;d++){
    const iso=`${y}-${pad2(m)}-${pad2(d)}`;
    const cls=['cday',iso===todayISO()?'today':'',iso===val?'sel':'',(val&&P.pair&&iso>=lo&&iso<=hi&&iso!==val)?'range':''].filter(Boolean).join(' ');
    cells+=`<button class="${cls}" data-act="calPick" data-v="${iso}" ${P.min&&iso<P.min?'disabled':''} aria-label="${esc(fmtDateLong(iso))}"${iso===val?' aria-pressed="true"':''}>${d}</button>`;
  }
  const canPrev=!P.min||P.month>P.min.slice(0,7);
  byId('pick-root').innerHTML=`<div class="scrim" data-act="calClose"></div><div class="dialog cal" role="dialog" aria-modal="true" aria-label="${esc(P.label)} wählen">
   <div class="small muted" style="text-align:center;font-weight:600">${esc(P.label)}</div>
   <div class="calhead"><button class="iconbtn" data-act="calNav" data-d="-1" aria-label="Vorheriger Monat" ${canPrev?'':'disabled style="opacity:.3"'}>‹</button><b>${esc(name)}</b><button class="iconbtn" data-act="calNav" data-d="1" aria-label="Nächster Monat">›</button></div>
   <div class="calgrid">${cells}</div>
   <div class="calfoot">${P.min&&todayISO()<P.min?'':'<button class="btn" data-act="calToday">Heute</button>'}${P.opt&&val?'<button class="btn" data-act="calClear">Kein Datum</button>':''}<button class="btn" data-act="calClose">Abbrechen</button></div></div>`;
}
function closePicker(){const r=byId('pick-root');r.classList.remove('open');r.innerHTML='';P=null;
  if(!byId('sheet-root').classList.contains('open')&&!byId('ask-root').classList.contains('open')) document.body.classList.remove('lock');}
function pickValue(v){
  const id=P.id; closePicker(); setDate(id,v);
  // Abreise folgt der Anreise: leer oder davor -> auf die Anreise setzen
  if(id==='gStart'&&v){const e=byId('gEnd');if(e&&(!e.value||e.value<v)) setDate('gEnd',v);}
  if(id==='fDate'&&v){const u=byId('fUntil');if(u&&u.value&&u.value<v) setDate('fUntil',v);}
}

/* ===== Blätter nach unten wegziehen ===== */
let drag=null;
document.addEventListener('touchstart',e=>{
  const sh=e.target.closest('#sheet-root .sheet'); if(!sh||e.touches.length>1) return;
  const onGrip=!!e.target.closest('.grip');
  if(!onGrip&&(sh.scrollTop>0||e.target.closest('input,textarea,select'))) return;
  drag={sh,y0:e.touches[0].clientY,t0:Date.now(),dy:0,grip:onGrip}; sh.style.transition='none';
},{passive:true});
document.addEventListener('touchmove',e=>{
  if(!drag) return;
  const dy=e.touches[0].clientY-drag.y0;
  if(dy<=0&&!drag.grip){drag.sh.style.transform='';drag=null;return;}   // nach oben = normal scrollen
  drag.dy=Math.max(0,dy); drag.sh.style.transform=`translateY(${drag.dy}px)`;
  if(e.cancelable) e.preventDefault();
},{passive:false});
function endDrag(){
  if(!drag) return;
  const {sh,dy,t0}=drag; drag=null;
  const fast=dy/Math.max(1,Date.now()-t0)>0.5;
  sh.style.transition='transform .2s ease';
  if(dy>100||(dy>40&&fast)){ sh.style.transform='translateY(110%)'; setTimeout(closeSheet,190); }
  else sh.style.transform='';
}
document.addEventListener('touchend',endDrag);
document.addEventListener('touchcancel',endDrag);

  renameMember:el=>{
    const m=grp().members.find(x=>x.id===el.dataset.id);
    openSheet(`<h2>Person umbenennen</h2><label class="fl" for="mName">Name</label><input id="mName" class="in" value="${esc(m.name)}" maxlength="40" autocomplete="off">
    <div class="btnrow"><button class="btn" data-act="closeSheet">Abbrechen</button><button class="btn primary" data-act="saveMember" data-id="${m.id}">Speichern</button></div>`);
    byId('mName').focus();
  },
  saveMember:el=>{
    const g=grp(), m=g.members.find(x=>x.id===el.dataset.id), name=byId('mName').value.trim();
    if(!name){notify('Bitte einen Namen eingeben.');return;}
    if(g.members.some(x=>x.id!==m.id&&x.name.toLowerCase()===name.toLowerCase())){notify(`„${name}“ gibt es schon.`);return;}
    m.name=name; m.updatedAt=nowISO(); save(); closeSheet(); render(true);
  },
  delMember:async el=>{
    closeSheet();
    const g0=grp(), m=g0.members.find(x=>x.id===el.dataset.id); if(!m) return;
    const g=g0;
    if(usedIds(g).has(m.id)){await info('Entfernen nicht möglich',`${m.name} kommt in Ausgaben oder Zahlungen vor und kann nur umbenannt werden.`);return;}
    const ok=await ask({title:`${m.name} entfernen?`,text:'Die Person kommt in keiner Ausgabe vor und wird aus dieser Reise entfernt.',buttons:[{label:'Entfernen',value:true,style:'danger'},{label:'Behalten',value:false}]});
    if(!ok) return;
    const cur=grp(); if(!cur||!cur.members.some(x=>x.id===m.id)) return;
    const sn=snapGroup(cur);
    cur.members=cur.members.filter(x=>x.id!==m.id); tomb(cur,m.id);
    if(S.ui.meByGroup[cur.id]===m.id) delete S.ui.meByGroup[cur.id];
    if(cur.defaultSplit&&cur.defaultSplit.weights) delete cur.defaultSplit.weights[m.id];
    save(); render(true); undoNotice(`${m.name} entfernt`,sn);
  },
  nightsFromTrip:async()=>{
    const g=grp(), tn=tripNights(g);
    const ok=await ask({title:`Alle auf ${tn} ${tn===1?'Nacht':'Nächte'} setzen?`,text:'Die Nächte aller Personen werden aus dem Zeitraum der Reise übernommen. Bereits gespeicherte Ausgaben ändern sich nicht.',buttons:[{label:'Übernehmen',value:true,style:'primary'},{label:'Abbrechen',value:false}]});
    if(!ok) return;
    g.members.forEach(m=>{m.nights=tn;m.updatedAt=nowISO();}); save(); render(true);
  },
  step:el=>{
    const k=el.dataset.k, id=el.dataset.id, dir=+el.dataset.d, out=byId(k+'-'+id);
    if(k==='mw'||k==='mn'){
      const g=grp(), m=g.members.find(x=>x.id===id);
      if(k==='mw'){m.defaultWeight=clamp(Math.round((m.defaultWeight+dir*.5)*2)/2,0,20);out.textContent=fmtNum(m.defaultWeight);}
      else{m.nights=clamp((m.nights??tripNights(g)??0)+dir,0,365);out.textContent=m.nights;}
      m.updatedAt=nowISO(); save();
    }else if(k==='dw'){D.wt[id]=clamp(Math.round(((+D.wt[id]||0)+dir*.5)*2)/2,0,20);out.textContent=fmtNum(D.wt[id]);updatePreview();}
    else if(k==='dn'){D.nt[id]=clamp((+D.nt[id]||0)+dir,0,365);out.textContent=D.nt[id];updatePreview();}
  },

  newExpense:()=>{
    const g=grp();
    if(g.members.length<2){notify('Lege zuerst mindestens zwei Personen an.');V={name:'group',tab:'members'};render();return;}
    openDraft(g,null);
  },
  editExpense:el=>{const g=grp(), e=g.entries.find(x=>x.id===el.dataset.id); if(e) openDraft(g,e);},
  openSeries:async()=>{
    const g=grp(), src=g.entries.find(x=>x.id===D.seriesId); if(!src) return;
    if(await leaveDraft()) openDraft(g,src);
  },
  cancelExpense:async()=>{if(await leaveDraft()){V={name:'group',tab:'overview'};render();}},
  setPayer:el=>{D.paidBy=el.dataset.id;render(true);},
  togMulti:()=>{
    const g=grp();
    if(!D.multi){
      D.multi=true; g.members.forEach(m=>D.pay[m.id]='');
      if(D.paidBy&&D.amount) D.pay[D.paidBy]=D.amount;
    }else{
      const r=evalDraft(g,D); D.multi=false; D.paidBy=r.paidBy||D.paidBy;
    }
    render(true);
  },
  togCur:()=>{
    const g=grp();
    D.curOn=!D.curOn;
    if(D.curOn){
      if(!D.curAmt) D.curAmt=D.amount;
      if(!D.curRate&&g.rates&&g.rates[D.curCode]) D.curRate=fmtRate(g.rates[D.curCode]);
    }
    render(true);
  },
  autoCats:()=>{   // Ausgaben ohne Kategorie anhand des Titels einsortieren
    const g=grp(), now=new Date().toISOString(); let n=0;
    g.entries.forEach(e=>{ if(e.type==='expense'&&!e.category){ const c=guessCat(e.title); if(c){ e.category=c; e.updatedAt=now; n++; } } });
    if(!n) return; save(); render(true); notify(`${n} ${n===1?'Ausgabe':'Ausgaben'} einsortiert`);
  },
  setCat:el=>{D.category=D.category===el.dataset.id?null:el.dataset.id;D.catManual=true;render(true);},
  setMode:el=>{D.mode=el.dataset.id;render(true);},
  setFreq:el=>{D.freq=el.dataset.id;if(!D.freq)D.until='';render(true);},
  saveDefault:()=>{
    const g=grp(), sp=draftSplit(g,D), r=computeSplit(10000,sp,g.members);
    if(!r.ok){notify(r.msg);return;}
    g.defaultSplit={mode:sp.mode,weights:sp.weights,items:[]}; g.metaUpdatedAt=nowISO();
    save(); render(true); notify('Gespeichert. Gilt ab jetzt für neue Ausgaben dieser Reise.');
  },
  clearDefault:()=>{const g=grp();delete g.defaultSplit;g.metaUpdatedAt=nowISO();save();render(true);notify('Standard entfernt. Neue Ausgaben starten wieder gleichmäßig.');},
  togEq:el=>{const id=el.dataset.id;D.eq[id]=!D.eq[id];el.classList.toggle('on',D.eq[id]);el.setAttribute('aria-pressed',D.eq[id]);updatePreview();},
  eqAll:el=>{grp().members.forEach(m=>D.eq[m.id]=el.dataset.v==='1');render(true);},
  pctEven:()=>{
    const ms=grp().members, n=ms.length, base=Math.floor(10000/n); let left=10000-base*n;
    ms.forEach(m=>{const v=base+(left>0?1:0);if(left>0)left--;D.pc[m.id]=fmtNum(v/100);});
    render(true);
  },
  addItem:()=>{D.items.push({name:'',price:'',members:grp().members.map(m=>m.id)});render(true);},
  delItem:el=>{D.items.splice(+el.dataset.i,1);if(!D.items.length)D.items.push({name:'',price:'',members:grp().members.map(m=>m.id)});render(true);},
  togItem:el=>{
    const it=D.items[+el.dataset.i], id=el.dataset.id, on=!it.members.includes(id);
    if(on) it.members.push(id); else it.members=it.members.filter(x=>x!==id);
    el.classList.toggle('on',on); el.setAttribute('aria-pressed',on); updatePreview();
  },
  itemsToTotal:()=>{
    const r=evalDraft(grp(),D); if(!r.split.itemSum) return;
    D.amount=fmtPlain(r.split.itemSum); byId('fAmount').value=D.amount; updatePreview();
  },
  saveExpense:()=>{
    const g=grp(), r=evalDraft(g,D);
    if(!r.ok){notify(r.msg);return;}
    const now=new Date().toISOString();
    if(D.catManual&&D.title.trim()&&D.category!==guessCat(D.title)) catLearn(D.title,D.category);
    const e={id:D.id||uid(),type:'expense',title:D.title.trim(),category:D.category,date:D.date,amountCents:r.amount,paidBy:r.paidBy,
      split:draftSplit(g,D),shares:r.split.shares,createdAt:D.createdAt||now,updatedAt:now};
    if(r.payers) e.payers=r.payers;
    if(D.curOn){
      e.fx={currency:D.curCode,amountCents:parseEuro(D.curAmt),rate:parseRate(D.curRate)};
      if(!g.rates||g.rates[D.curCode]!==e.fx.rate){g.rates=Object.assign({},g.rates,{[D.curCode]:e.fx.rate});g.metaUpdatedAt=now;}
    }
    if(D.note.trim()) e.note=D.note.trim().slice(0,500);
    if(D.seriesId) e.seriesId=D.seriesId;
    else if(D.freq) e.repeat={freq:D.freq,until:D.until||null,skipped:D.skipped};
    const i=g.entries.findIndex(x=>x.id===e.id);
    if(i>=0) g.entries[i]=e; else g.entries.push(e);
    const wasEdit=!!D.id; D=null; save();
    if(!wasEdit) pushEntry(g,e);
    const added=runRecurring();
    V={name:'group',tab:'overview'}; render();
    notify((wasEdit?'Änderungen gespeichert':'Ausgabe gespeichert')+(added?` · ${added} ${added===1?'Wiederholung':'Wiederholungen'} ergänzt`:''));
  },
  delExpense:async()=>{
    const g=grp(), e=g.entries.find(x=>x.id===D.id); if(!e) return;
    const inst=g.entries.filter(x=>x.seriesId===e.id);
    let choice;
    if(e.repeat&&inst.length){
      choice=await ask({title:'Serie löschen?',text:`„${e.title}“ wiederholt sich ${FREQ_SHORT[e.repeat.freq]}. Dazu gibt es ${inst.length} weitere ${inst.length===1?'Eintrag':'Einträge'}. Wird nur dieser Eintrag gelöscht, entstehen keine neuen mehr.`,
        buttons:[{label:'Ganze Serie löschen',value:'all',style:'danger'},{label:'Nur diesen Eintrag löschen',value:'one'},{label:'Abbrechen',value:null}]});
    }else{
      const src=e.seriesId&&g.entries.find(x=>x.id===e.seriesId);
      choice=await ask({title:'Ausgabe löschen?',text:`„${e.title}“ wird gelöscht und aus allen Salden herausgerechnet.${src&&src.repeat?' Dieser Termin der Serie wird nicht erneut angelegt.':''}`,
        buttons:[{label:'Löschen',value:'one',style:'danger'},{label:'Behalten',value:null}]});
    }
    if(!choice) return;
    const sn=snapGroup(g,[e.seriesId].filter(Boolean));
    if(e.seriesId){const src=g.entries.find(x=>x.id===e.seriesId);if(src&&src.repeat){src.repeat.skipped=(src.repeat.skipped||[]).concat(e.date);src.updatedAt=nowISO();}}
    g.entries.filter(x=>x.id===e.id||(choice==='all'&&x.seriesId===e.id)).forEach(x=>tomb(g,x.id));
    g.entries=g.entries.filter(x=>x.id!==e.id&&!(choice==='all'&&x.seriesId===e.id));
    D=null; save(); V={name:'group',tab:'overview'}; render(); undoNotice(choice==='all'?'Serie gelöscht':'Ausgabe gelöscht',sn);
  },

  markPaid:el=>{
    const g=grp(), t=lastTransfers[+el.dataset.i]; if(!t) return;
    paySuggest=t.cents; paySheet(g,{from:t.from,to:t.to,cents:t.cents,date:todayISO(),suggested:true});
  },
  newPayment:()=>{const g=grp();paySuggest=0;paySheet(g,{from:meId(g)||g.members[0].id,to:(g.members.find(m=>m.id!==(meId(g)||g.members[0].id))||{}).id,cents:0,date:todayISO()});},
  editPayment:el=>{
    const g=grp(), e=g.entries.find(x=>x.id===el.dataset.id); if(!e) return;
    paySuggest=0; paySheet(g,{id:e.id,from:e.paidBy,to:e.paidTo,cents:e.amountCents,date:e.date});
  },
  savePayment:el=>{
    const g=grp(), from=byId('pFrom').value, to=byId('pTo').value, c=parseEuro(byId('pAmt').value), date=byId('pDate').value;
    if(from===to){notify('Von und An müssen verschiedene Personen sein.');return;}
    if(!(c>0)){notify('Bitte einen gültigen Betrag eingeben.');byId('pAmt').focus();return;}
    if(!/^\d{4}-\d{2}-\d{2}$/.test(date)){notify('Bitte ein Datum wählen.');return;}
    const id=el.dataset.id;
    if(id){const e=g.entries.find(x=>x.id===id);Object.assign(e,{paidBy:from,paidTo:to,amountCents:c,date,updatedAt:new Date().toISOString()});}
    else g.entries.push({id:uid(),type:'settlement',date,amountCents:c,paidBy:from,paidTo:to,createdAt:nowISO(),updatedAt:nowISO()});
    save(); closeSheet(); render(true);
    if(!id) pushEntry(g,g.entries[g.entries.length-1]);
    notify(id?'Zahlung geändert':paySuggest&&c<paySuggest?`Teilzahlung gespeichert, ${fmtEuro(paySuggest-c)} bleiben offen`:'Zahlung gespeichert');
  },
  delPayment:async el=>{
    const g=grp(), e=g.entries.find(x=>x.id===el.dataset.id); if(!e) return;
    const ok=await ask({title:'Zahlung löschen?',text:`${nameOf(g,e.paidBy)} → ${nameOf(g,e.paidTo)} ${fmtEuro(e.amountCents)} gilt dann wieder als offen.`,
      buttons:[{label:'Zahlung löschen',value:true,style:'danger'},{label:'Behalten',value:false}]});
    if(!ok) return;
    const sn=snapGroup(g);
    g.entries=g.entries.filter(x=>x.id!==e.id); tomb(g,e.id); save(); closeSheet(); render(true); undoNotice('Zahlung gelöscht',sn);
  },
  copyText:async()=>{
    const txt=settlementText(grp());
    try{await navigator.clipboard.writeText(txt);notify('Abrechnung kopiert');}
    catch(e){textSheet(txt);}
  },
  shareText:async()=>{
    const g=grp();
    try{await navigator.share({title:'Abrechnung '+g.name,text:settlementText(g)});}catch(e){}
  }
};

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  const f=ACT[el.dataset.act]; if(!f) return;
  e.preventDefault(); f(el,e);
});
/* beim Tippen des Titels Kategorie vorschlagen, solange sie nicht von Hand gewählt wurde */
function autoCat(){
  if(!D||D.catManual) return;
  const c=guessCat(D.title); if(c===D.category) return;
  D.category=c;
  document.querySelectorAll('#catChips [data-act=setCat]').forEach(b=>{const on=b.dataset.id===c;b.classList.toggle('on',on);b.setAttribute('aria-pressed',String(on));});
  const a=document.getElementById('catAuto'); if(a) a.textContent=c?'automatisch erkannt':'optional';
}
function onField(e){
  const el=e.target;
  if(el.dataset&&el.dataset.s==='q'){F.q=el.value;updateList();return;}
  const f=el.dataset&&el.dataset.f; if(!f||!D) return;
  if(f==='title'){D.title=el.value;autoCat();}
  else if(f==='amount') D.amount=el.value;
  else if(f==='date') D.date=el.value;
  else if(f==='until') D.until=el.value;
  else if(f==='note') D.note=el.value;
  else if(f==='fixed') D.fx[el.dataset.id]=el.value;
  else if(f==='percent') D.pc[el.dataset.id]=el.value;
  else if(f==='pay') D.pay[el.dataset.id]=el.value;
  else if(f==='itemName') D.items[+el.dataset.i].name=el.value;
  else if(f==='itemPrice') D.items[+el.dataset.i].price=el.value;
  else if(f==='curAmt') D.curAmt=el.value;
  else if(f==='curRate') D.curRate=el.value;
  else if(f==='curCode'){
    D.curCode=el.value; const g=grp();
    D.curRate=g.rates&&g.rates[D.curCode]?fmtRate(g.rates[D.curCode]):'';
    const r=byId('fxRate'); if(r) r.value=D.curRate;
    document.querySelectorAll('.curLbl').forEach(x=>x.textContent=D.curCode);
  }
  updatePreview();
}
document.addEventListener('input',onField);
document.addEventListener('input',e=>{if(e.target.id==='invName')invLiveCheck();});
document.addEventListener('change',e=>{
  const ch=e.target.dataset&&e.target.dataset.ch;
  if(ch==='me'){
    const g=grp(); if(e.target.value) S.ui.meByGroup[g.id]=e.target.value; else delete S.ui.meByGroup[g.id];
    save(); render(true); return;
  }
  if(ch==='fcat'){F.cat=e.target.value;updateList();return;}
  if(ch==='fperson'){F.person=e.target.value;updateList();return;}
  if(e.target.dataset&&e.target.dataset.f==='curCode') onField(e);
  else if(e.target.type==='date') onField(e);
});
try{matchMedia('(min-width: 800px)').addEventListener('change',()=>render(true));}catch(e){}
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if(byId('pick-root').classList.contains('open')) closePicker();
    else if(byId('ask-root').classList.contains('open')) {}
    else if(byId('sheet-root').classList.contains('open')) closeSheet();
    else if(V.name==='expense') ACT.cancelExpense();
    return;
  }
  if(e.key==='Enter'&&e.target.id==='newMember'){e.preventDefault();ACT.addMember();}
  if(e.key==='Enter'&&e.target.id==='gName'){e.preventDefault();const b=document.querySelector('[data-act="saveGroup"]');if(b)ACT.saveGroup(b);}
  if(e.key==='Enter'&&e.target.id==='mName'){e.preventDefault();const b=document.querySelector('[data-act="saveMember"]');if(b)ACT.saveMember(b);}
  if(e.key==='Enter'&&e.target.id==='invName'){e.preventDefault();inviteGo();}
  if(e.key==='Enter'&&e.target.id==='q'){e.preventDefault();e.target.blur();}
});
byId('importFile').addEventListener('change',async e=>{
  const f=e.target.files&&e.target.files[0]; e.target.value=''; if(!f) return;
  let data;
  try{data=JSON.parse(await f.text());}catch(err){await info('Import nicht möglich','Die Datei ist keine gültige JSON-Datei.');return;}
  importData(data);
});
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState!=='visible') return;
  if(V.name==='group'&&runRecurring()) render(true);
  syncAll();
  kontoRefresh();
});
window.addEventListener('online',syncAll);
setInterval(()=>{ if(document.visibilityState==='visible'){ syncAll(); kontoApply(); } },20000);
Konto.onChange(()=>{ kontoApply(); remoteChanged(null); });
Push.onChange(()=>{ if(V.name==='groups') render(true); });
document.addEventListener('focusout',()=>{ if(pendingRender) setTimeout(()=>{const a=document.activeElement;if(pendingRender&&!(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))){pendingRender=false;render(true);}},50); });
window.addEventListener('hashchange',()=>{if(location.hash==='#tests'){V={name:'tests'};render();}});

if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){navigator.serviceWorker.register('sw.js').catch(()=>{});}
/* Android: Zurück-Taste/-Geste. Ein Puffer-Eintrag im Verlauf fängt „Zurück“ ab; zuerst schließen sich Kalender,
   Rückfragen und Blätter, dann die Ausgabe (mit Rückfrage bei Änderungen), dann geht es zur Reise und zur Reiseliste.
   Erst danach verlässt „Zurück“ die App (bzw. geht zum Hauptmenü). */
const BackNav=(()=>{
  let armed=false;
  try{armed=!!(history.state&&history.state.kGuard);}catch(e){}
  const arm=()=>{if(armed)return;try{history.pushState({kGuard:1},'');armed=true;}catch(e){}};
  const isOpen=id=>byId(id).classList.contains('open');
  const handle=()=>{
    if(isOpen('pick-root')){closePicker();return true;}
    if(isOpen('ask-root')){ACT.askBtn({dataset:{i:String(askBtns.findIndex(b=>!b.value&&b.value!==0))}});return true;}
    if(isOpen('sheet-root')){closeSheet();return true;}
    if(V.name==='expense'){ACT.cancelExpense();return true;}
    if(V.name==='tests'){V={name:'groups'};render();return true;}
    if(V.name==='group'&&V.tab&&V.tab!=='overview'){V={name:'group',tab:'overview'};render();return true;}
    if(V.name==='group'){ACT.goGroups();return true;}
    return false;
  };
  addEventListener('popstate',()=>{if(!armed)return;armed=false;if(handle())arm();else history.back();});
  return {arm,handle};
})();
runRecurring();
const J=parseJoin(location.hash);
if(location.hash==='#tests') V={name:'tests'};
else if(grp()) V={name:'group',tab:'overview'};
render();
if(J){ try{history.replaceState(null,'',location.pathname+location.search);}catch(e){} joinTrip(J.id,J.secret); }
BackNav.arm();
syncAll();
kontoRefresh();
</script>
