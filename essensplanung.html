    if (!res.ok) throw await this.err(res);
    const j = await res.json();
    let b64 = j.content;
    if ((!b64 || j.encoding === 'none') && j.sha) {   // Dateien über 1 MB: über die Blob-Schnittstelle laden
      const r = this.repo;
      const br = await this.api(`/repos/${encodeURIComponent(r.owner)}/${encodeURIComponent(r.name)}/git/blobs/${j.sha}`);
      if (!br.ok) throw await this.err(br);
      b64 = (await br.json()).content;
    }
    return { sha: j.sha, b64 };
  },
  async putFile(p, b64, sha, message) {
    const body = { message, content: b64 };
    if (sha) body.sha = sha;
    const res = await this.api(this.path(p), { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    if (!res.ok) throw await this.err(res);
    return (await res.json()).content.sha;
  },
  async deleteFile(p) {
    const f = await this.getFile(p).catch(() => null);
    if (!f) return;
    await this.api(this.path(p), { method: 'DELETE', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ message: 'Bild entfernt', sha: f.sha }) });
  },
  async err(res) {
    let m = '';
    try { m = (await res.json()).message || ''; } catch (e) {}
    const e = new Error(m || ('HTTP ' + res.status));
    e.status = res.status;
    return e;
  },
  /* Vergleichsform unabhängig von der Reihenfolge */
  canon(d) {
    const c = deep(d);
    ['recipes', 'ingredients', 'rotation', 'plan'].forEach(k => c[k] = (c[k] || []).sort((a, b) => (a.id < b.id ? -1 : 1)));
    return JSON.stringify(c);
  },
  async loadMeta() {
    const m = (await Store.get('sync')) || {};
    this.sha = m.sha || null; this.dirty = !!m.dirty; this.lastSync = m.lastSync || null;
  },
  saveMeta() { return Store.set('sync', { sha: this.sha, dirty: this.dirty, lastSync: this.lastSync }); },
  markDirty() {
    this.dirty = true; this.gen++; this.saveMeta();
    if (!this.enabled()) { this.setState('off'); return; }
    clearTimeout(this.timer);
    this.timer = setTimeout(() => this.run(), 1500);
  },
  setState(s, msg) { this.state = s; this.msg = msg || ''; if (typeof renderSyncPill === 'function') renderSyncPill(); },
  async pull() {
    if (this.isPB) return this.pullPB();
    const f = await this.getFile('data.json');
    if (!f) { this.sha = null; if (db && db.household) this.dirty = true; return false; }
    if (f.sha === this.sha) return false;
    const remote = repairDb(JSON.parse(b64ToUtf8(f.b64)));
    db = repairDb(EP.mergeDb(db, remote));
    EP.normalizePlan(db);
    this.sha = f.sha;
    if (this.canon(db) !== this.canon(remote)) this.dirty = true;
    await Store.set('db', db);
    await this.saveMeta();
    return true;
  },
  async pullPB() {
    const k = await PB.keysFor(Auth.token);
    const r = await PB.api('GET', '/' + this.repo.pb, k.auth);
    if (r.status === 404) { const e = new Error('Haushalt auf dem Server nicht gefunden.'); e.status = 404; throw e; }
    if (r.status !== 200 || !r.json) throw PB.fail(r);
    this.remoteRev = +r.json.rev || 0;
    if (r.json.updated === this.sha) return false;
    const remote = repairDb(JSON.parse(await PB.dec(k.enc, r.json.data)));
    db = repairDb(EP.mergeDb(db, remote));
    EP.normalizePlan(db);
    this.sha = r.json.updated;
    if (this.canon(db) !== this.canon(remote)) this.dirty = true;
    await Store.set('db', db);
    await this.saveMeta();
    return true;
  },
  async pushPB() {
    const k = await PB.keysFor(Auth.token);
    for (let attempt = 0; attempt < 5 && this.dirty; attempt++) {
      const g0 = this.gen;
      const u = await PB.api('PATCH', '/' + this.repo.pb, k.auth, { data: await PB.enc(k.enc, JSON.stringify(db)), rev: (this.remoteRev || 0) + 1 });
      if (u.status === 404) { const e = new Error('Haushalt auf dem Server nicht gefunden.'); e.status = 404; throw e; }
      if (u.status !== 200 || !u.json) throw PB.fail(u);
      this.sha = u.json.updated; this.remoteRev = +u.json.rev || 0;
      if (this.gen === g0) this.dirty = false;
      await this.saveMeta();
      // Kontrolle: Hat zwischenzeitlich ein anderes Gerät geschrieben? Dann zusammenführen und erneut schreiben.
      const v = await PB.api('GET', '/' + this.repo.pb, k.auth);
      if (v.status === 200 && v.json && v.json.updated !== this.sha) await this.pullPB();
    }
  },
  async push() {
    if (this.isPB) return this.pushPB();
    for (let attempt = 0; attempt < 4 && this.dirty; attempt++) {
      try {
        this.sha = await this.putFile('data.json', utf8ToB64(JSON.stringify(db)), this.sha, 'Essensplanung aktualisiert');
        this.dirty = false;
        await this.saveMeta();
      } catch (e) {
        if (e.status === 409 || e.status === 422) { await this.pull(); continue; } // zwischenzeitlich geändert → zusammenführen
        throw e;
      }
    }
  },
  async run(opts) {
    opts = opts || {};
    if (!this.enabled()) { this.setState('off'); return; }
    if (typeof draft !== 'undefined' && draft && !opts.force) return; // während eines Wochenentwurfs nicht dazwischenfunken
    if (this.busy) { this.again = true; return; }
    if (!navigator.onLine) { this.setState('offline'); return; }
    this.busy = true; this.setState('busy');
    try {
      const changed = await this.pull();
      await this.push();
      await Images.sync();
      this.lastSync = Date.now(); await this.saveMeta();
      this.setState('ok');
      if (changed && typeof rerender === 'function') rerender();
    } catch (e) {
      const m = this.isPB ? (e.status === 404 ? 'Haushalt auf dem Server nicht gefunden.' : e.status === 0 ? 'Server nicht erreichbar – wird automatisch wiederholt.' : (e.message || 'Abgleich fehlgeschlagen.'))
        : e.status === 401 ? 'Zugang abgelaufen oder ungültig – Token neu eingeben.'
        : e.status === 403 ? 'Kein Schreibzugriff auf das Repository.'
        : e.status === 404 ? 'Repository nicht gefunden.' : (e.message || 'Abgleich fehlgeschlagen.');
      this.setState(navigator.onLine ? 'err' : 'offline', m);
    } finally {
      this.busy = false;
      if (this.again) { this.again = false; setTimeout(() => this.run(), 300); }
    }
  },
  startPolling() {
    clearInterval(this.poll);
    this.poll = setInterval(() => { if (document.visibilityState === 'visible') this.run(); }, this.isPB ? 30000 : 60000);
  },
  /* Verbindung prüfen: Repository muss existieren und privat sein */
  async checkRepo(owner, name, token) {
    const res = await fetch(`https://api.github.com/repos/${encodeURIComponent(owner)}/${encodeURIComponent(name)}`, {
      cache: 'no-store', headers: { Authorization: 'Bearer ' + token, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' } });
    if (res.status === 401) throw new Error('Der Token ist ungültig oder abgelaufen.');
    if (res.status === 404) throw new Error('Repository nicht gefunden – oder der Token hat keinen Zugriff darauf.');
    if (!res.ok) throw new Error('GitHub antwortet mit Fehler ' + res.status + '.');
    const j = await res.json();
    if (!j.private) throw new Error('Dieses Repository ist öffentlich. Deine Rezepte und dein Wochenplan wären für alle sichtbar – bitte ein privates Repository verwenden.');
    return j;
  },
};

/* ---------- Bilder (lokal in IndexedDB, im Repository unter images/) ---------- */
const Images = {
  mem: new Map(),
  async put(key, full, thumb) {
    await Store.set('img:' + key, full); await Store.set('thumb:' + key, thumb);
    this.mem.set('img:' + key, full); this.mem.set('thumb:' + key, thumb);
    const q = (await Store.get('imgq')) || []; q.push(key); await Store.set('imgq', q);
  },
  async remove(key) {
    const d = (await Store.get('imgdel')) || []; d.push(key); await Store.set('imgdel', d);
  },
  async get(key, thumb) {
    const k = (thumb ? 'thumb:' : 'img:') + key;
    if (this.mem.has(k)) return this.mem.get(k);
    let v = await Store.get(k);
    if (!v && Sync.enabled() && navigator.onLine) {
      try {
        if (Sync.isPB) {
          const kk = await PB.keysFor(Auth.token);
          const r = await PB.api('GET', '/' + await PB.imgId(Sync.repo.pb, key, thumb ? 't' : 'f'), kk.auth);
          if (r.status === 200 && r.json) { v = await PB.dec(kk.enc, r.json.data); await Store.set(k, v); }
        } else {
          const f = await Sync.getFile(`images/${key}${thumb ? '_t' : ''}.jpg`);
          if (f) { v = 'data:image/jpeg;base64,' + f.b64.replace(/\s/g, ''); await Store.set(k, v); }
        }
      } catch (e) {}
    }
    if (v) this.mem.set(k, v);
    return v || null;
  },
  async sync() {
    if (Sync.isPB) return this.syncPB();
    const q = (await Store.get('imgq')) || [];
    const rest = [];
    for (const key of q) {
      try {
        for (const [suffix, sk] of [['', 'img:'], ['_t', 'thumb:']]) {
          const v = await Store.get(sk + key);
          if (!v) continue;
          try { await Sync.putFile(`images/${key}${suffix}.jpg`, v.split(',')[1], null, 'Bild hinzugefügt'); }
          catch (e) { if (e.status !== 422) throw e; } // existiert schon
        }
      } catch (e) { rest.push(key); }
    }
    await Store.set('imgq', rest);
    const d = (await Store.get('imgdel')) || [];
    for (const key of d) {
      try { await Sync.deleteFile(`images/${key}.jpg`); await Sync.deleteFile(`images/${key}_t.jpg`); } catch (e) {}
      await Store.del('img:' + key); await Store.del('thumb:' + key);
    }
    await Store.set('imgdel', []);
  },
  /* Bilder mit dem eigenen Server abgleichen: je Bild ein Datensatz für groß (f) und Vorschau (t) */
  async syncPB() {
    const kk = await PB.keysFor(Auth.token), hh = Sync.repo.pb;
    const q = (await Store.get('imgq')) || [], rest = [];
    for (const key of q) {
      try {
        for (const [suffix, sk] of [['f', 'img:'], ['t', 'thumb:']]) {
          let v = await Store.get(sk + key);
          if (!v) continue;
          if (v.length > 1400000) v = await this.shrink(v);   // Obergrenze eines Datensatzes: 2 MB
          const id = await PB.imgId(hh, key, suffix);
          const r = await PB.api('POST', '', null, { id, auth: kk.auth, data: await PB.enc(kk.enc, v), rev: 1 });
          if (r.status === 200) continue;
          const g = await PB.api('GET', '/' + id, kk.auth);        // existiert schon?
          if (g.status !== 200) throw PB.fail(r);
        }
      } catch (e) { rest.push(key); }
    }
    await Store.set('imgq', rest);
    const d = (await Store.get('imgdel')) || [];
    for (const key of d) {
      try { for (const suffix of ['f', 't']) await PB.api('DELETE', '/' + await PB.imgId(hh, key, suffix), kk.auth); } catch (e) {}
      await Store.del('img:' + key); await Store.del('thumb:' + key);
    }
    await Store.set('imgdel', []);
  },
  async shrink(url) {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const s = Math.min(1, 1200 / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', 0.72);
  },
  /* alle Bildschlüssel der Rezepte (zum ersten Hochladen) */
  allKeys() { const out = new Set(); (db.recipes || []).forEach(r => { if (!r.deleted) (r.images || []).forEach(i => out.add(i.fileKey)); }); return [...out]; },
  /* Bild verkleinern: längste Kante 1600 px + Vorschau 400 px */
  async process(file) {
    if (file.size > 10 * 1024 * 1024) throw new Error('Das Bild ist größer als 10 MB.');
    const url = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsDataURL(file); });
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('Dieses Bildformat kann der Browser nicht lesen.')); i.src = url; });
    const scale = (max, q) => {
      const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas');
      c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      return { url: c.toDataURL('image/jpeg', q), w: c.width, h: c.height };
    };
    const full = scale(1600, 0.82), thumb = scale(400, 0.75);
    return { full: full.url, thumb: thumb.url, width: full.w, height: full.h };
  },
  /* Platzhalter im DOM nachträglich befüllen */
  async hydrate(root) {
    for (const el of $$('img[data-img]', root)) {
      const v = await this.get(el.dataset.img, el.dataset.thumb === '1');
      if (v) el.src = v; else if (el.dataset.hideEmpty) el.remove();
    }
  },
};

/* ==========================================================================
   Essensplanung – App Teil 2: Operationen
   ========================================================================== */
const recipeById = id => db.recipes.find(r => r.id === id) || null;
const rotById = (d, id) => (d || db).rotation.find(e => e.id === id && !e.deleted) || null;
const ingById = id => db.ingredients.find(i => i.id === id) || null;
const liveRecipes = () => EP.live(db.recipes).filter(r => !r.archivedAt);
const isMain = p => EP.laneOf(p) === 'MAIN';
const mainPlan = d => EP.live((d || db).plan).filter(isMain);
const mainDates = d => new Set(mainPlan(d).map(p => p.date));
/* Hauptgericht-Einträge je Datum */
function planByDate(d) {
  const m = new Map();
  mainPlan(d).forEach(p => m.set(p.date, p));
  return m;
}
/* Eintrag einer Zusatzspur (Mittag, Kuchen) an einem Tag */
function laneAt(src, date, lane) { return EP.live((src || db).plan).find(p => p.date === date && EP.laneOf(p) === lane) || null; }
function laneDays(lane) { return ((db.settings.lanes || {})[lane] || { days: [] }).days; }
function laneActiveOn(lane, date) { return laneDays(lane).includes(EP.parseISO(date).getDay()); }
const unreviewedCount = () => EP.live(db.ingredients).filter(i => i.reviewed === false).length;
const blockEntries = (bid, d) => EP.live((d || db).plan).filter(p => p.blockId === bid).sort((a, b) => a.date.localeCompare(b.date));
function daysOf(recipe) { return EP.daysFor(recipe, db.settings); }
function firstFreeFrom(start) { return EP.nextFreeDates(start, 1, mainDates())[0]; }
/* nächster Tag ab start, an dem die Spur aktiv und noch frei ist */
function firstLaneDay(lane, start) {
  for (let i = 0, d = start; i < 60; i++, d = EP.addDays(d, 1)) if (laneActiveOn(lane, d) && !laneAt(db, d, lane)) return d;
  return start;
}

/* nächster Rotationseintrag für „Tauschen“: möglichst ein anderes Gericht als bisher.
   Holt wie gewohnt einen Eintrag (legt nur bei Bedarf einen Durchlauf an) und weicht sonst auf
   bereits vorhandene offene Einträge aus – ohne zusätzliche Durchläufe zu erzeugen. */
function nextDifferent(src, ex, lane, month, notRecipe) {
  const first = EP.nextEntries(src, 1, ex, rng, lane, month)[0];
  if (!first || first.recipeId !== notRecipe) return first;
  const alt = EP.pendingSorted(src, lane).find(e => !ex.has(e.id) && e.recipeId !== notRecipe && EP.inSeason(recipeById(e.recipeId), month));
  return alt || first;
}

/* ---------- Plan (übernommene Einträge, wirken sofort) ---------- */
function placeBlock(start, o) {
  const recipe = recipeById(o.recipeId);
  const n = daysOf(recipe);
  const dates = EP.nextFreeDates(start, n, mainDates());
  const bid = o.blockId || EP.uuid();
  dates.forEach((date, i) => db.plan.push(EP.touch({
    id: EP.uuid(), date, lane: 'MAIN', type: i ? 'LEFTOVER' : 'COOK', recipeId: recipe.id, blockId: bid,
    dayIndex: i + 1, dayCount: n, rotationEntryId: o.rotationEntryId || null,
    source: o.rotationEntryId ? 'ROTATION' : 'MANUAL', locked: !!o.locked, status: 'PLANNED', note: '', deleted: false,
  })));
  if (o.rotationEntryId) { const e = rotById(null, o.rotationEntryId); if (e && e.status !== 'DONE') EP.planEntry(e); }
  return dates;
}
/* Zusatzspur: ein Gericht an genau einem Tag (kein Resteblock) */
function placeLane(date, lane, recipeId, rotationEntryId, locked) {
  const old = laneAt(db, date, lane);
  if (old) removeBlock(old.blockId, true);
  db.plan.push(EP.touch({ id: EP.uuid(), date, lane, type: 'COOK', recipeId, blockId: EP.uuid(), dayIndex: 1, dayCount: 1,
    rotationEntryId: rotationEntryId || null, source: rotationEntryId ? 'ROTATION' : 'MANUAL', locked: !!locked, status: 'PLANNED', note: '', deleted: false }));
  if (rotationEntryId) { const e = rotById(null, rotationEntryId); if (e && e.status !== 'DONE') EP.planEntry(e); }
}
function swapLane(date, lane) {
  const p = laneAt(db, date, lane); if (!p) return null;
  const info = removeBlock(p.blockId, true);
  const ex = new Set(info && info.rotationEntryId ? [info.rotationEntryId] : []);
  const next = nextDifferent(db, ex, lane, EP.monthOf(date), info.recipeId);
  if (!next) { placeLane(date, lane, info.recipeId, info.rotationEntryId); return null; }
  placeLane(date, lane, next.recipeId, next.id);
  return recipeById(next.recipeId);
}
function removeBlock(bid, releaseIt) {
  const es = blockEntries(bid);
  if (!es.length) return null;
  const info = { recipeId: es[0].recipeId, rotationEntryId: es[0].rotationEntryId, locked: es[0].locked, start: es[0].date };
  es.forEach(EP.tomb);
  if (releaseIt !== false && info.rotationEntryId) {
    const e = rotById(null, info.rotationEntryId);
    if (e && e.status === 'PLANNED') EP.release(db, e);
  }
  return info;
}
function markCooked(bid) {
  const es = blockEntries(bid);
  const now = Date.now();
  es.forEach(p => { p.status = 'DONE'; if (p.type === 'COOK') p.cookedAt = now; EP.touch(p); });   // gekocht: Zutaten wandern nicht mehr in die nächste Woche
  const e = es[0] && es[0].rotationEntryId && rotById(null, es[0].rotationEntryId);
  if (e) EP.completeEntry(e);
}
function toggleLock(bid) {
  const es = blockEntries(bid);
  const v = !(es[0] && es[0].locked);
  es.forEach(p => { p.locked = v; EP.touch(p); });
  return v;
}
function swapBlock(bid) {
  const info = removeBlock(bid, true);
  if (!info) return null;
  const ex = new Set(info.rotationEntryId ? [info.rotationEntryId] : []);
  const next = nextDifferent(db, ex, 'MAIN', EP.monthOf(info.start), info.recipeId);
  if (!next) { placeBlock(info.start, info); return null; }
  placeBlock(info.start, { recipeId: next.recipeId, rotationEntryId: next.id, locked: info.locked });
  return recipeById(next.recipeId);
}
function moveBlock(bid, newStart) {
  const info = removeBlock(bid, false);
  if (info) placeBlock(newStart, Object.assign({}, info, { blockId: bid }));
}
/* ---------- Reste einzeln verschieben, streichen, weiterrutschen ---------- */
/* Tage eines Gerichts neu durchzählen (Kochtag 1/n, Reste 2/n …) */
function renumberBlock(bid, src) {
  const es = blockEntries(bid, src), n = es.length;
  es.forEach((p, i) => { if (p.dayIndex !== i + 1 || p.dayCount !== n) { p.dayIndex = i + 1; p.dayCount = n; EP.touch(p); } });
}
/* Prüft, ob Reste an einen Tag passen; liefert eine Fehlermeldung oder '' */
function restMoveCheck(p, date, src) {
  src = src || db;
  if (!date) return 'Bitte einen Tag wählen.';
  const cook = blockEntries(p.blockId, src).find(x => x.type === 'COOK');
  if (cook && date <= cook.date) return `Reste gehen erst nach dem Kochtag (${EP.weekday(cook.date)} ${EP.fmtShort(cook.date)}).`;
  if (date < EP.todayISO()) return 'Dieser Tag liegt in der Vergangenheit.';
  if (date === p.date) return 'Die Reste sind schon an diesem Tag eingeplant.';
  const other = planByDate(src).get(date);
  if (other) return `An diesem Tag ist schon etwas eingeplant (${other.type === 'BLOCKED' ? 'gesperrt' : (recipeById(other.recipeId) || {}).name || 'Gericht'}).`;
  if (draft && src === draft.clone && draft.blocked.has(date)) return 'Dieser Tag ist im Entwurf gesperrt.';
  return '';
}
/* erster passender Tag für Reste nach dem aktuellen */
function restSuggest(p, src) {
  for (let i = 1, d = EP.addDays(p.date, 1); i < 60; i++, d = EP.addDays(d, 1)) if (!restMoveCheck(p, d, src)) return d;
  return EP.addDays(p.date, 1);
}
function moveRest(entryId, date, src) {
  const p = EP.live((src || db).plan).find(x => x.id === entryId);
  if (!p) return;
  p.date = date;
  if (date >= EP.todayISO()) p.status = 'PLANNED';   // aus der Vergangenheit geholte Reste sind wieder offen
  EP.touch(p);
  renumberBlock(p.blockId, src);
}
/* erster freier Tag ab heute für Reste eines vergangenen Tages */
function restFromToday(p, src) {
  for (let i = 0, d = EP.todayISO(); i < 60; i++, d = EP.addDays(d, 1)) if (!restMoveCheck(p, d, src)) return d;
  return null;
}
/* Resttag sperren: in der Zukunft rutschen die Reste weiter; in der Vergangenheit (z. B. doch auswärts
   gegessen) kommen nur die Reste dieses Tages auf den ersten freien Tag ab heute */
function blockRest(p, date, src, extra) {
  if (date < EP.todayISO()) {
    const to = restFromToday(p, src);
    if (to) moveRest(p.id, to, src); else dropRest(p.id, src);
  } else slideLeftovers(p.blockId, date, src, extra);
}
function dropRest(entryId, src) {
  const p = EP.live((src || db).plan).find(x => x.id === entryId);
  if (!p) return;
  EP.tomb(p);
  renumberBlock(p.blockId, src);
}
/* Reste ab einem Tag rutschen auf die nächsten freien Tage (Kochtag bleibt) */
function slideLeftovers(bid, date, src, extra) {
  src = src || db;
  const later = blockEntries(bid, src).filter(x => x.type === 'LEFTOVER' && x.date >= date);
  if (!later.length) return;
  const occ = mainDates(src);
  later.forEach(x => occ.delete(x.date));
  occ.add(date);
  (extra || []).forEach(d => occ.add(d));
  const dates = EP.nextFreeDates(date, later.length, occ);
  const today = EP.todayISO();
  later.forEach((x, i) => { if (x.date !== dates[i]) { x.date = dates[i]; if (x.date >= today) x.status = 'PLANNED'; EP.touch(x); } });
  renumberBlock(bid, src);
}
/* Im Wochenentwurf: Tag mit Übertrag-Resten sperren → Reste rutschen weiter, Entwurf plant drumherum */
function draftBlockCarry(date, note) {
  const p = planByDate(draft.clone).get(date);
  draft.blocked.set(date, note);
  if (p && p.type === 'LEFTOVER') blockRest(p, date, draft.clone, [...draft.blocked.keys()]);
  relayoutDraft();
}
function blockDay(date, note) {
  const p = planByDate().get(date);
  if (p && p.type === 'LEFTOVER') {   // Resttag: nur die Reste rutschen weiter, der Kochtag bleibt
    db.plan.push(EP.touch({ id: EP.uuid(), date, type: 'BLOCKED', recipeId: null, blockId: null, dayIndex: 0, dayCount: 0,
      rotationEntryId: null, source: 'MANUAL', locked: false, status: 'PLANNED', note: note || '', deleted: false }));
    blockRest(p, date);
    return;
  }
  let info = null;
  if (p && p.blockId) info = removeBlock(p.blockId, false);
  else if (p) EP.tomb(p);
  db.plan.push(EP.touch({ id: EP.uuid(), date, type: 'BLOCKED', recipeId: null, blockId: null, dayIndex: 0, dayCount: 0,
    rotationEntryId: null, source: 'MANUAL', locked: false, status: 'PLANNED', note: note || '', deleted: false }));
  if (info) placeBlock(info.start, info); // Reste rutschen weiter (A6)
}
function unblockDay(date) {
  const p = planByDate().get(date);
  if (p && p.type === 'BLOCKED') EP.tomb(p);
}

/* ---------- Zusätzliche Gerichte (beliebig viele pro Tag, ohne Rotation) ---------- */
const isExtra = p => EP.laneOf(p) === 'EXTRA';
const extraRank = { MAIN: 0, LUNCH: 1, CAKE: 2, SIDE: 3 };
function extrasAt(src, date) {
  return EP.live((src || db).plan).filter(p => p.date === date && isExtra(p))
    .sort((a, b) => (extraRank[a.dishKind] || 0) - (extraRank[b.dishKind] || 0) || (a.createdAt || 0) - (b.createdAt || 0));
}
/* Änderung auf echten Plan und – falls vorhanden – auf den Entwurf anwenden */
function eachPlan(fn) { fn(db.plan); if (draft) fn(draft.clone.plan); }
/* Beilagen-Vorschläge für einen Tag: verknüpfte Beilagen der dort gekochten Gerichte, die noch nicht eingeplant
   und für diesen Termin nicht abgelehnt sind. ents = weekEntries(ws). Liefert { sides, sources } */
function sideSuggestions(ents, d) {
  const srcs = [], main = ents.get(d), lunch = ents.lanes.LUNCH.get(d), extras = ents.extras.get(d) || [];
  if (main && main.type === 'COOK' && !main.drafted) srcs.push(main);
  if (lunch && !lunch.drafted) srcs.push(lunch);
  extras.forEach(x => { if (x.dishKind !== 'SIDE') srcs.push(x); });
  const have = new Set(extras.map(x => x.recipeId).concat(srcs.map(x => x.recipeId)));
  const out = [];
  srcs.forEach(p => {
    if (p.status === 'DONE') return;
    const off = new Set(p.sidesOff || []);
    EP.linkedSides(db, recipeById(p.recipeId)).forEach(s => { if (!have.has(s.id) && !off.has(s.id) && !out.some(o => o.id === s.id)) out.push(s); });
  });
  return { sides: out, sources: srcs };
}
/* „Diesmal nicht“: Vorschläge an diesem Tag ausblenden (am jeweiligen Planeintrag gemerkt) */
function dismissSides(ents, d) {
  const { sides, sources } = sideSuggestions(ents, d);
  sources.forEach(p => {
    const e = db.plan.find(x => x.id === p.id && !x.deleted); if (!e) return;
    const mine = EP.linkedSides(db, recipeById(e.recipeId)).map(s => s.id).filter(id => sides.some(s => s.id === id));
    if (!mine.length) return;
    e.sidesOff = [...new Set((e.sidesOff || []).concat(mine))]; EP.touch(e);
  });
}
function addExtra(date, recipeId) {
  const r = recipeById(recipeId);
  const id = EP.uuid();
  const e = EP.touch({ id, date, lane: 'EXTRA', dishKind: EP.laneOf(r), type: 'COOK', recipeId, blockId: id, dayIndex: 1, dayCount: 1,
    rotationEntryId: null, source: 'MANUAL', locked: false, status: date < EP.todayISO() ? 'DONE' : 'PLANNED', note: '', deleted: false });
  eachPlan(pl => pl.push(deep(e)));
  return e;
}
function removeExtra(id) { eachPlan(pl => { const p = pl.find(x => x.id === id && !x.deleted); if (p) EP.tomb(p); }); }
function moveExtra(id, date) {
  eachPlan(pl => { const p = pl.find(x => x.id === id && !x.deleted); if (p) { p.date = date; p.status = date < EP.todayISO() ? 'DONE' : 'PLANNED'; EP.touch(p); } });
}
function replaceExtra(id, recipeId) {
  const r = recipeById(recipeId);
  eachPlan(pl => { const p = pl.find(x => x.id === id && !x.deleted); if (p) { p.recipeId = recipeId; p.dishKind = EP.laneOf(r); EP.touch(p); } });
}

/* ---------- Wochenentwurf (5.4) ---------- */
let draft = null;
function startDraft(ws) {
  const today = EP.todayISO();
  const days = EP.weekDays(ws), inWeek = new Set(days);
  const clone = { settings: db.settings, recipes: db.recipes, rotation: deep(db.rotation), plan: deep(db.plan) };
  const planLive = EP.live(clone.plan);
  const remove = new Set();
  planLive.forEach(p => {
    if (EP.laneOf(p) === 'EXTRA') return; // zusätzliche Gerichte bleiben stehen
    if (!inWeek.has(p.date) || p.type === 'BLOCKED' || p.date < today || p.locked) return;
    const cook = planLive.find(x => x.blockId === p.blockId && x.type === 'COOK');
    if (cook && (cook.date < ws || cook.date < today)) return; // Übertrag bzw. bereits begonnen
    remove.add(p.blockId || p.id);
  });
  remove.forEach(bid => {
    const es = planLive.filter(p => p.blockId === bid || p.id === bid);
    es.forEach(EP.tomb);
    const rid = es[0] && es[0].rotationEntryId;
    const e = rid && clone.rotation.find(x => x.id === rid && !x.deleted);
    if (e && e.status === 'PLANNED') EP.release(clone, e);
  });
  draft = { ws, clone, sequence: [], blocked: new Map(), drafts: [], lanes: [], specialOff: new Set() };
  relayoutDraft();
  buildLaneDrafts();
}
/* Zusatzspuren im Entwurf: je aktivem Tag das nächste Gericht der eigenen Rotation */
function buildLaneDrafts() {
  const today = EP.todayISO();
  draft.lanes = [];
  ['LUNCH', 'CAKE'].forEach(lane => {
    const used = new Set();
    EP.weekDays(draft.ws).forEach(d => {
      if (d < today || !laneActiveOn(lane, d) || laneAt(draft.clone, d, lane)) return;
      const e = EP.nextEntries(draft.clone, 1, used, rng, lane, EP.monthOf(d))[0];
      if (!e) return;
      used.add(e.id);
      draft.lanes.push({ id: EP.uuid(), date: d, lane, recipeId: e.recipeId, rotationEntryId: e.id });
    });
  });
}
const laneUsed = lane => new Set(draft.lanes.filter(x => x.lane === lane && x.rotationEntryId).map(x => x.rotationEntryId));
function draftLane(date, lane) { return draft.lanes.find(x => x.date === date && x.lane === lane) || null; }
function draftLaneNext(date, lane) {
  let x = draftLane(date, lane);
  const e = EP.nextEntries(draft.clone, 1, laneUsed(lane), rng, lane, EP.monthOf(date))[0];
  if (!e) return notify('Keine weiteren Gerichte in dieser Rotation.');
  if (!x) { x = { id: EP.uuid(), date, lane }; draft.lanes.push(x); }
  x.recipeId = e.recipeId; x.rotationEntryId = e.id;
}
function draftLanePick(date, lane, recipeId) {
  let x = draftLane(date, lane);
  const used = laneUsed(lane); if (x) used.delete(x.rotationEntryId);
  const e = EP.manualPickEntry(draft.clone, recipeId, used);
  if (!x) { x = { id: EP.uuid(), date, lane }; draft.lanes.push(x); }
  x.recipeId = recipeId; x.rotationEntryId = e ? e.id : null;
}
function draftLaneRemove(date, lane) { draft.lanes = draft.lanes.filter(x => !(x.date === date && x.lane === lane)); }
function relayoutDraft() {
  const days = EP.weekDays(draft.ws);
  const occupied = mainDates(draft.clone);
  draft.blocked.forEach((_, d) => occupied.add(d));
  specialFree(days).forEach(d => occupied.add(d));
  const res = EP.layoutDraft({
    days, occupied, sequence: draft.sequence,
    nextFn: (ex, start) => EP.nextEntries(draft.clone, 1, ex, rng, 'MAIN', EP.monthOf(start))[0],
    recipeOf: recipeById, settings: db.settings, today: EP.todayISO(),
  });
  draft.sequence = res.sequence;
  draft.drafts = res.drafts;
}
/* Besondere Tage: beim Füllen das Hauptgericht freihalten (nur wenn es „Besonderes“-Rezepte gibt) */
const hasSpecial = () => liveRecipes().some(r => EP.laneOf(r) === 'SPECIAL');
const isSpecialDay = d => EP.specialDays(db.settings).includes(EP.parseISO(d).getDay());
function specialFree(days) {
  if (db.settings.specialKeepFree === false || !hasSpecial()) return [];
  const today = EP.todayISO();
  return days.filter(d => d >= today && isSpecialDay(d) && !(draft && draft.specialOff && draft.specialOff.has(d)));
}
/* Besonderes Gericht an einem Tag: als Abendessen (ersetzt das Hauptgericht) oder als Mittagessen. Fixiert, damit „Füllen“ es stehen lässt. */
function placeSpecial(d, id, slot) {
  if (slot === 'LUNCH') return placeLane(d, 'LUNCH', id, null, true);
  const p = planByDate().get(d);
  if (p && p.type === 'LEFTOVER') dropRest(p.id);
  else if (p && p.blockId && p.type !== 'BLOCKED') removeBlock(p.blockId, true);
  else if (p && p.type === 'BLOCKED') unblockDay(d);
  return placeBlock(d, { recipeId: id, locked: true });
}
/* Gäste: Personen am Kochtag (null = wie immer) */
function setGuests(entryId, n) {
  const p = db.plan.find(x => x.id === entryId && !x.deleted); if (!p) return;
  p.guests = n && n !== db.settings.portionsPerDay ? n : null; EP.touch(p);
}
function draftUsed() { return new Set(draft.sequence.filter(s => s.kind === 'ROT').map(s => s.entryId)); }
function draftSwap(bid) {
  const i = draft.sequence.findIndex(s => s.blockId === bid);
  if (i < 0) return;
  const at = (draft.drafts.find(x => x.blockId === bid) || {}).date || draft.ws;
  const next = nextDifferent(draft.clone, draftUsed(), 'MAIN', EP.monthOf(at), draft.sequence[i].recipeId);
  if (!next) return notify('Keine weiteren Gerichte in der Rotation.');
  draft.sequence[i] = { kind: 'ROT', entryId: next.id, recipeId: next.recipeId, blockId: bid, locked: draft.sequence[i].locked };
  relayoutDraft();
}
function draftMove(bid, dir) {
  const i = draft.sequence.findIndex(s => s.blockId === bid), j = i + dir;
  if (i < 0 || j < 0 || j >= draft.sequence.length) return;
  [draft.sequence[i], draft.sequence[j]] = [draft.sequence[j], draft.sequence[i]];
  relayoutDraft();
}
function draftPick(bid, recipeId) {
  const i = draft.sequence.findIndex(s => s.blockId === bid);
  if (i < 0) return;
  const used = draftUsed(); used.delete(draft.sequence[i].entryId);
  const e = EP.manualPickEntry(draft.clone, recipeId, used);
  draft.sequence[i] = e ? { kind: 'ROT', entryId: e.id, recipeId, blockId: bid, locked: draft.sequence[i].locked }
    : { kind: 'MAN', recipeId, blockId: bid, locked: draft.sequence[i].locked };
  relayoutDraft();
}
function draftToggleLock(bid) {
  const s = draft.sequence.find(x => x.blockId === bid);
  if (s) { s.locked = !s.locked; relayoutDraft(); }
}
function commitDraft() {
  const c = draft.clone;
  draft.drafts.forEach(d => {
    c.plan.push(EP.touch(Object.assign({ id: EP.uuid(), deleted: false }, d)));
    if (d.type === 'COOK' && d.rotationEntryId) {
      const e = c.rotation.find(x => x.id === d.rotationEntryId && !x.deleted);
      if (e) EP.planEntry(e);
    }
  });
  draft.lanes.forEach(x => {
    c.plan.push(EP.touch({ id: EP.uuid(), date: x.date, lane: x.lane, type: 'COOK', recipeId: x.recipeId, blockId: EP.uuid(), dayIndex: 1, dayCount: 1,
      rotationEntryId: x.rotationEntryId || null, source: x.rotationEntryId ? 'ROTATION' : 'MANUAL', locked: false, status: 'PLANNED', note: '', deleted: false }));
    const e = x.rotationEntryId && c.rotation.find(r => r.id === x.rotationEntryId && !r.deleted);
    if (e) EP.planEntry(e);
  });
  draft.blocked.forEach((note, date) => c.plan.push(EP.touch({ id: EP.uuid(), date, lane: 'MAIN', type: 'BLOCKED', recipeId: null, blockId: null,
    dayIndex: 0, dayCount: 0, rotationEntryId: null, source: 'MANUAL', locked: false, status: 'PLANNED', note, deleted: false })));
  db.rotation = c.rotation; db.plan = c.plan;
  draft = null;
}
/* Anzeige-Einträge einer Woche (übernommen oder Entwurf): Hauptgerichte + Zusatzspuren */
function weekEntries(ws) {
  const days = EP.weekDays(ws);
  const isDraft = draft && draft.ws === ws;
  const src = isDraft ? draft.clone : db;
  const m = planByDate(src);
  const out = new Map(), lanes = { LUNCH: new Map(), CAKE: new Map() };
  days.forEach(d => {
    if (m.has(d)) out.set(d, Object.assign({ drafted: false }, m.get(d)));
    ['LUNCH', 'CAKE'].forEach(l => { const p = laneAt(src, d, l); if (p) lanes[l].set(d, Object.assign({ drafted: false }, p)); });
  });
  if (isDraft) {
    draft.blocked.forEach((note, d) => out.set(d, { date: d, type: 'BLOCKED', note, drafted: true, extraBlocked: true }));
    draft.drafts.forEach(x => { if (days.includes(x.date)) out.set(x.date, Object.assign({ drafted: true }, x)); });
    draft.lanes.forEach(x => lanes[x.lane].set(x.date, Object.assign({ drafted: true, type: 'COOK' }, x)));
  }
  out.lanes = lanes;
  out.extras = new Map(days.map(d => [d, extrasAt(src, d)]).filter(x => x[1].length));
  return out;
}

/* ---------- Rezepte ---------- */
function findRecipeByName(name) {
  const n = name.trim().toLowerCase();
  return EP.live(db.recipes).find(r => r.name.trim().toLowerCase() === n) || null;
}
function newRecipe(name, kind) {
  kind = kind || 'MAIN';
  const max = EP.live(db.recipes).reduce((m, r) => Math.max(m, r.sortOrder || 0), 0);
  return EP.touch({ id: EP.uuid(), name: name.trim().slice(0, 120), kind, seasonMonths: null, inRotation: EP.ROTATES(kind), weight: 1,
    servings: kind === 'CAKE' ? 12 : db.settings.portionsPerDay, daysOverride: null, sortOrder: max + 1, notes: '', instructions: '',
    prepTimeMinutes: null, tags: [], archivedAt: null, deleted: false, images: [], ingredients: [] });
}
/* Schnellerfassung – liefert {added, restored, skipped} */
function quickAdd(lines, kind) {
  const res = { added: 0, restored: 0, skipped: 0 };
  lines.map(l => l.replace(/^[-*•\d.)\s]+/, '').trim()).filter(Boolean).forEach(name => {
    const ex = findRecipeByName(name);
    if (ex && !ex.archivedAt) { res.skipped++; return; }
    if (ex) { ex.archivedAt = null; ex.inRotation = true; EP.touch(ex); EP.syncRecipeIntoCycles(db, ex, rng); res.restored++; return; }
    const r = newRecipe(name, kind);
    db.recipes.push(r);
    EP.syncRecipeIntoCycles(db, r, rng);
    res.added++;
  });
  return res;
}
function setWeight(r, w) { r.weight = Math.min(5, Math.max(1, w)); EP.touch(r); EP.syncRecipeIntoCycles(db, r, rng); }
function setInRotation(r, v) { r.inRotation = v; EP.touch(r); EP.syncRecipeIntoCycles(db, r, rng); }
function archiveRecipe(r) { r.archivedAt = Date.now(); EP.touch(r); EP.syncRecipeIntoCycles(db, r, rng); }
/* ---------- Rezept-Import aus dem Scanner-Chat ----------
   items: [{ rec (aus EP.parseRecipeImport), kind, mode: 'new' | 'replace' | 'copy' | 'skip' }]
   liefert { added, replaced, skipped, newIngredients } */
function uniqueRecipeName(name) {
  if (!findRecipeByName(name)) return name;
  for (let i = 2; i < 100; i++) { const n = `${name} (${i})`; if (!findRecipeByName(n)) return n; }
  return name + ' ' + Date.now();
}
function importRecipes(items) {
  const res = { added: 0, replaced: 0, skipped: 0, newIngredients: 0, ids: [] }, links = [];
  items.forEach(it => {
    if (it.mode === 'skip') { res.skipped++; return; }
    const src = it.rec, kind = it.kind || src.kind;
    const ings = src.ingredients.map((x, k) => {
      let ing = findIngredient(x.name);
      if (!ing) { ing = createIngredient(x.name, x.category, x.unit || 'STUECK', false); res.newIngredients++; }
      return { ingredientId: ing.id, quantity: x.quantity, unit: x.quantity == null ? null : (x.unit || ing.defaultUnit || 'STUECK'), note: x.note || '', sortOrder: k + 1 };
    });
    const fields = { kind, servings: src.servings, prepTimeMinutes: src.prepTimeMinutes, instructions: src.instructions, ingredients: ings };
    const ex = it.targetId ? recipeById(it.targetId) : findRecipeByName(src.name);
    if (ex && it.mode === 'replace') {
      // Bilder, Gewichtung und Rotationsstatus bleiben; Saison nur, wenn im Import angegeben
      Object.assign(ex, fields, { archivedAt: null, tags: src.tags.length ? src.tags : ex.tags, notes: src.notes || ex.notes,
        seasonMonths: src.seasonMonths || ex.seasonMonths, daysOverride: kind === 'MAIN' ? ex.daysOverride : null });
      if (src.favorite) ex.favorite = true;
      links.push([ex, src.sideNames]);
      EP.touch(ex); EP.syncRecipeIntoCycles(db, ex, rng); res.replaced++; res.ids.push(ex.id);
      return;
    }
    const r = newRecipe(ex && !it.targetId ? uniqueRecipeName(src.name) : src.name, kind);
    Object.assign(r, fields, { tags: src.tags, notes: src.notes, seasonMonths: src.seasonMonths, favorite: !!src.favorite });
    db.recipes.push(r); EP.syncRecipeIntoCycles(db, r, rng); res.added++; res.ids.push(r.id);
    links.push([r, src.sideNames]);
  });
  // Beilagen-Verknüpfungen per Name (auch auf Rezepte aus demselben Import)
  links.forEach(([r, names]) => {
    const ids = (names || []).map(n => findRecipeByName(n)).filter(x => x && !x.archivedAt && x.id !== r.id).map(x => x.id);
    if (!ids.length) return;
    r.sides = [...new Set((r.sides || []).concat(ids))]; EP.touch(r);
  });
  return res;
}


/* ---------- Zutaten ---------- */
function findIngredient(name) {
  const n = name.trim().toLowerCase();
  return EP.live(db.ingredients).find(i => i.name.toLowerCase() === n) || null;
}
function createIngredient(name, category, unit, reviewed) {
  const i = EP.touch({ id: EP.uuid(), name: name.trim(), category: category || EP.guessCategory(name), shoppingSource: null,
    defaultUnit: unit || 'STUECK', reviewed: !!reviewed, deleted: false });
  db.ingredients.push(i);
  return i;
}
function ingredientUsage(id) { return liveRecipes().filter(r => r.ingredients.some(x => x.ingredientId === id)).length; }
function mergeIngredient(fromId, toId) {
  EP.live(db.recipes).forEach(r => {
    let ch = false;
    r.ingredients.forEach(x => { if (x.ingredientId === fromId) { x.ingredientId = toId; ch = true; } });
    if (ch) EP.touch(r);
  });
  const f = ingById(fromId); if (f) EP.tomb(f);
}

/* ---------- Einkaufsliste: Zustand je Zeitraum (4.8) ---------- */
/* Einkaufsstand gilt für alle Zeiträume (gekauft je Kochtag und Zutat) */
function shopState() { return EP.ensureShopping(db); }
/* aktueller Zeitraum der Einkaufsliste: „alles Kommende“ = ab heute bis zum letzten geplanten Kochtag (mind. Wochenende) */
function curShopRange() {
  if (!shopRange) shopRange = { mode: 'all' };
  if (shopRange.mode === 'all') {
    const today = EP.todayISO(), end = EP.addDays(EP.weekStart(today), 6);
    const last = EP.live(db.plan).filter(p => p.type === 'COOK' && p.date >= today).reduce((m, p) => p.date > m ? p.date : m, end);
    shopRange.from = today; shopRange.to = last;
  }
  return shopRange;
}
const curShopList = () => { const r = curShopRange(); return EP.buildShoppingList(db, r.from, r.to); };
const shopRows = l => l.market.concat(...l.supermarket.map(g => g.items), ...l.drogerie.map(g => g.items), l.pantry);

/* ---------- Sicherung ---------- */
async function exportData(withImages) {
  const data = deep(db);
  delete data.household;
  const out = { format: 'essensplanung', version: 1, exportedAt: new Date().toISOString(), data };
  if (withImages) {
    out.images = {};
    for (const r of liveRecipes()) for (const im of r.images) {
      const full = await Images.get(im.fileKey, false), th = await Images.get(im.fileKey, true);
      if (full) out.images[im.fileKey] = { full, thumb: th || full };
    }
  }
  return JSON.stringify(out, null, 1);
}
async function importData(json, mode) {
  const src = repairDb(json.data || json);
  if (json.images) for (const [k, v] of Object.entries(json.images)) await Images.put(k, v.full, v.thumb);
  if (mode === 'replace') {
    // alles Bestehende als gelöscht markieren (damit der Abgleich es auch auf anderen Geräten entfernt)
    ['recipes', 'ingredients', 'rotation', 'plan'].forEach(k => EP.live(db[k]).forEach(EP.tomb));
    ['recipes', 'ingredients', 'rotation', 'plan'].forEach(k => src[k].forEach(x => { EP.touch(x); db[k].push(x); }));
    db.settings = EP.touch(Object.assign({}, src.settings));
    return { recipes: EP.live(src.recipes).length };
  }
  // Zusammenführen per Name
  const idMap = new Map();
  EP.live(src.ingredients).forEach(i => {
    const ex = findIngredient(i.name);
    if (ex) idMap.set(i.id, ex.id);
    else { const n = createIngredient(i.name, i.category, i.defaultUnit, i.reviewed !== false); n.shoppingSource = i.shoppingSource || null; idMap.set(i.id, n.id); }
  });
  let added = 0, updated = 0;
  EP.live(src.recipes).filter(r => !r.archivedAt).forEach(r => {
    const ings = r.ingredients.map(x => Object.assign({}, x, { ingredientId: idMap.get(x.ingredientId) })).filter(x => x.ingredientId);
    const ex = findRecipeByName(r.name);
    if (ex) {
      Object.assign(ex, { kind: r.kind || 'MAIN', seasonMonths: r.seasonMonths || null, servings: r.servings, weight: r.weight, daysOverride: r.daysOverride, notes: r.notes, instructions: r.instructions,
        prepTimeMinutes: r.prepTimeMinutes, tags: r.tags, ingredients: ings, images: r.images.length ? r.images : ex.images, archivedAt: null });
      EP.touch(ex); EP.syncRecipeIntoCycles(db, ex, rng); updated++;

  const start = e => {

  };
  const move = e => {

    if (!dragging) return;

    if (e.cancelable) e.preventDefault();
  };
  const end = () => {
    if (startY == null) return;

    startY = null;
    if (!dragging) return;
    sheet.addEventListener('click', ev => { ev.stopPropagation(); ev.preventDefault(); }, { capture: true, once: true }); // kein Klick nach dem Ziehen

function cookBtn(r) {

function laneVisible(lane) { return laneDays(lane).length > 0 && liveRecipes().some(r => EP.laneOf(r) === lane); }
/* Durchgehende Wochenansicht: Wochen untereinander, KW als mitlaufende Trennzeile.

let weekRange = null;   // { from: Montag der ersten gezeigten Woche, weeks: Anzahl }
function ensureWeekShown(ws) {
  const today = EP.todayISO();

      if (p.type === 'LEFTOVER') {

        opts.push({ label: 'Reste streichen', hint: 'z. B. eingefroren oder schon gegessen – der Tag wird frei', run: () => undoable(() => { dropRest(p.id); return 'Resttag gestrichen.'; }) });
      }
      opts.push({ label: p.type === 'LEFTOVER' ? 'Ganzes Gericht verschieben' : 'Verschieben', hint: p.type === 'LEFTOVER' ? 'Kochtag und alle Reste' : '', run: () => {

      opts.push({ label: 'Selbst wählen', hint: 'Dieses Gericht ersetzen', run: () => recipePickSheet('Gericht wählen', id => pickCheck(id, d, y => y.blockId === p.blockId, o => undoable(() => {

        placeBlock(cook ? cook.date : d, { recipeId: id, rotationEntryId: e ? e.id : null, locked: info && info.locked });
        return m.replace(/^Eingeplant/, 'Ersetzt');
      })), 'MAIN', { date: d, ignore: y => y.blockId === p.blockId }) });
      opts.push({ label: 'Tag sperren', hint: p.type === 'LEFTOVER' ? 'z. B. Auswärts essen – die Reste rutschen einen Tag weiter' : 'Reste rutschen auf den nächsten freien Tag', run: () => promptSheet('Tag sperren', 'Notiz', 'Auswärts essen', 'Sperren', note => undoable(() => { blockDay(d, note); return 'Tag gesperrt.'; })) });
    } else if (p.type === 'LEFTOVER') {
      opts.push({ label: 'Tag sperren', hint: 'z. B. doch auswärts gegessen – diese Reste kommen auf heute oder später', run: () => promptSheet('Tag sperren', 'Notiz', 'Auswärts essen', 'Sperren', note => undoable(() => { blockDay(d, note); return 'Tag gesperrt, Reste neu eingeplant.'; })) });
      opts.push({ label: 'Reste verschieben', hint: 'Auf heute oder einen späteren Tag legen', run: () => restSheet(r, p, null, nd => undoable(() => { moveRest(p.id, nd); return 'Reste verschoben.'; })) });

  }
  addLaneOptions(d, opts);
  optionsSheet(title, p && p.recipeId ? esc((recipeById(p.recipeId) || {}).name || '') : '', opts, dayChip(p));

const EXTRA_KINDS = ['MAIN', 'LUNCH', 'SIDE', 'CAKE', 'SPECIAL'];

function extraActions(id) {

/* „Mittagessen/Kuchen hinzufügen“ für Tage, an denen keine Zeile dafür angezeigt wird */
function addLaneOptions(d, opts) {
  const ents = weekEntries(weekStartISO);
  ['LUNCH', 'CAKE'].forEach(l => {
    if (ents.lanes[l].get(d)) return;                                           // schon etwas eingeplant
    if (laneVisible(l) && laneActiveOn(l, d) && d >= EP.todayISO()) return;     // Zeile ist ohnehin sichtbar
    if (!liveRecipes().some(r => EP.laneOf(r) === l)) return;                   // keine Rezepte dieser Art
    const o = { label: l === 'LUNCH' ? 'Mittagessen hinzufügen' : 'Kuchen hinzufügen',
      hint: 'Zusätzlich zum Hauptgericht an diesem Tag', run: () => laneActions(d, l) };
    const i = opts.findIndex(x => x.danger);           // rote Aktion bleibt ganz unten
    i === -1 ? opts.push(o) : opts.splice(i, 0, o);
  });
  if (hasSpecial() && d >= EP.todayISO() && !(draft && draft.ws === EP.weekStart(d)) && !specialOn(ents, d)) {
    const o = { label: `${DISH_LABEL.SPECIAL} wählen`, icon: 'star', tone: 'rim', group: 1, hint: 'Als Abend- oder Mittagessen – außerhalb der Rotation', run: () => specialPick(d) };
    const i = opts.findIndex(x => x.danger);
    i === -1 ? opts.push(o) : opts.splice(i, 0, o);
  }
  if (draft && draft.ws === EP.weekStart(d) && !ents.get(d) && specialFree([d]).length) {
    opts.unshift({ label: 'Doch normal füllen', icon: 'dice', group: 1, hint: `Freigehalten für ${DISH_LABEL.SPECIAL} – stattdessen aus der Rotation`, run: () => { draft.specialOff.add(d); relayoutDraft(); rerender(); } });
  }
  if (liveRecipes().length) {
    const i = opts.findIndex(x => x.danger);
    i === -1 ? opts.push(extraOption(d)) : opts.splice(i, 0, extraOption(d));
  }
}

/* ---------- Rezepte (Fundus) ---------- */
function recipeMatches(r) {
  const f = recipeFilter;
  if (EP.laneOf(r) !== f.kind) return false;
  const rot = EP.ROTATES(f.kind);
  if (rot && f.status === 'active' && !r.inRotation) return false;
  if (rot && f.status === 'paused' && r.inRotation) return false;
  if (f.tag && !(r.tags || []).includes(f.tag)) return false;
  if (f.q) {
    const q = f.q.toLowerCase();
    const inIng = r.ingredients.some(x => { const i = ingById(x.ingredientId); return i && i.name.toLowerCase().includes(q); });
    if (!r.name.toLowerCase().includes(q) && !(r.tags || []).some(t => t.toLowerCase().includes(q)) && !inIng) return false;
  }
  return true;
}

        </button>${favBtn(r)}</div>

          <label><span class="switch"><input type="checkbox" data-rot="${r.id}" ${r.inRotation ? 'checked' : ''} aria-label="In Rotation"><i></i></span>${r.inRotation ? 'In Rotation' : 'Pausiert'}</label>
          <div class="wstep"><button data-act="w" data-arg="${r.id}|-1" aria-label="Seltener">−</button><output>×${r.weight}</output><button data-act="w" data-arg="${r.id}|1" aria-label="Häufiger">+</button></div>
        </div>` : ''}</div>`;
    }).join('') || (all.length ? '<p class="empty">Keine Treffer.</p>' : `<div class="empty"><p class="serif">${{ MAIN: 'Dein Fundus ist leer', LUNCH: 'Noch keine Mittagsgerichte', CAKE: 'Noch keine Kuchen', SIDE: 'Noch keine Beilagen', SPECIAL: 'Noch nichts Besonderes' }[kind]}</p>
      <p>${{ MAIN: 'Tipp oben einen Gerichtnamen ein – Portionen, Zutaten und Anleitung kannst du später ergänzen.', LUNCH: 'Kleine Gerichte fürs Wochenende mit eigener Rotation.', CAKE: 'Kuchen kommen zusätzlich zum Essen dazu und haben ihre eigene Rotation.', SIDE: 'Salate, Soßen, Brot … ohne Rotation – du fügst sie selbst zu einem Tag hinzu.', SPECIAL: 'Aufwendige Gerichte für Sonntage und Festtage – gesammelt, aber nie in der Rotation.' }[kind]}</p>
      <div class="btns">${kind === 'SIDE' || kind === 'SPECIAL' ? '' : kind === 'MAIN' ? (liveRecipes().some(r => EP.laneOf(r) === 'MAIN') ? '' : '<button class="btn" data-act="seed">Beispielrezepte laden</button>')
        : `<button class="btn" data-act="seedlane" data-arg="${kind}">${kind === 'LUNCH' ? '6 Mittagsgerichte als Vorschlag laden' : '7 Kuchen als Vorschlag laden'}</button>`}</div></div>`)}</div>
    ${all.length && rot ? `<p class="hint" style="text-align:center">${all.filter(r => r.inRotation).length} von ${all.length} in Rotation${kind === 'MAIN' ? `, ${pp} Portionen pro Tag` : ''}</p>` : ''}`;
}

/* ---------- Rezept-Export (gleiches Format wie der Import) ---------- */
function exportSheet() {
  const lanes = EP.KINDS.map(k => [k.key, esc(LANE_LABEL[k.key])]);
  const all = liveRecipes().filter(r => !r.archivedAt);
  if (!all.length) return notify('Noch keine Rezepte vorhanden.');
  const cur = recipeFilter.kind;
  const groups = lanes.map(([k, l]) => {
    const rs = all.filter(r => EP.laneOf(r) === k).sort((a, b) => a.name.localeCompare(b.name, 'de'));
    if (!rs.length) return '';
    return `<h3 class="exph">${l} <button class="btn quiet small" data-x="grp" data-k="${k}">alle</button></h3>`
      + rs.map(r => `<label class="imphead"><input type="checkbox" data-exp="${r.id}" data-k="${k}" ${k === cur ? 'checked' : ''}><span class="nm">${esc(r.name)}</span></label>`).join('');
  }).join('');
  openSheet(`<h2>Rezepte exportieren</h2>
    <p class="hint" style="margin-top:0">Gleiches Format wie beim Import – die Datei lässt sich hier oder in einem anderen Haushalt wieder einlesen. Bilder, Gewichtung und Plan sind nicht enthalten.</p>
    <div class="btns two"><button class="btn" data-x="all">Alle wählen</button><button class="btn" data-x="none">Keine</button></div>
    <div class="explist">${groups}</div>
    <p class="hint" id="expn"></p>
    <div class="btns two"><button class="btn" data-x="copy">Text kopieren</button><button class="btn primary" data-x="file">Als Datei</button></div>`, el => {
    const boxes = () => [...el.querySelectorAll('[data-exp]')];
    const chosen = () => boxes().filter(b => b.checked).map(b => b.dataset.exp);
    const upd = () => { const n = chosen().length; $('#expn', el).textContent = n ? `${n} ${n === 1 ? 'Rezept' : 'Rezepte'} ausgewählt` : 'Nichts ausgewählt';
      el.querySelectorAll('[data-x=copy],[data-x=file]').forEach(b => b.disabled = !n); };
    el.addEventListener('change', upd);
    $('[data-x=all]', el).onclick = () => { boxes().forEach(b => b.checked = true); upd(); };
    $('[data-x=none]', el).onclick = () => { boxes().forEach(b => b.checked = false); upd(); };
    el.querySelectorAll('[data-x=grp]').forEach(g => g.onclick = () => {
      const bs = boxes().filter(b => b.dataset.k === g.dataset.k), on = !bs.every(b => b.checked);
      bs.forEach(b => b.checked = on); upd();
    });
    const text = () => JSON.stringify(EP.buildRecipeExport(db, chosen()), null, 1);
    $('[data-x=copy]', el).onclick = async () => {
      try { await navigator.clipboard.writeText(text()); notify('Rezepte kopiert.'); closeSheet(); }
      catch (e) { notify('Kopieren nicht erlaubt – bitte „Als Datei“ nutzen.'); }
    };
    $('[data-x=file]', el).onclick = () => {
      const n = chosen().length, blob = new Blob([text()], { type: 'application/json' });
      const name = `rezepte-${n}-${EP.todayISO()}.json`;
      const file = typeof File !== 'undefined' ? new File([blob], name, { type: 'application/json' }) : null;
      closeSheet();
      if (file && navigator.canShare && navigator.canShare({ files: [file] })) { navigator.share({ files: [file], title: 'Rezepte' }).catch(() => {}); return; }
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
    };
    upd();
  });
}

/* ---------- Rezept-Import (Antwort aus dem Scanner-Chat) ---------- */
/* Schnellweg am Handy: ein Tipp auf „Importieren“ liest direkt die Zwischenablage (iOS fragt einmal „Einsetzen“).
   Steht dort ein gültiger Rezeptblock, geht es sofort zur Vorschau – sonst öffnet sich das Eingabeblatt. */
async function quickImport() {
  const touch = typeof matchMedia === 'function' && matchMedia('(pointer: coarse)').matches;
  if (!touch || !(navigator.clipboard && navigator.clipboard.readText)) return importSheet();
  let t = '';
  try { t = (await navigator.clipboard.readText()) || ''; } catch (e) { return importSheet(); }
  let recs = null;
  try { recs = t.trim() ? EP.parseRecipeImport(t) : null; } catch (e) { recs = null; }
  if (recs) return importPreview(recs, t);
  importSheet();
}
function importSheet(prefill) {
  const canRead = !!(navigator.clipboard && navigator.clipboard.readText);
  openSheet(`<h2>Rezepte importieren</h2>
    <p class="sub" style="margin-top:6px">Füge die Antwort aus dem Rezept-Scanner-Chat ein. Text vor oder nach dem Block stört nicht.</p>
    <textarea class="in" id="imp-t" placeholder="{ &quot;format&quot;: &quot;essensplanung-import&quot;, … }" autocapitalize="off" autocorrect="off" spellcheck="false" style="margin-top:12px;min-height:150px;font-size:16px">${esc(prefill || '')}</textarea>
    <p class="warn hidden" id="imp-err" role="alert" style="font-size:14px;margin-top:8px"></p>
    <div class="btns two">${canRead ? '<button class="btn" data-x="paste">Einfügen</button>' : ''}<button class="btn" data-x="file" ${canRead ? '' : 'style="grid-column:1/-1"'}>Datei wählen</button></div>
    <input type="file" id="imp-f" accept=".json,.txt,application/json,text/plain" class="hidden">
    <div class="btns two"><button class="btn" data-x="no">Abbrechen</button><button class="btn primary" data-x="yes">Weiter</button></div>`, el => {
    const ta = $('#imp-t', el), err = $('#imp-err', el);
    const fail = m => { err.textContent = m; err.classList.remove('hidden'); };
    const tryPreview = t => { try { const recs = EP.parseRecipeImport(t); importPreview(recs, t); return true; } catch (e) { return false; } };
    const next = () => {
      const t = ta.value.trim();
      if (!t) return fail('Bitte zuerst die Antwort aus dem Chat einfügen.');
      let recs;
      try { recs = EP.parseRecipeImport(t); } catch (e) { return fail(e.message); }
      importPreview(recs, t);
    };
    ta.oninput = () => err.classList.add('hidden');
    // Lange tippen → „Einsetzen“: gültiger Block springt direkt zur Vorschau
    ta.addEventListener('paste', () => setTimeout(() => { const t = ta.value.trim(); if (t) tryPreview(t); }, 0));
    const p = $('[data-x=paste]', el);
    if (p) p.onclick = async () => {
      try { const t = await navigator.clipboard.readText(); if (!t) return fail('Die Zwischenablage ist leer.'); ta.value = t; err.classList.add('hidden'); next(); }
      catch (e) { fail('Kein Zugriff auf die Zwischenablage. Tippe lange ins Feld und wähle „Einsetzen“.'); }
    };
    $('[data-x=file]', el).onclick = () => $('#imp-f', el).click();
    $('#imp-f', el).onchange = async e => { const f = e.target.files[0]; if (!f) return; ta.value = await f.text(); e.target.value = ''; next(); };
    $('[data-x=no]', el).onclick = closeSheet;
    $('[data-x=yes]', el).onclick = next;
  });
}
function importPreview(recs, rawText) {
  const items = recs.map(rec => {
    const ex = findRecipeByName(rec.name);
    const dup = !!(ex && !ex.archivedAt);
    const sim = !ex ? EP.similarRecipes(db, rec.name, rec.kind)[0] || null : null;
    return { rec, kind: rec.kind, dup, sim, include: true, mode: dup ? 'skip' : ex ? 'replace' : 'new' };
  });
  const segBtn = (i, attr, val, cur, label) => `<button data-x="${attr}" data-i="${i}" data-v="${val}" aria-pressed="${cur === val}">${label}</button>`;
  const card = (it, i) => {
    const r = it.rec, newIngs = r.ingredients.filter(x => !findIngredient(x.name)).length;
    const steps = r.instructions ? r.instructions.split('\n').filter(l => l.trim()).length : 0;
    const meta = [`${r.servings} ${it.kind === 'CAKE' ? 'Stücke' : 'Portionen'}`, `${r.ingredients.length} Zutaten${newIngs ? ` (${newIngs} neu)` : ''}`,
      `${steps} ${steps === 1 ? 'Schritt' : 'Schritte'}`, r.prepTimeMinutes ? r.prepTimeMinutes + ' Min.' : ''].filter(Boolean).join(', ');
    return `<div class="rcard impcard" data-card="${i}">
      <label class="imphead"><input type="checkbox" data-inc="${i}" checked aria-label="${esc(r.name)} importieren"><span class="nm">${esc(r.name)}</span></label>
      <p class="meta">${meta}</p>
      <div class="seg lane-seg seg5" style="margin-top:10px">${EP.KINDS.map(l => segBtn(i, 'kind', l.key, it.kind, segLbl(LANE_LABEL[l.key]))).join('')}</div>
      ${it.dup ? `<p class="hint warn" style="margin-top:10px">„${esc(r.name)}“ gibt es schon.</p>
        <div class="seg" style="margin-top:6px">${segBtn(i, 'mode', 'skip', it.mode, 'Überspringen')}${segBtn(i, 'mode', 'replace', it.mode, 'Ersetzen')}${segBtn(i, 'mode', 'copy', it.mode, 'Als Kopie')}</div>
        <p class="hint" data-modehint="${i}"></p>` : ''}
      ${it.sim ? `<p class="hint warn" style="margin-top:10px">Ähnlich zu „${esc(it.sim.name)}“ – ist das dasselbe Rezept?</p>
        <div class="seg" style="margin-top:6px">${segBtn(i, 'mode', 'new', it.mode, 'Neu anlegen')}${segBtn(i, 'mode', 'replace', it.mode, 'Vorhandenes ersetzen')}${segBtn(i, 'mode', 'skip', it.mode, 'Überspringen')}</div>
        <p class="hint" data-modehint="${i}"></p>` : ''}
      ${r.warnings.length ? `<ul class="box warnbox" style="margin-top:10px">${r.warnings.map(w => `<li>${esc(w)}</li>`).join('')}</ul>` : ''}
      <details class="impdetails"><summary>Zutaten und Anleitung ansehen</summary>
        <ul class="impings">${r.ingredients.map(x => `<li><b>${x.quantity == null ? '' : esc(EP.fmtNum(x.quantity) + ' ' + (x.unit ? EP.UNITS[x.unit][x.quantity > 1 && EP.UNITS[x.unit].p ? 'p' : 's'] : ''))}</b> ${esc(x.name)}${x.note ? `<small>, ${esc(x.note)}</small>` : ''}</li>`).join('') || '<li>Keine Zutaten</li>'}</ul>
        ${r.instructions ? `<div class="md">${renderMd(r.instructions).intro}<ol class="impsteps">${renderMd(r.instructions).steps.map(t => `<li>${t}</li>`).join('')}</ol></div>` : ''}
        ${r.notes ? `<p class="hint">${esc(r.notes)}</p>` : ''}
      </details>
    </div>`;
  };
  const MODE_HINT = { skip: 'Das vorhandene Rezept bleibt unverändert.', replace: 'Zutaten, Portionen und Anleitung werden ersetzt. Bilder, Gewichtung und Rotation bleiben.', copy: 'Wird mit Zusatz „(2)“ im Namen angelegt.' };
  openSheet(`<h2>${items.length === 1 ? '1 Rezept gefunden' : items.length + ' Rezepte gefunden'}</h2>
    <p class="sub" style="margin-top:6px">Prüfe die Art und hake ab, was übernommen werden soll. Details kannst du danach im Rezept bearbeiten.</p>
    ${items.map(card).join('')}
    <div class="btns two"><button class="btn" data-x="back">Zurück</button><button class="btn primary" data-x="yes"></button></div>`, el => {
    const count = () => items.filter(it => it.include && it.mode !== 'skip').length;
    const refresh = () => {
      const n = count(), b = $('[data-x=yes]', el);
      b.textContent = n ? (n === 1 ? '1 Rezept importieren' : n + ' Rezepte importieren') : 'Nichts ausgewählt';
      b.disabled = !n;
      items.forEach((it, i) => {
        const h = $(`[data-modehint="${i}"]`, el);
        if (h) h.textContent = it.sim ? { new: 'Wird als eigenes Rezept angelegt.', replace: `„${it.sim.name}“ bekommt Zutaten, Portionen und Anleitung aus dem Import. Name, Bilder und Rotation bleiben.`, skip: 'Wird nicht importiert.' }[it.mode] : MODE_HINT[it.mode];
        $(`[data-card="${i}"]`, el).classList.toggle('off', !it.include || it.mode === 'skip');
      });
    };
    $$('[data-inc]', el).forEach(c => c.onchange = () => {
      const it = items[+c.dataset.inc]; it.include = c.checked;
      if (c.checked && it.dup && it.mode === 'skip') { it.mode = 'copy'; $$(`[data-x=mode][data-i="${c.dataset.inc}"]`, el).forEach(b => b.setAttribute('aria-pressed', b.dataset.v === 'copy')); }
      refresh();
    });
    $$('[data-x=kind],[data-x=mode]', el).forEach(b => b.onclick = () => {
      const i = +b.dataset.i, key = b.dataset.x;
      items[i][key] = b.dataset.v;
      if (key === 'kind' && b.dataset.v === 'CAKE' && items[i].rec.servings <= 4) items[i].rec.servings = 12;
      $$(`[data-x=${key}][data-i="${i}"]`, el).forEach(x => x.setAttribute('aria-pressed', x === b));
      if (key === 'mode' && b.dataset.v !== 'skip') { items[i].include = true; $(`[data-inc="${i}"]`, el).checked = true; }
      if (key === 'kind') { const m = $(`[data-card="${i}"] .meta`, el); m.textContent = m.textContent.replace(/^\d+ (Stücke|Portionen)/, `${items[i].rec.servings} ${b.dataset.v === 'CAKE' ? 'Stücke' : 'Portionen'}`); }
      refresh();
    });
    $('[data-x=back]', el).onclick = () => importSheet(rawText);
    $('[data-x=yes]', el).onclick = () => {
      const chosen = items.filter(it => it.include && it.mode !== 'skip');
      if (!chosen.length) return;
      closeSheet();
      const res = importRecipes(chosen.map(it => it.sim && it.mode === 'replace' ? Object.assign({ targetId: it.sim.id }, it) : it));
      recipeFilter = Object.assign(recipeFilter, { kind: chosen[0].kind, q: '', tag: '', status: 'all' });
      const parts = [res.added ? `${res.added} importiert` : '', res.replaced ? `${res.replaced} ersetzt` : ''].filter(Boolean).join(', ');
      const msg = `${parts || 'Nichts geändert'}.${res.newIngredients ? ` ${res.newIngredients} neue Zutaten – Einkaufsorte unter ⚙ prüfen.` : ''}`;
      if (res.ids.length === 1) {   // ein einzelnes Rezept: gleich im Editor öffnen, um Werte und Notizen anzupassen
        persist().then(() => { openEdit(res.ids[0]); notify(msg + ' Du kannst es jetzt anpassen.'); });
      } else change(msg);
    };
    refresh();
  });
}

/* ---------- Rezept bearbeiten ---------- */
let editState = null;
function openEdit(id, kind) {
  const r = id ? recipeById(id) : newRecipe('', kind);
  editState = { isNew: !id, dirty: false, r: deep(r),
    rows: r.ingredients.slice().sort((a, b) => a.sortOrder - b.sortOrder).map(x => {
      const i = ingById(x.ingredientId);
      return { name: i ? i.name : '', qty: x.quantity == null ? '' : EP.fmtNum(x.quantity), unit: x.unit || '', note: x.note || '', cat: i ? i.category : 'SONSTIGES' };
    }) };
  go('edit');
}
function vEdit() {
  if (!editState) return '<p class="empty">Kein Rezept geöffnet.</p>';

function readEditForm() {

function saveEdit() {
  readEditForm();

  r.name = r.name.trim();

  if (r.seasonMonths && (!r.seasonMonths.length || r.seasonMonths.length >= 12)) r.seasonMonths = null;
  if (EP.laneOf(r) !== 'MAIN' && EP.laneOf(r) !== 'SPECIAL') r.daysOverride = null;
  r.sides = (r.sides || []).filter(id => id !== r.id && recipeById(id));
  const dup = findRecipeByName(r.name);
  if (dup && dup.id !== r.id && !dup.archivedAt) return notify('Ein Rezept mit diesem Namen gibt es schon.');
  // Zutaten auflösen, unbekannte anlegen
  const ings = [];
  e.rows.forEach((x, k) => {
    if (!x.name.trim()) return;
    const qty = parseQty(x.qty);
    let ing = findIngredient(x.name);
    if (!ing) ing = createIngredient(x.name, x.cat || 'SONSTIGES', x.unit || 'STUECK');
    ings.push({ ingredientId: ing.id, quantity: qty, unit: qty == null ? null : (x.unit || ing.defaultUnit || 'STUECK'), note: x.note.trim(), sortOrder: k + 1 });
  });

}

const Timers = {
  list: [], iv: null, ctx: null, el: null,
  /* Klingelton als WAV (drei Pieptöne). Ein <audio>-Element spielt auf dem iPhone auch bei

  wav() {
    const rate = 22050, n = Math.round(rate * 0.8), b = new DataView(new ArrayBuffer(44 + n * 2));

  /* Mitteilung vom Pi, falls die App im Hintergrund oder das Display aus ist */
  push(t) {
    if (typeof Push === 'undefined') return;
    const tag = 'timer-' + t.id;
    if (t.done || t.left != null) { Push.cancel(tag); return; }
    const r = recipeById(t.recipeId);
    Push.schedule(tag, t.end, 'timer', 'Timer abgelaufen', (r ? r.name + ' · ' : '') + 'Schritt ' + (t.step + 1) + (t.label ? ' · ' + String(t.label).split('|')[0] : ''), 'essensplanung.html');
  },
  start(recipeId, step, sec, label) {

  toggle(id) {

      if (b.dataset.t === 'open') { if (t && t.done) return this.stop(id); if (t && !cookOpen()) openCook(t.recipeId); return; }

    const what = list.length === 1 ? `„${list[0]}“` : list.length <= 4 ? list.map(x => `„${x}“`).join(', ') : `${list.length} Artikel`, w = this.who();
    Push.notify(it, 'einkauf', 'Einkaufsliste', `${w ? w + ' hat ' : ''}${what} hinzugefügt`.replace(/^./, c => c.toUpperCase()), 'essensplanung.html');
  },
  /* Wochenplan übernommen */
  planCommitted(ws) {
    const it = this.item(); if (typeof Push === 'undefined' || !it) return;
    const days = EP.weekDays(ws), m = planByDate(db), names = [];
    days.forEach(d => { const p = m.get(d); const r = p && p.type === 'COOK' && (p.dayIndex || 1) === 1 && recipeById(p.recipeId); if (r) names.push(EP.weekday(d) + ' ' + r.name); });
    const w = this.who();
    Push.notify(it, 'plan', 'Wochenplan ab ' + EP.fmtShort(ws), (w ? w + ' hat geplant: ' : '') + (names.join(' · ') || 'Neue Woche geplant'), 'essensplanung.html');
  },
  /* Kocherinnerung: die nächsten 7 Tage zur eingestellten Uhrzeit auf diesem Gerät */
  remindText(d) {
    const parts = [], main = planByDate(db).get(d);
    const name = p => p && p.type === 'COOK' && (p.dayIndex || 1) === 1 && recipeById(p.recipeId) ? recipeById(p.recipeId).name : '';
    if (name(main)) parts.push(name(main));
    [['LUNCH', 'Mittag'], ['CAKE', 'Kuchen']].forEach(([l, lbl]) => { const n = name(laneAt(db, d, l)); if (n) parts.push(lbl + ': ' + n); });

  remindPlan() {
    const out = {}; if (!db) return out;
    const p = Push.prefs(), [hh, mm] = String(p.remindTime || '16:30').split(':').map(Number), now = Date.now();
    for (let i = 0; i < 7; i++) {
      const d = EP.addDays(EP.todayISO(), i), txt = this.remindText(d); if (!txt) continue;
      const at = EP.parseISO(d); at.setHours(hh || 0, mm || 0, 0, 0);

  rRun: null, rAgain: false,

    if (this.rRun) { this.rAgain = true; return this.rRun; }
    this.rRun = this._syncRemind().catch(() => {}).finally(() => { this.rRun = null; if (this.rAgain) { this.rAgain = false; this.syncRemind(); } });

    const want = Push.enabled() && Push.prefs().remind ? this.remindPlan() : {}, next = {};
    for (const tag of Object.keys(old)) {
      if (want[tag]) continue;

    }

      if (await Push.schedule(tag, v.at, 'remind', 'Heute kochen', v.txt, 'essensplanung.html')) next[tag] = v;

const PROG_KEY = 'ep_cookprog';

  if (!cookState) return;
  const all = LS.get(PROG_KEY) || {}, now = Date.now();
  Object.keys(all).forEach(k => { if (now - all[k].t > 12 * 3600e3) delete all[k]; });
  if (cookState.done.size || cookState.n !== (cookState.r.servings || 2) || cookState.pan) all[cookState.r.id] = { done: [...cookState.done], n: cookState.n, pan: cookState.pan || null, t: now };
  else delete all[cookState.r.id];

}
function loadCookProgress(id) {

  return p && Date.now() - p.t < 12 * 3600e3 ? p : null;
}
function renderMd(md) {

    const t = l.trim(); if (!t) return;

}

/* ---------- Kochansicht (Karten wie in Rezept-Apps: Kopf, Zutaten mit Portionen-Umschalter, Schritte zum Abhaken) ---------- */
let cookState = null;

  leaf: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 19c0-8 5-13 14-14-1 9-6 14-14 14z"/><path d="M5 19l7-7"/></svg>',

  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
};
/* Menge für n Portionen, sinnvoll gerundet; bei der Originalportion unverändert */
function cookAmount(x, factor) {
  if (x.quantity == null) return 'nach Geschmack';
  let q = x.quantity * factor;
  if (factor !== 1) {
    const dim = EP.dimOf(x.unit);
    if (dim === 'MASS' || dim === 'VOLUME') {
      const base = q * ((EP.UNITS[x.unit] && EP.UNITS[x.unit].f) || 1);
      const r = base >= 100 ? 5 : base >= 10 ? 1 : 0.1;
      q = Math.round(base / r) * r / ((EP.UNITS[x.unit] && EP.UNITS[x.unit].f) || 1);
    } else q = Math.max(0.25, Math.round(q * 4) / 4);
  }
  return EP.sumAmounts([{ quantity: q, unit: x.unit }]).text
    .replace(/(\d+),5\b/g, (m, d) => (d === '0' ? '' : d) + '½').replace(/(\d+),25\b/g, (m, d) => (d === '0' ? '' : d) + '¼').replace(/(\d+),75\b/g, (m, d) => (d === '0' ? '' : d) + '¾');
}
function cookIngredients() {
  const r = cookState.r;
  const list = r.ingredients.slice().sort((a, b) => a.sortOrder - b.sortOrder).map(x => {
    const i = ingById(x.ingredientId);
    return { x, name: i ? i.name : '', spice: !!(i && i.category === 'GEWUERZE'), key: (i ? i.name : '').split(/[(,/]/)[0].trim().toLowerCase() };
  }).filter(o => o.name);
  return list.filter(o => !o.spice).concat(list.filter(o => o.spice));   // Gewürze immer zuletzt
}
const isCake = r => EP.laneOf(r) === 'CAKE' || r.kind === 'CAKE';
function cookFactor() {
  const r = cookState.r;
  if (isCake(r) && r.pan && cookState.pan) return EP.panFactor(r.pan, cookState.pan);
  return cookState.n / (r.servings || cookState.n || 1);
}
function cookIngRows() {
  const f = cookFactor();
  return cookIngredients().map((o, k) => `<li data-ci="${k}" class="${cookState.done.has('i' + k) ? 'done' : ''}"><span class="q">${esc(cookAmount(o.x, f))}</span>
    <span class="nm">${esc(o.name)}${o.x.note ? `<small>${esc(o.x.note)}</small>` : ''}</span></li>`).join('');
}
const cookStem = w => w.replace(/(en|n|e|s)$/, '');
const cookSame = (w, k) => w === k || w === k + 'n' || w === k + 'en' || w === k + 'e' || w === k + 's' || w === k + 'er';
/* Passt das Wort w (klein) zur Zutat key? Ganze Wörter, Mehrzahl (Tomate → Tomaten), Wortenden (Reis → Milchreis)
   und Wortanfänge (Knoblauch → Knoblauchzehen), aber nicht Milch in „Milchreis“, wenn Milchreis selbst Zutat ist */
function wordMatches(w, key, others) {
  const taken = (others || []).some(o => o !== key && o.split(/\s+/).some(k => cookSame(w, k)));
  return key.split(/\s+/).filter(k => k.length >= 3).some(k =>
    cookSame(w, k) || (w.length >= 4 && k.endsWith(w)) || (cookStem(w).length >= 4 && k.endsWith(cookStem(w))) ||
    (k.length >= 4 && w.startsWith(k) && !taken));
}
const cookWords = text => text.replace(/<[^>]+>/g, ' ').toLowerCase().split(/[^a-zäöüß]+/).filter(Boolean);
function mentions(text, key, others) { return cookWords(text).some(w => wordMatches(w, key, others)); }
/* Position der ersten Erwähnung im Text (für die Reihenfolge innerhalb eines Schritts) */
function mentionPos(text, key, others) { const i = cookWords(text).findIndex(w => wordMatches(w, key, others)); return i < 0 ? 1e9 : i; }
/* In welchem Schritt wird welche Zutat zum ersten Mal gebraucht? (-1 = nie erwähnt) */
function cookPlan(steps) {
  const all = cookIngredients(), keys = all.map(o => o.key);
  const first = all.map(o => o.key ? steps.findIndex(t => mentions(t, o.key, keys)) : -1);
  return { all, keys, first };
}
/* Hebt im Schritttext die erste Stelle jeder hier neu gebrauchten Zutat hervor */
function markFirstUse(html, ings, keys) {
  const open = new Set(ings.map(o => o.key));

    const hit = [...open].find(k => wordMatches(w.toLowerCase(), k, keys));

      <button class="btn primary" data-act="cookedit" data-arg="${r.id}">Rezept ergänzen</button></section>` : ''}
    ${cookState.done.size ? '<div class="btns"><button class="btn quiet" data-act="cookreset">Abhaken zurücksetzen</button></div>' : ''}
    <p class="hint" style="margin-top:18px;text-align:center">Der Bildschirm bleibt an, solange die Kochansicht offen ist. Tippe auf Zutaten und Schritte, um sie abzuhaken – der Stand bleibt bis zu 12 Stunden gespeichert. Timer laufen weiter, auch wenn du die Kochansicht schließt; der Ton kommt, solange die App geöffnet ist.</p></div>`;
  bindCook();
  Images.hydrate(el);
}
/* aktueller Schritt = erster nicht abgehakter */
function markCurrentStep() {
  const lis = $$('#cookview [data-cs]');
  const cur = lis.find(li => !li.classList.contains('done'));
  lis.forEach(li => li.classList.toggle('cur', li === cur && lis.some(x => x.classList.contains('done'))));
  return cur;
}
/* Durchstreichen sicher an- und ausschalten: Safari (iOS) zeichnet geerbtes text-decoration nach dem Entfernen
   einer Klasse am Elternelement manchmal nicht neu – deshalb zusätzlich direkt an den Textelementen setzen. */
function strikeRow(item, on, cls) {
  if (!item) return;
  item.classList.toggle(cls || 'checked', on);
  item.querySelectorAll('.nm, .amt, .xname, .stxt, .sing').forEach(e => {
    e.style.textDecorationLine = on ? 'line-through' : 'none';
    if (!on) e.style.color = ''; void e.offsetWidth;   // Neuzeichnen erzwingen
  });
}
function bindCook() {
  const el = $('#cookview');
  const flip = (li, k) => { const on = !cookState.done.has(k); on ? cookState.done.add(k) : cookState.done.delete(k); strikeRow(li, on, 'done'); saveCookProgress(); };
  $$('[data-ci]', el).forEach(li => li.onclick = () => flip(li, 'i' + li.dataset.ci));
  $$('[data-cs]', el).forEach(li => li.onclick = () => {
    flip(li, 's' + li.dataset.cs);
    const cur = markCurrentStep();
    if (li.classList.contains('done') && cur) {   // nächsten Schritt ins Bild holen, falls er unten herausragt
      const b = cur.getBoundingClientRect();
      if (b.top > window.innerHeight * 0.6) cur.scrollIntoView({ block: 'center', behavior: 'smooth' });
    }
  });
  $$('[data-tm]', el).forEach(b => b.onclick = e => {
    e.stopPropagation();
    const [k, sec, ...lbl] = b.dataset.tm.split('|');
    Timers.start(cookState.r.id, +k, +sec, lbl.join('|'));
  });
  markCurrentStep();
}
function cookPortions(d) {
  if (!cookState) return;
  cookState.n = Math.max(1, Math.min(99, cookState.n + d));
  saveCookProgress();
  const el = $('#cookview'), y = el.scrollTop;
  renderCook();       // Abhak-Zustand bleibt in cookState.done
  el.scrollTop = y;
}
function cookPan() {
  if (!cookState) return;
  const r = cookState.r, redraw = () => { const el = $('#cookview'), y = el.scrollTop; renderCook(); el.scrollTop = y; };
  if (!r.pan) return recipePanSheet(r, () => { cookState.pan = null; saveCookProgress(); redraw(); });
  panSheet({ title: 'Backform', sub: `Rezept: ${EP.panLabel(r.pan)}. Die Mengen werden über die Fläche umgerechnet.`, cur: cookState.pan || r.pan, orig: r.pan,
    reset: `Originalform (${EP.panLabel(r.pan)})`,
    onPick: p => { cookState.pan = p && !EP.samePan(p, r.pan) ? p : null; saveCookProgress(); redraw(); } });
}
function closeCook() {
  $('#cookview').classList.add('hidden');
  unlockScreen();
  Timers.render();
}

/* ---------- Rotation ---------- */
function vRotation() {
  const sig = () => db.rotation.length + ':' + db.rotation.filter(e => e.deleted).length + ':' + db.rotation.filter(e => e.status === 'SKIPPED').length;
  const before = sig();
  EP.LANES.forEach(l => EP.nextEntries(db, 1, null, rng, l.key, EP.monthOf(EP.todayISO())));
  if (sig() !== before) persist();
  // nur Rezepte, die es noch gibt: keine gelöschten/archivierten, pausierte nur solange sie noch eingeplant sind
  const shownE = e => { const r = recipeById(e.recipeId); return r && !r.deleted && !r.archivedAt && (r.inRotation || e.status === 'PLANNED'); };
  const stLabel = { PENDING: ['Offen', ''], PLANNED: ['Geplant', 'cook'], DONE: ['Gekocht', 'done'], SKIPPED: ['Ausgelassen', 'block'] };
  const fixed = db.settings.rotationMode === 'FIXED';
  const actives = EP.activeRecipes(db).sort((a, b) => a.sortOrder - b.sortOrder);
  const allCycles = EP.LANES.flatMap(l => EP.openCycles(db, l.key).map(c => [l.key, c]));
  return (allCycles.length ? allCycles.map(([lane, c]) => {
    const all = EP.cycleEntries(db, c, lane).filter(shownE);
    const season = all.filter(e => e.status === 'SKIPPED' && e.skipReason === 'SEASON');
    const es = all.filter(e => !season.includes(e));
    const seasonNames = [...new Set(season.map(e => recipeById(e.recipeId).name))];
    return `<h3>${LANE_LABEL[lane]} · Durchlauf ${c}</h3><div class="box">${es.map(e => {
      const r = recipeById(e.recipeId), [l, cls] = stLabel[e.status];
      return `<div class="item"><span class="nm serif" style="font-size:17px">${esc(r ? r.name : '–')}${r && r.weight > 1 ? ` <span class="sub">(${e.occurrence}/${r.weight})</span>` : ''}</span>
        <span class="badge ${cls}">${l}</span>
        ${e.status === 'PENDING' ? `<button class="btn quiet small" data-act="rpost" data-arg="${e.id}">Später</button><button class="btn quiet small" data-act="rskip" data-arg="${e.id}">Auslassen</button>` : ''}</div>`;
    }).join('')}</div>${seasonNames.length ? `<p class="hint">Gerade keine Saison, in diesem Durchlauf ausgelassen: ${esc(seasonNames.join(', '))}</p>` : ''}`;
  }).join('') : '<p class="empty">Keine offenen Durchläufe – leg Rezepte an und nimm sie in die Rotation.</p>')
  + (fixed && actives.length ? `<h3>Feste Reihenfolge</h3><p class="hint" style="margin-top:0">Gilt ab dem nächsten Durchlauf.</p><div class="box">${actives.map((r, i) => `<div class="item">
      <span class="nm serif">${esc(r.name)}</span>
      <button class="btn quiet small" data-act="sortup" data-arg="${r.id}" ${i === 0 ? 'disabled' : ''} aria-label="Nach oben">▲</button>
      <button class="btn quiet small" data-act="sortdown" data-arg="${r.id}" ${i === actives.length - 1 ? 'disabled' : ''} aria-label="Nach unten">▼</button></div>`).join('')}</div>` : '')
  + `<div class="btns"><button class="btn danger" data-act="rreset">Rotation neu starten</button></div>`;
}
