<meta name="color-scheme" content="light dark">
<title>Essensplanung</title>
<style>
:root{
  --enamel:#F6F8FB; --plate:#FFFFFF; --rim:#1E4FA0; --rim-ink:#FFFFFF; --rim-soft:#E6EDF8;
  --ink:#172033; --speckle:#586477; --line:#D6DDE8; --tomato:#B93A22; --basil:#2B7249; --mustard:#8A5F00;
  --shadow:0 1px 0 rgba(23,32,51,.06);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){:root{
  --enamel:#0E1626; --plate:#162136; --rim:#86AAEE; --rim-ink:#0E1626; --rim-soft:#1C2B48;
  --ink:#EDF1F8; --speckle:#A7B3C6; --line:#2B3A57; --tomato:#FF8C74; --basil:#72D39B; --mustard:#F0C45C;
  --shadow:none;
}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{background:var(--enamel);color:var(--ink);font:16px/1.45 var(--sans);min-height:100dvh;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
:focus-visible{outline:3px solid var(--rim);outline-offset:2px}
.hidden{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- Kopf ---------- */
.top{position:sticky;top:0;z-index:20;background:var(--enamel);display:flex;align-items:center;gap:8px;
  padding:10px 16px 8px;border-bottom:1px solid var(--line)}
.top .ttl{font-family:var(--serif);font-size:21px;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{min-width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--rim);font-size:15px;font-weight:600;padding:0 8px}
.iconbtn:active{background:var(--rim-soft)}
.iconbtn svg{width:22px;height:22px}
#gear{position:relative}
.gearbadge{position:absolute;top:3px;right:1px;min-width:19px;height:19px;padding:0 5px;border-radius:99px;background:var(--tomato);color:#fff;
  font-size:12px;font-weight:700;line-height:19px;text-align:center;box-shadow:0 0 0 2px var(--enamel)}
.countbadge{min-width:24px;height:24px;padding:0 7px;border-radius:99px;background:var(--tomato);color:#fff;font-size:13px;font-weight:700;line-height:24px;text-align:center}
.syncpill{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--speckle);padding:6px 9px;border-radius:99px;border:1px solid var(--line);background:var(--plate);min-height:32px}
.syncpill i{width:8px;height:8px;border-radius:50%;background:var(--speckle);display:block}
.syncpill.ok i{background:var(--basil)} .syncpill.busy i{background:var(--rim)} .syncpill.err i{background:var(--tomato)}

main{max-width:640px;margin:0 auto;padding:16px 16px calc(96px + env(safe-area-inset-bottom))}

/* ---------- Untere Navigation ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--plate);border-top:1px solid var(--line);
  display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;min-height:52px;
  color:var(--speckle);font-size:12px;font-weight:600;border-radius:12px}
.tabs button svg{width:24px;height:24px}
.tabs button[aria-current="page"]{color:var(--rim)}
.tabs button[aria-current="page"] svg{stroke-width:2.4}

/* ---------- Grundbausteine ---------- */
h2{font-family:var(--serif);font-size:24px;font-weight:600;line-height:1.2;margin-bottom:4px}
h3{font-size:15px;font-weight:700;margin:22px 0 8px}
.sub{color:var(--speckle);font-size:14px}
.serif{font-family:var(--serif)}
.box{background:var(--plate);border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow)}
.stack>*+*{margin-top:10px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:12px 16px;border-radius:14px;
  font-weight:700;font-size:16px;background:var(--plate);border:1.5px solid var(--line);color:var(--ink);width:100%}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--rim);border-color:var(--rim);color:var(--rim-ink)}
.btn.quiet{border-color:transparent;background:transparent;color:var(--rim);min-height:44px}
.btn.danger{color:var(--tomato)}
.btn.small{min-height:40px;padding:8px 12px;font-size:14px;border-radius:12px;width:auto}
.btns{display:grid;gap:10px;margin-top:16px}
.btns.two{grid-template-columns:1fr 1fr}
.field{display:block;margin-top:14px}
.field>span{display:block;font-size:14px;font-weight:600;color:var(--speckle);margin-bottom:6px}
.in{width:100%;min-height:48px;background:var(--plate);border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;font-size:16px}
.in:focus{border-color:var(--rim);outline:none}
textarea.in{min-height:110px;resize:vertical;line-height:1.5}
select.in{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--speckle) 50%),linear-gradient(135deg,var(--speckle) 50%,transparent 50%);
  background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
.hint{font-size:13px;color:var(--speckle);margin-top:6px}
.warn{color:var(--tomato)}
.empty{text-align:center;padding:36px 16px;color:var(--speckle)}
.empty .serif{font-size:21px;color:var(--ink);margin-bottom:6px}
.seg{display:flex;background:var(--rim-soft);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;min-height:40px;border-radius:9px;font-size:14px;font-weight:600;color:var(--speckle);padding:6px 8px}
.seg button[aria-pressed="true"]{background:var(--plate);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--plate);font-size:22px;font-weight:600;color:var(--rim)}
.stepper output{min-width:46px;text-align:center;font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
.switch{position:relative;width:52px;height:32px;flex-shrink:0}
.switch input{opacity:0;position:absolute;inset:0;margin:0;cursor:pointer;z-index:1}
.switch i{position:absolute;inset:0;border-radius:99px;background:var(--line);transition:background .15s}
.switch i:after{content:'';position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}
.switch input:checked+i{background:var(--basil)}
.switch input:checked+i:after{transform:translateX(20px)}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 8px;border-radius:99px;
  background:var(--rim-soft);color:var(--rim);white-space:nowrap}
.badge.cook{background:transparent;border:1.5px solid var(--basil);color:var(--basil)}
.badge.rest{background:transparent;border:1.5px dashed var(--mustard);color:var(--mustard)}
.badge.block{background:transparent;border:1.5px solid var(--tomato);color:var(--tomato)}
.badge.done{background:transparent;border:1.5px solid var(--speckle);color:var(--speckle)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.months{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.months .chip{padding:5px 0;text-align:center}
.lane-seg{margin-bottom:14px}
.srcrow{padding:10px 0;border-bottom:1px solid var(--line)}
.srcrow:last-child{border-bottom:none}
.srcrow .nm{font-weight:600}
.srcrow .amt{font-size:13px;color:var(--speckle)}
.srcseg{margin-top:8px}
.srcseg button{min-height:36px;font-size:13px}
.newbox{border-color:var(--tomato)}
details.srcgroup{margin-top:8px}
details.srcgroup summary .amt{margin-left:auto;margin-right:10px;font-weight:600;color:var(--speckle);font-size:13px}
/* Datumsfelder: iOS gibt ihnen sonst eine feste Mindestbreite, dann überlappen sie */
.dategrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin-top:10px}
.dategrid label{min-width:0;display:block}
.dategrid .hint{display:block;margin:0 0 4px}
input[type=date].in{-webkit-appearance:none;appearance:none;min-width:0;max-width:100%;width:100%;display:block;text-align:left}
input[type=date]::-webkit-date-and-time-value{text-align:left}
@media (max-width:340px){.dategrid{grid-template-columns:1fr}}
.rangebox{margin-bottom:4px}
.rangebox summary{font-weight:600;font-size:15px;color:var(--rim)}
.chip{min-height:34px;padding:5px 12px;border-radius:99px;border:1.5px solid var(--line);font-size:14px;font-weight:600;color:var(--speckle);background:var(--plate)}
.chip[aria-pressed="true"]{border-color:var(--rim);color:var(--rim);background:var(--rim-soft)}

/* ---------- Vorschlag: der Teller ---------- */
.plate-wrap{display:flex;flex-direction:column;align-items:center;text-align:center;padding:8px 0 4px}
.plate{width:min(76vw,300px);aspect-ratio:1;border-radius:50%;background:var(--plate);
  border:12px solid var(--rim);box-shadow:inset 0 0 0 7px var(--plate),inset 0 0 0 8px var(--line);
  display:flex;align-items:center;justify-content:center;padding:34px;position:relative;overflow:hidden}
.plate.plate-lunch{border-color:var(--basil);width:min(64vw,250px)}
.plate.plate-cake{border-color:var(--tomato);width:min(64vw,250px);border-style:double;border-width:14px}
.plate .dish{font-family:var(--serif);font-size:clamp(22px,6.4vw,30px);line-height:1.15;font-weight:600;overflow-wrap:anywhere}
.plate img{position:absolute;inset:7px;width:calc(100% - 14px);height:calc(100% - 14px);object-fit:cover;border-radius:50%}
.dish-under{font-family:var(--serif);font-size:26px;font-weight:600;line-height:1.2;margin-top:14px;overflow-wrap:anywhere}
.plate-meta{color:var(--speckle);font-size:15px;margin-top:8px}
.progress{margin:18px 0 6px;font-size:14px;color:var(--speckle);text-align:center}
.progress-bar{height:6px;background:var(--rim-soft);border-radius:99px;overflow:hidden;margin-top:6px}
.progress-bar i{display:block;height:100%;background:var(--rim);border-radius:99px}
.queue{margin-top:6px}
.queue li{list-style:none;display:flex;align-items:baseline;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line)}
.queue li:last-child{border-bottom:none}
.queue .n{color:var(--speckle);font-size:13px;font-variant-numeric:tabular-nums;width:20px}
.queue .nm{font-family:var(--serif);font-size:17px;flex:1;min-width:0}
.queue .d{font-size:13px;color:var(--speckle);white-space:nowrap}

/* ---------- Woche ---------- */
.weekhead{display:flex;align-items:center;gap:6px;margin-bottom:12px}
.weekhead .kw{flex:1;text-align:center}
.weekhead .kw b{display:block;font-family:var(--serif);font-size:24px;font-weight:600}
.weekhead .kw span{font-size:14px;color:var(--speckle)}
.draftbar{background:var(--rim-soft);border:1.5px dashed var(--rim);border-radius:14px;padding:12px 14px;margin-bottom:12px;font-size:14px}
.draftbar b{color:var(--rim)}
.days{background:var(--plate);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.day{border-top:1px solid var(--line);position:relative}
.day:first-child{border-top:none}
.daymain{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:12px 14px;min-height:66px}
.daymain:active,.laneline:active{background:var(--rim-soft)}
.laneline{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:7px 14px 9px 70px;min-height:40px;border-top:1px dashed var(--line)}
.laneline .lanelbl{font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;flex-shrink:0}
.lane-lunch .lanelbl{background:transparent;border:1.5px solid var(--basil);color:var(--basil)}
.lane-cake .lanelbl{background:transparent;border:1.5px solid var(--tomato);color:var(--tomato)}
.lane-x-main .lanelbl{background:transparent;border:1.5px solid var(--rim);color:var(--rim)}
.lane-x-lunch .lanelbl{background:transparent;border:1.5px solid var(--basil);color:var(--basil)}
.lane-x-cake .lanelbl{background:transparent;border:1.5px solid var(--tomato);color:var(--tomato)}
.lane-x-side .lanelbl{background:transparent;border:1.5px solid var(--mustard,#b8860b);color:var(--mustard,#b8860b)}
.seg4 button{flex:1 1 auto;font-size:13px;padding:6px 5px;min-width:0}
.kind-seg{margin-top:10px}
.pausetog{margin-top:10px;min-height:44px;font-size:15px}
.laneline .nm{font-family:var(--serif);font-size:16px;flex:1;min-width:0;overflow-wrap:anywhere}
.laneline .nm.free{font-family:var(--sans);font-size:14px;color:var(--speckle)}
.laneline.drafted{background:linear-gradient(90deg,var(--rim-soft),transparent 60%)}
.day.today:before{content:'';position:absolute;left:0;top:8px;bottom:8px;width:4px;border-radius:0 4px 4px 0;background:var(--rim)}
.day.past{opacity:.62}
.daymain .dt{width:44px;flex-shrink:0;text-align:center}
.daymain .dt b{display:block;font-size:15px}
.daymain .dt span{font-size:12px;color:var(--speckle)}
.daymain .what{flex:1;min-width:0}
.daymain .nm{font-family:var(--serif);font-size:17px;line-height:1.25;overflow-wrap:anywhere}
.daymain .nm.free{font-family:var(--sans);font-size:15px;color:var(--speckle)}
.daymain .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.day.drafted .daymain{background:linear-gradient(90deg,var(--rim-soft),transparent 60%)}
.lock{width:16px;height:16px;color:var(--speckle);flex-shrink:0}

/* ---------- Rezepte ---------- */
.quick{display:flex;gap:8px}
.quick .in{flex:1}
.quick .btn{width:auto;min-width:52px;padding:0 14px}
.rlist{margin-top:12px}
.rcard{background:var(--plate);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px;box-shadow:var(--shadow)}
.rcard.paused{opacity:.72}
.rcard .head{display:flex;align-items:center;gap:12px}
.rcard .thumb{width:48px;height:48px;border-radius:50%;object-fit:cover;flex-shrink:0;border:3px solid var(--rim)}
.rcard .nm{font-family:var(--serif);font-size:18px;font-weight:600;line-height:1.2;text-align:left;overflow-wrap:anywhere}
.rcard .meta{font-size:13px;color:var(--speckle);margin-top:2px;text-align:left}
.rcard .ctrl{display:flex;align-items:center;justify-content:space-between;margin-top:10px;gap:10px}
.rcard .ctrl label{font-size:14px;color:var(--speckle);display:flex;align-items:center;gap:8px}
.wstep{display:flex;align-items:center;gap:4px}
.wstep button{width:36px;height:36px;border-radius:10px;border:1.5px solid var(--line);color:var(--rim);font-weight:700;font-size:18px;background:var(--plate)}
.wstep output{min-width:34px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}

/* ---------- Rezept bearbeiten ---------- */
.nameinput{font-family:var(--serif);font-size:22px;font-weight:600}
.live{font-size:14px;color:var(--basil);font-weight:600;margin-top:6px}
.ingrow{border:1px solid var(--line);border-radius:14px;padding:10px;margin-top:8px;background:var(--plate)}
.ingrow .l1{display:grid;grid-template-columns:72px 96px 1fr 40px;gap:6px}
.ingrow .l2{display:grid;grid-template-columns:1fr 40px 40px;gap:6px;margin-top:6px}
.ingrow .in{min-height:42px;padding:8px 10px;font-size:16px}
.ingrow select.in{padding-right:24px;background-position:calc(100% - 14px) 50%,calc(100% - 9px) 50%}
.ingrow .x{width:40px;height:42px;border-radius:10px;border:1.5px solid var(--line);color:var(--speckle);font-size:15px}
.ingrow .newcat{margin-top:6px;font-size:13px;color:var(--mustard);display:flex;align-items:center;gap:8px}
.ingrow .newcat select{min-height:38px;font-size:16px;padding:6px 26px 6px 8px}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:8px;margin-top:8px}
.gallery button{aspect-ratio:1;border-radius:12px;overflow:hidden;position:relative;border:1.5px solid var(--line);background:var(--rim-soft)}
.gallery img{width:100%;height:100%;object-fit:cover;display:block}
.gallery .cover{position:absolute;left:4px;top:4px;background:var(--rim);color:var(--rim-ink);font-size:11px;font-weight:700;padding:2px 6px;border-radius:99px}
.gallery .add{display:flex;align-items:center;justify-content:center;font-size:30px;color:var(--rim);border-style:dashed}

/* ---------- Einkauf ---------- */
.shopsec{margin-top:18px}
.shopsec>h3{margin:0 0 8px;display:flex;align-items:baseline;gap:8px}
.shopsec>h3 small{font-weight:600;color:var(--speckle);font-size:13px}
.cat{font-size:13px;font-weight:700;color:var(--speckle);margin:12px 0 4px}
.item{display:flex;align-items:center;gap:12px;padding:9px 2px;min-height:48px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.item:last-child{border-bottom:none}
.item input{width:22px;height:22px;accent-color:var(--basil);flex-shrink:0}
.item .nm{flex:1;min-width:0}
.item .amt{color:var(--speckle);font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums}
.item.checked .nm,.item.checked .amt{text-decoration:line-through;color:var(--speckle)}
details.box summary{cursor:pointer;font-weight:700;min-height:28px;list-style:none;display:flex;align-items:center;justify-content:space-between}
details.box summary::-webkit-details-marker{display:none}
details.box summary:after{content:'+';font-size:20px;color:var(--rim)}
details.box[open] summary:after{content:'−'}
.warnbox{border-color:var(--tomato)}
.warnbox li{list-style:none;color:var(--tomato);font-size:14px;padding:3px 0}

/* ---------- Blätter (Dialoge) ---------- */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(10,16,28,.48);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--enamel);width:100%;max-width:640px;max-height:88dvh;overflow:auto;overscroll-behavior:contain;border-radius:22px 22px 0 0;
  padding:8px 18px calc(18px + env(safe-area-inset-bottom));animation:up .18s ease-out}
.grab{position:sticky;top:-8px;z-index:2;margin:-8px -18px 6px;padding:10px 0 12px;background:var(--enamel);cursor:grab;touch-action:none}
.grab i{display:block;width:44px;height:5px;border-radius:99px;background:var(--speckle);opacity:.55;margin:0 auto}
.sheet h2{font-size:22px}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;min-height:52px;padding:12px 14px;border-radius:14px;background:var(--plate);border:1px solid var(--line);margin-top:8px;font-weight:600}
.opt small{display:block;font-weight:400;color:var(--speckle);font-size:13px}
.opt.danger{color:var(--tomato)}
.opt .oic{flex-shrink:0;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--tc);background:color-mix(in srgb,var(--tc) 14%,transparent)}
.opt .oic svg{width:21px;height:21px}
.opt:active{transform:scale(.985);background:var(--rim-soft)}
.tone-rim{--tc:var(--rim)}.tone-basil{--tc:var(--basil)}.tone-tomato{--tc:var(--tomato)}.tone-speckle{--tc:var(--speckle)}.tone-mustard{--tc:var(--mustard)}
.opt.tone-basil .grow{color:var(--basil)}.opt.tone-tomato .grow{color:var(--tomato)}
.opt.tone-basil small,.opt.tone-tomato small{color:var(--speckle)}
.opt.danger{border-color:color-mix(in srgb,var(--tomato) 35%,var(--line))}
.optgap{height:10px}
.opthead{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin:4px 0 6px}
.opthead .sub{font-family:var(--serif);font-size:19px;color:var(--ink);width:100%}
.opthead .badge{margin:0}
.toast.act{pointer-events:auto;display:flex;align-items:center;gap:14px;padding:6px 6px 6px 18px;text-align:left}
.toast .undo{min-height:44px;padding:0 14px;border-radius:10px;font-weight:700;color:var(--enamel);background:color-mix(in srgb,var(--enamel) 16%,transparent)}
.pick{max-height:52dvh;overflow:auto;margin-top:10px}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(10px);z-index:60;
  background:var(--ink);color:var(--enamel);padding:12px 18px;border-radius:14px;font-size:15px;font-weight:600;max-width:88vw;text-align:center;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- Anmeldung ---------- */
.auth{max-width:440px;margin:0 auto;padding:40px 22px calc(40px + env(safe-area-inset-bottom))}
.auth .mark{width:92px;height:92px;border-radius:50%;border:10px solid var(--rim);background:var(--plate);box-shadow:inset 0 0 0 5px var(--plate),inset 0 0 0 6px var(--line);margin:0 auto 22px}
.auth h1{font-family:var(--serif);font-size:32px;font-weight:600;text-align:center;line-height:1.15}
.auth p.lead{text-align:center;color:var(--speckle);margin-top:8px}
.steps{padding-left:20px;margin-top:8px}
.steps li{margin-top:6px;font-size:15px}
.backlink{display:inline-flex;align-items:center;min-height:44px;color:var(--rim);font-weight:600;text-decoration:none}

/* ---------- Kochansicht ---------- */
.cookscreen{position:fixed;inset:0;z-index:40;background:var(--enamel);overflow:auto;padding:calc(10px + env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom))}
.cookscreen .inner{max-width:720px;margin:0 auto}
.cooktop{display:flex;justify-content:flex-end;margin-bottom:10px}
.cookscreen .hero{width:100%;max-height:40dvh;object-fit:cover;border-radius:22px;display:block;margin-bottom:-28px}
.ccard{background:var(--plate);border-radius:24px;padding:20px 20px 22px;margin-bottom:16px;box-shadow:0 2px 14px rgba(15,30,60,.07);position:relative}
.ccard h2{font-size:24px;font-weight:800;margin:0 0 14px}
.chead h1{font-family:var(--serif);font-size:clamp(28px,7.5vw,40px);line-height:1.12;font-weight:600;margin:0 0 14px}
.cmeta{display:flex;flex-wrap:wrap;gap:10px 22px;font-size:17px}
.cmeta span{display:inline-flex;align-items:center;gap:8px}
.cmeta svg{width:22px;height:22px;color:var(--rim);flex-shrink:0}
.ctags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.ctags span{background:var(--rim-soft);color:var(--rim);border-radius:99px;padding:3px 10px;font-size:14px;font-weight:600}
.cstep{display:grid;grid-template-columns:56px 1fr 56px;border:1.5px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:8px}
.cstep button{min-height:52px;font-size:26px;color:var(--ink);background:none}
.cstep button:active{background:var(--rim-soft)}
.cstep output{display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:700;border-left:1.5px solid var(--line);border-right:1.5px solid var(--line)}
.cing{list-style:none;padding:0;margin:0}
.cing li{display:grid;grid-template-columns:minmax(92px,32%) 1fr;gap:14px;padding:15px 0;border-bottom:1px solid var(--line);font-size:19px;line-height:1.35;cursor:pointer}
.cing li:last-child{border-bottom:0}
.cing .q{font-weight:800;font-variant-numeric:tabular-nums}
.cing .nm small{display:block;font-size:15px;color:var(--speckle)}
.cing li.done{color:var(--speckle)}
.cing li.done .nm{text-decoration:line-through}
.cintro{font-size:18px;margin-bottom:8px}
.cookscreen ol.steps-big{list-style:none;padding:0;margin:0}
.cookscreen ol.steps-big>li{padding:6px 0 20px;cursor:pointer}
.cookscreen ol.steps-big>li+li{border-top:1px solid var(--line);padding-top:18px}
.shead{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.spill{background:var(--rim-soft);color:var(--rim);font-weight:800;font-size:17px;padding:9px 16px;border-radius:99px}
.scheck{width:44px;height:44px;border-radius:50%;border:2px solid var(--speckle);display:flex;align-items:center;justify-content:center;color:var(--speckle)}
.scheck svg{width:24px;height:24px}
.sing{display:flex;gap:12px;align-items:flex-start;margin:0 0 12px;color:var(--speckle);font-size:17px}
.sing svg{width:28px;height:28px;flex-shrink:0;margin-top:1px}
.sing ul{margin:0;padding-left:0;list-style:none}
.sing li+li:before{content:'• '}
.stxt{font-size:21px;line-height:1.5}
.cookscreen ol.steps-big>li.done .stxt,.cookscreen ol.steps-big>li.done .sing{color:var(--speckle);text-decoration:line-through;text-decoration-thickness:1px}
.cookscreen ol.steps-big>li.done .scheck{background:var(--basil);border-color:var(--basil);color:var(--plate)}
.cnotes{font-size:18px;margin:0;white-space:pre-line}
.md p{margin-top:8px} .md ul{padding-left:20px;margin-top:6px}

/* ---------- Druck ---------- */
@media print{
  .top,.tabs,.noprint,.scrim,.toast{display:none!important}
  body{background:#fff;color:#000;padding:0}
  main{padding:0;max-width:none}
  .box{border:none;box-shadow:none;padding:0}
  .item{min-height:0;padding:3px 0;border:none}
  .item input{width:14px;height:14px}
  details.box>*{display:block}
}

details.ghalt summary{min-height:44px}
/* Rezept-Import */
.impbtn{margin-top:6px;width:100%;min-height:44px}
.impcard{transition:opacity .15s}
.impcard.off{opacity:.55}
.imphead{display:flex;align-items:center;gap:12px;min-height:44px}
.imphead input{width:24px;height:24px;flex-shrink:0;accent-color:var(--rim)}
.impcard .meta{margin-left:36px}
.impdetails{margin-top:8px}
.impdetails summary{min-height:44px;display:flex;align-items:center;font-weight:600;font-size:14px;color:var(--rim);cursor:pointer}
.impings{padding-left:0;margin:4px 0 8px}
.impings li{list-style:none;font-size:14px;padding:3px 0;overflow-wrap:anywhere}
.impings small{color:var(--speckle)}
.impsteps{padding-left:22px;font-size:14px;line-height:1.5}
.impsteps li{margin:4px 0;overflow-wrap:anywhere}
.impbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.impbtns .impbtn{margin-top:0}
.explist{margin:8px 0}
.exph{display:flex;align-items:center;justify-content:space-between;margin:14px 0 4px;font-size:15px}
.exph .btn{min-height:44px}
.dayrow{display:flex;align-items:stretch}
.dayrow>.daymain,.dayrow>.laneline{flex:1;min-width:0}
.cookbtn{width:52px;min-height:44px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--rim);border-left:1px solid var(--line)}
.cookbtn svg{width:26px;height:26px}
.cookbtn:active{background:var(--rim-soft)}
.lanerow{border-top:1px dashed var(--line)}
.lanerow>.laneline{border-top:0}
.lanerow>.cookbtn{border-left-style:dashed}
.lanerow>.cookbtn svg{width:22px;height:22px}
.cookscreen mark.ning{background:var(--rim-soft);color:var(--rim);font-weight:700;border-radius:5px;padding:0 3px}
.cookscreen li.done mark.ning{background:none;color:inherit}
.sing li.spice,.cextra li.spice{font-style:italic}
.cextra{background:var(--enamel);border-radius:16px;padding:12px 16px;margin:0 0 14px;font-size:17px}
.cextra b{display:block;margin-bottom:4px}
.cextra ul{margin:0;padding-left:20px}
.cextra.spices{margin:14px 0 0}
/* ---------- Kochansicht: aktueller Schritt, Timer ---------- */
.cookscreen ol.steps-big>li.cur{position:relative}
.cookscreen ol.steps-big>li.cur:before{content:'';position:absolute;left:-16px;top:12px;bottom:14px;width:4px;border-radius:0 4px 4px 0;background:var(--rim)}
.cookscreen ol.steps-big>li.cur .spill{background:var(--rim);color:var(--rim-ink)}
.tchips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.tchip{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:99px;background:var(--rim-soft);color:var(--rim);font-weight:700;font-size:16px}
.tchip svg{width:20px;height:20px}
li.done .tchips{display:none}
.timerbar{position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:55;display:flex;flex-direction:column;gap:6px;pointer-events:none;max-width:560px;margin:0 auto}
body.cooking .timerbar{bottom:calc(12px + env(safe-area-inset-bottom))}
body.cooking.has-timers .cookscreen{padding-bottom:calc(150px + env(safe-area-inset-bottom))}
.tmr{pointer-events:auto;display:flex;align-items:center;gap:4px;background:var(--ink);color:var(--enamel);border-radius:16px;padding:4px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.tmr button{min-width:44px;min-height:44px;border-radius:12px;color:inherit;font-weight:800;font-size:15px}
.tmr button:active{background:rgba(127,127,127,.25)}
.tmr .tlbl{flex:1;min-width:0;text-align:left;padding:2px 10px;display:flex;flex-direction:column}
.tmr time{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.tmr small{font-size:12px;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tmr.paused time{opacity:.55}
.tmr.ring{background:var(--tomato);color:#fff;animation:tpulse 1s ease-in-out infinite}
@keyframes tpulse{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--tomato) 35%,transparent)}}
@media (prefers-reduced-motion:reduce){.tmr.ring{animation:none}}
/* ---------- Heute ---------- */
.day.today{background:color-mix(in srgb,var(--rim) 7%,var(--plate))}
.day.today:before{width:5px}
.day.today .dt b{color:var(--rim)}

<script>
/* ==== Zentrales Konto der Anwendungssammlung (gleicher Code in allen Apps) ====
   Ein Konto = ein verschlüsselter „Schlüsselbund“ auf dem Pi (Collection trips).
   Aus Benutzername + Passwort wird per PBKDF2 ein Hauptschlüssel abgeleitet, daraus per HKDF
   die Datensatz-ID, der Zugangsnachweis (X-Trip-Auth) und der AES-GCM-Schlüssel.
   Der Server sieht nur verschlüsselte Daten und kennt weder Namen noch Passwort.
   Im Schlüsselbund liegen die Verbindungslinks (Reisen, Haushalt, Spielgruppe, Projekte)
   und – falls gewünscht – Passwörter der Brief-Profile.
   Angemeldet bleibt man bis zum Abmelden (localStorage „konto“, gilt für alle Apps derselben Adresse).
   Face ID: optional über einen Passkey mit PRF-Erweiterung (iOS 18+).
   Passwort vergessen: optional Sicherheitsfrage. Aus Benutzername + Antwort wird (PBKDF2) ein zweiter
   Schlüssel abgeleitet, der einen Datensatz mit dem Hauptschlüssel öffnet. Die Frage selbst liegt
   in einem Datensatz, der nur mit dem Benutzernamen lesbar ist.
   Einladungen: Jedes Konto veröffentlicht ein Profil (öffentliche Schlüssel ECDH + ECDSA) und hat ein Postfach,
   beide auffindbar über den Benutzernamen. Eine Einladung (Verbindungslink einer Reise/eines Haushalts …) wird für
   den Empfänger verschlüsselt, vom Absender signiert, ins Postfach gelegt und läuft nach einigen Tagen ab. */
const Konto = (() => {
  const DEFAULT = 'https://kostenpi.tail281e3e.ts.net';
  const ITER = 310000;

    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
    del(k) { try { localStorage.removeItem(k); } catch (e) {} },

  const server = () => { try { return localStorage.getItem('konto-server') || DEFAULT; } catch (e) { return DEFAULT; } };

  /* ---------- Schlüssel ---------- */
  async function masterFrom(user, pw) {

      const enc = await crypto.subtle.deriveKey({ name: 'HKDF', hash: 'SHA-256', salt: s, info: te('enc') }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);

  const vaultKeys = master => keys(master, 'konto-v1');
  const pkKeys = secret => keys(secret, 'konto-passkey-v1');
  const normAnswer = a => String(a || '').toLowerCase().replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').replace(/ß/g, 'ss')

  async function recoverySecret(user, answer) {
    const base = await crypto.subtle.importKey('raw', te(normAnswer(answer)), 'PBKDF2', false, ['deriveBits']);
    const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: te('anwendungssammlung-recovery-v1|' + normUser(user)), iterations: ITER }, base, 256);

  const recKeys = secret => keys(secret, 'konto-recovery-v1');

  /* Datensatz mit fester ID anlegen oder überschreiben */
  async function upsert(k, obj) {
    const data = await encrypt(k.enc, obj);
    const r = await api('POST', '', null, { id: k.id, auth: k.auth, data, rev: 1 });
    if (r.status === 200) return;
    if (r.status !== 400) throw fail(r);
    const u = await api('PATCH', '/' + k.id, k.auth, { data });
    if (u.status !== 200) throw fail(u);
  }
  async function encrypt(key, obj) {
    const iv = crypto.getRandomValues(new Uint8Array(12));

  async function decrypt(key, str) {
    const p = String(str || '').split('.');

    return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64d(p[1]) }, key, b64d(p[2]))));
  }

  /* ---------- Server ---------- */
  async function api(method, path, auth, body) {
    const h = {}; if (auth) h['X-Trip-Auth'] = auth; if (body) h['Content-Type'] = 'application/json';
    const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 15000);
    try {
      const r = await fetch(server() + '/api/collections/trips/records' + path, { method, headers: h, body: body ? JSON.stringify(body) : undefined, cache: 'no-store', signal: ctl.signal });
      let j = null; try { j = await r.json(); } catch (e) {}
      return { status: r.status, json: j };

    } finally { clearTimeout(to); }

  /* ---------- Schlüsselbund zusammenführen ---------- */
  function emptyVault(user) { return { v: 1, user, items: {}, deleted: {}, passkeys: {}, recovery: null, keys: null, sent: {} }; }
  function clean(v, user) {

      deleted: v.deleted && typeof v.deleted === 'object' ? v.deleted : {}, passkeys: v.passkeys && typeof v.passkeys === 'object' ? v.passkeys : {},
      recovery: v.recovery && typeof v.recovery === 'object' ? v.recovery : null,
      keys: v.keys && typeof v.keys === 'object' ? v.keys : null, sent: v.sent && typeof v.sent === 'object' ? v.sent : {} };

  function merge(a, b) {

    if (out.recovery && out.deleted.recovery && out.deleted.recovery >= out.recovery.createdAt) out.recovery = null;
    out.keys = [a.keys, b.keys].filter(Boolean).sort((x, y) => (x.createdAt || '').localeCompare(y.createdAt || '') || (x.encPub > y.encPub ? 1 : -1))[0] || null;   // älteste gewinnt
    for (const src of [a.sent, b.sent]) for (const k in src) if (!out.deleted['sent:' + k]) out.sent[k] = src[k];

  /* ---------- Sitzung ---------- */
  const session = () => { const s = ls.get('konto'); return s && s.master && s.user ? s : null; };

  const listeners = new Set();
  const emit = () => listeners.forEach(fn => { try { fn(); } catch (e) {} });

  async function fetchVault(master) {
    const k = await vaultKeys(master);
    const r = await api('GET', '/' + k.id, k.auth);
    if (r.status === 404) return null;
    if (r.status !== 200 || !r.json) throw fail(r);
    return { vault: clean(await decrypt(k.enc, r.json.data)), rev: +r.json.rev || 0 };
  }
  async function createVault(master, vault) {
    const k = await vaultKeys(master);
    const r = await api('POST', '', null, { id: k.id, auth: k.auth, data: await encrypt(k.enc, vault), rev: 1 });
    if (r.status !== 200) throw fail(r);
  }

  let busy = null, again = false;
  /* Abgleich: holen, zusammenführen, bei Bedarf zurückschreiben */
  async function sync() {
    const s = session(); if (!s) return null;
    if (busy) { again = true; return busy; }
    busy = (async () => {
      try {
        const k = await vaultKeys(s.master);
        for (let round = 0; round < 4; round++) {
          const r = await api('GET', '/' + k.id, k.auth);
          if (r.status === 404) { const e = new Error('Konto nicht mehr vorhanden'); e.gone = true; throw e; }
          if (r.status !== 200 || !r.json) throw fail(r);
          const remote = clean(await decrypt(k.enc, r.json.data), s.user);
          const local = ls.get('konto-cache') ? cache() : remote;
          const merged = merge(local, remote);
          ls.set('konto-cache', merged);
          if (canon(merged) === canon(remote)) { ls.set('konto-state', { at: nowIso(), err: '' }); break; }
          const u = await api('PATCH', '/' + k.id, k.auth, { data: await encrypt(k.enc, merged), rev: (+r.json.rev || 0) + 1 });
          if (u.status === 200) { ls.set('konto-state', { at: nowIso(), err: '' }); break; }
          if (u.status !== 400 && u.status !== 409) throw fail(u);
        }
        emit();
        return cache();
      } catch (e) {
        ls.set('konto-state', { at: (ls.get('konto-state') || {}).at || null, err: e.message || 'Fehler' });
        if (e.gone) { logout(); emit(); }
        throw e;
      } finally {
        busy = null;
        if (again) { again = false; setTimeout(() => sync().catch(() => {}), 50); }
      }
    })();
    return busy;
  }

  async function login(user, pw) {
    user = String(user || '').trim();
    if (!user || !pw) throw new Error('Bitte Benutzername und Passwort eingeben.');
    const master = await masterFrom(user, pw);
    const f = await fetchVault(master);
    if (!f) return { notFound: true };
    ls.set('konto', { user: f.vault.user || user, master, at: nowIso() });
    ls.set('konto-cache', f.vault);
    emit();
    ensureProfile().catch(() => {});
    return { ok: true };
  }
  async function register(user, pw) {
    user = String(user || '').trim();
    if (user.length < 2) throw new Error('Der Benutzername braucht mindestens 2 Zeichen.');
    if (String(pw || '').length < 8) throw new Error('Das Passwort braucht mindestens 8 Zeichen.');
    const master = await masterFrom(user, pw);
    const f = await fetchVault(master);
    if (f) { ls.set('konto', { user: f.vault.user || user, master, at: nowIso() }); ls.set('konto-cache', f.vault); emit(); return { existed: true }; }
    await createVault(master, emptyVault(user));
    ls.set('konto', { user, master, at: nowIso() });
    ls.set('konto-cache', emptyVault(user));
    emit();
    await ensureProfile().catch(() => {});
    return { ok: true };
  }
  function logout() { ['konto', 'konto-cache', 'konto-state', 'konto-inbox'].forEach(ls.del); keyCache.clear(); emit(); }
  let recovered = false;   // gerade über die Sicherheitsfrage angemeldet → neues Passwort ohne altes erlaubt
  async function changePassword(oldPw, newPw) {
    const s = session(); if (!s) throw new Error('Nicht angemeldet.');
    if (String(newPw || '').length < 8) throw new Error('Das neue Passwort braucht mindestens 8 Zeichen.');
    if (!(recovered && oldPw == null) && (await masterFrom(s.user, oldPw)) !== s.master) throw new Error('Das bisherige Passwort stimmt nicht.');
    const v = await sync();
    const nm = await masterFrom(s.user, newPw);
    await createVault(nm, v);
    for (const cid in v.passkeys) {   // Face-ID-Zugänge auf den neuen Schlüssel umstellen
      const p = v.passkeys[cid], pk = await pkKeys(p.secret);
      await api('PATCH', '/' + pk.id, pk.auth, { data: await encrypt(pk.enc, { user: s.user, master: nm }), rev: 2 });
    }
    if (v.recovery && v.recovery.secret) await upsert(await recKeys(v.recovery.secret), { user: s.user, master: nm });
    const ok = await vaultKeys(s.master);
    await api('DELETE', '/' + ok.id, ok.auth);
    ls.set('konto', { user: s.user, master: nm, at: nowIso() });
    recovered = false;
    emit();
  }

  /* ---------- Sicherheitsfrage ---------- */
  async function setRecovery(question, answer) {
    const s = session(); if (!s) throw new Error('Nicht angemeldet.');

    if (question.length < 5) throw new Error('Bitte eine Frage eingeben.');
    if (normAnswer(answer).length < 3) throw new Error('Die Antwort braucht mindestens 3 Zeichen.');
    const v = await sync();
    const secret = await recoverySecret(s.user, answer);
    await upsert(await recKeys(secret), { user: s.user, master: s.master });
    await upsert(await questionKeys(s.user), { question });
    if (v.recovery && v.recovery.secret && v.recovery.secret !== secret) {   // alte Antwort ungültig machen
      const old = await recKeys(v.recovery.secret); await api('DELETE', '/' + old.id, old.auth);
    }
    const c = cache(); c.recovery = { secret, question, createdAt: nowIso() }; delete c.deleted.recovery;
    ls.set('konto-cache', c); await sync();
    return true;
  }
  async function removeRecovery() {
    const s = session(); if (!s) return;
    const v = await sync();
    if (v.recovery && v.recovery.secret) { const k = await recKeys(v.recovery.secret); await api('DELETE', '/' + k.id, k.auth); }
    const q = await questionKeys(s.user); await api('DELETE', '/' + q.id, q.auth);
    const c = cache(); c.recovery = null; c.deleted.recovery = nowIso(); ls.set('konto-cache', c); await sync();
  }
  async function getQuestion(user) {
    const q = await questionKeys(String(user || '').trim());
    const r = await api('GET', '/' + q.id, q.auth);
    if (r.status === 404) return null;
    if (r.status !== 200 || !r.json) throw fail(r);
    return (await decrypt(q.enc, r.json.data)).question || null;
  }
  /* mit richtiger Antwort anmelden; danach muss ein neues Passwort gesetzt werden */
  async function recover(user, answer) {
    user = String(user || '').trim();
    const k = await recKeys(await recoverySecret(user, answer));
    const r = await api('GET', '/' + k.id, k.auth);
    if (r.status === 404) return { wrong: true };
    if (r.status !== 200 || !r.json) throw fail(r);
    const d = await decrypt(k.enc, r.json.data);
    const f = await fetchVault(d.master);
    if (!f) return { wrong: true };
    ls.set('konto', { user: d.user || user, master: d.master, at: nowIso() });
    ls.set('konto-cache', f.vault);
    recovered = true;
    emit();
    return { ok: true };
  }

  /* ---------- Einträge ---------- */
  function items(app) {
    const v = cache();
    return Object.keys(v.items).filter(k => !app || v.items[k].app === app).map(k => Object.assign({ key: k }, v.items[k]));
  }
  function put(key, item) {
    if (!session()) return false;
    const v = cache();
    const old = v.items[key];
    const nx = Object.assign({}, item, { updatedAt: nowIso() });
    if (old) { const a = Object.assign({}, old), b = Object.assign({}, nx); delete a.updatedAt; delete b.updatedAt; if (canon(a) === canon(b)) return false; }
    v.items[key] = nx; delete v.deleted[key];
    ls.set('konto-cache', v);
    sync().catch(() => {});
    return true;
  }
  function remove(key) {
    if (!session()) return false;
    const v = cache();
    if (!v.items[key]) return false;
    delete v.items[key]; v.deleted[key] = nowIso();
    ls.set('konto-cache', v);
    sync().catch(() => {});
    return true;
  }

  /* ---------- Face ID (Passkey mit PRF) ---------- */
  const PRF_SALT = te('anwendungssammlung-konto-prf-v1');
  const rpId = () => location.hostname;
  async function passkeySupported() {
    try {
      if (!window.PublicKeyCredential || !navigator.credentials || location.protocol !== 'https:') return false;
      if (PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable && !(await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable())) return false;
      if (PublicKeyCredential.getClientCapabilities) { const c = await PublicKeyCredential.getClientCapabilities(); if (c && c['extension:prf'] === false) return false; }

  async function enablePasskey() {
    const s = session(); if (!s) throw new Error('Nicht angemeldet.');
    const cred = await navigator.credentials.create({ publicKey: {
      rp: { name: 'Anwendungssammlung', id: rpId() },
      user: { id: crypto.getRandomValues(new Uint8Array(16)), name: s.user, displayName: s.user },

      const a = await navigator.credentials.get({ publicKey: { challenge: crypto.getRandomValues(new Uint8Array(32)), rpId: rpId(), userVerification: 'required',
        allowCredentials: [{ type: 'public-key', id: cred.rawId }], extensions: { prf: { eval: { first: PRF_SALT } } } } });
      out = prfOut(a);

    const secret = b64e(out), pk = await pkKeys(secret);
    const r = await api('POST', '', null, { id: pk.id, auth: pk.auth, data: await encrypt(pk.enc, { user: s.user, master: s.master }), rev: 1 });
    if (r.status !== 200 && r.status !== 400) throw fail(r);
    const v = cache(); const cid = b64e(new Uint8Array(cred.rawId));

    ls.set('konto-cache', v); await sync();
    ls.set('konto-passkey', true);
    return true;
  }
  async function loginWithPasskey() {
    const a = await navigator.credentials.get({ publicKey: { challenge: crypto.getRandomValues(new Uint8Array(32)), rpId: rpId(), userVerification: 'required',
      extensions: { prf: { eval: { first: PRF_SALT } } } }, mediation: 'optional' });
    const out = prfOut(a);
    if (!out) throw new Error('Face ID hat keinen Schlüssel geliefert. Bitte mit Passwort anmelden.');
    const pk = await pkKeys(b64e(out));
    const r = await api('GET', '/' + pk.id, pk.auth);
    if (r.status === 404) throw new Error('Für diesen Passkey ist kein Konto hinterlegt. Bitte mit Passwort anmelden und Face ID neu einrichten.');
    if (r.status !== 200 || !r.json) throw fail(r);
    const d = await decrypt(pk.enc, r.json.data);
    const f = await fetchVault(d.master);
    if (!f) throw new Error('Konto nicht gefunden.');
    ls.set('konto', { user: d.user, master: d.master, at: nowIso() });
    ls.set('konto-cache', f.vault);
    emit();
    return { ok: true };
  }

  /* ---------- Profil, Postfach, Einladungen ---------- */
  const INVITE_DAYS = 7;
  async function nameKeys(user, salt) {
    const h = new Uint8Array(await crypto.subtle.digest('SHA-256', te(salt + '|' + normUser(user))));
    return keys(b64e(h), salt);
  }
  const profileKeys = user => nameKeys(user, 'konto-profil-v1');
  const inboxKeys = user => nameKeys(user, 'konto-postfach-v1');
  const ECDH = { name: 'ECDH', namedCurve: 'P-256' }, ECDSA = { name: 'ECDSA', namedCurve: 'P-256' };
  async function readRec(k) {
    const r = await api('GET', '/' + k.id, k.auth);
    if (r.status === 404) return null;
    if (r.status !== 200 || !r.json) throw fail(r);
    return { data: await decrypt(k.enc, r.json.data), rev: +r.json.rev || 0 };
  }
  /* Schlüsselpaare anlegen (einmal pro Konto) und Profil + Postfach veröffentlichen */
  async function ensureProfile() {
    const s = session(); if (!s) return null;
    let v = cache();
    if (!v.keys) {
      const e = await crypto.subtle.generateKey(ECDH, true, ['deriveBits']);
      const g = await crypto.subtle.generateKey(ECDSA, true, ['sign', 'verify']);
      v.keys = { createdAt: nowIso(), encPub: await crypto.subtle.exportKey('jwk', e.publicKey), encPriv: await crypto.subtle.exportKey('jwk', e.privateKey),
        sigPub: await crypto.subtle.exportKey('jwk', g.publicKey), sigPriv: await crypto.subtle.exportKey('jwk', g.privateKey) };
      ls.set('konto-cache', v);
      v = await sync();
    }
    const pk = await profileKeys(s.user), cur = await readRec(pk);
    const prof = { user: s.user, encPub: v.keys.encPub, sigPub: v.keys.sigPub };
    if (!cur || canon(cur.data) !== canon(prof)) await upsert(pk, prof);
    const ik = await inboxKeys(s.user);
    if (!(await readRec(ik))) await upsert(ik, { entries: {} });
    return prof;
  }
  /* Gibt es ein Konto mit genau diesem Namen? → Profil (mit richtiger Schreibweise) oder null */
  async function findUser(name) { const p = await readRec(await profileKeys(String(name || '').trim())); return p ? p.data : null; }
  async function sealFor(prof, payload) {
    const eph = await crypto.subtle.generateKey(ECDH, true, ['deriveBits']);
    const pub = await crypto.subtle.importKey('jwk', prof.encPub, ECDH, false, []);
    const bits = await crypto.subtle.deriveBits({ name: 'ECDH', public: pub }, eph.privateKey, 256);
    const key = (await keys(b64e(new Uint8Array(bits)), 'konto-einladung-v1')).enc;
    return { epk: await crypto.subtle.exportKey('jwk', eph.publicKey), box: await encrypt(key, payload) };
  }
  async function openSealed(sealed, encPriv) {
    const priv = await crypto.subtle.importKey('jwk', encPriv, ECDH, false, ['deriveBits']);
    const pub = await crypto.subtle.importKey('jwk', sealed.epk, ECDH, false, []);
    const bits = await crypto.subtle.deriveBits({ name: 'ECDH', public: pub }, priv, 256);

    const k = await crypto.subtle.importKey('jwk', sigPriv, ECDSA, false, ['sign']);
    return b64e(new Uint8Array(await crypto.subtle.sign({ name: 'ECDSA', hash: 'SHA-256' }, k, te(canon(body)))));

    try { const k = await crypto.subtle.importKey('jwk', sigPub, ECDSA, false, ['verify']); return await crypto.subtle.verify({ name: 'ECDSA', hash: 'SHA-256' }, k, b64d(sig), te(canon(body))); }
    catch (e) { return false; }
  }
  async function editInbox(user, fn) {
    const ik = await inboxKeys(user);
    for (let i = 0; i < 3; i++) {
      const cur = await readRec(ik);
      if (!cur) throw new Error('Postfach nicht gefunden');
      const entries = Object.assign({}, cur.data.entries || {});
      const now = nowIso();
      for (const k in entries) if ((entries[k].expiresAt || '') < now) delete entries[k];   // Abgelaufenes aufräumen
      if (fn(entries) === false) return;
      const u = await api('PATCH', '/' + ik.id, ik.auth, { data: await encrypt(ik.enc, { entries }), rev: cur.rev + 1 });
      if (u.status === 200) return;

  /* Einladung senden: item = {app, id, secret, label} (wie im Schlüsselbund) */
  async function invite(toName, key, item, days) {

    if (normUser(prof.user) === normUser(s.user)) throw new Error('Du kannst dich nicht selbst einladen.');

  }
  async function withdraw(iid) {
    const v = cache(), x = v.sent[iid]; if (!x) return false;
    try { await editInbox(x.to, e => { if (!e[iid]) return false; delete e[iid]; }); } catch (e) { if (!/Postfach nicht gefunden/.test(e.message)) throw e; }
    delete v.sent[iid]; v.deleted['sent:' + iid] = nowIso(); ls.set('konto-cache', v); sync().catch(() => {});
    return true;
  }
  /* gesendete Einladungen mit Stand: offen | abgelaufen | erledigt (angenommen/abgelehnt) */
  async function sentList(app) {
    const v = cache(), now = nowIso(), out = [];
    const byUser = {};
    for (const iid in v.sent) { const x = v.sent[iid]; if (app && x.app !== app) continue; (byUser[x.to] = byUser[x.to] || []).push(Object.assign({ iid }, x)); }
    for (const u in byUser) {
      let entries = null;
      try { const r = await readRec(await inboxKeys(u)); entries = r ? r.data.entries || {} : {}; } catch (e) { entries = null; }
      byUser[u].forEach(x => out.push(Object.assign(x, { status: x.expiresAt < now ? 'abgelaufen' : entries === null ? 'unbekannt' : entries[x.iid] ? 'offen' : 'erledigt' })));
    }
    return out.sort((a, b) => b.createdAt.localeCompare(a.createdAt));
  }
  function forget(iid) { const v = cache(); if (!v.sent[iid]) return; delete v.sent[iid]; v.deleted['sent:' + iid] = nowIso(); ls.set('konto-cache', v); sync().catch(() => {}); }
  /* eigene Einladungen lesen (geprüft: Signatur des Absenders, nicht abgelaufen) */
  async function inbox() {
    const s = session(); if (!s) return [];
    await ensureProfile();
    const r = await readRec(await inboxKeys(s.user)); if (!r) return [];
    const now = nowIso(), keysV = cache().keys, out = [];
    for (const iid in r.data.entries || {}) {
      const e = r.data.entries[iid]; if ((e.expiresAt || '') < now) continue;
      try {
        const { body, sig } = await openSealed(e.sealed, keysV.encPriv);
        if (body.iid !== iid || normUser(body.to) !== normUser(s.user) || body.expiresAt < now) continue;
        const sender = await findUser(body.from);
        if (!sender || !(await verifyBody(body, sig, sender.sigPub))) continue;
        out.push(Object.assign({}, body, { from: sender.user }));
      } catch (err) { /* nicht für uns / beschädigt */ }
    }
    ls.set('konto-inbox', out.map(x => ({ iid: x.iid, from: x.from, app: x.item.app, label: x.item.label, expiresAt: x.expiresAt })));
    emit();
    return out.sort((a, b) => b.createdAt.localeCompare(a.createdAt));
  }
  async function accept(inv) {
    put(inv.key, Object.assign({}, inv.item, { invitedBy: inv.from }));
    await editInbox(user(), e => { if (!e[inv.iid]) return false; delete e[inv.iid]; });
    await sync().catch(() => {});
    inbox().catch(() => {});
  }
  async function decline(inv) { await editInbox(user(), e => { if (!e[inv.iid]) return false; delete e[inv.iid]; }); inbox().catch(() => {}); }
  const user = () => (session() || {}).user || '';

  return {
    session, user, loggedIn: () => !!session(), state: () => ls.get('konto-state') || {},
    login, register, logout, changePassword, sync, items, put, remove, onChange: fn => listeners.add(fn),
    passkeySupported, enablePasskey, loginWithPasskey, hasPasskey: () => Object.keys(cache().passkeys).length > 0,
    setRecovery, removeRecovery, getQuestion, recover,
    ensureProfile, findUser, invite, withdraw, sentList, forget, inbox, accept, decline, inviteDays: INVITE_DAYS,
    inboxCount: () => (ls.get('konto-inbox') || []).filter(x => x.expiresAt >= nowIso()).length, hasRecovery: () => !!cache().recovery, recoveryQuestion: () => (cache().recovery || {}).question || '',
    _merge: merge,
    _forge: async (prof, body, sig) => { const sealed = await sealFor(prof, { body, sig }); await editInbox(prof.user, e => { e[body.iid] = { sealed, expiresAt: body.expiresAt }; }); },
  };
})();

<script>
/* ==== Mitteilungen der Anwendungssammlung (gleicher Code in allen Apps) ====
   Web-Push über den Push-Dienst auf dem Pi (…/push). Funktioniert auf dem iPhone nur in einer App
   vom Home-Bildschirm (ab iOS 16.4). Kanäle werden aus den Geheimnissen der Apps abgeleitet, Texte
   sind mit einem Kanalschlüssel verschlüsselt – der Pi sieht weder Namen noch Inhalte. Der Service
   Worker (sw.js) entschlüsselt sie mit den Schlüsseln aus IndexedDB „push-keys“ und zeigt sie an.
   Welche Arten ein Gerät bekommt, steht in localStorage „push-prefs“ und wird beim Pi hinterlegt. */
const Push = (() => {
  const DEFAULT = 'https://kostenpi.tail281e3e.ts.net/push';
  const KINDS = [
    { key: 'timer', label: 'Kochtimer', sub: 'Wenn ein Timer der Kochansicht abläuft', def: true },
    { key: 'remind', label: 'Kocherinnerung', sub: 'Am Kochtag: „Heute: Spaghetti Bolognese“', def: false },
    { key: 'einkauf', label: 'Einkaufsliste', sub: 'Jemand im Haushalt ergänzt die Einkaufsliste', def: true },
    { key: 'plan', label: 'Wochenplan', sub: 'Jemand im Haushalt übernimmt einen neuen Wochenplan', def: false },
    { key: 'invite', label: 'Einladungen', sub: 'Jemand lädt dich per Benutzername ein', def: true },
    { key: 'kosten', label: 'Neue Ausgaben', sub: 'Jemand trägt in einer geteilten Reise etwas ein', def: true },
    { key: 'spiele', label: 'Spiele', sub: 'Neue Partie im Verlauf der Spielgruppe', def: false },
    { key: 'cocktails', label: 'Cocktails', sub: 'Änderungen an geteilten Cocktail-Projekten', def: false },
  ];
  const APP_KINDS = { essen: ['einkauf', 'plan'], kosten: ['kosten'], spiele: ['spiele'], cocktails: ['cocktails'] };
  const te = t => new TextEncoder().encode(t);
  const b64e = u8 => { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); };
  const b64d = str => { str = String(str).replace(/-/g, '+').replace(/_/g, '/'); while (str.length % 4) str += '='; const b = atob(str), u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; };
  const ls = {
    get(k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
    del(k) { try { localStorage.removeItem(k); } catch (e) {} },
  };
  const server = () => { try { return localStorage.getItem('push-server') || DEFAULT; } catch (e) { return DEFAULT; } };
  const rnd = n => b64e(crypto.getRandomValues(new Uint8Array(n)));
  function device() {
    let d = ls.get('push-device');
    if (!d || !d.id) { d = { id: rnd(18), secret: rnd(24), ch: rnd(32) }; ls.set('push-device', d); }
    return d;
  }
  function prefs() {
    const p = Object.assign({ remindTime: '16:30' }, ls.get('push-prefs') || {});
    KINDS.forEach(k => { if (typeof p[k.key] !== 'boolean') p[k.key] = k.def; });
    return p;
  }
  const listeners = new Set(); const emit = () => listeners.forEach(f => { try { f(); } catch (e) {} });

  /* ---------- Kanäle ---------- */
  const chanCache = new Map();
  function chan(secret, label) {
    const ck = label + '|' + secret;
    if (!chanCache.has(ck)) chanCache.set(ck, (async () => {
      const base = await crypto.subtle.importKey('raw', te(secret), 'HKDF', false, ['deriveBits']);
      const bits = n => crypto.subtle.deriveBits({ name: 'HKDF', hash: 'SHA-256', salt: te('push-v1'), info: te(label + '|' + n) }, base, 256);
      return { id: b64e(new Uint8Array(await bits('id')).subarray(0, 24)), key: b64e(new Uint8Array(await bits('key'))) };
    })());
    return chanCache.get(ck);
  }
  const normUser = u => String(u || '').trim().toLowerCase();
  const itemChan = it => chan(it.secret, it.app + ':' + it.id);
  const userChan = name => chan('konto-postfach|' + normUser(name), 'inbox');
  const devChan = () => chan(device().ch, 'device');
  async function encrypt(keyB64, obj) {
    const key = await crypto.subtle.importKey('raw', b64d(keyB64), 'AES-GCM', false, ['encrypt']);
    const iv = crypto.getRandomValues(new Uint8Array(12));
    return 'v1.' + b64e(iv) + '.' + b64e(new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, te(JSON.stringify(obj)))));
  }
  /* Kanalschlüssel für den Service Worker ablegen */
  function idb() {
    return new Promise((res, rej) => { const r = indexedDB.open('push-keys', 1); r.onupgradeneeded = () => r.result.createObjectStore('k'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  }
  async function storeKeys(map) {
    const db = await idb();
    await new Promise((res, rej) => { const tx = db.transaction('k', 'readwrite'), st = tx.objectStore('k'); st.clear(); Object.entries(map).forEach(([k, v]) => st.put(v, k)); tx.oncomplete = res; tx.onerror = () => rej(tx.error); });
    db.close();
  }
  async function channels() {
    const p = prefs(), out = {}, keys = {};
    const add = (c, kinds) => { if (!kinds.length) return; out[c.id] = (out[c.id] || []).concat(kinds); keys[c.id] = c.key; };
    add(await devChan(), ['test'].concat(['timer', 'remind'].filter(k => p[k])));   // „test“ immer, damit die Testmitteilung ankommt
    const K = typeof Konto !== 'undefined' && Konto.loggedIn() ? Konto : null;
    if (K) {
      if (p.invite) add(await userChan(K.user()), ['invite']);
      for (const it of K.items()) { const kinds = (APP_KINDS[it.app] || []).filter(k => p[k]); if (kinds.length && it.secret) add(await itemChan(it), kinds); }
    }
    return { out, keys };
  }

  /* ---------- Server ---------- */
  async function api(path, body) {
    const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 15000);
    try {
      const r = await fetch(server() + path, { method: body ? 'POST' : 'GET', headers: body ? { 'Content-Type': 'application/json' } : {}, body: body ? JSON.stringify(body) : undefined, cache: 'no-store', signal: ctl.signal });
      let j = null; try { j = await r.json(); } catch (e) {}
      if (!r.ok) { const e = new Error((j && j.error) || ('Push-Dienst antwortet mit ' + r.status)); e.status = r.status; throw e; }
      return j;
    } catch (e) { if (e.status) throw e; const err = new Error('Push-Dienst nicht erreichbar'); err.offline = true; throw err; }

  }

  const standalone = () => { try { return window.navigator.standalone === true || matchMedia('(display-mode: standalone)').matches; } catch (e) { return false; } };

  function status() {
    if (!supported()) return { state: standalone() ? 'unsupported' : 'notInstalled', text: standalone() ? 'Dieses Gerät unterstützt keine Mitteilungen für Web-Apps (iOS 16.4 oder neuer nötig).' : 'Mitteilungen gehen nur in der App vom Home-Bildschirm (Teilen → „Zum Home-Bildschirm“).' };
    if (Notification.permission === 'denied') return { state: 'denied', text: 'Mitteilungen sind abgelehnt. Erlauben unter iPhone-Einstellungen → Mitteilungen → diese App.' };
    const s = ls.get('push-state') || {};
    if (Notification.permission === 'granted' && s.on) return { state: 'on', text: s.err ? 'Aktiv – letzter Abgleich fehlgeschlagen: ' + s.err : 'Aktiv auf diesem Gerät' };

  }
  async function swReg() {
    const reg = (await navigator.serviceWorker.getRegistration()) || (await navigator.serviceWorker.register('sw.js'));

  }

  async function enable() {
    if (!supported()) throw new Error(status().text);
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') throw new Error('Ohne Erlaubnis keine Mitteilungen.');

    const reg = await swReg();
    let sub = await reg.pushManager.getSubscription();
    if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64d(publicKey) });

  }
  async function disable() {
    try { const reg = await navigator.serviceWorker.getRegistration(); const sub = reg && await reg.pushManager.getSubscription(); if (sub) await sub.unsubscribe(); } catch (e) {}

  }
  let syncing = null;
  /* Kanäle und Arten beim Pi aktualisieren (nur wenn sich etwas geändert hat) */
  async function sync(force) {
    const st = ls.get('push-state') || {};
    if (!st.on || !supported() || Notification.permission !== 'granted') return false;
    if (syncing) return syncing;
    syncing = (async () => {
      try {
        const reg = await swReg();
        const sub = await reg.pushManager.getSubscription();
        if (!sub) { ls.set('push-state', { on: false }); emit(); return false; }
        const { out, keys } = await channels();
        await storeKeys(keys);
        const sj = sub.toJSON(), sig = JSON.stringify([sj.endpoint, out]);

        return true;
      } catch (e) { ls.set('push-state', { on: true, err: e.message }); throw e; }
      finally { syncing = null; emit(); }
    })();
    return syncing;
  }
  function setPrefs(p) { ls.set('push-prefs', Object.assign(prefs(), p)); emit(); return sync().catch(() => {}); }

  /* ---------- Senden ---------- */
  /* an alle Geräte eines geteilten Dings (außer diesem): item = {app, id, secret} */
  async function notify(item, kind, title, body, url) {
    if (!item || !item.secret || !item.id) return false;
    try {
      const c = await itemChan(item);
      await api('/send', { channels: [c.id], kind, boxes: { '*': await encrypt(c.key, { title, body, url: url || null, tag: kind + ':' + item.id }) }, exclude: device().id });
      return true;
    } catch (e) { return false; }
  }
  async function notifyUser(name, kind, title, body, url) {
    try { const c = await userChan(name); await api('/send', { channels: [c.id], kind, boxes: { '*': await encrypt(c.key, { title, body, url: url || null }) } }); return true; }
    catch (e) { return false; }
  }
  /* an dieses Gerät zu einem Zeitpunkt (Kochtimer, Kocherinnerung); gleicher tag ersetzt */
  async function schedule(tag, at, kind, title, body, url) {
    if (!(ls.get('push-state') || {}).on) return false;
    try {
      const c = await devChan();
      await api('/send', { channels: [c.id], kind, tag, at: new Date(at).toISOString(), ttl: 3600, boxes: { '*': await encrypt(c.key, { title, body, url: url || null, tag }) } });
      return true;
    } catch (e) { return false; }
  }
  async function cancel(tag) {
    if (!(ls.get('push-state') || {}).on) return false;
    try { const c = await devChan(); await api('/cancel', { channels: [c.id], tag }); return true; } catch (e) { return false; }
  }
  async function test() {
    const c = await devChan();
    await api('/send', { channels: [c.id], kind: 'test', boxes: { '*': await encrypt(c.key, { title: 'Testmitteilung', body: 'Mitteilungen funktionieren 👍', url: 'index.html#mitteilungen' }) } });
  }

  /* Einladungen automatisch ankündigen */
  if (typeof Konto !== 'undefined' && Konto.invite && !Konto.invite._push) {
    const orig = Konto.invite;
    Konto.invite = async function (name, key, item, days) {
      const r = await orig.apply(this, arguments);
      notifyUser(r.to, 'invite', 'Neue Einladung', `${Konto.user()} lädt dich zu „${(item && item.label) || 'etwas'}“ ein`, 'index.html#konto');
      return r;
    };
    Konto.invite._push = true;
  }
  if (typeof Konto !== 'undefined' && Konto.onChange) Konto.onChange(() => { sync().catch(() => {}); });
  if (typeof document !== 'undefined') document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { emit(); sync().catch(() => {}); } });

  if (typeof window !== 'undefined') {
    window.addEventListener('pageshow', e => { if (e.persisted) emit(); });
    window.addEventListener('storage', e => { if (!e.key || /^push-(state|prefs)$/.test(e.key)) emit(); });
  }

  return { KINDS, supported, standalone, status, enable, disable, sync, prefs, setPrefs, notify, notifyUser, schedule, cancel, test, onChange: f => listeners.add(f),
    enabled: () => !!(ls.get('push-state') || {}).on && supported() && Notification.permission === 'granted', _chan: chan, _channels: channels };
})();

  function fmtDate(s) { const [y, m, d] = s.split('-'); return d + '.' + m + '.' + y; }
  function fmtShort(s) { const [, m, d] = s.split('-'); return d + '.' + m + '.'; }
  const WD = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];
  const WD_LONG = ['Sonntag', 'Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag'];

/* ---------- Lokaler Speicher (IndexedDB, Rückfall localStorage) ---------- */
const Store = (() => {
  let dbp = null;

    if (dbp) return dbp;

      if (!('indexedDB' in window)) return rej(new Error('kein IndexedDB'));
      const r = indexedDB.open('essensplanung', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('kv');
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });

  }
  const tx = (mode, fn) => open().then(d => new Promise((res, rej) => {
    const t = d.transaction('kv', mode); const req = fn(t.objectStore('kv'));
    t.oncomplete = () => res(req && req.result); t.onerror = () => rej(t.error);
  }));
  const ls = {
    get: k => { try { const v = localStorage.getItem('ep_kv_' + k); return Promise.resolve(v ? JSON.parse(v) : undefined); } catch (e) { return Promise.resolve(undefined); } },
    set: (k, v) => { try { localStorage.setItem('ep_kv_' + k, JSON.stringify(v)); } catch (e) {} return Promise.resolve(); },
    del: k => { try { localStorage.removeItem('ep_kv_' + k); } catch (e) {} return Promise.resolve(); },
  };
  return {
    get: k => tx('readonly', s => s.get(k)).catch(() => ls.get(k)),
    set: (k, v) => tx('readwrite', s => s.put(v, k)).catch(() => ls.set(k, v)),
    del: k => tx('readwrite', s => s.delete(k)).catch(() => ls.del(k)),

})();

function bytesToB64(bytes) {

  return btoa(bin);
}

  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

/* ---------- Kryptografie (PBKDF2 + AES-GCM) ---------- */
const Crypt = {
  ITER: 150000,
  async pbkdfKey(password, salt) {
    const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), { name: 'PBKDF2' }, false, ['deriveKey', 'deriveBits']);
    return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: this.ITER, hash: 'SHA-256' }, km, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
  },
  async verifier(password, saltB64) {
    const salt = saltB64 ? b64ToBytes(saltB64) : crypto.getRandomValues(new Uint8Array(16));
    const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), { name: 'PBKDF2' }, false, ['deriveBits']);
    const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt, iterations: this.ITER, hash: 'SHA-256' }, km, 256);
    return { salt: bytesToB64(salt), hash: bytesToB64(new Uint8Array(bits)), iter: this.ITER };
  },
  async check(password, v) { return v && (await this.verifier(password, v.salt)).hash === v.hash; },
  async encWithPassword(password, text) {
    const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
    const key = await this.pbkdfKey(password, salt);
    const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, new TextEncoder().encode(text));
    return { salt: bytesToB64(salt), iv: bytesToB64(iv), data: bytesToB64(new Uint8Array(ct)) };
  },
  async decWithPassword(password, blob) {
    const key = await this.pbkdfKey(password, b64ToBytes(blob.salt));
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64ToBytes(blob.iv) }, key, b64ToBytes(blob.data));
    return new TextDecoder().decode(pt);
  },
  async rawKey(raw) { return crypto.subtle.importKey('raw', raw, { name: 'AES-GCM' }, false, ['encrypt', 'decrypt']); },
  async encRaw(raw, text) {
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, await this.rawKey(raw), new TextEncoder().encode(text));
    return { iv: bytesToB64(iv), data: bytesToB64(new Uint8Array(ct)) };
  },
  async decRaw(raw, blob) {
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64ToBytes(blob.iv) }, await this.rawKey(raw), b64ToBytes(blob.data));
    return new TextDecoder().decode(pt);
  },
};

/* Täglicher Abschluss: vergangene Kochtage gelten als gekocht (5.2 complete) */
function housekeeping() {
  const today = EP.todayISO();
  let changed = false;
  const rot = new Map(db.rotation.map(e => [e.id, e]));
  EP.live(db.plan).forEach(p => {
    if (p.type === 'BLOCKED' || p.date >= today) return;
    if (p.status !== 'DONE') { p.status = 'DONE'; EP.touch(p); changed = true; }
    if (p.type === 'COOK' && p.rotationEntryId) {
      const e = rot.get(p.rotationEntryId);
      if (e && !e.deleted && e.status === 'PLANNED') { EP.completeEntry(e); changed = true; }
    }
  });
  if (EP.cleanRotation(db)) changed = true;   // Einträge gelöschter/pausierter Rezepte
  if (!draft && EP.releaseOrphans(db)) changed = true;   // „Geplant“, obwohl der Tag nicht mehr im Plan steht
  if (EP.pruneShopping(db, today)) changed = true;
  const before = JSON.stringify([db.recipes.length, db.ingredients.length, db.rotation.length, db.plan.length]);
  EP.pruneTombstones(db, 60 * DAY);
  if (before !== JSON.stringify([db.recipes.length, db.ingredients.length, db.rotation.length, db.plan.length])) changed = true;
  return changed;
}

const Auth = {
  get cfg() { return LS.get('ep_auth') || {}; },
  set cfg(v) { LS.set('ep_auth', v); },
  session: null, token: null,
  locked() {
    const l = LS.get('ep_lock');
    return l && l.until && l.until > Date.now() ? Math.ceil((l.until - Date.now()) / 60000) : 0;
  },
  failed() {
    const l = LS.get('ep_lock') || { fails: 0 };
    l.fails = (l.fails || 0) + 1;
    if (l.fails >= 5) { l.until = Date.now() + 15 * 60000; l.fails = 0; }
    LS.set('ep_lock', l);
  },
  async startSession(token) {
    const raw = crypto.getRandomValues(new Uint8Array(32));
    const s = { exp: Date.now() + 90 * DAY, key: bytesToB64(raw), tokenEnc: token ? await Crypt.encRaw(raw, token) : null };
    LS.set('ep_session', s);
    LS.del('ep_lock');
    this.token = token || null;
  },
  async resume() {
    const s = LS.get('ep_session');
    if (!s || !s.exp || s.exp < Date.now()) return false;
    try { this.token = s.tokenEnc ? await Crypt.decRaw(b64ToBytes(s.key), s.tokenEnc) : null; }
    catch (e) { this.token = null; }
    return true;
  },
  logout() { LS.del('ep_session'); this.token = null; },
  /* Token dauerhaft mit dem Haushaltspasswort verschlüsselt ablegen */
  async storeToken(password, token, repo) {
    const c = this.cfg;
    c.tokenEnc = token ? await Crypt.encWithPassword(password, token) : null;
    c.repo = repo || null;
    this.cfg = c;
    const s = LS.get('ep_session');
    if (s) { s.tokenEnc = token ? await Crypt.encRaw(b64ToBytes(s.key), token) : null; LS.set('ep_session', s); }
    this.token = token || null;
  },
  async tokenFromPassword(password) {
    const c = this.cfg;

/* ---------- Eigener Server (PocketBase auf dem Pi) ----------
   Ein Haushalt = ein Datensatz in der Collection "trips". Inhalt ist verschlüsselt (AES-GCM),
   Schlüssel und Zugangsnachweis werden per HKDF aus dem Geheimnis im Verbindungslink abgeleitet.
   Bilder liegen als eigene Datensätze mit fester, aus dem Bildschlüssel berechneter ID. */
const PB = {
  DEFAULT: 'https://kostenpi.tail281e3e.ts.net',
  get url() { try { return localStorage.getItem('ep_server') || this.DEFAULT; } catch (e) { return this.DEFAULT; } },
  b64e(u8) { return bytesToB64(u8).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); },
  b64d(s) { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; return b64ToBytes(s); },

      const enc = await crypto.subtle.deriveKey({ name: 'HKDF', hash: 'SHA-256', salt, info: te('enc') }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
      const bits = await crypto.subtle.deriveBits({ name: 'HKDF', hash: 'SHA-256', salt, info: te('auth') }, base, 256);
      return { enc, auth: this.b64e(new Uint8Array(bits)) };

  async enc(key, text) {

    return 'v1.' + this.b64e(iv) + '.' + this.b64e(new Uint8Array(ct));
  },
  async dec(key, str) {
    const p = String(str || '').split('.');

    return new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: this.b64d(p[1]) }, key, this.b64d(p[2])));
  },
  async api(method, path, auth, body) {
    const h = {}; if (auth) h['X-Trip-Auth'] = auth; if (body) h['Content-Type'] = 'application/json';
    const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 20000);
    try {
      const r = await fetch(this.url + '/api/collections/trips/records' + path, { method, headers: h, body: body ? JSON.stringify(body) : undefined, cache: 'no-store', signal: ctl.signal });

  async imgId(household, key, suffix) {

  async fetchHousehold(id, secret) {
    const k = await this.keysFor(secret);
    const r = await this.api('GET', '/' + id, k.auth);
    if (r.status === 404) { const e = new Error('Haushalt nicht gefunden. Ist der Link vollständig?'); e.status = 404; throw e; }
    if (r.status !== 200 || !r.json) throw this.fail(r);

  },

  async create(secret, data) {
    const k = await this.keysFor(secret);
    const r = await this.api('POST', '', null, { auth: k.auth, data: await this.enc(k.enc, JSON.stringify(data)), rev: 1 });
    if (r.status !== 200 || !r.json || !r.json.id) throw this.fail(r);
