<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Essensplanung">
<meta name="theme-color" content="#F6F8FB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1626" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<title>Essensplanung</title>
<style>
:root{
  --enamel:#F6F8FB; --plate:#FFFFFF; --rim:#1E4FA0; --rim-ink:#FFFFFF; --rim-soft:#E6EDF8;
  --ink:#172033; --speckle:#586477; --line:#D6DDE8; --tomato:#B93A22; --basil:#2B7249; --mustard:#8A5F00;
  --shadow:0 1px 0 rgba(23,32,51,.06);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){:root{
  --enamel:#0E1626; --plate:#162136; --rim:#86AAEE; --rim-ink:#0E1626; --rim-soft:#1C2B48;
  --ink:#EDF1F8; --speckle:#A7B3C6; --line:#2B3A57; --tomato:#FF8C74; --basil:#72D39B; --mustard:#F0C45C;
  --shadow:none;
}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{background:var(--enamel);color:var(--ink);font:16px/1.45 var(--sans);min-height:100dvh;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
:focus-visible{outline:3px solid var(--rim);outline-offset:2px}
.hidden{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- Kopf ---------- */
.top{position:sticky;top:0;z-index:20;background:var(--enamel);display:flex;align-items:center;gap:8px;
  padding:10px 16px 8px;border-bottom:1px solid var(--line)}
.top .ttl{font-family:var(--serif);font-size:21px;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{min-width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--rim);font-size:15px;font-weight:600;padding:0 8px}
.iconbtn:active{background:var(--rim-soft)}
.iconbtn svg{width:22px;height:22px}
#gear{position:relative}
.gearbadge{position:absolute;top:3px;right:1px;min-width:19px;height:19px;padding:0 5px;border-radius:99px;background:var(--tomato);color:#fff;
  font-size:12px;font-weight:700;line-height:19px;text-align:center;box-shadow:0 0 0 2px var(--enamel)}
.countbadge{min-width:24px;height:24px;padding:0 7px;border-radius:99px;background:var(--tomato);color:#fff;font-size:13px;font-weight:700;line-height:24px;text-align:center}
.syncpill{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--speckle);padding:6px 9px;border-radius:99px;border:1px solid var(--line);background:var(--plate);min-height:32px}
.syncpill i{width:8px;height:8px;border-radius:50%;background:var(--speckle);display:block}
.syncpill.ok i{background:var(--basil)} .syncpill.busy i{background:var(--rim)} .syncpill.err i{background:var(--tomato)}

main{max-width:640px;margin:0 auto;padding:16px 16px calc(96px + env(safe-area-inset-bottom))}

/* ---------- Untere Navigation ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--plate);border-top:1px solid var(--line);
  display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;min-height:52px;
  color:var(--speckle);font-size:12px;font-weight:600;border-radius:12px}
.tabs button svg{width:24px;height:24px}
.tabs button[aria-current="page"]{color:var(--rim)}
.tabs button[aria-current="page"] svg{stroke-width:2.4}

/* ---------- Grundbausteine ---------- */
h2{font-family:var(--serif);font-size:24px;font-weight:600;line-height:1.2;margin-bottom:4px}
h3{font-size:15px;font-weight:700;margin:22px 0 8px}
.sub{color:var(--speckle);font-size:14px}
.serif{font-family:var(--serif)}
.box{background:var(--plate);border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow)}
.stack>*+*{margin-top:10px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:12px 16px;border-radius:14px;
  font-weight:700;font-size:16px;background:var(--plate);border:1.5px solid var(--line);color:var(--ink);width:100%}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--rim);border-color:var(--rim);color:var(--rim-ink)}
.btn.quiet{border-color:transparent;background:transparent;color:var(--rim);min-height:44px}
.btn.danger{color:var(--tomato)}
.btn.small{min-height:40px;padding:8px 12px;font-size:14px;border-radius:12px;width:auto}
.btns{display:grid;gap:10px;margin-top:16px}
.btns.two{grid-template-columns:1fr 1fr}
.field{display:block;margin-top:14px}
.field>span{display:block;font-size:14px;font-weight:600;color:var(--speckle);margin-bottom:6px}
.in{width:100%;min-height:48px;background:var(--plate);border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;font-size:16px}
.in:focus{border-color:var(--rim);outline:none}
textarea.in{min-height:110px;resize:vertical;line-height:1.5}
select.in{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--speckle) 50%),linear-gradient(135deg,var(--speckle) 50%,transparent 50%);
  background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
.hint{font-size:13px;color:var(--speckle);margin-top:6px}
.warn{color:var(--tomato)}
.empty{text-align:center;padding:36px 16px;color:var(--speckle)}
.empty .serif{font-size:21px;color:var(--ink);margin-bottom:6px}
.seg{display:flex;background:var(--rim-soft);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;min-height:40px;border-radius:9px;font-size:14px;font-weight:600;color:var(--speckle);padding:6px 8px}
.seg button[aria-pressed="true"]{background:var(--plate);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--plate);font-size:22px;font-weight:600;color:var(--rim)}
.stepper output{min-width:46px;text-align:center;font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
.switch{position:relative;width:52px;height:32px;flex-shrink:0}
.switch input{opacity:0;position:absolute;inset:0;margin:0;cursor:pointer;z-index:1}
.switch i{position:absolute;inset:0;border-radius:99px;background:var(--line);transition:background .15s}
.switch i:after{content:'';position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}
.switch input:checked+i{background:var(--basil)}
.switch input:checked+i:after{transform:translateX(20px)}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 8px;border-radius:99px;
  background:var(--rim-soft);color:var(--rim);white-space:nowrap}
.badge.cook{background:transparent;border:1.5px solid var(--basil);color:var(--basil)}
.badge.rest{background:transparent;border:1.5px dashed var(--mustard);color:var(--mustard)}
.badge.block{background:transparent;border:1.5px solid var(--tomato);color:var(--tomato)}
.badge.done{background:transparent;border:1.5px solid var(--speckle);color:var(--speckle)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.months{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.months .chip{padding:5px 0;text-align:center}
.lane-seg{margin-bottom:14px}
.srcrow{padding:10px 0;border-bottom:1px solid var(--line)}
.srcrow:last-child{border-bottom:none}
.srcrow .nm{font-weight:600}
.srcrow .amt{font-size:13px;color:var(--speckle)}
.srcseg{margin-top:8px}
.srcseg button{min-height:36px;font-size:13px}
.newbox{border-color:var(--tomato)}
details.srcgroup{margin-top:8px}
details.srcgroup summary .amt{margin-left:auto;margin-right:10px;font-weight:600;color:var(--speckle);font-size:13px}
/* Datumsfelder: iOS gibt ihnen sonst eine feste Mindestbreite, dann überlappen sie */
.dategrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin-top:10px}
.dategrid label{min-width:0;display:block}
.dategrid .hint{display:block;margin:0 0 4px}
input[type=date].in{-webkit-appearance:none;appearance:none;min-width:0;max-width:100%;width:100%;display:block;text-align:left}
input[type=date]::-webkit-date-and-time-value{text-align:left}
@media (max-width:340px){.dategrid{grid-template-columns:1fr}}
.rangebox{margin-bottom:4px}
.rangebox summary{font-weight:600;font-size:15px;color:var(--rim)}
.chip{min-height:34px;padding:5px 12px;border-radius:99px;border:1.5px solid var(--line);font-size:14px;font-weight:600;color:var(--speckle);background:var(--plate)}
.chip[aria-pressed="true"]{border-color:var(--rim);color:var(--rim);background:var(--rim-soft)}

/* ---------- Vorschlag: der Teller ---------- */
.plate-wrap{display:flex;flex-direction:column;align-items:center;text-align:center;padding:8px 0 4px}
.plate{width:min(76vw,300px);aspect-ratio:1;border-radius:50%;background:var(--plate);
  border:12px solid var(--rim);box-shadow:inset 0 0 0 7px var(--plate),inset 0 0 0 8px var(--line);
  display:flex;align-items:center;justify-content:center;padding:34px;position:relative;overflow:hidden}
.plate.plate-lunch{border-color:var(--basil);width:min(64vw,250px)}
.plate.plate-cake{border-color:var(--tomato);width:min(64vw,250px);border-style:double;border-width:14px}
.plate .dish{font-family:var(--serif);font-size:clamp(22px,6.4vw,30px);line-height:1.15;font-weight:600;overflow-wrap:anywhere}
.plate img{position:absolute;inset:7px;width:calc(100% - 14px);height:calc(100% - 14px);object-fit:cover;border-radius:50%}
.dish-under{font-family:var(--serif);font-size:26px;font-weight:600;line-height:1.2;margin-top:14px;overflow-wrap:anywhere}
.plate-meta{color:var(--speckle);font-size:15px;margin-top:8px}
.progress{margin:18px 0 6px;font-size:14px;color:var(--speckle);text-align:center}
.progress-bar{height:6px;background:var(--rim-soft);border-radius:99px;overflow:hidden;margin-top:6px}
.progress-bar i{display:block;height:100%;background:var(--rim);border-radius:99px}
.queue{margin-top:6px}
.queue li{list-style:none;display:flex;align-items:baseline;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line)}
.queue li:last-child{border-bottom:none}
.queue .n{color:var(--speckle);font-size:13px;font-variant-numeric:tabular-nums;width:20px}
.queue .nm{font-family:var(--serif);font-size:17px;flex:1;min-width:0}
.queue .d{font-size:13px;color:var(--speckle);white-space:nowrap}

/* ---------- Woche ---------- */
.weekhead{display:flex;align-items:center;gap:6px;margin-bottom:12px}
.weekhead .kw{flex:1;text-align:center}
.weekhead .kw b{display:block;font-family:var(--serif);font-size:24px;font-weight:600}
.weekhead .kw span{font-size:14px;color:var(--speckle)}
.draftbar{background:var(--rim-soft);border:1.5px dashed var(--rim);border-radius:14px;padding:12px 14px;margin-bottom:12px;font-size:14px}
.draftbar b{color:var(--rim)}
.days{background:var(--plate);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.day{border-top:1px solid var(--line);position:relative}
.day:first-child{border-top:none}
.daymain{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:12px 14px;min-height:66px}
.daymain:active,.laneline:active{background:var(--rim-soft)}
.laneline{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:7px 14px 9px 70px;min-height:40px;border-top:1px dashed var(--line)}
.laneline .lanelbl{font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;flex-shrink:0}
.lane-lunch .lanelbl{background:transparent;border:1.5px solid var(--basil);color:var(--basil)}
.lane-cake .lanelbl{background:transparent;border:1.5px solid var(--tomato);color:var(--tomato)}
.laneline .nm{font-family:var(--serif);font-size:16px;flex:1;min-width:0;overflow-wrap:anywhere}
.laneline .nm.free{font-family:var(--sans);font-size:14px;color:var(--speckle)}
.laneline.drafted{background:linear-gradient(90deg,var(--rim-soft),transparent 60%)}
.day.today:before{content:'';position:absolute;left:0;top:8px;bottom:8px;width:4px;border-radius:0 4px 4px 0;background:var(--rim)}
.day.past{opacity:.62}
.daymain .dt{width:44px;flex-shrink:0;text-align:center}
.daymain .dt b{display:block;font-size:15px}
.daymain .dt span{font-size:12px;color:var(--speckle)}
.daymain .what{flex:1;min-width:0}
.daymain .nm{font-family:var(--serif);font-size:17px;line-height:1.25;overflow-wrap:anywhere}
.daymain .nm.free{font-family:var(--sans);font-size:15px;color:var(--speckle)}
.daymain .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.day.drafted .daymain{background:linear-gradient(90deg,var(--rim-soft),transparent 60%)}
.lock{width:16px;height:16px;color:var(--speckle);flex-shrink:0}

/* ---------- Rezepte ---------- */
.quick{display:flex;gap:8px}
.quick .in{flex:1}
.quick .btn{width:auto;min-width:52px;padding:0 14px}
.rlist{margin-top:12px}
.rcard{background:var(--plate);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px;box-shadow:var(--shadow)}
.rcard.paused{opacity:.72}
.rcard .head{display:flex;align-items:center;gap:12px}
.rcard .thumb{width:48px;height:48px;border-radius:50%;object-fit:cover;flex-shrink:0;border:3px solid var(--rim)}
.rcard .nm{font-family:var(--serif);font-size:18px;font-weight:600;line-height:1.2;text-align:left;overflow-wrap:anywhere}
.rcard .meta{font-size:13px;color:var(--speckle);margin-top:2px;text-align:left}
.rcard .ctrl{display:flex;align-items:center;justify-content:space-between;margin-top:10px;gap:10px}
.rcard .ctrl label{font-size:14px;color:var(--speckle);display:flex;align-items:center;gap:8px}
.wstep{display:flex;align-items:center;gap:4px}
.wstep button{width:36px;height:36px;border-radius:10px;border:1.5px solid var(--line);color:var(--rim);font-weight:700;font-size:18px;background:var(--plate)}
.wstep output{min-width:34px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}

/* ---------- Rezept bearbeiten ---------- */
.nameinput{font-family:var(--serif);font-size:22px;font-weight:600}
.live{font-size:14px;color:var(--basil);font-weight:600;margin-top:6px}
.ingrow{border:1px solid var(--line);border-radius:14px;padding:10px;margin-top:8px;background:var(--plate)}
.ingrow .l1{display:grid;grid-template-columns:72px 96px 1fr 40px;gap:6px}
.ingrow .l2{display:grid;grid-template-columns:1fr 40px 40px;gap:6px;margin-top:6px}
.ingrow .in{min-height:42px;padding:8px 10px;font-size:15px}
.ingrow select.in{padding-right:24px;background-position:calc(100% - 14px) 50%,calc(100% - 9px) 50%}
.ingrow .x{width:40px;height:42px;border-radius:10px;border:1.5px solid var(--line);color:var(--speckle);font-size:15px}
.ingrow .newcat{margin-top:6px;font-size:13px;color:var(--mustard);display:flex;align-items:center;gap:8px}
.ingrow .newcat select{min-height:38px;font-size:14px;padding:6px 26px 6px 8px}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:8px;margin-top:8px}
.gallery button{aspect-ratio:1;border-radius:12px;overflow:hidden;position:relative;border:1.5px solid var(--line);background:var(--rim-soft)}
.gallery img{width:100%;height:100%;object-fit:cover;display:block}
.gallery .cover{position:absolute;left:4px;top:4px;background:var(--rim);color:var(--rim-ink);font-size:11px;font-weight:700;padding:2px 6px;border-radius:99px}
.gallery .add{display:flex;align-items:center;justify-content:center;font-size:30px;color:var(--rim);border-style:dashed}

/* ---------- Einkauf ---------- */
.shopsec{margin-top:18px}
.shopsec>h3{margin:0 0 8px;display:flex;align-items:baseline;gap:8px}
.shopsec>h3 small{font-weight:600;color:var(--speckle);font-size:13px}
.cat{font-size:13px;font-weight:700;color:var(--speckle);margin:12px 0 4px}
.item{display:flex;align-items:center;gap:12px;padding:9px 2px;min-height:48px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.item:last-child{border-bottom:none}
.item input{width:22px;height:22px;accent-color:var(--basil);flex-shrink:0}
.item .nm{flex:1;min-width:0}
.item .amt{color:var(--speckle);font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums}
.item.checked .nm,.item.checked .amt{text-decoration:line-through;color:var(--speckle)}
details.box summary{cursor:pointer;font-weight:700;min-height:28px;list-style:none;display:flex;align-items:center;justify-content:space-between}
details.box summary::-webkit-details-marker{display:none}
details.box summary:after{content:'+';font-size:20px;color:var(--rim)}
details.box[open] summary:after{content:'−'}
.warnbox{border-color:var(--tomato)}
.warnbox li{list-style:none;color:var(--tomato);font-size:14px;padding:3px 0}

/* ---------- Blätter (Dialoge) ---------- */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(10,16,28,.48);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--enamel);width:100%;max-width:640px;max-height:88dvh;overflow:auto;overscroll-behavior:contain;border-radius:22px 22px 0 0;
  padding:8px 18px calc(18px + env(safe-area-inset-bottom));animation:up .18s ease-out}
.grab{position:sticky;top:-8px;z-index:2;margin:-8px -18px 6px;padding:10px 0 12px;background:var(--enamel);cursor:grab;touch-action:none}
.grab i{display:block;width:44px;height:5px;border-radius:99px;background:var(--speckle);opacity:.55;margin:0 auto}
.sheet h2{font-size:22px}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;min-height:52px;padding:12px 14px;border-radius:14px;background:var(--plate);border:1px solid var(--line);margin-top:8px;font-weight:600}
.opt small{display:block;font-weight:400;color:var(--speckle);font-size:13px}
.opt.danger{color:var(--tomato)}
.pick{max-height:52dvh;overflow:auto;margin-top:10px}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(10px);z-index:60;
  background:var(--ink);color:var(--enamel);padding:12px 18px;border-radius:14px;font-size:15px;font-weight:600;max-width:88vw;text-align:center;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- Anmeldung ---------- */
.auth{max-width:440px;margin:0 auto;padding:40px 22px calc(40px + env(safe-area-inset-bottom))}
.auth .mark{width:92px;height:92px;border-radius:50%;border:10px solid var(--rim);background:var(--plate);box-shadow:inset 0 0 0 5px var(--plate),inset 0 0 0 6px var(--line);margin:0 auto 22px}
.auth h1{font-family:var(--serif);font-size:32px;font-weight:600;text-align:center;line-height:1.15}
.auth p.lead{text-align:center;color:var(--speckle);margin-top:8px}
.steps{padding-left:20px;margin-top:8px}
.steps li{margin-top:6px;font-size:15px}
.backlink{display:inline-flex;align-items:center;min-height:44px;color:var(--rim);font-weight:600;text-decoration:none}

/* ---------- Kochansicht ---------- */
.cookscreen{position:fixed;inset:0;z-index:40;background:var(--plate);overflow:auto;padding:calc(12px + env(safe-area-inset-top)) 20px calc(40px + env(safe-area-inset-bottom))}
.cookscreen .inner{max-width:720px;margin:0 auto}
.cookscreen h1{font-family:var(--serif);font-size:clamp(30px,8vw,44px);line-height:1.1;font-weight:600;margin:10px 0 6px}
.cookscreen .hero{width:100%;max-height:44dvh;object-fit:cover;border-radius:18px;margin:10px 0}
.cookscreen .ing{font-size:20px;line-height:1.4}
.cookscreen .ing li{list-style:none;padding:9px 0;border-bottom:1px solid var(--line);display:flex;gap:12px;cursor:pointer}

<body>
<div id="auth" class="hidden"></div>
<div id="shell" class="hidden">

    <button class="iconbtn" id="gear" aria-label="Einstellungen"><span class="gearbadge hidden" id="gearbadge"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </header>

<noscript><p style="padding:24px">Die Essensplanung braucht JavaScript.</p></noscript>
<script>
/* ==========================================================================
   Essensplanung – Kernlogik (rein, ohne DOM/Speicher)
   Umsetzung der Spezifikation „Rezept-Rotation“ Abschnitt 5
   ========================================================================== */
const EP = (function () {
  'use strict';

  /* ---------- Hilfen ---------- */
  let clock = () => Date.now();
  function setClock(fn) { clock = fn; }
  function uuid() {
    if (typeof crypto !== 'undefined' && crypto.randomUUID) return crypto.randomUUID();
    return 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 12);
  }
  function touch(o) {
    const t = clock();
    if (!o.createdAt) o.createdAt = t;
    o.updatedAt = Math.max(t, (o.updatedAt || 0) + 1);
    return o;
  }
  const live = arr => (arr || []).filter(x => !x.deleted);
  function tomb(o) { o.deleted = true; touch(o); }

  /* seedbarer Zufallsgenerator (mulberry32) */
  function seededRng(seed) {
    let a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  /* ---------- Datum (lokale Zeit, Woche ab Montag) ---------- */
  const pad = n => String(n).padStart(2, '0');
  function iso(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function parseISO(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d, 12); }
  function addDays(s, n) { const d = parseISO(s); d.setDate(d.getDate() + n); return iso(d); }
  function todayISO() { return iso(new Date()); }
  function weekStart(s) { const d = parseISO(s); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return iso(d); }
  function weekDays(start) { return [0, 1, 2, 3, 4, 5, 6].map(i => addDays(start, i)); }
  function isoWeek(s) {
    const d = parseISO(s);
    const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    const day = t.getUTCDay() || 7;
    t.setUTCDate(t.getUTCDate() + 4 - day);
    const y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
    return Math.ceil(((t - y0) / 86400000 + 1) / 7);
  }
  function fmtDate(s) { const [y, m, d] = s.split('-'); return d + '.' + m + '.' + y; }
  function fmtShort(s) { const [, m, d] = s.split('-'); return d + '.' + m + '.'; }
  const WD = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];
  const WD_LONG = ['Sonntag', 'Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag'];
  function weekday(s) { return WD[parseISO(s).getDay()]; }
  function weekdayLong(s) { return WD_LONG[parseISO(s).getDay()]; }
  function fmtRange(from, to) {
    if (from.slice(0, 4) === to.slice(0, 4)) return fmtShort(from) + '–' + fmtDate(to);
    return fmtDate(from) + '–' + fmtDate(to);
  }

  /* ---------- 5.1 Tage pro Gericht ---------- */
  function daysFor(recipe, settings) {
    if (recipe.daysOverride) return recipe.daysOverride;
    const raw = recipe.servings / settings.portionsPerDay;
    const days = settings.roundingMode === 'FLOOR' ? Math.floor(raw) : Math.ceil(raw);
    return Math.max(1, days);
  }
  /* Hinweistext für ungerade Portionen */
  function daysHint(recipe, settings) {
    if (recipe.daysOverride) return '';
    const rest = recipe.servings % settings.portionsPerDay;
    if (!rest || recipe.servings < settings.portionsPerDay) return '';
    return settings.roundingMode === 'FLOOR'
      ? `${rest} ${rest === 1 ? 'Portion bleibt' : 'Portionen bleiben'} übrig`
      : `letzter Tag nur ${rest} ${rest === 1 ? 'Portion' : 'Portionen'}`;
  }

  /* ---------- 5.2 Rotation ---------- */
  /* Spuren: jede hat ihre eigene Rotation */
  const LANES = [
    { key: 'MAIN', label: 'Hauptgerichte', short: 'Hauptgericht' },
    { key: 'LUNCH', label: 'Mittagessen', short: 'Mittag' },
    { key: 'CAKE', label: 'Kuchen', short: 'Kuchen' },
  ];
  const laneOf = x => (x && (x.lane || x.kind)) || 'MAIN';
  const MONTHS = ['Jan', 'Feb', 'Mär', 'Apr', 'Mai', 'Jun', 'Jul', 'Aug', 'Sep', 'Okt', 'Nov', 'Dez'];
  function inSeason(recipe, month) {
    const m = recipe && recipe.seasonMonths;
    return !month || !m || !m.length || m.length >= 12 || m.includes(month);
  }
  function seasonLabel(recipe) {
    const m = (recipe.seasonMonths || []).slice().sort((a, b) => a - b);
    if (!m.length || m.length >= 12) return '';
    // zusammenhängende Bereiche, auch über den Jahreswechsel (z. B. Nov–Feb)
    const set = new Set(m), parts = [];
    let start = m.find(x => !set.has(x === 1 ? 12 : x - 1));
    if (start === undefined) return 'ganzjährig';
    const seen = new Set();
    for (const s0 of m.filter(x => !set.has(x === 1 ? 12 : x - 1))) {
      let e = s0; while (set.has(e === 12 ? 1 : e + 1) && !seen.has(e)) { seen.add(e); e = e === 12 ? 1 : e + 1; }
      parts.push(s0 === e ? MONTHS[s0 - 1] : MONTHS[s0 - 1] + '–' + MONTHS[e - 1]);
    }
    return parts.join(', ');
  }
  function monthOf(isoDate) { return +isoDate.slice(5, 7); }
  function activeRecipes(db, lane) {
    return live(db.recipes).filter(r => r.inRotation && !r.archivedAt && (!lane || laneOf(r) === lane));
  }
  function repairAdjacency(items, prevLastRecipeId) {
    let moves = 0;
    const maxMoves = items.length * items.length + 10;
    for (let i = 0; i < items.length && moves < maxMoves; i++) {
      const prev = i === 0 ? prevLastRecipeId : items[i - 1].recipeId;
      if (items[i].recipeId !== prev) continue;
      const j = items.findIndex((x, idx) => idx > i && x.recipeId !== prev);
      if (j !== -1) {
        const [moved] = items.splice(j, 1);
        items.splice(i, 0, moved);
        moves++;
        continue;
      }
      // Abweichung von der Referenz: Kein Tauschpartner mehr weiter hinten (z. B. beide
      // Vorkommen ganz am Ende). Dann den Eintrag an die nächstgelegene frühere Stelle setzen,
      // an der keiner seiner Nachbarn dasselbe Rezept ist. Sonst ist es unvermeidbar.
      const x = items[i].recipeId;
      let target = -1;
      for (let k = i - 1; k >= 0; k--) {
        const left = k === 0 ? prevLastRecipeId : items[k - 1].recipeId;
        if (left !== x && items[k].recipeId !== x) { target = k; break; }
      }
      if (target === -1) break;
      const [moved] = items.splice(i, 1);
      items.splice(target, 0, moved);
      moves++;
      i = target; // ab hier erneut prüfen
    }
  }
  function countAdjacent(items, prevLastRecipeId) {
    let a = 0;
    for (let i = 0; i < items.length; i++) {
      const prev = i === 0 ? prevLastRecipeId : items[i - 1].recipeId;
      if (items[i].recipeId === prev) a++;
    }
    return a;
  }
  /* Rückfallebene: ordnet so um, dass nie dasselbe Rezept folgt (sofern überhaupt möglich).
     Wählt jeweils das Rezept mit den meisten verbleibenden Vorkommen, das nicht dem vorigen
     entspricht; bei Gleichstand entscheidet die ursprüngliche (gemischte) Reihenfolge. */
  function greedyArrange(items, prevLastRecipeId) {
    const queues = new Map();
    items.forEach(it => { if (!queues.has(it.recipeId)) queues.set(it.recipeId, []); queues.get(it.recipeId).push(it); });
    const out = [];
    let prev = prevLastRecipeId;
    while (out.length < items.length) {
      let best = null;
      queues.forEach((q, id) => {
        if (!q.length || id === prev) return;
        if (!best || q.length > best.q.length || (q.length === best.q.length && q[0].key < best.q[0].key)) best = { id, q };
      });
      if (!best) queues.forEach((q, id) => { if (q.length && !best) best = { id, q }; }); // unvermeidbar
      out.push(best.q.shift());
      prev = best.id;
    }
    return out;
  }
  function buildCycle(recipes, settings, cycleNumber, prevLastRecipeId, rng, lane, month) {
    lane = lane || 'MAIN';
    const active = recipes.filter(r => r.inRotation && !r.archivedAt && !r.deleted && laneOf(r) === lane && inSeason(r, month))
      .sort((a, b) => a.sortOrder - b.sortOrder);
    const n = active.length;
    let items = active.flatMap((r, idx) =>
      Array.from({ length: r.weight }, (_, k) => {
        const u = settings.rotationMode === 'SHUFFLE' ? rng() : (idx + 0.5) / n;
        return { recipeId: r.id, occurrence: k + 1, key: (k + u) / r.weight };
      }));
    items.sort((a, b) => a.key - b.key);
    repairAdjacency(items, prevLastRecipeId);
    if (countAdjacent(items, prevLastRecipeId)) {
      const alt = greedyArrange([...items].sort((a, b) => a.key - b.key), prevLastRecipeId);
      if (countAdjacent(alt, prevLastRecipeId) < countAdjacent(items, prevLastRecipeId)) items = alt;
    }
    // Vorkommen in Reihenfolge des Auftretens nummerieren (1/2 vor 2/2)
    const seen = {};
    items.forEach(it => { seen[it.recipeId] = (seen[it.recipeId] || 0) + 1; it.occurrence = seen[it.recipeId]; });
    return items.map((it, i) => touch({
      id: uuid(), lane, cycleNumber, recipeId: it.recipeId, occurrence: it.occurrence,
      position: (i + 1) * 1000, status: 'PENDING', deleted: false,
    }));
  }
  const byCyclePos = (a, b) => a.cycleNumber - b.cycleNumber || a.position - b.position;
  const inLane = (lane) => e => laneOf(e) === (lane || 'MAIN');
  function cycleEntries(db, c, lane) { return live(db.rotation).filter(inLane(lane)).filter(e => e.cycleNumber === c).sort(byCyclePos); }
  function maxCycle(db, lane) { return live(db.rotation).filter(inLane(lane)).reduce((m, e) => Math.max(m, e.cycleNumber), 0); }
  function openCycles(db, lane) {
    return [...new Set(live(db.rotation).filter(inLane(lane)).filter(e => e.status === 'PENDING').map(e => e.cycleNumber))].sort((a, b) => a - b);
  }
  function pendingSorted(db, lane) { return live(db.rotation).filter(inLane(lane)).filter(e => e.status === 'PENDING').sort(byCyclePos); }
  function lastRecipeOfCycle(db, c, lane) {
    const es = cycleEntries(db, c, lane);
    return es.length ? es[es.length - 1].recipeId : null;
  }
  function appendCycle(db, rng, lane, month) {
    lane = lane || 'MAIN';
    const mc = maxCycle(db, lane);
    const cyc = buildCycle(live(db.recipes), db.settings, mc + 1, lastRecipeOfCycle(db, mc, lane), rng, lane, month);
    db.rotation.push(...cyc);
    return cyc;
  }
  /* next(n, exclude): die nächsten offenen Einträge einer Spur; erzeugt bei Bedarf Folgedurchläufe (R3, R7).
     Mit Monatsangabe werden Gerichte außerhalb ihrer Saison für diesen Durchlauf ausgelassen. */
  function nextEntries(db, n, exclude, rng, lane, month) {
    exclude = exclude || new Set();
    lane = lane || 'MAIN';
    const rec = month ? new Map(live(db.recipes).map(r => [r.id, r])) : null;
    for (let guard = 0; guard < 60; guard++) {
      let pend = pendingSorted(db, lane).filter(e => !exclude.has(e.id));
      if (month) {
        pend = pend.filter(e => {
          if (inSeason(rec.get(e.recipeId), month)) return true;
          e.status = 'SKIPPED'; e.skipReason = 'SEASON'; touch(e);
          return false;
        });
      }
      if (pend.length >= n) return pend.slice(0, n);
      if (!appendCycle(db, rng, lane, month).length) return pend;
    }
    return pendingSorted(db, lane).filter(e => !exclude.has(e.id)).slice(0, n);
  }
  function setStatus(entry, status) { entry.status = status; touch(entry); }
  function planEntry(entry) { setStatus(entry, 'PLANNED'); }
  function completeEntry(entry) { setStatus(entry, 'DONE'); }
  function skipEntry(entry) { setStatus(entry, 'SKIPPED'); }
  function postpone(db, entry) {
    const es = cycleEntries(db, entry.cycleNumber, laneOf(entry));
    entry.position = es.reduce((m, e) => Math.max(m, e.position), 0) + 1000;
    touch(entry);
  }
  function release(db, entry) {
    const es = cycleEntries(db, entry.cycleNumber, laneOf(entry));
    entry.position = es.reduce((m, e) => Math.min(m, e.position), Infinity) - 1000;
    entry.status = 'PENDING';
    touch(entry);
  }
  /* manualPick: erster offener Eintrag des Rezepts – oder null (dann MANUAL) */
  function manualPickEntry(db, recipeId, exclude) {
    exclude = exclude || new Set();
    return live(db.rotation).filter(e => e.status === 'PENDING' && e.recipeId === recipeId && !exclude.has(e.id)).sort(byCyclePos)[0] || null;
  }
  function resetRotation(db, rng, lane, month) {
    pendingSorted(db, lane).forEach(tomb);
    return appendCycle(db, rng, lane, month);
  }
  /* Rezept in laufende Durchläufe einarbeiten (neu, reaktiviert, pausiert, Gewicht oder Spur geändert) */
  function syncRecipeIntoCycles(db, recipe, rng) {
    const lane = laneOf(recipe);
    // offene Einträge in einer anderen Spur (Art des Gerichts geändert) entfernen
    live(db.rotation).filter(e => e.recipeId === recipe.id && e.status === 'PENDING' && laneOf(e) !== lane).forEach(tomb);
    const active = recipe.inRotation && !recipe.archivedAt && !recipe.deleted;
    openCycles(db, lane).forEach(c => {
      const mine = cycleEntries(db, c, lane).filter(e => e.recipeId === recipe.id);
      if (!active) { mine.filter(e => e.status === 'PENDING').forEach(tomb); return; }
      const diff = recipe.weight - mine.length;
      if (diff > 0) insertIntoCycle(db, c, recipe, diff, rng, lane);
      if (diff < 0) {
        mine.filter(e => e.status === 'PENDING').sort((a, b) => b.position - a.position)
          .slice(0, -diff).forEach(tomb);
      }
    });
  }
  function insertIntoCycle(db, c, recipe, count, rng, lane) {
    const es = cycleEntries(db, c, lane);
    let occ = es.filter(e => e.recipeId === recipe.id).reduce((m, e) => Math.max(m, e.occurrence), 0);
    const prevCycleLast = lastRecipeOfCycle(db, c - 1, lane);
    const nextCycleFirst = (cycleEntries(db, c + 1, lane)[0] || {}).recipeId || null;
    for (let k = 0; k < count; k++) {
      const firstOpen = es.findIndex(e => e.status === 'PENDING');
      const from = firstOpen === -1 ? es.length : firstOpen;
      const slots = [];
      for (let i = from; i <= es.length; i++) slots.push(i);
      const ok = slots.filter(i => {
        const prev = i === 0 ? prevCycleLast : es[i - 1].recipeId;
        const next = i === es.length ? nextCycleFirst : es[i].recipeId;
        return prev !== recipe.id && next !== recipe.id;
      });
      const pool = ok.length ? ok : slots;
      const at = pool[Math.floor(rng() * pool.length)];
      const entry = touch({ id: uuid(), lane, cycleNumber: c, recipeId: recipe.id, occurrence: ++occ,
        position: 0, status: 'PENDING', deleted: false });
      es.splice(at, 0, entry);
      db.rotation.push(entry);
    }
    es.forEach((e, i) => { const p = (i + 1) * 1000; if (e.position !== p) { e.position = p; touch(e); } });
  }
  /* Fortschritt des laufenden Durchlaufs für den Vorschlag */
  function cycleProgress(db, lane) {
    const oc = openCycles(db, lane);
    if (!oc.length) return null;
    const c = oc[0];
    const es = cycleEntries(db, c, lane);
    const used = es.filter(e => e.status !== 'PENDING').length;
    return { cycle: c, current: Math.min(es.length, used + 1), total: es.length };
  }

  /* ---------- 5.4 Wochenplan ---------- */
  function nextFreeDates(start, n, occupied) {
    const res = [];
    let d = start;
    for (let guard = 0; res.length < n && guard < 400; guard++) {
      if (!occupied.has(d)) res.push(d);
      d = addDays(d, 1);
    }
    return res;
  }
  /* Legt eine Folge von Gerichten auf freie Tage. Leere Folge = „Woche automatisch füllen“.
     seq-Einträge: { kind:'ROT', entryId, recipeId } oder { kind:'MAN', recipeId } */
  function layoutDraft({ days, occupied, sequence, nextFn, recipeOf, settings, today }) {
    const occ = new Set(occupied);
    const used = new Set(sequence.filter(s => s.kind === 'ROT').map(s => s.entryId));
    const drafts = [], placed = [];
    let si = 0;
    const firstFree = () => days.find(d => !occ.has(d) && d >= today);
    for (let start = firstFree(), guard = 0; start && guard < 60; start = firstFree(), guard++) {
      let item;
      if (si < sequence.length) item = sequence[si++];
      else {
        const e = nextFn(used, start);
        if (!e) break;
        used.add(e.id);
        item = { kind: 'ROT', entryId: e.id, recipeId: e.recipeId };
      }
      const recipe = recipeOf(item.recipeId);
      if (!recipe) continue;
      const n = daysFor(recipe, settings);
      const dates = nextFreeDates(start, n, occ);
      item.blockId = item.blockId || uuid();
      dates.forEach((date, i) => {
        occ.add(date);
        drafts.push({
          date, lane: 'MAIN', type: i === 0 ? 'COOK' : 'LEFTOVER', recipeId: recipe.id, blockId: item.blockId,
          dayIndex: i + 1, dayCount: n, rotationEntryId: item.kind === 'ROT' ? item.entryId : null,
          source: item.kind === 'ROT' ? 'ROTATION' : 'MANUAL', locked: !!item.locked, status: 'PLANNED', note: '',
        });
      });
      placed.push(item);
    }
    return { drafts, sequence: placed };
  }
  function fillWeek(opts) { return layoutDraft(Object.assign({ sequence: [] }, opts)).drafts; }

  /* ---------- Einheiten ---------- */
  const UNITS = {
    G: { s: 'g', dim: 'MASS', f: 1 }, KG: { s: 'kg', dim: 'MASS', f: 1000 },
    ML: { s: 'ml', dim: 'VOLUME', f: 1 }, L: { s: 'l', dim: 'VOLUME', f: 1000 },
    STUECK: { s: 'Stück', p: 'Stück' }, EL: { s: 'EL', p: 'EL' }, TL: { s: 'TL', p: 'TL' },
    PRISE: { s: 'Prise', p: 'Prisen' }, BUND: { s: 'Bund', p: 'Bund' },
    ZEHE: { s: 'Zehe', p: 'Zehen' }, DOSE: { s: 'Dose', p: 'Dosen' },
    GLAS: { s: 'Glas', p: 'Gläser' }, PACKUNG: { s: 'Packung', p: 'Packungen' },
    SCHEIBE: { s: 'Scheibe', p: 'Scheiben' },
  };
  const UNIT_ORDER = ['G', 'KG', 'ML', 'L', 'STUECK', 'EL', 'TL', 'PRISE', 'BUND', 'ZEHE', 'DOSE', 'GLAS', 'PACKUNG', 'SCHEIBE'];
  function dimOf(unit) { if (!unit) return 'NONE'; return UNITS[unit].dim || unit; }
  function fmtNum(x) {
    const r = Math.round(x * 100) / 100;
    return String(r).replace('.', ',');
  }
  function fmtDim(dim, total) {
    if (total == null) return '';
    if (dim === 'MASS') return total >= 1000 ? fmtNum(total / 1000) + ' kg' : fmtNum(total) + ' g';

function seedToDb(seed, EPref) {
  const E = EPref || EP;
  const settings = E.touch(Object.assign({ portionsPerDay: 2, roundingMode: 'FLOOR', rotationMode: 'SHUFFLE', marketListShowQuantities: true }, seed.settings || {}));
  const ingredients = (seed.ingredients || []).map(i => E.touch({
    id: E.uuid(), name: i.name, category: i.category, shoppingSource: i.shoppingSource || null,
    defaultUnit: i.defaultUnit || 'STUECK', reviewed: true, deleted: false,
  }));
  const byName = new Map(ingredients.map(i => [i.name.toLowerCase(), i]));
  const recipes = (seed.recipes || []).map((r, idx) => E.touch({
    id: E.uuid(), name: r.name, kind: r.kind || 'MAIN', seasonMonths: r.seasonMonths || null, inRotation: r.inRotation !== false, weight: r.weight || 1,
    servings: r.servings || settings.portionsPerDay, daysOverride: r.daysOverride || null,
    sortOrder: idx + 1, notes: r.notes || '', instructions: r.instructions || '',
    prepTimeMinutes: r.prepTimeMinutes || null, tags: r.tags || [], archivedAt: null, deleted: false,
    images: [],
    ingredients: (r.ingredients || []).map((x, k) => ({
      ingredientId: (byName.get(x.ingredient.toLowerCase()) || {}).id,
      quantity: x.quantity == null ? null : x.quantity, unit: x.unit || null, note: x.note || '', sortOrder: k + 1,

  }));

    recipes, ingredients, rotation: [], plan: [] };
}

/* ---------- Lokaler Speicher (IndexedDB, Rückfall localStorage) ---------- */
const Store = (() => {
  let dbp = null;
  function open() {
    if (dbp) return dbp;
    dbp = new Promise((res, rej) => {
      if (!('indexedDB' in window)) return rej(new Error('kein IndexedDB'));
      const r = indexedDB.open('essensplanung', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('kv');
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
    return dbp;
  }
  const tx = (mode, fn) => open().then(d => new Promise((res, rej) => {
    const t = d.transaction('kv', mode); const req = fn(t.objectStore('kv'));
    t.oncomplete = () => res(req && req.result); t.onerror = () => rej(t.error);
  }));
  const ls = {
    get: k => { try { const v = localStorage.getItem('ep_kv_' + k); return Promise.resolve(v ? JSON.parse(v) : undefined); } catch (e) { return Promise.resolve(undefined); } },
    set: (k, v) => { try { localStorage.setItem('ep_kv_' + k, JSON.stringify(v)); } catch (e) {} return Promise.resolve(); },
    del: k => { try { localStorage.removeItem('ep_kv_' + k); } catch (e) {} return Promise.resolve(); },
  };
  return {
    get: k => tx('readonly', s => s.get(k)).catch(() => ls.get(k)),
    set: (k, v) => tx('readwrite', s => s.put(v, k)).catch(() => ls.set(k, v)),
    del: k => tx('readwrite', s => s.delete(k)).catch(() => ls.del(k)),

function bytesToB64(bytes) {
  let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
function b64ToBytes(b64) {
  const bin = atob(String(b64).replace(/\s/g, ''));
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

/* ---------- Kryptografie (PBKDF2 + AES-GCM) ---------- */
const Crypt = {
  ITER: 150000,
  async pbkdfKey(password, salt) {
    const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), { name: 'PBKDF2' }, false, ['deriveKey', 'deriveBits']);
    return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: this.ITER, hash: 'SHA-256' }, km, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
  },
  async verifier(password, saltB64) {
    const salt = saltB64 ? b64ToBytes(saltB64) : crypto.getRandomValues(new Uint8Array(16));
    const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), { name: 'PBKDF2' }, false, ['deriveBits']);
    const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt, iterations: this.ITER, hash: 'SHA-256' }, km, 256);
    return { salt: bytesToB64(salt), hash: bytesToB64(new Uint8Array(bits)), iter: this.ITER };
  },
  async check(password, v) { return v && (await this.verifier(password, v.salt)).hash === v.hash; },
  async encWithPassword(password, text) {
    const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
    const key = await this.pbkdfKey(password, salt);
    const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, new TextEncoder().encode(text));
    return { salt: bytesToB64(salt), iv: bytesToB64(iv), data: bytesToB64(new Uint8Array(ct)) };
  },
  async decWithPassword(password, blob) {
    const key = await this.pbkdfKey(password, b64ToBytes(blob.salt));
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64ToBytes(blob.iv) }, key, b64ToBytes(blob.data));
    return new TextDecoder().decode(pt);
  },
  async rawKey(raw) { return crypto.subtle.importKey('raw', raw, { name: 'AES-GCM' }, false, ['encrypt', 'decrypt']); },
  async encRaw(raw, text) {
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, await this.rawKey(raw), new TextEncoder().encode(text));
    return { iv: bytesToB64(iv), data: bytesToB64(new Uint8Array(ct)) };
  },
  async decRaw(raw, blob) {
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64ToBytes(blob.iv) }, await this.rawKey(raw), b64ToBytes(blob.data));
    return new TextDecoder().decode(pt);
  },
};

/* Täglicher Abschluss: vergangene Kochtage gelten als gekocht (5.2 complete) */
function housekeeping() {
  const today = EP.todayISO();
  let changed = false;
  const rot = new Map(db.rotation.map(e => [e.id, e]));
  EP.live(db.plan).forEach(p => {
    if (p.type === 'BLOCKED' || p.date >= today) return;
    if (p.status !== 'DONE') { p.status = 'DONE'; EP.touch(p); changed = true; }
    if (p.type === 'COOK' && p.rotationEntryId) {
      const e = rot.get(p.rotationEntryId);
      if (e && !e.deleted && e.status === 'PLANNED') { EP.completeEntry(e); changed = true; }
    }
  });
  const before = JSON.stringify([db.recipes.length, db.ingredients.length, db.rotation.length, db.plan.length]);
  EP.pruneTombstones(db, 60 * DAY);
  if (before !== JSON.stringify([db.recipes.length, db.ingredients.length, db.rotation.length, db.plan.length])) changed = true;
  return changed;
}

/* ---------- Anmeldung & Sitzung ---------- */
const Auth = {
  get cfg() { return LS.get('ep_auth') || {}; },
  set cfg(v) { LS.set('ep_auth', v); },
  session: null, token: null,
  locked() {
    const l = LS.get('ep_lock');
    return l && l.until && l.until > Date.now() ? Math.ceil((l.until - Date.now()) / 60000) : 0;
  },
  failed() {
    const l = LS.get('ep_lock') || { fails: 0 };
    l.fails = (l.fails || 0) + 1;
    if (l.fails >= 5) { l.until = Date.now() + 15 * 60000; l.fails = 0; }
    LS.set('ep_lock', l);
  },
  async startSession(token) {
    const raw = crypto.getRandomValues(new Uint8Array(32));
    const s = { exp: Date.now() + 90 * DAY, key: bytesToB64(raw), tokenEnc: token ? await Crypt.encRaw(raw, token) : null };
    LS.set('ep_session', s);
    LS.del('ep_lock');
    this.token = token || null;
  },
  async resume() {
    const s = LS.get('ep_session');
    if (!s || !s.exp || s.exp < Date.now()) return false;
    try { this.token = s.tokenEnc ? await Crypt.decRaw(b64ToBytes(s.key), s.tokenEnc) : null; }
    catch (e) { this.token = null; }
    return true;
  },
  logout() { LS.del('ep_session'); this.token = null; },
  /* Token dauerhaft mit dem Haushaltspasswort verschlüsselt ablegen */
  async storeToken(password, token, repo) {
    const c = this.cfg;
    c.tokenEnc = token ? await Crypt.encWithPassword(password, token) : null;
    c.repo = repo || null;
    this.cfg = c;
    const s = LS.get('ep_session');
    if (s) { s.tokenEnc = token ? await Crypt.encRaw(b64ToBytes(s.key), token) : null; LS.set('ep_session', s); }
    this.token = token || null;
  },
  async tokenFromPassword(password) {
    const c = this.cfg;
    if (!c.tokenEnc) return null;
    try { return await Crypt.decWithPassword(password, c.tokenEnc); } catch (e) { return undefined; }
  },
};

      return { enc, auth: this.b64e(new Uint8Array(bits)) };
    })());
    return this.cache.get(secret);
  },
  async enc(key, text) {
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, new TextEncoder().encode(text));
    return 'v1.' + this.b64e(iv) + '.' + this.b64e(new Uint8Array(ct));
  },
  async dec(key, str) {
    const p = String(str || '').split('.');
    if (p.length !== 3 || p[0] !== 'v1') throw new Error('Unbekanntes Datenformat auf dem Server.');
    return new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: this.b64d(p[1]) }, key, this.b64d(p[2])));
  },
  async api(method, path, auth, body) {
    const h = {}; if (auth) h['X-Trip-Auth'] = auth; if (body) h['Content-Type'] = 'application/json';
    const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 20000);
    try {
      const r = await fetch(this.url + '/api/collections/trips/records' + path, { method, headers: h, body: body ? JSON.stringify(body) : undefined, cache: 'no-store', signal: ctl.signal });
      let j = null; try { j = await r.json(); } catch (e) {}

    } catch (e) {

    } finally { clearTimeout(to); }
  },
  fail(r) { const e = new Error('Server antwortet mit Fehler ' + r.status + '.'); e.status = r.status; return e; },
  /* feste Datensatz-ID für ein Bild: 15 Zeichen a–z0–9 */
  async imgId(household, key, suffix) {
    const h = new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(household + '|' + key + '|' + suffix)));
    const a = 'abcdefghijklmnopqrstuvwxyz0123456789'; let s = '';
    for (let i = 0; i < 15; i++) s += a[h[i] % 36];
    return s;
  },
  parseLink(str) {
    const m = /(?:#join=)?([a-z0-9]{15})\.([A-Za-z0-9_-]{43})\s*$/.exec(String(str || '').trim());
    return m ? { id: m[1], secret: m[2] } : null;
  },
  link(id, secret) { return location.origin + location.pathname + '#join=' + id + '.' + secret; },
  /* Haushalt vom Server holen (für "Verbinden") */
  async fetchHousehold(id, secret) {
    const k = await this.keysFor(secret);
    const r = await this.api('GET', '/' + id, k.auth);
    if (r.status === 404) { const e = new Error('Haushalt nicht gefunden. Ist der Link vollständig?'); e.status = 404; throw e; }
    if (r.status !== 200 || !r.json) throw this.fail(r);
    return { remote: repairDb(JSON.parse(await this.dec(k.enc, r.json.data))), updated: r.json.updated, rev: +r.json.rev || 0 };
  },
  /* neuen Haushalt-Datensatz anlegen */
  async create(secret, data) {
    const k = await this.keysFor(secret);
    const r = await this.api('POST', '', null, { auth: k.auth, data: await this.enc(k.enc, JSON.stringify(data)), rev: 1 });
    if (r.status !== 200 || !r.json || !r.json.id) throw this.fail(r);
    return r.json;
  },
};

/* ---------- Abgleich über ein privates GitHub-Repository (alt) oder den eigenen Server ---------- */
const Sync = {
  sha: null, dirty: false, busy: false, again: false, timer: null, poll: null,
  state: 'off', msg: '', lastSync: null,
  gen: 0, remoteRev: 0,
  get repo() { return Auth.cfg.repo || null; },
  get isPB() { const r = this.repo; return !!(r && r.pb); },
  enabled() { return !!(Auth.token && this.repo); },
  async api(path, opts) {
    opts = opts || {};
    const res = await fetch('https://api.github.com' + path, Object.assign({}, opts, {
      cache: 'no-store',
      headers: Object.assign({ Authorization: 'Bearer ' + Auth.token, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' }, opts.headers || {}),
    }));
    return res;
  },
  path(p) { const r = this.repo; return `/repos/${encodeURIComponent(r.owner)}/${encodeURIComponent(r.name)}/contents/${p}`; },
  async getFile(p) {
    const res = await this.api(this.path(p));
    if (res.status === 404) return null;
    if (!res.ok) throw await this.err(res);
    const j = await res.json();
    let b64 = j.content;
    if ((!b64 || j.encoding === 'none') && j.sha) {   // Dateien über 1 MB: über die Blob-Schnittstelle laden
      const r = this.repo;
      const br = await this.api(`/repos/${encodeURIComponent(r.owner)}/${encodeURIComponent(r.name)}/git/blobs/${j.sha}`);
      if (!br.ok) throw await this.err(br);
      b64 = (await br.json()).content;
    }
    return { sha: j.sha, b64 };
  },
  async putFile(p, b64, sha, message) {
    const body = { message, content: b64 };
    if (sha) body.sha = sha;
    const res = await this.api(this.path(p), { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    if (!res.ok) throw await this.err(res);
    return (await res.json()).content.sha;
  },
  async deleteFile(p) {
    const f = await this.getFile(p).catch(() => null);
    if (!f) return;
    await this.api(this.path(p), { method: 'DELETE', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ message: 'Bild entfernt', sha: f.sha }) });
  },
  async err(res) {
    let m = '';
    try { m = (await res.json()).message || ''; } catch (e) {}
    const e = new Error(m || ('HTTP ' + res.status));
    e.status = res.status;
    return e;
  },
  /* Vergleichsform unabhängig von der Reihenfolge */
  canon(d) {
    const c = deep(d);
    ['recipes', 'ingredients', 'rotation', 'plan'].forEach(k => c[k] = (c[k] || []).sort((a, b) => (a.id < b.id ? -1 : 1)));
    return JSON.stringify(c);
  },
  async loadMeta() {
    const m = (await Store.get('sync')) || {};
    this.sha = m.sha || null; this.dirty = !!m.dirty; this.lastSync = m.lastSync || null;
  },
  saveMeta() { return Store.set('sync', { sha: this.sha, dirty: this.dirty, lastSync: this.lastSync }); },
  markDirty() {
    this.dirty = true; this.gen++; this.saveMeta();
    if (!this.enabled()) { this.setState('off'); return; }
    clearTimeout(this.timer);
    this.timer = setTimeout(() => this.run(), 1500);
  },
  setState(s, msg) { this.state = s; this.msg = msg || ''; if (typeof renderSyncPill === 'function') renderSyncPill(); },
  async pull() {
    if (this.isPB) return this.pullPB();
    const f = await this.getFile('data.json');
    if (!f) { this.sha = null; if (db && db.household) this.dirty = true; return false; }
    if (f.sha === this.sha) return false;
    const remote = repairDb(JSON.parse(b64ToUtf8(f.b64)));
    db = repairDb(EP.mergeDb(db, remote));
    EP.normalizePlan(db);
    this.sha = f.sha;
    if (this.canon(db) !== this.canon(remote)) this.dirty = true;
    await Store.set('db', db);
    await this.saveMeta();
    return true;
  },
  async pullPB() {
    const k = await PB.keysFor(Auth.token);
    const r = await PB.api('GET', '/' + this.repo.pb, k.auth);
    if (r.status === 404) { const e = new Error('Haushalt auf dem Server nicht gefunden.'); e.status = 404; throw e; }
    if (r.status !== 200 || !r.json) throw PB.fail(r);
    this.remoteRev = +r.json.rev || 0;
    if (r.json.updated === this.sha) return false;
    const remote = repairDb(JSON.parse(await PB.dec(k.enc, r.json.data)));
    db = repairDb(EP.mergeDb(db, remote));
    EP.normalizePlan(db);
    this.sha = r.json.updated;
    if (this.canon(db) !== this.canon(remote)) this.dirty = true;
    await Store.set('db', db);
    await this.saveMeta();
    return true;
  },
  async pushPB() {
    const k = await PB.keysFor(Auth.token);
    for (let attempt = 0; attempt < 5 && this.dirty; attempt++) {
      const g0 = this.gen;
      const u = await PB.api('PATCH', '/' + this.repo.pb, k.auth, { data: await PB.enc(k.enc, JSON.stringify(db)), rev: (this.remoteRev || 0) + 1 });
      if (u.status === 404) { const e = new Error('Haushalt auf dem Server nicht gefunden.'); e.status = 404; throw e; }
      if (u.status !== 200 || !u.json) throw PB.fail(u);
      this.sha = u.json.updated; this.remoteRev = +u.json.rev || 0;
      if (this.gen === g0) this.dirty = false;
      await this.saveMeta();
      // Kontrolle: Hat zwischenzeitlich ein anderes Gerät geschrieben? Dann zusammenführen und erneut schreiben.
      const v = await PB.api('GET', '/' + this.repo.pb, k.auth);
      if (v.status === 200 && v.json && v.json.updated !== this.sha) await this.pullPB();
    }
  },
  async push() {
    if (this.isPB) return this.pushPB();
    for (let attempt = 0; attempt < 4 && this.dirty; attempt++) {
      try {
        this.sha = await this.putFile('data.json', utf8ToB64(JSON.stringify(db)), this.sha, 'Essensplanung aktualisiert');
        this.dirty = false;
        await this.saveMeta();
      } catch (e) {
        if (e.status === 409 || e.status === 422) { await this.pull(); continue; } // zwischenzeitlich geändert → zusammenführen
        throw e;
      }
    }
  },
  async run(opts) {
    opts = opts || {};
    if (!this.enabled()) { this.setState('off'); return; }
    if (typeof draft !== 'undefined' && draft && !opts.force) return; // während eines Wochenentwurfs nicht dazwischenfunken
    if (this.busy) { this.again = true; return; }
    if (!navigator.onLine) { this.setState('offline'); return; }
    this.busy = true; this.setState('busy');
    try {
      const changed = await this.pull();
      await this.push();
      await Images.sync();
      this.lastSync = Date.now(); await this.saveMeta();
      this.setState('ok');
      if (changed && typeof rerender === 'function') rerender();
    } catch (e) {
      const m = this.isPB ? (e.status === 404 ? 'Haushalt auf dem Server nicht gefunden.' : e.status === 0 ? 'Server nicht erreichbar – wird automatisch wiederholt.' : (e.message || 'Abgleich fehlgeschlagen.'))
        : e.status === 401 ? 'Zugang abgelaufen oder ungültig – Token neu eingeben.'
        : e.status === 403 ? 'Kein Schreibzugriff auf das Repository.'
        : e.status === 404 ? 'Repository nicht gefunden.' : (e.message || 'Abgleich fehlgeschlagen.');
      this.setState(navigator.onLine ? 'err' : 'offline', m);
    } finally {
      this.busy = false;
      if (this.again) { this.again = false; setTimeout(() => this.run(), 300); }
    }
  },
  startPolling() {
    clearInterval(this.poll);
    this.poll = setInterval(() => { if (document.visibilityState === 'visible') this.run(); }, this.isPB ? 30000 : 60000);
  },
  /* Verbindung prüfen: Repository muss existieren und privat sein */
  async checkRepo(owner, name, token) {
    const res = await fetch(`https://api.github.com/repos/${encodeURIComponent(owner)}/${encodeURIComponent(name)}`, {
      cache: 'no-store', headers: { Authorization: 'Bearer ' + token, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' } });
    if (res.status === 401) throw new Error('Der Token ist ungültig oder abgelaufen.');
    if (res.status === 404) throw new Error('Repository nicht gefunden – oder der Token hat keinen Zugriff darauf.');
    if (!res.ok) throw new Error('GitHub antwortet mit Fehler ' + res.status + '.');
    const j = await res.json();
    if (!j.private) throw new Error('Dieses Repository ist öffentlich. Deine Rezepte und dein Wochenplan wären für alle sichtbar – bitte ein privates Repository verwenden.');
    return j;
  },
};

/* ---------- Bilder (lokal in IndexedDB, im Repository unter images/) ---------- */
const Images = {
  mem: new Map(),
  async put(key, full, thumb) {
    await Store.set('img:' + key, full); await Store.set('thumb:' + key, thumb);
    this.mem.set('img:' + key, full); this.mem.set('thumb:' + key, thumb);
    const q = (await Store.get('imgq')) || []; q.push(key); await Store.set('imgq', q);
  },
  async remove(key) {
    const d = (await Store.get('imgdel')) || []; d.push(key); await Store.set('imgdel', d);
  },
  async get(key, thumb) {
    const k = (thumb ? 'thumb:' : 'img:') + key;
    if (this.mem.has(k)) return this.mem.get(k);
    let v = await Store.get(k);
    if (!v && Sync.enabled() && navigator.onLine) {
      try {
        if (Sync.isPB) {
          const kk = await PB.keysFor(Auth.token);
          const r = await PB.api('GET', '/' + await PB.imgId(Sync.repo.pb, key, thumb ? 't' : 'f'), kk.auth);
          if (r.status === 200 && r.json) { v = await PB.dec(kk.enc, r.json.data); await Store.set(k, v); }
        } else {
          const f = await Sync.getFile(`images/${key}${thumb ? '_t' : ''}.jpg`);
          if (f) { v = 'data:image/jpeg;base64,' + f.b64.replace(/\s/g, ''); await Store.set(k, v); }
        }
      } catch (e) {}
    }
    if (v) this.mem.set(k, v);
    return v || null;
  },
  async sync() {
    if (Sync.isPB) return this.syncPB();
    const q = (await Store.get('imgq')) || [];
    const rest = [];
    for (const key of q) {
      try {
        for (const [suffix, sk] of [['', 'img:'], ['_t', 'thumb:']]) {
          const v = await Store.get(sk + key);
          if (!v) continue;
          try { await Sync.putFile(`images/${key}${suffix}.jpg`, v.split(',')[1], null, 'Bild hinzugefügt'); }
          catch (e) { if (e.status !== 422) throw e; } // existiert schon
        }
      } catch (e) { rest.push(key); }
    }
    await Store.set('imgq', rest);
    const d = (await Store.get('imgdel')) || [];
    for (const key of d) {
      try { await Sync.deleteFile(`images/${key}.jpg`); await Sync.deleteFile(`images/${key}_t.jpg`); } catch (e) {}
      await Store.del('img:' + key); await Store.del('thumb:' + key);
    }
    await Store.set('imgdel', []);
  },
  /* Bilder mit dem eigenen Server abgleichen: je Bild ein Datensatz für groß (f) und Vorschau (t) */
  async syncPB() {
    const kk = await PB.keysFor(Auth.token), hh = Sync.repo.pb;
    const q = (await Store.get('imgq')) || [], rest = [];
    for (const key of q) {
      try {
        for (const [suffix, sk] of [['f', 'img:'], ['t', 'thumb:']]) {
          let v = await Store.get(sk + key);
          if (!v) continue;
          if (v.length > 1400000) v = await this.shrink(v);   // Obergrenze eines Datensatzes: 2 MB
          const id = await PB.imgId(hh, key, suffix);
          const r = await PB.api('POST', '', null, { id, auth: kk.auth, data: await PB.enc(kk.enc, v), rev: 1 });
          if (r.status === 200) continue;
          const g = await PB.api('GET', '/' + id, kk.auth);        // existiert schon?
          if (g.status !== 200) throw PB.fail(r);
        }
      } catch (e) { rest.push(key); }
    }
    await Store.set('imgq', rest);
    const d = (await Store.get('imgdel')) || [];
    for (const key of d) {
      try { for (const suffix of ['f', 't']) await PB.api('DELETE', '/' + await PB.imgId(hh, key, suffix), kk.auth); } catch (e) {}
      await Store.del('img:' + key); await Store.del('thumb:' + key);
    }
    await Store.set('imgdel', []);
  },
  async shrink(url) {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const s = Math.min(1, 1200 / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', 0.72);
  },
  /* alle Bildschlüssel der Rezepte (zum ersten Hochladen) */
  allKeys() { const out = new Set(); (db.recipes || []).forEach(r => { if (!r.deleted) (r.images || []).forEach(i => out.add(i.fileKey)); }); return [...out]; },
  /* Bild verkleinern: längste Kante 1600 px + Vorschau 400 px */
  async process(file) {
    if (file.size > 10 * 1024 * 1024) throw new Error('Das Bild ist größer als 10 MB.');
    const url = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsDataURL(file); });
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('Dieses Bildformat kann der Browser nicht lesen.')); i.src = url; });
    const scale = (max, q) => {
      const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas');
      c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      return { url: c.toDataURL('image/jpeg', q), w: c.width, h: c.height };
    };
    const full = scale(1600, 0.82), thumb = scale(400, 0.75);
    return { full: full.url, thumb: thumb.url, width: full.w, height: full.h };
  },
  /* Platzhalter im DOM nachträglich befüllen */
  async hydrate(root) {
    for (const el of $$('img[data-img]', root)) {
      const v = await this.get(el.dataset.img, el.dataset.thumb === '1');
      if (v) el.src = v; else if (el.dataset.hideEmpty) el.remove();
    }
  },
};

/* ==========================================================================
   Essensplanung – App Teil 2: Operationen
   ========================================================================== */
const recipeById = id => db.recipes.find(r => r.id === id) || null;
const rotById = (d, id) => (d || db).rotation.find(e => e.id === id && !e.deleted) || null;
const ingById = id => db.ingredients.find(i => i.id === id) || null;
const liveRecipes = () => EP.live(db.recipes).filter(r => !r.archivedAt);
const isMain = p => EP.laneOf(p) === 'MAIN';
const mainPlan = d => EP.live((d || db).plan).filter(isMain);
const mainDates = d => new Set(mainPlan(d).map(p => p.date));
/* Hauptgericht-Einträge je Datum */
function planByDate(d) {
  const m = new Map();
  mainPlan(d).forEach(p => m.set(p.date, p));
  return m;
}
/* Eintrag einer Zusatzspur (Mittag, Kuchen) an einem Tag */
function laneAt(src, date, lane) { return EP.live((src || db).plan).find(p => p.date === date && EP.laneOf(p) === lane) || null; }
function laneDays(lane) { return ((db.settings.lanes || {})[lane] || { days: [] }).days; }
function laneActiveOn(lane, date) { return laneDays(lane).includes(EP.parseISO(date).getDay()); }
const unreviewedCount = () => EP.live(db.ingredients).filter(i => i.reviewed === false).length;
const blockEntries = (bid, d) => EP.live((d || db).plan).filter(p => p.blockId === bid).sort((a, b) => a.date.localeCompare(b.date));
function daysOf(recipe) { return EP.daysFor(recipe, db.settings); }
function firstFreeFrom(start) { return EP.nextFreeDates(start, 1, mainDates())[0]; }
/* nächster Tag ab start, an dem die Spur aktiv und noch frei ist */
function firstLaneDay(lane, start) {
  for (let i = 0, d = start; i < 60; i++, d = EP.addDays(d, 1)) if (laneActiveOn(lane, d) && !laneAt(db, d, lane)) return d;
  return start;
}

/* ---------- Plan (übernommene Einträge, wirken sofort) ---------- */
function placeBlock(start, o) {
  const recipe = recipeById(o.recipeId);
  const n = daysOf(recipe);
  const dates = EP.nextFreeDates(start, n, mainDates());
  const bid = o.blockId || EP.uuid();
  dates.forEach((date, i) => db.plan.push(EP.touch({
    id: EP.uuid(), date, lane: 'MAIN', type: i ? 'LEFTOVER' : 'COOK', recipeId: recipe.id, blockId: bid,
    dayIndex: i + 1, dayCount: n, rotationEntryId: o.rotationEntryId || null,
    source: o.rotationEntryId ? 'ROTATION' : 'MANUAL', locked: !!o.locked, status: 'PLANNED', note: '', deleted: false,
  })));
  if (o.rotationEntryId) { const e = rotById(null, o.rotationEntryId); if (e && e.status !== 'DONE') EP.planEntry(e); }
  return dates;
}
/* Zusatzspur: ein Gericht an genau einem Tag (kein Resteblock) */
function placeLane(date, lane, recipeId, rotationEntryId) {
  const old = laneAt(db, date, lane);
  if (old) removeBlock(old.blockId, true);
  db.plan.push(EP.touch({ id: EP.uuid(), date, lane, type: 'COOK', recipeId, blockId: EP.uuid(), dayIndex: 1, dayCount: 1,
    rotationEntryId: rotationEntryId || null, source: rotationEntryId ? 'ROTATION' : 'MANUAL', locked: false, status: 'PLANNED', note: '', deleted: false }));
  if (rotationEntryId) { const e = rotById(null, rotationEntryId); if (e && e.status !== 'DONE') EP.planEntry(e); }
}
function swapLane(date, lane) {
  const p = laneAt(db, date, lane); if (!p) return null;
  const info = removeBlock(p.blockId, true);
  const ex = new Set(info && info.rotationEntryId ? [info.rotationEntryId] : []);
  const next = EP.nextEntries(db, 1, ex, rng, lane, EP.monthOf(date))[0];
  if (!next) { placeLane(date, lane, info.recipeId, info.rotationEntryId); return null; }
  placeLane(date, lane, next.recipeId, next.id);
  return recipeById(next.recipeId);
}
function removeBlock(bid, releaseIt) {
  const es = blockEntries(bid);
  if (!es.length) return null;
  const info = { recipeId: es[0].recipeId, rotationEntryId: es[0].rotationEntryId, locked: es[0].locked, start: es[0].date };
  es.forEach(EP.tomb);
  if (releaseIt !== false && info.rotationEntryId) {
    const e = rotById(null, info.rotationEntryId);
    if (e && e.status === 'PLANNED') EP.release(db, e);
  }
  return info;
}
function markCooked(bid) {
  const es = blockEntries(bid);
  es.forEach(p => { p.status = 'DONE'; EP.touch(p); });
  const e = es[0] && es[0].rotationEntryId && rotById(null, es[0].rotationEntryId);
  if (e) EP.completeEntry(e);
}
function toggleLock(bid) {
  const es = blockEntries(bid);
  const v = !(es[0] && es[0].locked);
  es.forEach(p => { p.locked = v; EP.touch(p); });
  return v;
}
function swapBlock(bid) {
  const info = removeBlock(bid, true);
  if (!info) return null;
  const ex = new Set(info.rotationEntryId ? [info.rotationEntryId] : []);
  const next = EP.nextEntries(db, 1, ex, rng, 'MAIN', EP.monthOf(info.start))[0];
  if (!next) { placeBlock(info.start, info); return null; }
  placeBlock(info.start, { recipeId: next.recipeId, rotationEntryId: next.id, locked: info.locked });
  return recipeById(next.recipeId);
}
function moveBlock(bid, newStart) {
  const info = removeBlock(bid, false);
  if (info) placeBlock(newStart, Object.assign({}, info, { blockId: bid }));
}
function blockDay(date, note) {

/* ---------- Wochenentwurf (5.4) ---------- */
let draft = null;
function startDraft(ws) {
  const today = EP.todayISO();
  const days = EP.weekDays(ws), inWeek = new Set(days);
  const clone = { settings: db.settings, recipes: db.recipes, rotation: deep(db.rotation), plan: deep(db.plan) };
  const planLive = EP.live(clone.plan);
  const remove = new Set();
  planLive.forEach(p => {
    if (!inWeek.has(p.date) || p.type === 'BLOCKED' || p.date < today || p.locked) return;
    const cook = planLive.find(x => x.blockId === p.blockId && x.type === 'COOK');
    if (cook && (cook.date < ws || cook.date < today)) return; // Übertrag bzw. bereits begonnen
    remove.add(p.blockId || p.id);
  });
  remove.forEach(bid => {
    const es = planLive.filter(p => p.blockId === bid || p.id === bid);
    es.forEach(EP.tomb);
    const rid = es[0] && es[0].rotationEntryId;
    const e = rid && clone.rotation.find(x => x.id === rid && !x.deleted);
    if (e && e.status === 'PLANNED') EP.release(clone, e);
  });
  draft = { ws, clone, sequence: [], blocked: new Map(), drafts: [], lanes: [] };
  relayoutDraft();
  buildLaneDrafts();
}
/* Zusatzspuren im Entwurf: je aktivem Tag das nächste Gericht der eigenen Rotation */
function buildLaneDrafts() {
  const today = EP.todayISO();
  draft.lanes = [];
  ['LUNCH', 'CAKE'].forEach(lane => {
    const used = new Set();
    EP.weekDays(draft.ws).forEach(d => {
      if (d < today || !laneActiveOn(lane, d) || laneAt(draft.clone, d, lane)) return;
      const e = EP.nextEntries(draft.clone, 1, used, rng, lane, EP.monthOf(d))[0];
      if (!e) return;
      used.add(e.id);
      draft.lanes.push({ id: EP.uuid(), date: d, lane, recipeId: e.recipeId, rotationEntryId: e.id });
    });
  });
}
const laneUsed = lane => new Set(draft.lanes.filter(x => x.lane === lane && x.rotationEntryId).map(x => x.rotationEntryId));
function draftLane(date, lane) { return draft.lanes.find(x => x.date === date && x.lane === lane) || null; }
function draftLaneNext(date, lane) {
  let x = draftLane(date, lane);
  const e = EP.nextEntries(draft.clone, 1, laneUsed(lane), rng, lane, EP.monthOf(date))[0];
  if (!e) return notify('Keine weiteren Gerichte in dieser Rotation.');
  if (!x) { x = { id: EP.uuid(), date, lane }; draft.lanes.push(x); }
  x.recipeId = e.recipeId; x.rotationEntryId = e.id;
}
function draftLanePick(date, lane, recipeId) {
  let x = draftLane(date, lane);
  const used = laneUsed(lane); if (x) used.delete(x.rotationEntryId);
  const e = EP.manualPickEntry(draft.clone, recipeId, used);
  if (!x) { x = { id: EP.uuid(), date, lane }; draft.lanes.push(x); }
  x.recipeId = recipeId; x.rotationEntryId = e ? e.id : null;
}
function draftLaneRemove(date, lane) { draft.lanes = draft.lanes.filter(x => !(x.date === date && x.lane === lane)); }
function relayoutDraft() {
  const days = EP.weekDays(draft.ws);
  const occupied = mainDates(draft.clone);
  draft.blocked.forEach((_, d) => occupied.add(d));
  const res = EP.layoutDraft({
    days, occupied, sequence: draft.sequence,
    nextFn: (ex, start) => EP.nextEntries(draft.clone, 1, ex, rng, 'MAIN', EP.monthOf(start))[0],
    recipeOf: recipeById, settings: db.settings, today: EP.todayISO(),
  });

  draft.drafts = res.drafts;
}
function draftUsed() { return new Set(draft.sequence.filter(s => s.kind === 'ROT').map(s => s.entryId)); }
function draftSwap(bid) {
  const i = draft.sequence.findIndex(s => s.blockId === bid);
  if (i < 0) return;
  const at = (draft.drafts.find(x => x.blockId === bid) || {}).date || draft.ws;
  const next = EP.nextEntries(draft.clone, 1, draftUsed(), rng, 'MAIN', EP.monthOf(at))[0];
  if (!next) return notify('Keine weiteren Gerichte in der Rotation.');
  draft.sequence[i] = { kind: 'ROT', entryId: next.id, recipeId: next.recipeId, blockId: bid, locked: draft.sequence[i].locked };
  relayoutDraft();
}
function draftMove(bid, dir) {
  const i = draft.sequence.findIndex(s => s.blockId === bid), j = i + dir;

}
function draftPick(bid, recipeId) {
  const i = draft.sequence.findIndex(s => s.blockId === bid);

  const used = draftUsed(); used.delete(draft.sequence[i].entryId);
  const e = EP.manualPickEntry(draft.clone, recipeId, used);
  draft.sequence[i] = e ? { kind: 'ROT', entryId: e.id, recipeId, blockId: bid, locked: draft.sequence[i].locked }

}
function draftToggleLock(bid) {

}

  const c = draft.clone;
  draft.drafts.forEach(d => {
    c.plan.push(EP.touch(Object.assign({ id: EP.uuid(), deleted: false }, d)));
    if (d.type === 'COOK' && d.rotationEntryId) {
      const e = c.rotation.find(x => x.id === d.rotationEntryId && !x.deleted);
      if (e) EP.planEntry(e);
    }
  });
  draft.lanes.forEach(x => {
    c.plan.push(EP.touch({ id: EP.uuid(), date: x.date, lane: x.lane, type: 'COOK', recipeId: x.recipeId, blockId: EP.uuid(), dayIndex: 1, dayCount: 1,
      rotationEntryId: x.rotationEntryId || null, source: x.rotationEntryId ? 'ROTATION' : 'MANUAL', locked: false, status: 'PLANNED', note: '', deleted: false }));
    const e = x.rotationEntryId && c.rotation.find(r => r.id === x.rotationEntryId && !r.deleted);
    if (e) EP.planEntry(e);
  });
  draft.blocked.forEach((note, date) => c.plan.push(EP.touch({ id: EP.uuid(), date, lane: 'MAIN', type: 'BLOCKED', recipeId: null, blockId: null,
    dayIndex: 0, dayCount: 0, rotationEntryId: null, source: 'MANUAL', locked: false, status: 'PLANNED', note, deleted: false })));

}
/* Anzeige-Einträge einer Woche (übernommen oder Entwurf): Hauptgerichte + Zusatzspuren */
function weekEntries(ws) {
  const days = EP.weekDays(ws);
  const isDraft = draft && draft.ws === ws;
  const src = isDraft ? draft.clone : db;
  const m = planByDate(src);
  const out = new Map(), lanes = { LUNCH: new Map(), CAKE: new Map() };
  days.forEach(d => {
    if (m.has(d)) out.set(d, Object.assign({ drafted: false }, m.get(d)));
    ['LUNCH', 'CAKE'].forEach(l => { const p = laneAt(src, d, l); if (p) lanes[l].set(d, Object.assign({ drafted: false }, p)); });
  });
  if (isDraft) {
    draft.blocked.forEach((note, d) => out.set(d, { date: d, type: 'BLOCKED', note, drafted: true, extraBlocked: true }));
    draft.drafts.forEach(x => { if (days.includes(x.date)) out.set(x.date, Object.assign({ drafted: true }, x)); });
    draft.lanes.forEach(x => lanes[x.lane].set(x.date, Object.assign({ drafted: true, type: 'COOK' }, x)));
  }
  out.lanes = lanes;
  return out;
}

/* ---------- Rezepte ---------- */
function findRecipeByName(name) {
  const n = name.trim().toLowerCase();
  return EP.live(db.recipes).find(r => r.name.trim().toLowerCase() === n) || null;
}
function newRecipe(name, kind) {
  kind = kind || 'MAIN';
  const max = EP.live(db.recipes).reduce((m, r) => Math.max(m, r.sortOrder || 0), 0);
  return EP.touch({ id: EP.uuid(), name: name.trim().slice(0, 120), kind, seasonMonths: null, inRotation: true, weight: 1,
    servings: kind === 'CAKE' ? 12 : db.settings.portionsPerDay, daysOverride: null, sortOrder: max + 1, notes: '', instructions: '',
    prepTimeMinutes: null, tags: [], archivedAt: null, deleted: false, images: [], ingredients: [] });
}
/* Schnellerfassung – liefert {added, restored, skipped} */
function quickAdd(lines, kind) {
  const res = { added: 0, restored: 0, skipped: 0 };
  lines.map(l => l.replace(/^[-*•\d.)\s]+/, '').trim()).filter(Boolean).forEach(name => {
    const ex = findRecipeByName(name);
    if (ex && !ex.archivedAt) { res.skipped++; return; }
    if (ex) { ex.archivedAt = null; ex.inRotation = true; EP.touch(ex); EP.syncRecipeIntoCycles(db, ex, rng); res.restored++; return; }
    const r = newRecipe(name, kind);
    db.recipes.push(r);
    EP.syncRecipeIntoCycles(db, r, rng);
    res.added++;
  });
  return res;
}

function setInRotation(r, v) { r.inRotation = v; EP.touch(r); EP.syncRecipeIntoCycles(db, r, rng); }

async function importData(json, mode) {
  const src = repairDb(json.data || json);

  if (mode === 'replace') {
    // alles Bestehende als gelöscht markieren (damit der Abgleich es auch auf anderen Geräten entfernt)
    ['recipes', 'ingredients', 'rotation', 'plan'].forEach(k => EP.live(db[k]).forEach(EP.tomb));
    ['recipes', 'ingredients', 'rotation', 'plan'].forEach(k => src[k].forEach(x => { EP.touch(x); db[k].push(x); }));

    const ex = findIngredient(i.name);
    if (ex) idMap.set(i.id, ex.id);
    else { const n = createIngredient(i.name, i.category, i.defaultUnit, i.reviewed !== false); n.shoppingSource = i.shoppingSource || null; idMap.set(i.id, n.id); }
  });
  let added = 0, updated = 0;
  EP.live(src.recipes).filter(r => !r.archivedAt).forEach(r => {
    const ings = r.ingredients.map(x => Object.assign({}, x, { ingredientId: idMap.get(x.ingredientId) })).filter(x => x.ingredientId);
    const ex = findRecipeByName(r.name);
    if (ex) {
      Object.assign(ex, { kind: r.kind || 'MAIN', seasonMonths: r.seasonMonths || null, servings: r.servings, weight: r.weight, daysOverride: r.daysOverride, notes: r.notes, instructions: r.instructions,
        prepTimeMinutes: r.prepTimeMinutes, tags: r.tags, ingredients: ings, images: r.images.length ? r.images : ex.images, archivedAt: null });
      EP.touch(ex); EP.syncRecipeIntoCycles(db, ex, rng); updated++;
    } else {
      const n = newRecipe(r.name, r.kind);
      Object.assign(n, { seasonMonths: r.seasonMonths || null, inRotation: r.inRotation, weight: r.weight, servings: r.servings, daysOverride: r.daysOverride, notes: r.notes,
        instructions: r.instructions, prepTimeMinutes: r.prepTimeMinutes, tags: r.tags, ingredients: ings, images: r.images });
      db.recipes.push(n); EP.syncRecipeIntoCycles(db, n, rng); added++;
    }
  });
  return { added, updated };
}
