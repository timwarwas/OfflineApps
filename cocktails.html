<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cocktailübersicht – Rezepte als technische Zeichnung</title>
<meta name="description" content="Cocktailrezepte als technisches Zeichnungsblatt: Glas-Schnittzeichnung mit farbigen Zutatenschichten, Legende und Schriftfeld. Läuft ohne Server im Browser.">
<meta name="color-scheme" content="light">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M6 6h20L18 17v7h5v2H9v-2h5v-7z' fill='none' stroke='%23000' stroke-width='2'/%3E%3Cpath d='M9.5 9.5h13L18 15h-4z' fill='%23C8102E'/%3E%3C/svg%3E">
<style>*{box-sizing:border-box}
:root{
  --desk:#D6D7CE;      /* Zeichentisch */
  --desk-dk:#BFC1B6;
  --panel:#FFFFFF;
  --ink:#000000;
  --ink-2:#4A4C46;
  --ink-3:#7C7F76;
  --rule:#B9BBB1;
  --rule-2:#E2E3DC;
  --signal:#C8102E;    /* Revisionsrot – einziger Akzent */
  --focus:#1D4ED8;
  --font:'Helvetica Neue',Helvetica,Arial,sans-serif;
}
html,body{margin:0;height:100%}
body{
  font-family:var(--font);font-size:14px;line-height:1.45;color:var(--ink);
  background:var(--desk);
  -webkit-text-size-adjust:100%;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--focus)}
:focus-visible{outline:2px solid var(--focus);outline-offset:1px}

/* ---------- Kopfleiste ---------- */
.bar{
  position:sticky;top:0;z-index:30;background:var(--panel);
  border-bottom:1px solid var(--rule);
  display:flex;align-items:stretch;flex-wrap:wrap;gap:0;
}
.brand{display:flex;align-items:center;gap:10px;padding:10px 14px;border-right:1px solid var(--rule-2)}
.brand b{font-size:15px;letter-spacing:.02em}
.brand span{font-size:11px;color:var(--ink-3)}
.brand svg{display:block}
.bar .projsel{display:flex;align-items:center;gap:6px;padding:8px 12px;border-right:1px solid var(--rule-2);flex:1 1 200px;min-width:0}
.bar .projsel select{flex:1;min-width:0}
.tabs{display:flex;margin-left:auto}
.tabs button{
  appearance:none;background:none;border:0;border-left:1px solid var(--rule-2);
  padding:12px 18px;font-size:13px;color:var(--ink-2);position:relative;white-space:nowrap;
}
.tabs button[aria-selected="true"]{color:var(--ink);font-weight:700}
.tabs button[aria-selected="true"]::after{
  content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;background:var(--signal);
}
.tabs .cnt{display:inline-block;margin-left:6px;font-size:11px;color:var(--ink-3);font-weight:400}

/* ---------- Grundraster ---------- */
main{padding:14px;max-width:1500px;margin:0 auto}
.panel{background:var(--panel);border:1px solid var(--rule)}
.panel>h2{
  margin:0;padding:9px 12px;font-size:12px;letter-spacing:.06em;font-weight:700;
  border-bottom:1px solid var(--rule-2);display:flex;align-items:center;gap:8px;
}
.panel>h2 .sub{font-weight:400;color:var(--ink-3);letter-spacing:0}
.pad{padding:12px}
.split{display:grid;grid-template-columns:340px 1fr;gap:14px;align-items:start}
@media(max-width:900px){.split{grid-template-columns:1fr}}

/* ---------- Bedienelemente ---------- */
.field{display:block;margin-bottom:10px}
.field>span{display:block;font-size:11px;color:var(--ink-3);margin-bottom:3px}
input[type=text],input[type=number],input[type=date],select,textarea{
  width:100%;padding:6px 8px;border:1px solid var(--rule);background:#FBFBF9;border-radius:2px;
}
textarea{min-height:64px;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1;min-width:0}
.btn{
  appearance:none;-webkit-appearance:none;margin:0;
  border:1px solid var(--ink);background:var(--panel);padding:7px 12px;border-radius:2px;
  font-size:13px;line-height:1.2;text-align:center;
  display:inline-flex;align-items:center;justify-content:center;
}
.btn:hover{background:#F0F0EA}
.btn.primary{background:var(--ink);color:#fff}
.btn.primary:hover{background:#222}
.btn.danger{border-color:var(--signal);color:var(--signal)}
.btn.small{padding:4px 8px;font-size:12px}
.btn.ghost{border-color:var(--rule)}
.btn[disabled]{opacity:.4;cursor:default}
.chk{display:flex;align-items:center;gap:7px;margin-bottom:7px;font-size:13px}
.chk input{width:16px;height:16px;flex:none}
.hint{font-size:12px;color:var(--ink-3)}

/* ---------- Fundus ---------- */
.filters{display:flex;gap:8px;flex-wrap:wrap;padding:12px;border-bottom:1px solid var(--rule-2)}
.filters input[type=text]{flex:2 1 200px}
.filters select{flex:1 1 130px}
.grid{
  display:grid;gap:1px;background:var(--rule-2);
  grid-template-columns:repeat(auto-fill,minmax(168px,1fr));
}
.tile{background:var(--panel);padding:8px;display:flex;flex-direction:column;gap:6px}
.tile .art{background:#fff;height:150px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.tile .art svg{max-height:100%;width:auto}
.tile h3{margin:0;font-size:13px;line-height:1.25}
.tile .meta{font-size:11px;color:var(--ink-3);margin-top:-2px}
.tile .acts{display:flex;gap:5px;margin-top:auto}
.tile .acts .btn{flex:1;text-align:center}
.tile.inproj{box-shadow:inset 3px 0 0 var(--signal)}
.badge{display:inline-block;font-size:10px;border:1px solid var(--rule);padding:0 4px;color:var(--ink-3)}

/* ---------- Projektliste ---------- */
.plist{list-style:none;margin:0;padding:0}
.plist li{display:flex;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--rule-2)}
.plist .num{font-size:11px;color:var(--ink-3);width:22px;text-align:right;flex:none;font-variant-numeric:tabular-nums}
.plist .thumb{width:44px;height:56px;flex:none;background:#fff;border:1px solid var(--rule-2)}
.plist .thumb svg{width:100%;height:100%}
.plist .txt{flex:1;min-width:0}
.plist .txt b{font-size:13px;display:block}
.plist .txt small{color:var(--ink-3);font-size:11px}
.plist .acts{display:flex;gap:4px;flex:none;flex-wrap:wrap;justify-content:flex-end}
.empty{padding:28px 16px;text-align:center;color:var(--ink-3)}

/* ---------- Blattvorschau ---------- */
.viewer{background:var(--desk-dk);padding:12px;overflow:auto;max-height:76vh}
.viewer .sheet{
  background:#fff;margin:0 auto;box-shadow:0 1px 0 rgba(0,0,0,.25),0 6px 18px rgba(0,0,0,.16);
}
.viewer .sheet svg{display:block;width:100%;height:auto}
.vbar{display:flex;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--rule-2);flex-wrap:wrap}
.vbar .sp{flex:1}
.pagenav{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2)}

/* ---------- Zutatenzeilen im Editor ---------- */
.ings{display:flex;flex-direction:column;gap:6px}
.ing{display:grid;grid-template-columns:20px 1fr 62px 84px 74px 30px;gap:5px;align-items:center}
.ing .h{font-size:10px;color:var(--ink-3)}
.ing .pos{font-size:11px;color:var(--ink-3);text-align:right;font-variant-numeric:tabular-nums}
@media(max-width:640px){
  .ing{grid-template-columns:20px 1fr 30px;grid-auto-rows:auto}
  .ing>select.u,.ing>input.a,.ing>select.p{grid-column:2/4}
}
.garnpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px;max-height:190px;overflow:auto;border:1px solid var(--rule);padding:8px;background:#FBFBF9}
.garnpick label{display:flex;gap:6px;align-items:center;font-size:12px}

/* ---------- Dialog ---------- */
dialog{
  border:1px solid var(--ink);padding:0;background:var(--panel);width:min(980px,96vw);
  max-height:92vh;overflow:auto;border-radius:2px;
}
dialog::backdrop{background:rgba(30,32,28,.55)}
.dlg-head{position:sticky;top:0;background:var(--panel);border-bottom:1px solid var(--rule);
  padding:10px 14px;display:flex;align-items:center;gap:10px;z-index:2}
.dlg-head h2{margin:0;font-size:15px;flex:1}
.dlg-body{padding:14px}
.dlg-foot{position:sticky;bottom:0;background:var(--panel);border-top:1px solid var(--rule);
  padding:10px 14px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.edsplit{display:grid;grid-template-columns:1fr 260px;gap:16px;align-items:start}
@media(max-width:760px){.edsplit{grid-template-columns:1fr}}
.livebox{background:#fff;border:1px solid var(--rule);position:sticky;top:56px}
.livebox svg{display:block;width:100%;height:auto}

/* ---------- Meldungen ---------- */
#toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:20px;z-index:60;
  background:var(--ink);color:#fff;padding:9px 15px;border-radius:2px;font-size:13px;
  opacity:0;pointer-events:none;transition:opacity .18s;max-width:92vw;
}
#toast.on{opacity:1}
.revtable{width:100%;border-collapse:collapse;font-size:12px}
.revtable th,.revtable td{border:1px solid var(--rule-2);padding:3px 5px;text-align:left}
.revtable th{font-size:10px;color:var(--ink-3);font-weight:600}
.notelist{list-style:none;margin:0;padding:0}
.notelist li{display:flex;gap:6px;align-items:flex-start;margin-bottom:5px}
.notelist .n{font-size:11px;color:var(--ink-3);width:16px;flex:none;padding-top:7px;text-align:right}
.qrbox{text-align:center;padding:8px}
.qrbox svg{max-width:100%;height:auto;border:1px solid var(--rule-2)}
.linkout{width:100%;font-size:11px;word-break:break-all;background:#FBFBF9;border:1px solid var(--rule);padding:6px;max-height:96px;overflow:auto}

@media print{
  body{background:#fff}
  .bar,main,#toast{display:none !important}
  #printarea{display:block !important}
  #printarea .sheet{page-break-after:always;break-after:page}
  #printarea .sheet:last-child{page-break-after:auto;break-after:auto}
  #printarea svg{width:100%;height:auto;display:block}
}
#printarea{display:none}

/* Aktionsleiste unter der Vorschau: gleichmäßige Kacheln, auf dem Telefon zweispaltig */
.actrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.actrow .btn{white-space:nowrap;min-height:40px}
@media(max-width:480px){.actrow{grid-template-columns:1fr 1fr}.actrow .btn:first-child{grid-column:1/-1}}

/* Auswahl von Farbe, Muster und Piktogramm für eigene Definitionen */
.lbl{display:block;font-size:11px;color:var(--ink-3);margin:12px 0 4px}
.swatches{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.swatches .sw{width:26px;height:20px;border:1px solid var(--rule);border-radius:2px;padding:0}
.swatches .sw.on{outline:2px solid var(--signal);outline-offset:1px}
.swatches input[type=color]{width:34px;height:22px;padding:0;border:1px solid var(--rule);background:none}
.patgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:4px;
  max-height:190px;overflow:auto;border:1px solid var(--rule);padding:6px;background:#FBFBF9}
.patgrid .pat{padding:2px;border:1px solid var(--rule-2);background:#fff;border-radius:2px;height:30px}
.patgrid .pat.on{border-color:var(--signal);box-shadow:inset 0 0 0 1px var(--signal)}
.picgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:4px;
  max-height:190px;overflow:auto;border:1px solid var(--rule);padding:6px;background:#FBFBF9}
.picgrid .pic{padding:3px;border:1px solid var(--rule-2);background:#fff;border-radius:2px;height:42px}
.picgrid .pic.on{border-color:var(--signal);box-shadow:inset 0 0 0 1px var(--signal)}
.patprev{width:70px;height:22px;border:1px solid var(--rule)}
.swpr{width:46px;flex:none;border:1px solid var(--rule-2);background:#fff}
.editorwhere{flex:1;text-align:right;padding-right:6px}
@media(max-width:640px){.editorwhere{display:none}}
#dlg2{width:min(680px,96vw)}
</style>
<style id="pagestyle">@page{size:594mm 420mm;margin:0}</style>

function C(id, name, cat, base, glass, ice, method, desc, ings, garn, tags, extra) {
  var o = {
    id:id, name:name, category:cat, baseSpirit:base, glass:glass, ice:ice,
    method:method, description:desc,
    ingredients: ings.map(function(a, i) {
      return { pos:i+1, ingredientId:a[0], name:(ING_BY_ID[a[0]]||{}).name || a[0],
               amount:(a[1]===null?null:a[1]), unit:a[2], prep:a[3]||'b' };
    }),
    garnish: (garn||[]).map(function(g) {
      return (typeof g === 'string') ? { id:g, count:1 } : { id:g[0], count:g[1] };
    }),
    tags: tags||[], altName:null, note:null, noteRef:null
  };
  if (extra) for (var k in extra) o[k] = extra[k];
  return o;
}

/* ============================================================
   Zeichen-Kern
   Alle Koordinaten in Millimetern auf dem Blatt, y nach unten.
   Die Ops-Liste wird sowohl nach SVG (Bildschirm) als auch nach
   PDF (Export) ausgegeben – identische Geometrie in beiden Wegen.
   ============================================================ */

var INK = '#000000';

function Drw() { this.ops = []; }
Drw.prototype.line = function (x1, y1, x2, y2, o) {
  o = o || {}; this.ops.push({ t:'l', x1:x1, y1:y1, x2:x2, y2:y2,
    w:o.w||0.18, c:o.c||INK, d:o.d||null }); return this;
};
Drw.prototype.path = function (segs, o) {
  o = o || {}; this.ops.push({ t:'p', segs:segs, w:(o.w===0?0:(o.w||0.18)),
    c:o.c||INK, fill:o.fill||null, close:!!o.close }); return this;
};
Drw.prototype.poly = function (pts, o) {
  var segs = [['M', pts[0][0], pts[0][1]]];
  for (var i = 1; i < pts.length; i++) segs.push(['L', pts[i][0], pts[i][1]]);
  if (o && o.close) segs.push(['Z']);
  return this.path(segs, o);
};
Drw.prototype.rect = function (x, y, w, h, o) {
  return this.poly([[x,y],[x+w,y],[x+w,y+h],[x,y+h]], Object.assign({close:true}, o||{}));
};
Drw.prototype.circ = function (cx, cy, r, o) {
  o = o || {}; this.ops.push({ t:'c', cx:cx, cy:cy, r:r, w:(o.w===0?0:(o.w||0.18)),
    c:o.c||INK, fill:o.fill||null }); return this;
};
Drw.prototype.text = function (x, y, s, o) {
  o = o || {}; if (s === null || s === undefined || s === '') return this;
  this.ops.push({ t:'t', x:x, y:y, s:String(s), size:o.size||2.2, anchor:o.anchor||'start',
    c:o.c||INK, bold:!!o.bold, rot:o.rot||0, ul:!!o.ul, ls:o.ls||0 }); return this;
};
Drw.prototype.clip = function (segs) { this.ops.push({ t:'k', segs:segs }); return this; };
Drw.prototype.unclip = function () { this.ops.push({ t:'u' }); return this; };
Drw.prototype.add = function (other) { this.ops = this.ops.concat(other.ops); return this; };

  201:667,193:667,241:556,237:278,243:556,250:556,226:556,234:556,238:278,244:556,251:556,171:556,187:556 };
var WINANSI_EXTRA_WB = { 228:556,246:611,252:611,196:722,214:778,220:722,223:611,233:556,232:556,231:556,
  225:556,224:556,150:556,151:1000,145:278,146:278,147:500,148:500,183:278,176:400,215:584,133:1000,
  201:667,193:722,241:611,237:278,243:611,250:611,226:556,234:556,238:278,244:611,251:611,171:556,187:556 };

function charCodeWA(ch) {
  var c = ch.charCodeAt(0);
  if (c < 127) return c;
  if (WINANSI[ch] !== undefined) return WINANSI[ch];
  return 63; /* ? */
}
function textWidth(s, size, bold, ls) {
  var t = 0, tbl = bold ? HELVB_W : HELV_W, ex = bold ? WINANSI_EXTRA_WB : WINANSI_EXTRA_W;
  for (var i = 0; i < s.length; i++) {
    var c = charCodeWA(s[i]);
    var w = (c < 127 ? tbl[c] : ex[c]);
    t += (w === undefined ? 556 : w);
  }
  return t / 1000 * size + (ls || 0) * Math.max(0, s.length - 1);
}

/* ---------- Geometrie ---------- */
function catmull(pts, samples) {
  /* Catmull-Rom durch alle Punkte, gibt dichte Punktfolge zurück */
  if (pts.length < 3) return pts.slice();
  var p = [pts[0]].concat(pts, [pts[pts.length - 1]]), out = [];
  for (var i = 0; i < p.length - 3; i++) {
    var p0 = p[i], p1 = p[i+1], p2 = p[i+2], p3 = p[i+3];
    for (var j = 0; j < samples; j++) {
      var t = j / samples, t2 = t*t, t3 = t2*t;
      out.push([
        0.5*((2*p1[0]) + (-p0[0]+p2[0])*t + (2*p0[0]-5*p1[0]+4*p2[0]-p3[0])*t2 + (-p0[0]+3*p1[0]-3*p2[0]+p3[0])*t3),
        0.5*((2*p1[1]) + (-p0[1]+p2[1])*t + (2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*t2 + (-p0[1]+3*p1[1]-3*p2[1]+p3[1])*t3)
      ]);
    }
  }
  out.push(pts[pts.length - 1]);
  return out;
}
function bboxOf(pts) {
  var x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (var i = 0; i < pts.length; i++) {
    if (pts[i][0] < x0) x0 = pts[i][0]; if (pts[i][0] > x1) x1 = pts[i][0];
    if (pts[i][1] < y0) y0 = pts[i][1]; if (pts[i][1] > y1) y1 = pts[i][1];
  }
  return { x0:x0, y0:y0, x1:x1, y1:y1 };
}
function segsFromPts(pts, close) {
  var s = [['M', pts[0][0], pts[0][1]]];
  for (var i = 1; i < pts.length; i++) s.push(['L', pts[i][0], pts[i][1]]);
  if (close) s.push(['Z']);
  return s;
}

/* Musterfeld für die Legende */
function hatchSwatch(drw, x, y, w, h, style, opt) {
  fillHatched(drw, [[x,y],[x+w,y],[x+w,y+h],[x,y+h]], style,
    Object.assign({ scale:1, lw:0.12 }, opt || {}));
}

/* ---------- Zahlformat ---------- */
function fmtNum(n) {
  if (n === null || n === undefined) return '';
  var r = Math.round(n * 100) / 100;
  return String(r).replace('.', ',');
}
function amountLabel(ing, unit) {
  /* Liefert die Beschriftung einer Bezugslinie */
  var u = UNIT_BY_ID[ing.unit] || { name:ing.unit, ml:10 };
  if (ing.unit === 'fill') return 'auffüllen';
  if (ing.unit === 'cl') {
    var ml = ing.amount * 10;
    if (unit === 'ml') return fmtNum(ml) + ' ml';
    if (unit === 'oz') return fmtNum(Math.round(ml / 2.957) / 10) + ' oz. (' + fmtNum(ml) + ' ml)';
    return fmtNum(ing.amount) + ' cl (' + fmtNum(ml) + ' ml)';
  }
  if (ing.unit === 'ml') return fmtNum(ing.amount) + ' ml';
  return fmtNum(ing.amount) + ' ' + u.name;
}
function volLabel(ml, unit) {
  if (unit === 'ml') return fmtNum(ml) + ' ml';
  if (unit === 'oz') return fmtNum(Math.round(ml / 2.957) / 10) + ' oz. (' + fmtNum(ml) + ' ml)';
  return fmtNum(ml / 10) + ' cl (' + fmtNum(ml) + ' ml)';
}
function mlOf(ing) {
  var u = UNIT_BY_ID[ing.unit];
  if (!u || ing.amount === null) return 0;
  return ing.amount * u.ml;
}

/* ============================================================
   Piktogramme (Garnitur/Zusätze) und Methodensymbole
   Alle zeichnen zentriert um (x,y) in eine Box der Höhe s.
   ============================================================ */
function arcPts(cx, cy, r, a0, a1, n) {
  var p = [], i;
  for (i = 0; i <= n; i++) {
    var a = a0 + (a1 - a0) * i / n;
    p.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]);
  }
  return p;
}
function leaf(drw, x, y, len, ang, lw) {
  var a = ang * Math.PI / 180, dx = Math.cos(a) * len, dy = Math.sin(a) * len;
  var mx = x + dx / 2, my = y + dy / 2, w = len * 0.34;
  var px = -Math.sin(a) * w, py = Math.cos(a) * w;
  drw.path([['M', x, y], ['C', mx + px, my + py, mx + px, my + py, x + dx, y + dy],
            ['C', mx - px, my - py, mx - px, my - py, x, y]], { w:lw, c:INK });
}

function drawPic(drw, type, x, y, s, lw) {
  lw = lw || 0.15;
  var o = { w:lw, c:INK }, of = { w:lw, c:INK, fill:'#FFFFFF' }, i, p;
  switch (type) {

    case 'cherry':
      drw.circ(x - s*0.06, y + s*0.18, s*0.28, of);
      drw.path([['M', x - s*0.06, y - s*0.10], ['C', x + s*0.10, y - s*0.28, x + s*0.22, y - s*0.36, x + s*0.34, y - s*0.44]], o);
      leaf(drw, x + s*0.30, y - s*0.44, s*0.26, -20, lw);
      break;

    case 'olive':
      drw.path(segsFromPts(arcPts(x, y, s*0.30, 0, Math.PI*2, 22).map(function(q){ return [x + (q[0]-x)*0.86, q[1]]; }), true), of);
      drw.circ(x, y, s*0.10, { w:lw, c:INK, fill:'#FFFFFF' });
      break;

    case 'onion':
      drw.circ(x, y, s*0.28, of);
      drw.path([['M', x - s*0.18, y - s*0.14], ['L', x + s*0.02, y - s*0.30]], o);
      drw.path([['M', x - s*0.02, y + s*0.26], ['L', x + s*0.16, y + s*0.10]], o);
      break;

    case 'orange': case 'lemon': case 'lime': {
      /* Achtelsegment */
      var r = s*0.44, a0 = -Math.PI*0.72, a1 = -Math.PI*0.28;
      p = [[x, y + r*0.42]].concat(arcPts(x, y + r*0.42, r, a0, a1, 10));
      drw.path(segsFromPts(p, true), of);
      drw.path(segsFromPts(arcPts(x, y + r*0.42, r*0.80, a0 + 0.10, a1 - 0.10, 8), false), { w:lw*0.8, c:INK });
      for (i = 1; i <= 3; i++) {
        var aa = a0 + (a1 - a0) * i / 4;
        drw.line(x + Math.cos(aa)*r*0.14, y + r*0.42 + Math.sin(aa)*r*0.14,
                 x + Math.cos(aa)*r*0.76, y + r*0.42 + Math.sin(aa)*r*0.76, { w:lw*0.7 });
      }
      break;
    }

    case 'limeslice': case 'orangefull': case 'lemonfull':
      drw.circ(x, y, s*0.40, of);
      drw.circ(x, y, s*0.31, { w:lw*0.8, c:INK });
      for (i = 0; i < 6; i++) {
        var ang = i * Math.PI / 3 + 0.3;
        drw.line(x + Math.cos(ang)*s*0.05, y + Math.sin(ang)*s*0.05,
                 x + Math.cos(ang)*s*0.29, y + Math.sin(ang)*s*0.29, { w:lw*0.7 });
      }
      break;

    case 'dash':
      drw.path([['M', x, y - s*0.34], ['C', x + s*0.24, y + s*0.02, x + s*0.18, y + s*0.30, x, y + s*0.30],
                ['C', x - s*0.18, y + s*0.30, x - s*0.24, y + s*0.02, x, y - s*0.34]], of);
      break;

    case 'icecube':
      drw.poly([[x - s*0.34, y - s*0.14],[x - s*0.06, y - s*0.34],[x + s*0.34, y - s*0.34],
                [x + s*0.34, y + s*0.16],[x + s*0.06, y + s*0.34],[x - s*0.34, y + s*0.34]], Object.assign({close:true}, of));
      drw.line(x - s*0.34, y - s*0.14, x + s*0.06, y - s*0.14, o);
      drw.line(x + s*0.06, y - s*0.14, x + s*0.34, y - s*0.34, o);
      drw.line(x + s*0.06, y - s*0.14, x + s*0.06, y + s*0.34, o);
      break;

    case 'iceball':
      drw.circ(x, y, s*0.36, of);
      drw.path(segsFromPts(arcPts(x, y, s*0.24, Math.PI*1.05, Math.PI*1.45, 6), false), { w:lw*0.8 });
      break;

    case 'crushed':
      var cp = [[-0.30,-0.22],[0.02,-0.30],[0.28,-0.06],[-0.10,0.02],[0.16,0.24],[-0.26,0.18]];
      for (i = 0; i < cp.length; i++)
        drw.poly([[x + cp[i][0]*s, y + cp[i][1]*s],
                  [x + cp[i][0]*s + s*0.15, y + cp[i][1]*s + s*0.04],
                  [x + cp[i][0]*s + s*0.07, y + cp[i][1]*s + s*0.15]], Object.assign({close:true}, of));
      break;

    case 'sugarcube':
      drw.poly([[x - s*0.30, y - s*0.10],[x - s*0.06, y - s*0.30],[x + s*0.30, y - s*0.30],
                [x + s*0.30, y + s*0.12],[x + s*0.06, y + s*0.30],[x - s*0.30, y + s*0.30]], Object.assign({close:true}, of));
      drw.line(x - s*0.30, y - s*0.10, x + s*0.06, y - s*0.10, o);
      drw.line(x + s*0.06, y - s*0.10, x + s*0.30, y - s*0.30, o);
      drw.line(x + s*0.06, y - s*0.10, x + s*0.06, y + s*0.30, o);
      for (i = 0; i < 5; i++) drw.circ(x - s*0.22 + (i%3)*s*0.11, y + s*0.06 + Math.floor(i/3)*s*0.12, s*0.025, { w:0, fill:INK });
      break;

    case 'sugar':
      drw.path(segsFromPts(arcPts(x, y + s*0.20, s*0.32, Math.PI, Math.PI*2, 12), false), o);
      drw.line(x - s*0.32, y + s*0.20, x + s*0.32, y + s*0.20, o);
      for (i = 0; i < 6; i++) drw.circ(x - s*0.20 + (i%3)*s*0.16, y - s*0.04 + Math.floor(i/3)*s*0.12, s*0.03, { w:0, fill:INK });
      break;

    case 'peel':
      drw.path([['M', x - s*0.30, y - s*0.26], ['C', x + s*0.30, y - s*0.34, x - s*0.30, y + s*0.18, x + s*0.30, y + s*0.10]], o);
      drw.path([['M', x - s*0.28, y - s*0.10], ['C', x + s*0.28, y - s*0.18, x - s*0.28, y + s*0.34, x + s*0.30, y + s*0.26]], o);
      break;

    case 'mint':
      drw.line(x, y + s*0.34, x, y - s*0.20, o);
      leaf(drw, x, y + s*0.10, s*0.30, -140, lw);
      leaf(drw, x, y + s*0.10, s*0.30, -40, lw);
      leaf(drw, x, y - s*0.12, s*0.26, -150, lw);
      leaf(drw, x, y - s*0.12, s*0.26, -30, lw);
      break;

    case 'basil':
      leaf(drw, x - s*0.02, y + s*0.16, s*0.40, -110, lw);
      leaf(drw, x + s*0.02, y + s*0.16, s*0.36, -55, lw);
      break;

    case 'rosemary':
      drw.line(x - s*0.22, y + s*0.32, x + s*0.16, y - s*0.32, o);
      for (i = 0; i < 5; i++) {
        var t = i / 5, bx = x - s*0.22 + (s*0.38)*t, by = y + s*0.32 - (s*0.64)*t;
        drw.line(bx, by, bx - s*0.16, by - s*0.06, { w:lw*0.8 });
        drw.line(bx, by, bx + s*0.14, by + s*0.02, { w:lw*0.8 });
      }
      break;

    case 'umbrella':
      drw.path(segsFromPts(arcPts(x, y - s*0.02, s*0.36, Math.PI, Math.PI*2, 14), true), of);
      for (i = 1; i < 4; i++) drw.line(x, y - s*0.02, x - s*0.36 + i*s*0.24, y - s*0.02 + Math.sin(i/4*Math.PI)*0 - 0, { w:lw*0.7 });
      drw.line(x, y - s*0.02, x, y + s*0.36, o);
      break;

    case 'pineapple':
      drw.poly([[x - s*0.26, y + s*0.24],[x + s*0.26, y + s*0.24],[x + s*0.16, y - s*0.18],[x - s*0.16, y - s*0.18]], Object.assign({close:true}, of));
      for (i = 0; i < 3; i++) drw.line(x - s*0.22 + i*s*0.16, y + s*0.24, x - s*0.10 + i*s*0.10, y - s*0.18, { w:lw*0.6 });
      drw.line(x - s*0.10, y - s*0.18, x - s*0.20, y - s*0.36, { w:lw*0.8 });
      drw.line(x, y - s*0.18, x, y - s*0.40, { w:lw*0.8 });
      drw.line(x + s*0.10, y - s*0.18, x + s*0.20, y - s*0.36, { w:lw*0.8 });
      break;

    case 'celery':
      drw.path([['M', x - s*0.14, y + s*0.40], ['C', x - s*0.20, y, x - s*0.16, y - s*0.20, x - s*0.20, y - s*0.40],
                ['L', x + s*0.10, y - s*0.40], ['C', x + s*0.14, y - s*0.10, x + s*0.12, y + s*0.10, x + s*0.14, y + s*0.40], ['Z']], of);
      drw.line(x - s*0.04, y + s*0.36, x - s*0.06, y - s*0.36, { w:lw*0.7 });
      break;

    case 'cucumber':
      drw.circ(x, y, s*0.36, of);
      drw.circ(x, y, s*0.24, { w:lw*0.8 });
      for (i = 0; i < 5; i++) {
        var ca = i * Math.PI * 2 / 5;
        drw.circ(x + Math.cos(ca)*s*0.11, y + Math.sin(ca)*s*0.11, s*0.035, { w:0, fill:INK });
      }
      break;

    case 'ginger':
      drw.path(segsFromPts(arcPts(x, y, s*0.32, 0, Math.PI*2, 16).map(function(q, k){
        return [q[0] + (k%3?0.01:-0.02)*s, q[1]]; }), true), of);
      drw.circ(x, y, s*0.18, { w:lw*0.7 });
      break;

    case 'pick':
      drw.line(x - s*0.30, y + s*0.34, x + s*0.30, y - s*0.34, o);
      drw.circ(x + s*0.30, y - s*0.34, s*0.08, of);
      drw.circ(x - s*0.02, y + s*0.02, s*0.14, of);
      break;

    case 'straw':
      drw.line(x - s*0.16, y + s*0.38, x + s*0.10, y - s*0.20, o);
      drw.line(x - s*0.04, y + s*0.40, x + s*0.22, y - s*0.18, o);
      drw.line(x + s*0.10, y - s*0.20, x + s*0.22, y - s*0.18, o);
      break;

    case 'beans':
      for (i = 0; i < 3; i++) {
        var bx2 = x - s*0.20 + i*s*0.20, by2 = y - s*0.10 + (i%2)*s*0.20;
        drw.path(segsFromPts(arcPts(bx2, by2, s*0.13, 0, Math.PI*2, 14).map(function(q){
          return [bx2 + (q[0]-bx2)*0.78, q[1]]; }), true), of);
        drw.line(bx2, by2 - s*0.12, bx2, by2 + s*0.12, { w:lw*0.7 });
      }
      break;

    case 'grated':
      for (i = 0; i < 9; i++)
        drw.circ(x - s*0.30 + (i%3)*s*0.30 + (Math.floor(i/3)%2)*s*0.08,
                 y - s*0.24 + Math.floor(i/3)*s*0.24, s*0.045, { w:0, fill:INK });
      break;

    case 'rimsalt': case 'rimsugar':
      drw.path(segsFromPts(arcPts(x, y + s*0.34, s*0.40, Math.PI*1.15, Math.PI*1.85, 10), false), o);
      for (i = 0; i < 7; i++) {
        var rx = x - s*0.34 + i*s*0.113, ry = y + s*0.34 - Math.sqrt(Math.max(0, 0.16 - Math.pow((rx-x)/s,2)))*s - s*0.06;
        if (type === 'rimsalt') drw.circ(rx, ry, s*0.045, { w:0, fill:INK });
        else drw.rect(rx - s*0.04, ry - s*0.04, s*0.08, s*0.08, { w:lw*0.7 });
      }
      break;

    case 'cream':
      drw.path([['M', x - s*0.30, y + s*0.26], ['C', x - s*0.26, y - s*0.10, x - s*0.06, y - s*0.10, x - s*0.02, y + s*0.06],
                ['C', x + s*0.02, y - s*0.20, x + s*0.26, y - s*0.16, x + s*0.30, y + s*0.26], ['Z']], of);
      break;

    case 'cinnamon':
      drw.poly([[x - s*0.30, y - s*0.12],[x + s*0.30, y - s*0.12],[x + s*0.30, y + s*0.12],[x - s*0.30, y + s*0.12]], Object.assign({close:true}, of));
      drw.circ(x - s*0.30, y, s*0.12, of);
      drw.circ(x - s*0.30, y, s*0.05, { w:lw*0.7 });
      break;

    case 'physalis':
      drw.circ(x, y + s*0.10, s*0.24, of);
      for (i = 0; i < 3; i++) leaf(drw, x, y + s*0.02, s*0.30, -150 + i*45, lw);
      break;

    case 'berry':
      drw.path([['M', x, y - s*0.26], ['C', x + s*0.30, y - s*0.20, x + s*0.24, y + s*0.34, x, y + s*0.36],
                ['C', x - s*0.24, y + s*0.34, x - s*0.30, y - s*0.20, x, y - s*0.26]], of);
      for (i = 0; i < 5; i++) drw.circ(x - s*0.12 + (i%3)*s*0.12, y - s*0.04 + Math.floor(i/3)*s*0.14, s*0.03, { w:0, fill:INK });
      leaf(drw, x, y - s*0.24, s*0.20, -150, lw); leaf(drw, x, y - s*0.24, s*0.20, -30, lw);
      break;

    case 'ribbon':
      drw.path([['M', x - s*0.34, y - s*0.10], ['C', x - s*0.10, y - s*0.34, x + s*0.10, y + s*0.14, x + s*0.34, y - s*0.10]], o);
      drw.path([['M', x - s*0.34, y + s*0.12], ['C', x - s*0.10, y - s*0.12, x + s*0.10, y + s*0.36, x + s*0.34, y + s*0.12]], o);
      break;

    default:
      drw.circ(x, y, s*0.30, of);
  }
}

/* ---------- Methodensymbole über dem Glas ---------- */
function drawMethodSym(drw, sym, x, y, s, lw) {
  lw = lw || 0.18;
  var o = { w:lw, c:INK }, i, p;
  function wave(yy, amp, n, wdt) {
    var pts = [], steps = n * 8;
    for (var k = 0; k <= steps; k++) {
      var t = k / steps;
      pts.push([x - wdt/2 + wdt*t, yy + Math.sin(t * n * Math.PI * 2) * amp]);
    }
    drw.path(segsFromPts(pts, false), o);
  }
  switch (sym) {
    case 'shake':
      wave(y - s*0.30, s*0.10, 2, s*0.95);
      wave(y,          s*0.10, 2, s*0.95);
      wave(y + s*0.30, s*0.10, 2, s*0.95);
      break;
    case 'stir':
      drw.circ(x, y, s*0.42, o);
      p = [];
      for (i = 0; i <= 40; i++) {
        var a = i / 40 * Math.PI * 3.2, r = s*0.06 + (s*0.28) * (i/40);
        p.push([x + Math.cos(a)*r, y + Math.sin(a)*r]);
      }
      drw.path(segsFromPts(p, false), { w:lw*0.85 });
      break;
    case 'swizzle':
      drw.circ(x, y, s*0.42, o);
      p = [];
      for (i = 0; i <= 40; i++) {
        var a2 = i / 40 * Math.PI * 3.2, r2 = s*0.06 + (s*0.24) * (i/40);
        p.push([x + Math.cos(a2)*r2, y + Math.sin(a2)*r2]);
      }
      drw.path(segsFromPts(p, false), { w:lw*0.85 });
      for (i = 0; i < 4; i++)
        drw.circ(x - s*0.28 + (i%2)*s*0.56, y - s*0.28 + Math.floor(i/2)*s*0.56, s*0.06, { w:0, fill:INK });
      break;
    case 'layer':
      drw.line(x, y - s*0.42, x, y + s*0.22, o);
      drw.poly([[x - s*0.14, y + s*0.14],[x + s*0.14, y + s*0.14],[x, y + s*0.42]], { close:true, w:lw, c:INK, fill:INK });
      drw.line(x - s*0.42, y + s*0.50, x + s*0.42, y + s*0.50, o);
      break;
    case 'build':
      drw.line(x - s*0.30, y - s*0.44, x - s*0.30, y + s*0.34, o);
      drw.line(x + s*0.30, y - s*0.44, x + s*0.30, y + s*0.34, o);
      drw.line(x - s*0.30, y + s*0.34, x + s*0.30, y + s*0.34, o);
      drw.line(x, y - s*0.52, x, y - s*0.06, { w:lw*0.9 });
      drw.poly([[x - s*0.11, y - s*0.16],[x + s*0.11, y - s*0.16],[x, y + s*0.10]], { close:true, w:lw, c:INK, fill:INK });
      break;
    case 'muddle':
      drw.rect(x - s*0.10, y - s*0.46, s*0.20, s*0.52, o);
      drw.rect(x - s*0.24, y + s*0.06, s*0.48, s*0.20, o);
      drw.line(x - s*0.40, y + s*0.42, x + s*0.40, y + s*0.42, o);
      break;
    case 'top':
      drw.line(x, y - s*0.50, x, y + s*0.02, o);
      drw.poly([[x - s*0.13, y - s*0.08],[x + s*0.13, y - s*0.08],[x, y + s*0.20]], { close:true, w:lw, c:INK, fill:INK });
      drw.line(x - s*0.42, y + s*0.30, x + s*0.42, y + s*0.30, o);
      drw.line(x - s*0.42, y + s*0.42, x + s*0.42, y + s*0.42, { w:lw*0.7 });
      break;
    case 'strain':
      drw.path(segsFromPts(arcPts(x, y - s*0.10, s*0.40, 0, Math.PI, 12), false), o);
      drw.line(x - s*0.40, y - s*0.10, x + s*0.40, y - s*0.10, o);
      for (i = 0; i < 5; i++) drw.circ(x - s*0.24 + i*s*0.12, y + s*0.04 + (i%2)*s*0.10, s*0.035, { w:0, fill:INK });
      drw.line(x + s*0.40, y - s*0.10, x + s*0.62, y - s*0.16, o);
      drw.line(x, y + s*0.30, x, y + s*0.48, o);
      break;
    case 'rinse':
      p = [];
      for (i = 0; i <= 24; i++) { var ra = Math.PI*0.2 + i/24*Math.PI*1.5; p.push([x + Math.cos(ra)*s*0.36, y + Math.sin(ra)*s*0.36]); }
      drw.path(segsFromPts(p, false), o);
      var ea = Math.PI*0.2 + Math.PI*1.5, ex = x + Math.cos(ea)*s*0.36, ey = y + Math.sin(ea)*s*0.36;
      drw.poly([[ex, ey], [ex + s*0.16, ey + s*0.14], [ex - s*0.06, ey + s*0.20]], { close:true, w:lw, c:INK, fill:INK });
      break;
    case 'blend':
      drw.poly([[x - s*0.26, y - s*0.44],[x + s*0.26, y - s*0.44],[x + s*0.18, y + s*0.30],[x - s*0.18, y + s*0.30]], Object.assign({close:true}, o));
      drw.line(x - s*0.20, y + s*0.30, x + s*0.20, y + s*0.30, o);
      drw.line(x - s*0.10, y + s*0.10, x + s*0.10, y - s*0.06, { w:lw*0.8 });
      drw.line(x - s*0.10, y - s*0.06, x + s*0.10, y + s*0.10, { w:lw*0.8 });
      break;
  }
}

  triS:    { k:'motif',  s:'triU',   sp:1.60 },

var PATTERN_IDS = Object.keys(PATTERNS);

/* Rückfallmuster, falls eine freie Zutat kein eigenes Muster hat */
var CLASS_PATTERN = { spirit:'l45', liqueur:'l45w', juice:'l135', syrup:'lx',
  filler:'dots', wine:'lh', bitter:'dense', dairy:'wave', other:'triS' };

/* Relative Helligkeit einer Farbe – dunkle Flächen bekommen ein helles Muster */
function relLum(hex) {
  if (!hex) return 1;
  var h = hex.replace('#', '');
  if (h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  var r = parseInt(h.slice(0,2),16)/255, g = parseInt(h.slice(2,4),16)/255, b = parseInt(h.slice(4,6),16)/255;
  return 0.2126*r + 0.7152*g + 0.0722*b;
}

function hatchLines(bb, ang, sp) {
  var out = [], a = ang * Math.PI / 180;
  var dx = Math.cos(a), dy = Math.sin(a);
  var nx = -dy, ny = dx;
  var cx = (bb.x0 + bb.x1) / 2, cy = (bb.y0 + bb.y1) / 2;
  var diag = Math.hypot(bb.x1 - bb.x0, bb.y1 - bb.y0) / 2 + sp;
  var n = Math.ceil(diag / sp);
  for (var i = -n; i <= n; i++) {
    var ox = cx + nx * i * sp, oy = cy + ny * i * sp;
    out.push([[ox - dx * diag, oy - dy * diag], [ox + dx * diag, oy + dy * diag]]);
  }
  return out;
}

function motifAt(drw, shape, x, y, r, lw, c, filled) {
  var o = { w: filled ? 0 : lw, c:c, fill: filled ? c : null };
  switch (shape) {
    case 'dia':  drw.poly([[x,y-r],[x+r,y],[x,y+r],[x-r,y]], Object.assign({ close:true }, o)); break;
    case 'triU': drw.poly([[x,y-r],[x+r*0.92,y+r*0.72],[x-r*0.92,y+r*0.72]], Object.assign({ close:true }, o)); break;
    case 'triD': drw.poly([[x,y+r],[x+r*0.92,y-r*0.72],[x-r*0.92,y-r*0.72]], Object.assign({ close:true }, o)); break;
    case 'sq':   drw.rect(x-r*0.8, y-r*0.8, r*1.6, r*1.6, Object.assign({ close:true }, o)); break;
    case 'cir':  drw.circ(x, y, r*0.82, o); break;
    case 'ring': drw.circ(x, y, r*0.85, { w:lw, c:c }); drw.circ(x, y, r*0.30, { w:0, fill:c }); break;
    case 'star':
      for (var i = 0; i < 3; i++) {
        var a = i * Math.PI / 3;
        drw.line(x - Math.cos(a)*r, y - Math.sin(a)*r, x + Math.cos(a)*r, y + Math.sin(a)*r, { w:lw, c:c });
      }
      break;
    case 'plus': drw.line(x-r, y, x+r, y, { w:lw, c:c }); drw.line(x, y-r, x, y+r, { w:lw, c:c }); break;
    case 'x':    drw.line(x-r*0.75, y-r*0.75, x+r*0.75, y+r*0.75, { w:lw, c:c });
                 drw.line(x-r*0.75, y+r*0.75, x+r*0.75, y-r*0.75, { w:lw, c:c }); break;
  }
}

/* Zeichnet ein Muster in den (bereits geclippten) Bereich bb */
function paintPattern(drw, bb, pat, sp, lw, c, abbr) {
  var i, j, x, y, L;
  if (pat.k === 'lines') {
    pat.a.forEach(function (ang) {
      L = hatchLines(bb, ang, sp);
      for (i = 0; i < L.length; i++) {
        drw.line(L[i][0][0], L[i][0][1], L[i][1][0], L[i][1][1], { w:lw, c:c, d:pat.dash || null });
        if (pat.pair) {
          var a2 = ang * Math.PI / 180, ox = -Math.sin(a2) * pat.pair, oy = Math.cos(a2) * pat.pair;
          drw.line(L[i][0][0]+ox, L[i][0][1]+oy, L[i][1][0]+ox, L[i][1][1]+oy, { w:lw, c:c });
        }
      }
    });
    return;
  }
  if (pat.k === 'zig') {
    for (y = bb.y0; y <= bb.y1 + sp; y += sp) {
      var pz = [];
      for (x = bb.x0 - sp; x <= bb.x1 + sp; x += sp * 0.55)
        pz.push([x, y + (Math.round((x - bb.x0) / (sp * 0.55)) % 2 ? sp * 0.32 : -sp * 0.32)]);
      if (pz.length > 1) drw.path(segsFromPts(pz, false), { w:lw, c:c });
    }
    return;
  }
  if (pat.k === 'wave') {
    for (y = bb.y0; y <= bb.y1 + sp; y += sp) {
      var pw = [], st = sp / 3;
      for (x = bb.x0; x <= bb.x1 + st; x += st)
        pw.push([x, y + Math.sin((x - bb.x0) / sp * Math.PI) * sp * 0.24]);
      if (pw.length > 1) drw.path(segsFromPts(pw, false), { w:lw, c:c });
      if (pat.dbl) {
        var pw2 = pw.map(function (q) { return [q[0], q[1] + sp * 0.30]; });
        drw.path(segsFromPts(pw2, false), { w:lw, c:c });
      }
    }
    return;
  }
  if (pat.k === 'herr') {
    for (y = bb.y0; y <= bb.y1 + sp; y += sp) {
      for (x = bb.x0 - sp; x <= bb.x1 + sp; x += sp) {
        var up = (Math.round((y - bb.y0) / sp) % 2) === 0;
        drw.line(x, y + (up ? sp*0.4 : -sp*0.4), x + sp*0.5, y + (up ? -sp*0.4 : sp*0.4), { w:lw, c:c });
      }
    }
    return;
  }
  if (pat.k === 'hex') {
    var hr = sp * 0.42;
    for (j = 0, y = bb.y0; y <= bb.y1 + sp; y += sp * 0.86, j++) {
      for (x = bb.x0 - sp + (j % 2 ? sp / 2 : 0); x <= bb.x1 + sp; x += sp) {
        var hp = [];
        for (i = 0; i < 6; i++) {
          var ha = i * Math.PI / 3 + Math.PI / 6;
          hp.push([x + Math.cos(ha) * hr, y + Math.sin(ha) * hr]);
        }
        drw.poly(hp, { close:true, w:lw, c:c });
      }
    }
    return;
  }
  if (pat.k === 'scale') {
    for (j = 0, y = bb.y0; y <= bb.y1 + sp; y += sp * 0.55, j++)
      for (x = bb.x0 - sp + (j % 2 ? sp / 2 : 0); x <= bb.x1 + sp; x += sp)
        drw.path(segsFromPts(arcPts(x, y, sp * 0.48, Math.PI, Math.PI * 2, 8), false), { w:lw, c:c });
    return;
  }
  if (pat.k === 'brick') {
    for (j = 0, y = bb.y0; y <= bb.y1 + sp; y += sp * 0.55, j++) {
      drw.line(bb.x0, y, bb.x1, y, { w:lw, c:c });
      for (x = bb.x0 - sp + (j % 2 ? sp / 2 : 0); x <= bb.x1 + sp; x += sp)
        drw.line(x, y, x, y + sp * 0.55, { w:lw, c:c });
    }
    return;
  }
  if (pat.k === 'chev') {
    for (y = bb.y0; y <= bb.y1 + sp; y += sp * 0.7)
      for (x = bb.x0 - sp; x <= bb.x1 + sp; x += sp)
        drw.path([['M', x, y + sp*0.3], ['L', x + sp*0.5, y - sp*0.25], ['L', x + sp, y + sp*0.3]], { w:lw, c:c });
    return;
  }
  if (pat.k === 'check' || pat.k === 'checkD') {
    var cs = pat.k === 'check' ? sp * 0.5 : sp * 0.55;
    for (j = 0, y = bb.y0; y <= bb.y1 + cs; y += cs, j++)
      for (i = 0, x = bb.x0; x <= bb.x1 + cs; x += cs, i++)
        if ((i + j) % 2 === 0) {
          if (pat.k === 'check') drw.rect(x, y, cs, cs, { w:0, fill:c });
          else drw.poly([[x + cs/2, y], [x + cs, y + cs/2], [x + cs/2, y + cs], [x, y + cs/2]],
                        { close:true, w:0, fill:c });
        }
    return;
  }
  if (pat.k === 'gridDot') {
    L = hatchLines(bb, 0, sp); for (i = 0; i < L.length; i++) drw.line(L[i][0][0], L[i][0][1], L[i][1][0], L[i][1][1], { w:lw, c:c });
    L = hatchLines(bb, 90, sp); for (i = 0; i < L.length; i++) drw.line(L[i][0][0], L[i][0][1], L[i][1][0], L[i][1][1], { w:lw, c:c });
    for (y = bb.y0 + sp/2; y <= bb.y1; y += sp)
      for (x = bb.x0 + sp/2; x <= bb.x1; x += sp) drw.circ(x, y, sp*0.13, { w:0, fill:c });
    return;
  }
  if (pat.k === 'text') {
    var t = abbr || '·', fsz = sp * 0.60, rh = sp * 0.95;
    var hgt = bb.y1 - bb.y0;
    var rows = Math.max(1, Math.round(hgt / rh));
    var y0 = bb.y0 + (hgt - (rows - 1) * rh) / 2 + fsz * 0.36;
    for (j = 0; j < rows; j++) {
      y = y0 + j * rh;
      for (x = bb.x0 + (j % 2 ? sp * 0.75 : -sp * 0.2); x <= bb.x1 + sp; x += sp * 1.5)
        drw.text(x, y, t, { size:fsz, c:c, bold:true });
    }
    return;
  }
  /* motif */
  var r = (pat.r || pat.sp * 0.30) * (sp / pat.sp);
  for (j = 0, y = bb.y0 + sp * 0.4; y <= bb.y1 + sp; y += sp, j++)
    for (x = bb.x0 - sp + (j % 2 ? sp / 2 : 0); x <= bb.x1 + sp; x += sp)
      motifAt(drw, pat.s, x, y, r, lw, c, pat.f);
}

/* Farbfläche + Muster innerhalb eines Polygons.
   style: { pat, color, abbr } oder eine Zutat aus ING_BY_ID */
function fillHatched(drw, pts, style, opt) {
  opt = opt || {};
  style = style || {};
  var segs = segsFromPts(pts, true), bb = bboxOf(pts);
  var scale = opt.scale || 1, lw = opt.lw || 0.12;
  var hc = opt.hatchColor || INK;
  var color = style.color || '#DDDDDD';
  if (opt.mono) drw.path(segs, { fill:'#FFFFFF', w:0 });
  else if (opt.color !== false) drw.path(segs, { fill:color, w:0 });
  if (opt.noHatch) { drw.path(segs, { w:lw, c:hc }); return; }
  var pat = PATTERNS[style.pat] || PATTERNS[CLASS_PATTERN[style.cls] || 'l45'];
  var sp = pat.sp * (0.68 + 0.32 * Math.min(1.2, scale));
  var pc = hc;
  if (!opt.mono && opt.color !== false && relLum(color) < 0.42) pc = '#FFFFFF';
  drw.clip(segs);
  paintPattern(drw, bb, pat, sp, lw, pc, style.abbr);
  drw.unclip();
  drw.path(segs, { w:lw, c:hc });
}
