/* ===== 12_draw_cocktail.js ===== */

/* ============================================================
   Schnittzeichnung eines Cocktails ("Assembly")
   ============================================================ */
var BASE_CELL_W = 70, BASE_CELL_H = 78;

/* Dichte Profilstützpunkte eines Glases (unskaliert) */
function glassSamples(g) {
  if (g._smp) return g._smp;
  var pts = g.prof.map(function (p) { return [p[0], p[1]]; });
  var s;
  if (g.smooth && pts.length > 2) {
    s = catmull(pts, 10);
    s.sort(function (a, b) { return a[0] - b[0]; });
  } else if (pts.length === 2) {
    s = []; for (var i = 0; i <= 16; i++) {
      var t = i / 16;
      s.push([pts[0][0] + (pts[1][0] - pts[0][0]) * t, pts[0][1] + (pts[1][1] - pts[0][1]) * t]);
    }
  } else {
    s = []; for (var k = 0; k < pts.length - 1; k++) {
      for (var j = 0; j < 8; j++) {
        var tt = j / 8;
        s.push([pts[k][0] + (pts[k+1][0] - pts[k][0]) * tt, pts[k][1] + (pts[k+1][1] - pts[k][1]) * tt]);
      }
    }
    s.push(pts[pts.length - 1]);
  }
  g._smp = s; return s;
}
function hwAt(g, y) {
  var s = glassSamples(g);
  if (y <= s[0][0]) return s[0][1];
  if (y >= s[s.length-1][0]) return s[s.length-1][1];
  for (var i = 1; i < s.length; i++) {
    if (s[i][0] >= y) {
      var t = (y - s[i-1][0]) / Math.max(1e-6, s[i][0] - s[i-1][0]);
      return s[i-1][1] + (s[i][1] - s[i-1][1]) * t;
    }
  }
  return s[s.length-1][1];
}
function glassCavityTop(g) { var s = glassSamples(g); return s[s.length-1][0]; }
function glassMaxHw(g) {
  var s = glassSamples(g), m = 0;
  for (var i = 0; i < s.length; i++) m = Math.max(m, s[i][1]);
  return m;
}
function glassTotalHeight(g) {
  var h = glassCavityTop(g);
  if (g.kind === 'stem') return h + (g.stem || 0) + (g.footH || 0) + (g.base || 0);
  return h + (g.base || 0) + (g.wall || 0);
}

/* ---------- Schichtberechnung ---------- */
function computeLayers(ck, cavTop) {
  var g = GLASS_BY_ID[ck.glass] || GLASSES[0];
  var ings = ck.ingredients.filter(function (i) { return i.ingredientId || i.name; });
  if (!ings.length) return [];
  var fillMax = cavTop * FILL_RATIO;
  var vols = ings.map(function (i) { return Math.max(mlOf(i), 0); });
  var fillIdx = -1;
  ings.forEach(function (i, k) { if (i.unit === 'fill') fillIdx = k; });
  var known = vols.reduce(function (a, b) { return a + b; }, 0);
  if (fillIdx >= 0) {
    var target = g.vol * 0.86;
    vols[fillIdx] = Math.max(target - known, g.vol * 0.18);
  }
  var total = vols.reduce(function (a, b) { return a + b; }, 0);
  if (total <= 0) return [];
  var height;
  if (fillIdx >= 0) height = fillMax;
  else {
    var frac = total / (g.vol * 0.52);
    height = fillMax * Math.max(0.46, Math.min(1, frac));
  }
  var minH = Math.min(1.5, height / (ings.length * 1.6));
  var h = vols.map(function (v) { return height * v / total; });
  /* Mindesthöhen durchsetzen */
  for (var pass = 0; pass < 6; pass++) {
    var deficit = 0, freeSum = 0;
    for (var i = 0; i < h.length; i++) {
      if (h[i] < minH) deficit += (minH - h[i]); else freeSum += (h[i] - minH);
    }
    if (deficit <= 0.0001 || freeSum <= 0.0001) break;
    var f = Math.max(0, 1 - deficit / freeSum);
    for (var j = 0; j < h.length; j++) h[j] = h[j] < minH ? minH : minH + (h[j] - minH) * f;
  }
  var out = [], y = 0;
  for (var m = 0; m < ings.length; m++) {
    out.push({ ing: ings[m], y0: y, y1: y + h[m], ml: vols[m] });
    y += h[m];
  }
  return out;
}

/* Polygon einer Schicht im Innenraum */
function layerPolygon(g, y0, y1, S, cx, baseY) {
  var pts = [], step = Math.max(0.35, (y1 - y0) / 14), y;
  for (y = y0; y < y1; y += step) pts.push([cx - hwAt(g, y) * S, baseY - y * S]);
  pts.push([cx - hwAt(g, y1) * S, baseY - y1 * S]);
  var right = [];
  for (y = y0; y < y1; y += step) right.push([cx + hwAt(g, y) * S, baseY - y * S]);
  right.push([cx + hwAt(g, y1) * S, baseY - y1 * S]);
  right.reverse();
  return pts.concat(right);
}

/* ---------- Glasumriss ---------- */
function drawGlassOutline(drw, g, S, cx, baseY, lw) {
  var smp = glassSamples(g), wall = (g.wall || 1.2), i, p;
  var outL = [], outR = [];
  for (i = 0; i < smp.length; i++) {
    outL.push([cx - (smp[i][1] + wall) * S, baseY - smp[i][0] * S]);
    outR.push([cx + (smp[i][1] + wall) * S, baseY - smp[i][0] * S]);
  }
  var innL = [], innR = [];
  for (i = 0; i < smp.length; i++) {
    innL.push([cx - smp[i][1] * S, baseY - smp[i][0] * S]);
    innR.push([cx + smp[i][1] * S, baseY - smp[i][0] * S]);
  }
  var o = { w:lw, c:INK };
  if (g.kind === 'stem') {
    var stemW = 2.6, sy = baseY + (g.stem || 10) * S, fy = sy + (g.footH || 2) * S;
    var bowlBotL = outL[0], bowlBotR = outR[0];
    var pathPts = outL.slice().reverse();      /* Kelch links von oben nach unten */
    pathPts = outL.slice();                     /* unten -> oben links */
    var seg = [['M', outL[outL.length-1][0], outL[outL.length-1][1]]];
    for (i = outL.length - 2; i >= 0; i--) seg.push(['L', outL[i][0], outL[i][1]]);
    seg.push(['C', cx - stemW/2*S - 1.2*S, baseY + 1.0*S, cx - stemW/2*S, baseY + 1.4*S, cx - stemW/2*S, baseY + 2.4*S]);
    seg.push(['L', cx - stemW/2*S, sy - 0.8*S]);
    seg.push(['C', cx - stemW/2*S, sy, cx - (g.foot||11)*0.5*S, sy + 0.2*S, cx - (g.foot||11)*S, sy + 0.9*S]);
    seg.push(['L', cx - (g.foot||11)*S, fy]);
    seg.push(['L', cx + (g.foot||11)*S, fy]);
    seg.push(['L', cx + (g.foot||11)*S, sy + 0.9*S]);
    seg.push(['C', cx + (g.foot||11)*0.5*S, sy + 0.2*S, cx + stemW/2*S, sy, cx + stemW/2*S, sy - 0.8*S]);
    seg.push(['L', cx + stemW/2*S, baseY + 2.4*S]);
    seg.push(['C', cx + stemW/2*S, baseY + 1.4*S, cx + stemW/2*S + 1.2*S, baseY + 1.0*S, outR[0][0], outR[0][1]]);
    for (i = 1; i < outR.length; i++) seg.push(['L', outR[i][0], outR[i][1]]);
    drw.path(seg, o);
    /* Innenkontur */
    var si = [['M', innL[innL.length-1][0], innL[innL.length-1][1]]];
    for (i = innL.length - 2; i >= 0; i--) si.push(['L', innL[i][0], innL[i][1]]);
    for (i = 0; i < innR.length; i++) si.push(['L', innR[i][0], innR[i][1]]);
    drw.path(si, { w:lw*0.7, c:INK });
    drw.line(outL[outL.length-1][0], outL[outL.length-1][1], innL[innL.length-1][0], innL[innL.length-1][1], o);
    drw.line(outR[outR.length-1][0], outR[outR.length-1][1], innR[innR.length-1][0], innR[innR.length-1][1], o);
  } else {
    var bot = baseY + (g.base || 3) * S;
    var seg2 = [['M', outL[outL.length-1][0], outL[outL.length-1][1]]];
    for (i = outL.length - 2; i >= 0; i--) seg2.push(['L', outL[i][0], outL[i][1]]);
    seg2.push(['L', outL[0][0], bot]);
    seg2.push(['L', outR[0][0], bot]);
    for (i = 0; i < outR.length; i++) seg2.push(['L', outR[i][0], outR[i][1]]);
    drw.path(seg2, o);
    var si2 = [['M', innL[innL.length-1][0], innL[innL.length-1][1]]];
    for (i = innL.length - 2; i >= 0; i--) si2.push(['L', innL[i][0], innL[i][1]]);
    si2.push(['L', innR[0][0], innR[0][1]]);
    for (i = 1; i < innR.length; i++) si2.push(['L', innR[i][0], innR[i][1]]);
    drw.path(si2, { w:lw*0.7, c:INK });
    drw.line(outL[outL.length-1][0], outL[outL.length-1][1], innL[innL.length-1][0], innL[innL.length-1][1], o);
    drw.line(outR[outR.length-1][0], outR[outR.length-1][1], innR[innR.length-1][0], innR[innR.length-1][1], o);
    if (g.handle) {
      var cavH = glassCavityTop(g), bulge = Math.min(10, cavH * 0.18) * S;
      var hx = outR[Math.floor(outR.length*0.75)][0], hy1 = baseY - cavH*0.78*S, hy2 = baseY - cavH*0.26*S;
      drw.path([['M', hx, hy1], ['C', hx + bulge, hy1, hx + bulge, hy2, hx, hy2]], { w:lw, c:INK });
      drw.path([['M', hx, hy1 + 1.4*S], ['C', hx + bulge*0.68, hy1 + 1.4*S, hx + bulge*0.68, hy2 - 1.4*S, hx, hy2 - 1.4*S]], { w:lw*0.7, c:INK });
    }
    if (g.spout) {
      var tl = outL[outL.length-1], il = innL[innL.length-1];
      drw.path([['M', tl[0] + 0.2*S, tl[1]], ['L', tl[0] - 3.2*S, tl[1] - 2.4*S],
                ['L', il[0] - 0.4*S, il[1] - 2.2*S], ['L', il[0] + 0.6*S, il[1]]], { w:lw, c:INK, fill:'#FFFFFF' });
    }
    if (g.relief) {
      for (i = 1; i <= 3; i++) {
        var ry = baseY - glassCavityTop(g) * (i / 4) * S;
        drw.line(cx - (hwAt(g, glassCavityTop(g)*(i/4)) + wall*0.4) * S, ry,
                 cx + (hwAt(g, glassCavityTop(g)*(i/4)) + wall*0.4) * S, ry, { w:lw*0.6, c:INK });
      }
    }
  }
}

/* ---------- Eisdarstellung ----------
   Alles wird auf die Flüssigkeitssäule bezogen: Größe und Anzahl der
   Stücke richten sich nach Glasbreite und Füllhöhe, damit nichts über
   dem Getränk in der Luft hängt. topY = Oberkante der obersten Schicht. */
function drawIce(drw, ck, g, S, cx, baseY, topY, lw, st) {
  if (!ck.ice || ck.ice === 'none') return null;
  var cav = glassCavityTop(g), i;
  var liqTop = Math.max(2, Math.min(cav * FILL_RATIO, topY));
  var anchor = null;
  /* mittlere Innenbreite der Flüssigkeitssäule */
  var hwMid = hwAt(g, liqTop * 0.55), hwTopL = hwAt(g, liqTop);

  if (ck.ice === 'crushed') {
    var szc = Math.max(0.9, Math.min(2.0, hwMid * 0.17));
    var rows = Math.max(2, Math.min(9, Math.floor(liqTop / (szc * 1.5))));
    var cols = Math.max(2, Math.min(6, Math.floor(hwMid * 2 / (szc * 2.1))));
    var k = 0;
    for (var r0 = 0; r0 < rows; r0++) {
      var fy = liqTop * (0.10 + 0.82 * (rows === 1 ? 0.5 : r0 / (rows - 1)));
      var hwc = hwAt(g, Math.min(fy, cav)) - szc * 0.9;
      if (hwc <= 0.4) continue;
      for (var c0 = 0; c0 < cols; c0++) {
        var t = cols === 1 ? 0.5 : c0 / (cols - 1);
        var fx = (t - 0.5) * 2 * hwc * 0.92 + ((r0 % 2) ? hwc * 0.14 : -hwc * 0.14);
        if (Math.abs(fx) > hwc) continue;
        var px = cx + fx * S, py = baseY - fy * S, sz = szc * S;
        drw.poly([[px, py - sz*0.5], [px + sz*0.55, py - sz*0.1],
                  [px + sz*0.25, py + sz*0.5], [px - sz*0.45, py + sz*0.3]],
          { close:true, w:lw*0.7, c:INK, fill:'#FFFFFF' });
        if (k === 1) anchor = [px, py];
        k++;
      }
    }
    if (!anchor) anchor = [cx, baseY - liqTop * 0.6 * S];

  } else if (ck.ice === 'ball') {
    var r = Math.min(hwMid * 0.68, liqTop * 0.44, 9);
    r = Math.max(r, 1.6);
    var cyB = Math.min(Math.max(r * 1.02, liqTop * 0.55), Math.max(r * 1.02, liqTop - r * 0.18));
    var py2 = baseY - cyB * S;
    drw.circ(cx, py2, r * S, { w:lw, c:INK, fill:'#FFFFFF' });
    drw.path(segsFromPts(arcPts(cx, py2, r*0.62*S, Math.PI*1.05, Math.PI*1.42, 6), false), { w:lw*0.7, c:INK });
    anchor = [cx + r*0.72*S, py2 - r*0.52*S];

  } else {
    /* Würfelgröße aus Glasbreite und Füllhöhe, Anzahl daraus abgeleitet */
    var cs = Math.min(hwMid * 0.82, liqTop * 0.40, 6.2);
    cs = Math.max(cs, 1.8);
    var cnt = Math.max(1, Math.min(4, Math.floor(liqTop / (cs * 1.10))));
    if (cnt === 1) cs = Math.min(cs, liqTop * 0.62);
    st.iceCount = cnt;
    for (i = 0; i < cnt; i++) {
      var yy = cnt === 1 ? liqTop * 0.52
             : cs * 0.62 + (liqTop - cs * 1.24) * (i / (cnt - 1));
      var hw2 = hwAt(g, yy);
      var room = Math.max(0, hw2 - cs * 0.62);
      var side = (i % 2 ? 0.42 : -0.38) * (cnt > 1 ? 1 : 0);
      var offx = Math.max(-room, Math.min(room, hw2 * side));
      var pxc = cx + offx * S, pyc = baseY - yy * S, c2 = cs * S;
      drw.poly([[pxc - c2*0.5, pyc - c2*0.18], [pxc - c2*0.12, pyc - c2*0.5],
                [pxc + c2*0.5, pyc - c2*0.5], [pxc + c2*0.5, pyc + c2*0.18],
                [pxc + c2*0.12, pyc + c2*0.5], [pxc - c2*0.5, pyc + c2*0.5]],
        { close:true, w:lw*0.8, c:INK, fill:'#FFFFFF' });
      drw.line(pxc - c2*0.5, pyc - c2*0.18, pxc + c2*0.12, pyc - c2*0.18, { w:lw*0.6, c:INK });
      drw.line(pxc + c2*0.12, pyc - c2*0.18, pxc + c2*0.5, pyc - c2*0.5, { w:lw*0.6, c:INK });
      drw.line(pxc + c2*0.12, pyc - c2*0.18, pxc + c2*0.12, pyc + c2*0.5, { w:lw*0.6, c:INK });
      if (i === cnt - 1) anchor = [pxc, pyc - c2*0.3];
    }
  }
  return anchor;
}

/* ---------- Hauptfunktion ---------- */
/* opts: {scale, mono, showTable, unit, marks (Sammler für Legende)} */
function drawCocktail(drw, ck, cellX, cellY, cellW, cellH, opts) {
  opts = opts || {};
  var S = opts.scale || 1;
  var g = GLASS_BY_ID[ck.glass] || GLASSES[0];
  var lw = Math.max(0.12, 0.20 * Math.min(1.15, Math.max(0.75, S)));
  var fs = Math.max(1.55, Math.min(3.0, 2.50 * Math.pow(S, 0.40)));
  var st = { iceCount: 3 }, plain = !!opts.plain;
  var mxW = BASE_CELL_W * S, mxH = BASE_CELL_H * S;
  if (cellW > mxW) { cellX += (cellW - mxW) / 2; cellW = mxW; }
  if (cellH > mxH) { cellY += (cellH - mxH) / 2; cellH = mxH; }
  var cav = glassCavityTop(g), maxHw = glassMaxHw(g), wall = g.wall || 1.2;
  var Hg = glassTotalHeight(g) * S;
  var cx = cellX + cellW * 0.5 - 1.5 * S;

  var titleH = fs * 2.6 + (ck.altName ? fs * 1.4 : 0) + (ck.note ? fs * 2.6 : 0);
  var methodH = 8 * S;
  var usedH = methodH + Hg + titleH + 3;
  var top = cellY + Math.max(1, (cellH - usedH) / 2);
  var rimY = top + methodH;
  var baseY = rimY + cav * S;          /* y des Kavitätsbodens */

  /* --- Methodensymbol --- */
  var meth = METHOD_BY_ID[ck.method] || METHOD_BY_ID['b'];
  drawMethodSym(drw, meth.sym, cx, top + methodH * 0.42, 6.2 * S, lw);
  if (opts.marks) opts.marks.methods[ck.method] = true;

  /* --- Schichten --- */
  var layers = computeLayers(ck, cav);
  for (var i = 0; i < layers.length; i++) {
    var L = layers[i];
    var ing = ING_BY_ID[L.ing.ingredientId] ||
      { cls:(L.ing.cls || 'other'), color:(L.ing.color || '#DDDDDD'), name:L.ing.name, pat:null, abbr:'' };
    var poly = layerPolygon(g, L.y0, L.y1, S, cx, baseY);
    fillHatched(drw, poly, ing, { scale:S, lw:lw*0.62, mono:opts.mono, color:!opts.mono, noHatch:opts.noHatch });
  }

  /* --- Eis --- */
  var topLayerY = layers.length ? layers[layers.length-1].y1 : cav * 0.5;
  var iceAnchor = drawIce(drw, ck, g, S, cx, baseY, topLayerY, lw, st);

  /* --- Glasumriss --- */
  drawGlassOutline(drw, g, S, cx, baseY, lw);

  /* --- Bezugslinien der Zutaten --- */
  var outerHw = (maxHw + wall) * S;
  var leftX  = cx - outerHw - 3.0 * S, rightX = cx + outerHw + 3.0 * S;
  var lab = { l: [], r: [] };
  var mainSym = meth.sym, anyIcon = false;
  for (var k = 0; !plain && k < layers.length; k++) {
    var Ly = baseY - (layers[k].y0 + layers[k].y1) / 2 * S;
    var side = (k % 2 === 0) ? 'l' : 'r';
    var psym = prepSymbol(layers[k].ing.prep);
    if (psym === mainSym) psym = null;
    if (psym) { anyIcon = true; if (opts.usedSyms) opts.usedSyms[psym] = true; }
    lab[side].push({ y: Ly, txt: amountLabel(layers[k].ing, opts.unit || 'cl'),
                     sym: psym, yc: (layers[k].y0 + layers[k].y1) / 2 });
  }
  if (opts.usedSyms) opts.usedSyms[mainSym] = true;
  var iconW = anyIcon ? 5.4 * S : 0;
  var lineH = fs * 1.06, blockH = lineH * 2 + 0.5;
  ['l','r'].forEach(function (side) {
    var arr = lab[side];
    arr.sort(function (a, b) { return a.y - b.y; });
    for (var q = 1; q < arr.length; q++)
      if (arr[q].y - arr[q-1].y < blockH) arr[q].y = arr[q-1].y + blockH;
    var overflow = arr.length ? (arr[arr.length-1].y - (cellY + cellH - 4)) : 0;
    if (overflow > 0) for (var q2 = 0; q2 < arr.length; q2++) arr[q2].y -= overflow;
  });
  var dimXpre = cellX + cellW - 2.2;
  ['l','r'].forEach(function (side) {
    var sx = side === 'l' ? -1 : 1;
    var maxw = 0;
    lab[side].forEach(function (it) {
      var p = it.txt.split(' (');
      maxw = Math.max(maxw, textWidth(p[0], fs), textWidth(p.length > 1 ? '(' + p[1] : '', fs));
    });
    var tx = side === 'l' ? (cellX + 1.2 + iconW + maxw) : (dimXpre - 3.2 - iconW - maxw);
    var edge = side === 'l' ? Math.min(tx + 1.4 * S, leftX) : Math.max(tx - 1.4 * S, rightX);
    lab[side].forEach(function (it) {
      var innerHw = hwAt(g, it.yc) * S;
      var p0x = cx + sx * innerHw * 0.55, p0y = baseY - it.yc * S;
      var p1x = cx + sx * (hwAt(g, it.yc) + wall) * S, p1y = p0y;
      drw.circ(p0x, p0y, lw * 1.5, { w:0, fill:INK });
      drw.path([['M', p0x, p0y], ['L', p1x, p1y], ['L', edge, it.y], ['L', tx, it.y]], { w:lw*0.8, c:INK });
      var parts = it.txt.split(' (');
      var l1 = parts[0], l2 = parts.length > 1 ? '(' + parts[1] : '';
      drw.text(tx, it.y - 0.3, l1, { size:fs, anchor: side==='l' ? 'end' : 'start' });
      if (l2) drw.text(tx, it.y - 0.3 + lineH, l2, { size:fs, anchor: side==='l' ? 'end' : 'start' });
      if (it.sym) {
        /* Symbol außen neben der Beschriftung, kleiner Pfeil zur Beschriftung */
        var ix = side === 'l' ? (tx - maxw - iconW * 0.55) : (tx + maxw + iconW * 0.55);
        drawMethodSym(drw, it.sym, ix, it.y + lineH * 0.3, 4.4 * S, lw * 0.85);
      }
    });
  });

  /* --- Maßlinie Glasvolumen --- */
  var dimX = cellX + cellW - 2.2;
  if (!plain) {
  var yTopDim = rimY, yBotDim = baseY;
  drw.line(dimX, yTopDim, dimX, yBotDim, { w:lw*0.8, c:INK });
  [[yTopDim, 1], [yBotDim, -1]].forEach(function (a) {
    drw.poly([[dimX, a[0]], [dimX - 0.55*S, a[0] + a[1]*1.5*S], [dimX + 0.55*S, a[0] + a[1]*1.5*S]],
      { close:true, w:lw*0.6, c:INK, fill:INK });
  });
  drw.line(dimX - 3.5, yTopDim, dimX + 0.9, yTopDim, { w:lw*0.5, c:INK, d:[0.8,0.8] });
  drw.line(dimX - 3.5, yBotDim, dimX + 0.9, yBotDim, { w:lw*0.5, c:INK, d:[0.8,0.8] });
  drw.text(dimX - 0.9, (yTopDim + yBotDim) / 2, volLabel(g.vol, opts.unit || 'cl'),
    { size:fs, anchor:'middle', rot:-90 });
  }

  /* --- Eis-Beschriftung --- */
  if (!plain && iceAnchor && ck.ice && ck.ice !== 'none') {
    var gi = GAR_BY_ID[(ICE_BY_ID[ck.ice] || {}).gid];
    if (gi) {
      var cnt = ck.ice === 'cubes' ? 3 : 1;
      var sgn = iceAnchor[0] >= cx ? 1 : -1;
      if (lab.l.length !== lab.r.length) sgn = lab.l.length < lab.r.length ? -1 : 1;
      var lx = cx + sgn * (outerHw + 2.2 * S);
      var ly = Math.max(rimY + 1.5 * S, iceAnchor[1] - 2.0 * S);
      /* Kollision mit der obersten Bezugslinien-Beschriftung dieser Seite vermeiden */
      var sideLabs = sgn < 0 ? lab.l : lab.r;
      sideLabs.forEach(function (it) { if (Math.abs(it.y - ly) < blockH) ly = Math.min(ly, it.y - blockH); });
      ly = Math.max(ly, rimY - 3.0 * S);
      drw.path([['M', iceAnchor[0], iceAnchor[1]], ['L', lx - sgn * 2.0*S, ly], ['L', lx, ly]], { w:lw*0.7, c:INK });
      drw.circ(iceAnchor[0], iceAnchor[1], lw*1.4, { w:0, fill:INK });
      drw.text(lx + sgn * 0.6, ly + fs*0.35, (ck.ice === 'crushed' ? '' : cnt + ' ') + '(' + gi.key + ')',
        { size:fs, anchor: sgn > 0 ? 'start' : 'end' });
      if (opts.marks) opts.marks.gars[gi.id] = true;
    }
  }

  /* --- Garnituren am Glasrand --- */
  var rimHw = (hwAt(g, cav) + wall) * S;
  var gcount = 0, inCount = 0;
  (ck.garnish || []).forEach(function (gr) {
    var G = GAR_BY_ID[gr.id]; if (!G) return;
    if (opts.marks) opts.marks.gars[G.id] = true;
    var side = (gcount % 2 === 0) ? 1 : -1, idx = Math.floor(gcount / 2);
    var ps = 5.4 * S;
    var gx = cx + side * (rimHw * 0.92 + idx * ps * 1.15);
    var gy = rimY - ps * 0.22;
    if (G.at === 'in') {
      /* Größe und Lage aus Glasbreite und Füllhöhe ableiten, damit die
         Garnitur im Getränk liegt und nicht daneben hängt */
      var liqT = Math.max(2, Math.min(cav * FILL_RATIO, topLayerY));
      var hwL = hwAt(g, liqT);
      ps = Math.max(3.0, Math.min(hwL * 0.92, liqT * 0.80, 8.6)) * S;
      var roomG = Math.max(0, hwL * S - ps * 0.55);
      var baseOff = (ck.ice && ck.ice !== 'none' && ck.ice !== 'crushed') ? 0.58 : 0.34;
      gx = cx + side * Math.min(roomG, hwL * baseOff * S + inCount * ps * 1.05);
      gy = baseY - liqT * S;   /* Mitte auf der Flüssigkeitsoberfläche: schwimmt */
      inCount++;
    } else if (G.at === 'side') {
      gx = cx + side * (rimHw + ps * 0.7); gy = rimY + ps * 0.4;
    }
    drawPic(drw, G.pic, gx, gy, ps, lw * 0.8);
    var tx2 = gx + side * ps * 0.62, tyG = gy - ps * 0.52;
    if (G.at === 'in' && !plain) {
      var ox = cx + side * (rimHw + 2.2 * S), oy = gy - ps * 0.62;
      drw.path([['M', gx + side * ps * 0.35, gy], ['L', ox - side * 1.5 * S, oy], ['L', ox, oy]],
        { w:lw*0.7, c:INK });
      tx2 = ox + side * 0.6; tyG = oy + fs * 0.35;
    }
    if (!plain) drw.text(tx2, tyG, (gr.count || 1) + ' (' + G.key + ')',
      { size:fs*0.95, anchor: side > 0 ? 'start' : 'end' });
    gcount++;
  });

  /* --- Titel --- */
  var ty = baseY + (g.kind === 'stem' ? ((g.stem||0) + (g.footH||0)) * S : (g.base||3) * S) + fs * 2.1;
  var title = (ck.name || '').toUpperCase();
  drw.text(cx, ty, title, { size:fs*1.2, anchor:'middle', bold:true });
  var tw = textWidth(title, fs*1.2, true);
  drw.line(cx - tw/2, ty + fs*0.42, cx + tw/2, ty + fs*0.42, { w:lw*0.8, c:INK });
  var ny = ty + fs*1.7;
  if (ck.altName && !plain) {
    drw.text(cx, ny, '(Alternativname: ' + ck.altName + ')', { size:fs*0.9, anchor:'middle' });
    ny += fs*1.3;
  }
  if (ck.note && !plain) {
    var words = ck.note.split(' '), line = '', lines = [], maxw = cellW - 6;
    words.forEach(function (w) {
      var t = line ? line + ' ' + w : w;
      if (textWidth(t, fs*0.85) > maxw) { lines.push(line); line = w; } else line = t;
    });
    if (line) lines.push(line);
    lines.slice(0, 3).forEach(function (l, li) {
      drw.text(cx, ny + li * fs, l, { size:fs*0.85, anchor:'middle' });
    });
    ny += Math.min(3, lines.length) * fs;
  }
  if (ck.noteRef) {
    var hx2 = cx + textWidth(title, fs*1.2, true)/2 + fs*1.4, hy3 = ty - fs*0.3;
    drw.poly([[hx2, hy3 - fs*0.85], [hx2 + fs*0.85, hy3 + fs*0.6], [hx2 - fs*0.85, hy3 + fs*0.6]],
      { close:true, w:lw*0.8, c:INK });
    drw.text(hx2, hy3 + fs*0.35, String(ck.noteRef), { size:fs*0.8, anchor:'middle' });
  }

  /* --- optionale Zutatentabelle --- */
  if (opts.showTable) {
    var tyy = ny + fs * 1.4, colX = cellX + 3;
    ck.ingredients.forEach(function (ing, ii) {
      var y2 = tyy + ii * fs * 1.15;
      drw.text(colX, y2, String(ii+1), { size:fs*0.85 });
      drw.text(colX + 4, y2, amountLabel(ing, 'cl').split(' (')[0], { size:fs*0.85 });
      drw.text(colX + 17, y2, ing.name, { size:fs*0.85 });
      var sy = prepSymbol(ing.prep);
      drw.text(cellX + cellW - 3, y2, sy ? (SYMBOL_BY_ID[sy] || {}).name || '' : '', { size:fs*0.85, anchor:'end' });
    });
  }
}

/* Sammler für die Legenden eines Blattes */
function newMarks() { return { ings:{}, gars:{}, methods:{}, glasses:{} }; }


/* ===== 13_draw_sheet.js ===== */

/* ============================================================
   Zeichnungsblatt ("Plan")
   ============================================================ */
var SHEET_SIZES = {
  A4: [297, 210], A3: [420, 297], A2: [594, 420], A1: [841, 594], A0: [1189, 841]
};
function sheetDims(fmt, orientation) {
  var d = SHEET_SIZES[fmt] || SHEET_SIZES.A2;
  return orientation === 'portrait' ? { w:d[1], h:d[0] } : { w:d[0], h:d[1] };
}

function wrapText(s, maxw, size, bold) {
  var words = String(s).split(/\s+/), line = '', out = [];
  for (var i = 0; i < words.length; i++) {
    var t = line ? line + ' ' + words[i] : words[i];
    if (textWidth(t, size, bold) > maxw && line) { out.push(line); line = words[i]; }
    else line = t;
  }
  if (line) out.push(line);
  return out;
}

/* Marks über das ganze Projekt sammeln (für die Legenden) */
function collectMarks(cocktails) {
  var m = newMarks();
  cocktails.forEach(function (ck) {
    m.methods[ck.method || 'b'] = true;
    m.glasses[ck.glass] = true;
    (ck.ingredients || []).forEach(function (ing) {
      var I = ING_BY_ID[ing.ingredientId] ||
        { cls:ing.cls || 'other', color:ing.color || '#DDDDDD', abbr:'', pat:null };
      m.ings[ing.ingredientId || ing.name] =
        { name: ing.name || I.name, cls: I.cls, color: I.color, abbr: I.abbr || '', pat: I.pat };
    });
    (ck.garnish || []).forEach(function (gr) { if (GAR_BY_ID[gr.id]) m.gars[gr.id] = true; });
    var ic = ICE_BY_ID[ck.ice];
    if (ic && ic.gid) m.gars[ic.gid] = true;
  });
  return m;
}

/* Alle Zubereitungssymbole, die auf dem Blatt vorkommen */
function collectSymbols(cocktails) {
  var used = {};
  cocktails.forEach(function (ck) {
    var m = METHOD_BY_ID[ck.method] || METHOD_BY_ID.b;
    used[m.sym] = true;
    (ck.ingredients || []).forEach(function (i) {
      var sy = prepSymbol(i.prep);
      if (sy && sy !== m.sym) used[sy] = true;
    });
  });
  return used;
}

/* ---------- Layout ---------- */
function computeSheetLayout(project) {
  var s = project.settings, d = sheetDims(s.sheetFormat, s.orientation);
  var W = d.w, H = d.h;
  var ml = 20, mr = 10, mt = 10, mb = 10;                 /* Innenrahmen */
  var RC = Math.max(112, Math.min(190, W * 0.255));       /* Legendenspalte */
  var pre = { W:W, H:H, ml:ml, mr:mr, mt:mt, mb:mb, RC:RC, areaX:ml, areaW:W - ml - mr - RC - 3 };
  var TBM = titleBlockMetrics(pre, project);
  var revN = Math.min(6, (s.revisions || []).length);
  var TB_H = Math.max(TBM.h, revN ? 4.4 + revN * 4.2 : 0);  /* Höhe des unteren Streifens */
  var innerX = ml, innerY = mt, innerW = W - ml - mr, innerH = H - mt - mb;
  var topTitleH = 0;
  if (s.titlePosition === 'top') {
    var tl = wrapText((s.titleBlock || {}).title || '', innerW - RC - 13, 6.0, true).slice(0, 2).length;
    topTitleH = 9 + tl * 7.2 + (project.subtitle ? 5.2 : 0) + 4;
  }
  var areaX = innerX, areaY = innerY + topTitleH;
  var areaW = innerW - RC - 3;
  var areaH = innerH - TB_H - 3 - topTitleH;

  var n = Math.max(1, project.cocktails.length);
  var best = null;
  for (var cols = 1; cols <= 14; cols++) {
    var rows = Math.ceil(n / cols);
    var cw = areaW / cols, chh = areaH / rows;
    var sc = Math.min(cw / BASE_CELL_W, chh / BASE_CELL_H);
    if (!best || sc > best.scale) best = { cols:cols, rows:rows, scale:sc };
  }
  var minScale = 0.85, maxScale = 1.35;
  var pages = [];
  if (best.scale >= minScale || project.settings.fitToOneSheet) {
    best.scale = Math.max(project.settings.fitToOneSheet ? 0.34 : minScale, Math.min(maxScale, best.scale));
    pages = [project.cocktails.slice()];
  } else {
    /* Kapazität bei Mindestmaßstab bestimmen */
    var colsC = Math.max(1, Math.floor(areaW / (BASE_CELL_W * minScale)));
    var rowsC = Math.max(1, Math.floor(areaH / (BASE_CELL_H * minScale)));
    var cap = colsC * rowsC;
    for (var i = 0; i < project.cocktails.length; i += cap) pages.push(project.cocktails.slice(i, i + cap));
    best = { cols:colsC, rows:rowsC, scale:minScale };
    var nn = Math.max(1, pages[0].length), b2 = null;
    for (var c2 = 1; c2 <= 14; c2++) {
      var r2 = Math.ceil(nn / c2);
      if (r2 > rowsC) continue;
      var sc2 = Math.min(areaW / c2 / BASE_CELL_W, areaH / r2 / BASE_CELL_H);
      if (!b2 || sc2 > b2.scale) b2 = { cols:c2, rows:r2, scale:Math.min(maxScale, sc2) };
    }
    if (b2) best = b2;
  }
  if (!pages.length) pages = [[]];
  return { W:W, H:H, ml:ml, mr:mr, mt:mt, mb:mb, RC:RC, TB_H:TB_H, TBW:TBM.w, topTitleH:topTitleH,
           areaX:areaX, areaY:areaY, areaW:areaW, areaH:areaH,
           cols:best.cols, rows:best.rows, scale:best.scale, pages:pages };
}

/* ---------- Rahmen mit Zonenkennzeichnung ---------- */
function drawFrame(drw, L) {
  var W = L.W, H = L.H;
  drw.rect(5, 5, W - 10, H - 10, { w:0.35 });
  drw.rect(L.ml, L.mt, W - L.ml - L.mr, H - L.mt - L.mb, { w:0.5 });
  var zx = Math.max(4, Math.round((W - L.ml - L.mr) / 105)),
      zy = Math.max(3, Math.round((H - L.mt - L.mb) / 105));
  var i, x, y, letters = 'ABCDEFGHIJ';
  for (i = 0; i < zx; i++) {
    x = L.ml + (W - L.ml - L.mr) * (i + 0.5) / zx;
    drw.text(x, L.mt - 2.6, String(i + 1), { size:3, anchor:'middle' });
    drw.text(x, H - L.mb + 4.6, String(i + 1), { size:3, anchor:'middle' });
    if (i > 0) {
      var xd = L.ml + (W - L.ml - L.mr) * i / zx;
      drw.line(xd, 5, xd, L.mt, { w:0.25 }); drw.line(xd, H - L.mb, xd, H - 5, { w:0.25 });
    }
  }
  for (i = 0; i < zy; i++) {
    y = L.mt + (H - L.mt - L.mb) * (i + 0.5) / zy;
    drw.text(L.ml - 5.5, y + 1, letters[i], { size:3, anchor:'middle' });
    drw.text(W - L.mr + 5.5, y + 1, letters[i], { size:3, anchor:'middle' });
    if (i > 0) {
      var yd = L.mt + (H - L.mt - L.mb) * i / zy;
      drw.line(5, yd, L.ml, yd, { w:0.25 }); drw.line(W - L.mr, yd, W - 5, yd, { w:0.25 });
    }
  }
}

function boxTitle(drw, x, y, w, txt) {
  drw.text(x + 1.6, y + 4.0, txt, { size:3.0, bold:true, ls:0.25 });
  drw.line(x, y + 5.4, x + w, y + 5.4, { w:0.25 });
  return y + 5.4;
}

/* ---------- Legenden ---------- */
function drawGarnishLegend(drw, x, y, w, marks) {
  var ids = GARNISHES.filter(function (g) { return marks.gars[g.id]; });
  if (!ids.length) return y;
  var cols = Math.max(2, Math.floor(w / 46));
  var colw = w / cols, rowh = 9.2;
  var rows = Math.ceil(ids.length / cols);
  var h = 5.4 + rows * rowh + 2;
  drw.rect(x, y, w, h, { w:0.35 });
  var yy = boxTitle(drw, x, y, w, 'GARNITUREN UND ZUSÄTZE');
  ids.forEach(function (g, i) {
    var c = i % cols, r = Math.floor(i / cols);
    var gx = x + c * colw + 5.5, gy = yy + 1.5 + r * rowh + rowh * 0.42;
    drawPic(drw, g.pic, gx, gy, 7.0, 0.16);
    var lines = wrapText('1 – ' + g.name + ' (' + g.key + ')', colw - 12, 2.5);
    lines.slice(0, 2).forEach(function (l, li) {
      drw.text(gx + 5.4, gy - 0.6 + li * 2.9, l, { size:2.5 });
    });
  });
  return y + h + 3;
}

function drawMethodLegend(drw, x, y, w, usedSyms) {
  var ms = SYMBOLS.filter(function (m) { return usedSyms[m.id]; });
  if (!ms.length) return y;
  var cols = w >= 150 ? 2 : 1, colw = w / cols;
  var rows = Math.ceil(ms.length / cols), rowh = 9.0;
  var h = 5.4 + rows * rowh + 1.5;
  drw.rect(x, y, w, h, { w:0.35 });
  var yy = boxTitle(drw, x, y, w, 'ZUBEREITUNG – SYMBOL ÜBER DEM GLAS ODER AN DER SCHICHT');
  ms.forEach(function (m, i) {
    var c = i % cols, r = Math.floor(i / cols);
    var gx = x + c * colw + 6.5, gy = yy + 1.5 + r * rowh + rowh * 0.45;
    drawMethodSym(drw, m.id, gx, gy, 6.5, 0.2);
    var lines = wrapText(m.name, colw - 16, 2.5);
    lines.slice(0, 2).forEach(function (l, li) { drw.text(gx + 6.5, gy - 0.4 + li * 2.9, l, { size:2.5 }); });
  });
  return y + h + 3;
}

function drawIngredientLegend(drw, x, y, w, marks, mono, maxH) {
  var list = Object.keys(marks.ings).map(function (k) {
    var v = marks.ings[k];
    return { id:k, name:v.name, cls:v.cls, color:v.color, abbr:v.abbr, pat:v.pat };
  });
  if (!list.length) return y;
  list.sort(function (a, b) { return a.name.localeCompare(b.name, 'de'); });
  var cols = Math.max(1, Math.floor(w / 56)), rowh = 5.2, rows, h;
  function calc() { rows = Math.ceil(list.length / cols); h = 5.4 + rows * rowh + 2.5; }
  calc();
  while (maxH && h > maxH && cols < 5) { cols++; calc(); }
  while (maxH && h > maxH && rowh > 3.6) { rowh -= 0.2; calc(); }
  if (maxH && h > maxH) {                     /* Notfall: Liste kürzen */
    var fit = Math.max(1, Math.floor((maxH - 8) / rowh) * cols);
    if (list.length > fit) list = list.slice(0, fit - 1).concat([{ name:'… weitere', cls:'other', color:'#FFFFFF', abbr:'' }]);
    calc();
  }
  var colw = w / cols;
  drw.rect(x, y, w, h, { w:0.35 });
  var yy = boxTitle(drw, x, y, w, 'ZUTATEN – FARBE UND MUSTER');
  list.forEach(function (it, i) {
    var c = i % cols, r = Math.floor(i / cols);
    var sx = x + 2 + c * colw, sy = yy + 2.2 + r * rowh;
    hatchSwatch(drw, sx, sy, 13, rowh - 1.6, it, { mono:mono, color:!mono, lw:0.12 });
    var nm = it.name;
    while (textWidth(nm, 2.5) > colw - 18 && nm.length > 4) nm = nm.slice(0, -2);
    if (nm !== it.name) nm = nm + '.';
    drw.text(sx + 14.6, sy + rowh * 0.62, nm, { size:2.5 });
  });
  return y + h + 3;
}

function notesHeight(w, notes) {
  var h = 5.4 + 2.2;
  (notes || []).forEach(function (n) { h += wrapText(n, w - 12, 2.5).length * 3.2 + 0.8; });
  return Math.max(12, h + 0.6);
}
function drawGeneralNotes(drw, x, y, w, h, notes) {
  drw.rect(x, y, w, h, { w:0.35 });
  var yy = boxTitle(drw, x, y, w, 'ALLGEMEINE HINWEISE');
  var cy = yy + 4.2;
  (notes || []).forEach(function (n, i) {
    var lines = wrapText(n, w - 12, 2.5);
    lines.forEach(function (l, li) {
      if (cy > y + h - 1.5) return;
      if (li === 0) {
        drw.poly([[x + 3.2, cy - 2.4], [x + 6.4, cy + 0.6], [x + 0.0 + 0.0, cy + 0.6]], { close:true, w:0.2 });
        drw.text(x + 3.2, cy + 0.1, String(i + 1), { size:1.9, anchor:'middle' });
      }
      drw.text(x + 8.4, cy, l, { size:2.5 });
      cy += 3.2;
    });
    cy += 0.8;
  });
  return y + h;
}

/* ---------- Schriftfeld ----------
   Nur so groß wie nötig. Titel wahlweise im Schriftfeld (oberste Zeile,
   rechtsbündig) oder mittig über den Cocktails (settings.titlePosition = 'top'). */
function titleBlockMetrics(L, project) {
  var s = project.settings, tb = s.titleBlock || {};
  var inBlock = s.titlePosition !== 'top';
  var colR = 54;                                   /* Nummer / Blatt */
  var qrW = s.qrInTitleBlock ? 20 : 0;
  var midW = 96;
  var titleLines = inBlock ? wrapText(tb.title || '', Math.min(L.RC + 70, 220) - 6, 4.6, true).slice(0, 3) : [];
  var titleW = 0;
  titleLines.forEach(function (l) { titleW = Math.max(titleW, textWidth(l, 4.6, true, 0.3)); });
  var w = Math.max(qrW + (qrW ? 3 : 0) + midW + colR, inBlock ? titleW + 8 : 0, L.RC);
  w = Math.min(w, L.W - L.ml - L.mr - 30);
  var topH = inBlock ? (2.2 + titleLines.length * 5.4 + (project.subtitle ? 4.0 : 0) + 1.6) : 0;
  var lowH = Math.max(qrW ? qrW + 3 : 0, 16);
  return { w:w, h:topH + lowH, topH:topH, lowH:lowH, colR:colR, qrW:qrW, titleLines:titleLines, inBlock:inBlock };
}
function drawTitleBlock(drw, L, project, page, pages, qrMatrix) {
  var s = project.settings, tb = s.titleBlock || {};
  var M = titleBlockMetrics(L, project);
  var x1 = L.W - L.mr, y1 = L.H - L.mb;
  var w = M.w, h = M.h, x = x1 - w, y = y1 - h;
  drw.rect(x, y, w, h, { w:0.5 });

  /* Titelzeile */
  if (M.inBlock) {
    var ty = y + 5.6;
    M.titleLines.forEach(function (l, i) {
      drw.text(x1 - 3, ty + i * 5.4, l, { size:4.6, bold:true, ls:0.3, anchor:'end' });
    });
    var sy2 = ty + M.titleLines.length * 5.4 - 0.4;
    if (project.subtitle) drw.text(x1 - 3, sy2, project.subtitle, { size:3.0, anchor:'end' });
    drw.line(x, y + M.topH, x1, y + M.topH, { w:0.35 });
  }

  /* untere Zeile: QR | Angaben | Nummer/Blatt */
  var ly = y + M.topH, lh = M.lowH;
  var cx0 = x;
  if (qrMatrix && M.qrW) {
    drawQrMatrix(drw, qrMatrix, x + 1.5, ly + 1.5, M.qrW);
    cx0 = x + M.qrW + 3;
    drw.line(cx0, ly, cx0, y1, { w:0.25 });
  }
  var midX = x1 - M.colR;
  drw.line(midX, ly, midX, y1, { w:0.35 });
  var r1 = cx0 + 2.5, ta = ly + 4.8, tb2 = ly + lh - 3.6;
  drw.text(r1, ta - 1.6, 'REZEPTE VON', { size:1.9 });
  drw.text(r1, ta + 1.6, tb.recipesBy || '—', { size:2.7 });
  var half = (midX - cx0) / 2;
  drw.text(r1 + half, ta - 1.6, 'ORT', { size:1.9 });
  drw.text(r1 + half, ta + 1.6, tb.location || '—', { size:2.7 });
  drw.text(r1, tb2 - 1.6, 'DATUM', { size:1.9 });
  drw.text(r1, tb2 + 1.6, tb.date || '', { size:2.7 });
  drw.text(r1 + half, tb2 - 1.6, 'BLATTFORMAT', { size:1.9 });
  drw.text(r1 + half, tb2 + 1.6, s.sheetFormat + (s.orientation === 'portrait' ? ' hoch' : ' quer'), { size:2.7 });
  if (!M.inBlock && project.subtitle) { /* Untertitel steht oben beim Titel */ }

  drw.text(midX + 2.5, ta - 1.6, 'ZEICHNUNGSNUMMER', { size:1.9 });
  drw.text(midX + 2.5, ta + 2.0, tb.drawingNumber || '—', { size:3.6, bold:true });
  drw.text(midX + 2.5, tb2 - 1.6, 'BLATT', { size:1.9 });
  drw.text(midX + 2.5, tb2 + 1.6, page + ' von ' + pages, { size:2.7, bold:true });
  return { x:x, y:y, w:w, h:h };
}

/* Titel über dem Zeichenfeld */
function drawTopTitle(drw, L, project) {
  var tb = project.settings.titleBlock || {};
  var cx = L.areaX + L.areaW / 2, y = L.mt + 8.5;
  var lines = wrapText(tb.title || '', L.areaW - 10, 6.0, true).slice(0, 2);
  lines.forEach(function (l, i) { drw.text(cx, y + i * 7.2, l, { size:6.0, bold:true, ls:0.4, anchor:'middle' }); });
  var yy = y + (lines.length - 1) * 7.2;
  if (project.subtitle) { yy += 5.2; drw.text(cx, yy, project.subtitle, { size:3.4, anchor:'middle' }); }
  var tw = 0; lines.forEach(function (l) { tw = Math.max(tw, textWidth(l, 6.0, true, 0.4)); });
  drw.line(cx - tw / 2, yy + 2.2, cx + tw / 2, yy + 2.2, { w:0.4 });
  return yy + 6;
}

function drawRevisionTable(drw, L, project, tbBox) {
  var revs = (project.settings.revisions || []).slice(-6);
  if (!revs.length) return;
  var rowh = 4.2, headH = 4.4;
  var maxRows = Math.max(1, Math.floor((L.TB_H - headH) / rowh));
  if (revs.length > maxRows) revs = revs.slice(-maxRows);
  var w = 108, h = headH + revs.length * rowh;
  var x = tbBox.x - w - 3, y = tbBox.y + tbBox.h - h;
  drw.rect(x, y, w, h, { w:0.35 });
  var cols = [0, 10, 62, 84, w];
  drw.line(x, y + headH, x + w, y + headH, { w:0.25 });
  var heads = ['REV', 'BESCHREIBUNG', 'DATUM', 'NAME'];
  heads.forEach(function (t, i) {
    drw.text(x + cols[i] + 1.4, y + 3.3, t, { size:2.2, bold:true });
    if (i > 0) drw.line(x + cols[i], y, x + cols[i], y + h, { w:0.25 });
  });
  revs.slice().reverse().forEach(function (r, i) {
    var ry = y + headH + i * rowh + 3.1;
    drw.text(x + 1.4, ry, String(r.rev), { size:2.4 });
    var d = r.text || '';
    while (textWidth(d, 2.4) > cols[2] - cols[1] - 3 && d.length > 3) d = d.slice(0, -2);
    drw.text(x + cols[1] + 1.4, ry, d, { size:2.4 });
    drw.text(x + cols[2] + 1.4, ry, r.date || '', { size:2.4 });
    drw.text(x + cols[3] + 1.4, ry, r.by || '', { size:2.4 });
    if (i < revs.length - 1) drw.line(x, y + headH + (i+1)*rowh, x + w, y + headH + (i+1)*rowh, { w:0.15 });
  });
}

/* ---------- QR-Matrix ins Schriftfeld ---------- */
function drawQrMatrix(drw, m, x, y, size) {
  var n = m.length, c = size / n;
  drw.rect(x - 0.8, y - 0.8, size + 1.6, size + 1.6, { w:0, fill:'#FFFFFF' });
  for (var r = 0; r < n; r++) {
    var run = -1;
    for (var q = 0; q <= n; q++) {
      var on = q < n && m[r][q];
      if (on && run < 0) run = q;
      if (!on && run >= 0) {
        drw.rect(x + run * c, y + r * c, (q - run) * c + 0.02, c + 0.02, { w:0, fill:INK });
        run = -1;
      }
    }
  }
}

/* ---------- Blatt zeichnen ---------- */
function drawSheet(project, pageIdx, layout, qrMatrix) {
  var L = layout || computeSheetLayout(project);
  var drw = new Drw();
  var s = project.settings, mono = s.colorMode === 'bw';
  drw.rect(0, 0, L.W, L.H, { w:0, fill:'#FFFFFF' });
  drawFrame(drw, L);

  var list = L.pages[pageIdx] || [];
  var marks = collectMarks(project.cocktails);
  var usedSyms = collectSymbols(project.cocktails);
  if (s.titlePosition === 'top') drawTopTitle(drw, L, project);

  /* Cocktail-Raster */
  var cw = L.areaW / L.cols, ch = L.areaH / L.rows;
  list.forEach(function (ck, i) {
    var c = i % L.cols, r = Math.floor(i / L.cols);
    if (r >= L.rows) return;
    drawCocktail(drw, ck, L.areaX + c * cw, L.areaY + r * ch, cw, ch, {
      scale: L.scale, mono: mono, showTable: s.showNotesTable, unit: s.unit, marks: null
    });
  });

  /* Legendenspalte */
  var lx = L.W - L.mr - L.RC, ly = L.mt + 1, lw = L.RC;
  ly = drawGarnishLegend(drw, lx, ly, lw, marks);
  ly = drawMethodLegend(drw, lx, ly, lw, usedSyms);
  var notesH = (s.generalNotes || []).length ? notesHeight(lw, s.generalNotes) : 0;
  var notesY = L.H - L.mb - L.TB_H - 3 - notesH;
  ly = drawIngredientLegend(drw, lx, ly, lw, marks, mono, notesY - ly - 3);
  if (notesH) drawGeneralNotes(drw, lx, notesY, lw, notesH, s.generalNotes);

  var tbBox = drawTitleBlock(drw, L, project, pageIdx + 1, L.pages.length, qrMatrix);
  drawRevisionTable(drw, L, project, tbBox);
  return drw;
}


/* ===== 14_render_svg.js ===== */

/* ============================================================
   Ausgabe der Ops-Liste als SVG (Bildschirm, Vorschau, Druck)
   ============================================================ */
var SVG_FONT = "'Helvetica Neue',Helvetica,Arial,sans-serif";

function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function nn(v) { return (Math.round(v * 100) / 100); }

function segsToD(segs) {
  var d = '';
  for (var i = 0; i < segs.length; i++) {
    var s = segs[i];
    if (s[0] === 'M') d += 'M' + nn(s[1]) + ' ' + nn(s[2]);
    else if (s[0] === 'L') d += 'L' + nn(s[1]) + ' ' + nn(s[2]);
    else if (s[0] === 'C') d += 'C' + nn(s[1]) + ' ' + nn(s[2]) + ' ' + nn(s[3]) + ' ' + nn(s[4]) + ' ' + nn(s[5]) + ' ' + nn(s[6]);
    else if (s[0] === 'Z') d += 'Z';
    d += ' ';
  }
  return d.trim();
}

var SVG_SEQ = 0;
function opsToSvg(ops, W, H, opt) {
  opt = opt || {};
  /* Eigener Präfix je Aufruf: sonst greifen mehrere SVGs auf derselben
     Seite auf denselben Clip-Pfad zu und die Muster verschwinden. */
  var pre = 'c' + (++SVG_SEQ) + '_';
  var out = [], defs = [], clipId = 0, open = 0;
  for (var i = 0; i < ops.length; i++) {
    var o = ops[i];
    switch (o.t) {
      case 'l':
        out.push('<path d="M' + nn(o.x1) + ' ' + nn(o.y1) + 'L' + nn(o.x2) + ' ' + nn(o.y2) +
          '" stroke="' + o.c + '" stroke-width="' + nn(o.w) + '" fill="none"' +
          (o.d ? ' stroke-dasharray="' + o.d.join(' ') + '"' : '') + '/>');
        break;
      case 'p':
        out.push('<path d="' + segsToD(o.segs) + '"' +
          (o.fill ? ' fill="' + o.fill + '"' : ' fill="none"') +
          (o.w > 0 ? ' stroke="' + o.c + '" stroke-width="' + nn(o.w) + '"' : '') + '/>');
        break;
      case 'c':
        out.push('<circle cx="' + nn(o.cx) + '" cy="' + nn(o.cy) + '" r="' + nn(o.r) + '"' +
          (o.fill ? ' fill="' + o.fill + '"' : ' fill="none"') +
          (o.w > 0 ? ' stroke="' + o.c + '" stroke-width="' + nn(o.w) + '"' : '') + '/>');
        break;
      case 't':
        var anc = o.anchor === 'middle' ? 'middle' : (o.anchor === 'end' ? 'end' : 'start');
        out.push('<text x="' + nn(o.x) + '" y="' + nn(o.y) + '" font-size="' + nn(o.size) +
          '" font-family="' + SVG_FONT + '" fill="' + o.c + '" text-anchor="' + anc + '"' +
          (o.bold ? ' font-weight="700"' : '') +
          (o.ls ? ' letter-spacing="' + nn(o.ls) + '"' : '') +
          (o.rot ? ' transform="rotate(' + nn(o.rot) + ' ' + nn(o.x) + ' ' + nn(o.y) + ')"' : '') +
          '>' + esc(o.s) + '</text>');
        break;
      case 'k':
        clipId++;
        defs.push('<clipPath id="' + pre + clipId + '"><path d="' + segsToD(o.segs) + '"/></clipPath>');
        out.push('<g clip-path="url(#' + pre + clipId + ')">'); open++;
        break;
      case 'u':
        if (open > 0) { out.push('</g>'); open--; }
        break;
    }
  }
  while (open-- > 0) out.push('</g>');
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + W + ' ' + H + '"' +
    (opt.width ? ' width="' + opt.width + '"' : '') +
    (opt.height ? ' height="' + opt.height + '"' : '') +
    ' shape-rendering="geometricPrecision" style="' + (opt.style || '') + '">' +
    '<defs>' + defs.join('') + '</defs>' + out.join('') + '</svg>';
}

/* Kleine Vorschau eines einzelnen Cocktails (Fundus-Kachel) */
function cocktailPreviewSvg(ck, w, h, opt) {
  opt = opt || {};
  var drw = new Drw();
  var cw = opt.plain ? 46 : BASE_CELL_W, chh = opt.plain ? 62 : BASE_CELL_H;
  drawCocktail(drw, ck, 0, 0, cw, chh, { scale: opt.scale || 0.92, unit: opt.unit || 'cl',
    mono: opt.mono, noHatch: opt.noHatch, plain: opt.plain });
  return opsToSvg(drw.ops, cw, chh, { style:'width:100%;height:100%;display:block' });
}


/* ===== 15_render_pdf.js ===== */

/* ============================================================
   PDF-Erzeugung (rein clientseitig, echte Vektorgrafik)
   Kein externer Code: eigener Writer für PDF 1.4.
   ============================================================ */
var MM2PT = 72 / 25.4;

function pdfNum(v) {
  var r = Math.round(v * 1000) / 1000;
  return (Math.abs(r) < 0.0005) ? '0' : String(r);
}
function pdfStr(s) {
  var out = '';
  for (var i = 0; i < s.length; i++) {
    var code = charCodeWA(s[i]);
    var ch = String.fromCharCode(code);
    if (ch === '(' || ch === ')' || ch === '\\') out += '\\' + ch;
    else if (code < 32) out += ' ';
    else out += ch;
  }
  return out;
}
function hexToRgb(h) {
  if (!h) return [0, 0, 0];
  h = h.replace('#', '');
  if (h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  return [parseInt(h.slice(0,2),16)/255, parseInt(h.slice(2,4),16)/255, parseInt(h.slice(4,6),16)/255];
}

function opsToPdfContent(ops, H) {
  var K = MM2PT, hp = H * K, c = [];
  var curStroke = null, curFill = null, curW = null, curDash = null;
  function X(x) { return pdfNum(x * K); }
  function Y(y) { return pdfNum(hp - y * K); }
  function setStroke(col) { if (col !== curStroke) { var r = hexToRgb(col); c.push(pdfNum(r[0]) + ' ' + pdfNum(r[1]) + ' ' + pdfNum(r[2]) + ' RG'); curStroke = col; } }
  function setFill(col) { if (col !== curFill) { var r = hexToRgb(col); c.push(pdfNum(r[0]) + ' ' + pdfNum(r[1]) + ' ' + pdfNum(r[2]) + ' rg'); curFill = col; } }
  function setW(w) { if (w !== curW) { c.push(pdfNum(w * K) + ' w'); curW = w; } }
  function setDash(d) {
    var k = d ? d.join(',') : '';
    if (k !== curDash) {
      c.push(d ? '[' + d.map(function (v) { return pdfNum(v * K); }).join(' ') + '] 0 d' : '[] 0 d');
      curDash = k;
    }
  }
  function emitSegs(segs) {
    for (var i = 0; i < segs.length; i++) {
      var s = segs[i];
      if (s[0] === 'M') c.push(X(s[1]) + ' ' + Y(s[2]) + ' m');
      else if (s[0] === 'L') c.push(X(s[1]) + ' ' + Y(s[2]) + ' l');
      else if (s[0] === 'C') c.push(X(s[1]) + ' ' + Y(s[2]) + ' ' + X(s[3]) + ' ' + Y(s[4]) + ' ' + X(s[5]) + ' ' + Y(s[6]) + ' c');
      else if (s[0] === 'Z') c.push('h');
    }
  }
  function circleSegs(cx, cy, r) {
    var k = 0.5522847498 * r;
    return [['M', cx + r, cy],
            ['C', cx + r, cy + k, cx + k, cy + r, cx, cy + r],
            ['C', cx - k, cy + r, cx - r, cy + k, cx - r, cy],
            ['C', cx - r, cy - k, cx - k, cy - r, cx, cy - r],
            ['C', cx + k, cy - r, cx + r, cy - k, cx + r, cy], ['Z']];
  }
  c.push('1 J 1 j');
  for (var i = 0; i < ops.length; i++) {
    var o = ops[i];
    switch (o.t) {
      case 'l':
        setStroke(o.c); setW(o.w); setDash(o.d);
        c.push(X(o.x1) + ' ' + Y(o.y1) + ' m ' + X(o.x2) + ' ' + Y(o.y2) + ' l S');
        break;
      case 'p':
        setDash(null);
        if (o.fill) setFill(o.fill);
        if (o.w > 0) { setStroke(o.c); setW(o.w); }
        emitSegs(o.segs);
        c.push(o.fill ? (o.w > 0 ? 'B' : 'f') : 'S');
        break;
      case 'c':
        setDash(null);
        if (o.fill) setFill(o.fill);
        if (o.w > 0) { setStroke(o.c); setW(o.w); }
        emitSegs(circleSegs(o.cx, o.cy, o.r));
        c.push(o.fill ? (o.w > 0 ? 'B' : 'f') : 'S');
        break;
      case 't': {
        setFill(o.c);
        var size = o.size * K;
        var w = textWidth(o.s, o.size, o.bold, o.ls) * K;
        var phi = -(o.rot || 0) * Math.PI / 180;
        var cs = Math.cos(phi), sn = Math.sin(phi);
        var dx = o.anchor === 'middle' ? -w / 2 : (o.anchor === 'end' ? -w : 0);
        var px = o.x * K + dx * cs, py = hp - o.y * K + dx * sn;
        c.push('BT');
        c.push('/' + (o.bold ? 'F2' : 'F1') + ' ' + pdfNum(size) + ' Tf');
        if (o.ls) c.push(pdfNum(o.ls * K) + ' Tc');
        c.push(pdfNum(cs) + ' ' + pdfNum(sn) + ' ' + pdfNum(-sn) + ' ' + pdfNum(cs) + ' ' +
               pdfNum(px) + ' ' + pdfNum(py) + ' Tm');
        c.push('(' + pdfStr(o.s) + ') Tj');
        if (o.ls) c.push('0 Tc');
        c.push('ET');
        curFill = o.c;
        break;
      }
      case 'k':
        c.push('q'); setDash(null); emitSegs(o.segs); c.push('W n');
        curStroke = curFill = curW = null;
        break;
      case 'u':
        c.push('Q'); curStroke = curFill = curW = curDash = null;
        break;
    }
  }
  return c.join('\n');
}

function latin1Bytes(s) {
  var b = new Uint8Array(s.length);
  for (var i = 0; i < s.length; i++) b[i] = s.charCodeAt(i) & 0xFF;
  return b;
}

async function maybeDeflate(bytes) {
  if (typeof CompressionStream === 'undefined') return null;
  try {
    var cs = new CompressionStream('deflate');
    var w = cs.writable.getWriter(); w.write(bytes); w.close();
    var buf = await new Response(cs.readable).arrayBuffer();
    return new Uint8Array(buf);
  } catch (e) { return null; }
}

/* pages: [{ ops, W, H }] */
async function buildPdf(pages, meta) {
  meta = meta || {};
  var objs = [];                 /* 1-basiert; objs[i] = Uint8Array */
  function addObj(bytes) { objs.push(bytes); return objs.length; }

  var fontR = addObj(latin1Bytes('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>'));
  var fontB = addObj(latin1Bytes('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>'));

  var pageObjIds = [], contentIds = [];
  var pagesId = objs.length + 1 + pages.length * 2;   /* Platzhalter, wird später korrigiert */

  var contents = [];
  for (var i = 0; i < pages.length; i++) {
    var txt = opsToPdfContent(pages[i].ops, pages[i].H);
    var raw = latin1Bytes(txt);
    var def = await maybeDeflate(raw);
    contents.push({ raw: raw, def: def });
  }

  /* Objekte anlegen: für jede Seite Content + Page */
  var pageIds = [];
  for (var p = 0; p < pages.length; p++) {
    var ct = contents[p];
    var body = ct.def || ct.raw;
    var head = '<< /Length ' + body.length + (ct.def ? ' /Filter /FlateDecode' : '') + ' >>\nstream\n';
    var buf = new Uint8Array(head.length + body.length + 10);
    buf.set(latin1Bytes(head), 0); buf.set(body, head.length);
    buf.set(latin1Bytes('\nendstream'), head.length + body.length);
    var cid = addObj(buf.slice(0, head.length + body.length + 10));
    contentIds.push(cid);
    pageIds.push(0);
  }
  var pagesObjId = objs.length + pages.length + 1;
  for (var q = 0; q < pages.length; q++) {
    var w = pages[q].W * MM2PT, h = pages[q].H * MM2PT;
    var s = '<< /Type /Page /Parent ' + pagesObjId + ' 0 R /MediaBox [0 0 ' + pdfNum(w) + ' ' + pdfNum(h) + '] ' +
      '/Resources << /Font << /F1 ' + fontR + ' 0 R /F2 ' + fontB + ' 0 R >> /ProcSet [/PDF /Text] >> ' +
      '/Contents ' + contentIds[q] + ' 0 R >>';
    pageIds[q] = addObj(latin1Bytes(s));
  }

var Store = {
  state: null,
  load: function () {
    var raw = null;

    if (raw) {
      try {
        var s = JSON.parse(raw);
        if (s && s.projects && s.projects.length) {
          this.state = this.migrate(s);
          applyCustomDefs(this.state);
          return this.state;

      } catch (e) { /* defekter Stand wird verworfen */ }
    }
    var p = newProject('Mein erstes Projekt');
    this.state = { schemaVersion: SCHEMA_VERSION, appVersion: APP_VERSION,

                   customIngredients: [], customGarnishes: [],

  },
  migrate: function (s) {
    s.schemaVersion = s.schemaVersion || 1;
    s.customLibrary = s.customLibrary || [];
    s.customIngredients = s.customIngredients || [];
    s.customGarnishes = s.customGarnishes || [];
    s.ui = s.ui || { unit:'cl', tab:'fundus' };
    s.projects.forEach(function (p) {
      p.settings = p.settings || newProject().settings;

function slugId(prefix, name) {
  var base = String(name || '').toLowerCase()
    .replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').replace(/ß/g, 'ss')
    .replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '').slice(0, 28) || 'eigen';
  var id = prefix + base, n = 2;
  while (ING_BY_ID[id] || GAR_BY_ID[id]) { id = prefix + base + '_' + n; n++; }
  return id;
}

/* Nächster freier Kennbuchstabe: a…z, dann aa, ab … */
function nextGarnishKey() {
  var used = {};
  GARNISHES.forEach(function (g) { used[g.key] = true; });
  var al = 'abcdefghijklmnopqrstuvwxyz', i, j;
  for (i = 0; i < 26; i++) if (!used[al[i]]) return al[i];
  for (i = 0; i < 26; i++) for (j = 0; j < 26; j++) {
    var k = al[i] + al[j];
    if (!used[k]) return k;
  }
  return 'zz';
}

/* Kürzel für das Buchstabenmuster vorschlagen */
function suggestAbbr(name) {
  var w = String(name || '').toUpperCase().replace(/[^A-ZÄÖÜ ]/g, '').split(/\s+/).filter(Boolean);
  if (!w.length) return 'XX';
  if (w.length === 1) return w[0].slice(0, 2);
  return (w[0][0] + w[1][0]);
}

function registerCustomIngredient(def) {
  var o = { id:def.id, name:def.name, cls:def.cls || 'other', color:def.color || '#CCCCCC',
            abv:def.abv || 0, abbr:def.abbr || '', pat:def.pat || 'l45', custom:true };
  var old = ING_BY_ID[o.id];
  if (old) {
    for (var k in o) old[k] = o[k];
    return old;
  }
  INGREDIENTS.push(o); ING_BY_ID[o.id] = o;
  return o;
}
function registerCustomGarnish(def) {
  var o = { id:def.id, key:def.key, name:def.name, pic:def.pic || 'cherry', at:def.at || 'rim', custom:true };
  var old = GAR_BY_ID[o.id];

  GARNISHES.push(o); GAR_BY_ID[o.id] = o;
  return o;
}

  (state.customIngredients || []).forEach(registerCustomIngredient);
  (state.customGarnishes || []).forEach(registerCustomGarnish);
}

function unregisterCustomIngredient(id) {
  INGREDIENTS = INGREDIENTS.filter(function (i) { return i.id !== id; });

    (list || []).forEach(function (c) {
      (c.ingredients || []).forEach(function (i) { if (i.ingredientId === id) hit = true; });
    });

  state.projects.forEach(function (p) { scan(p.cocktails); });
  scan(state.customLibrary);

}

    (list || []).forEach(function (c) {

}

function importJsonFile(file) {
  var fr = new FileReader();
  fr.onload = function () {
    var obj;
    try { obj = JSON.parse(fr.result); }
    catch (e) { toast('Die Datei ist keine gültige JSON-Datei.'); return; }
    var err = validateImport(obj);
    if (err) { toast(err); return; }
    var proj = normalizeImportedProject(obj.project);
    Store.state.projects.push(proj);
    Store.state.activeId = proj.id;
    (obj.customIngredients || []).forEach(function (d) {
      registerCustomIngredient(d);
      if (!Store.state.customIngredients.some(function (x) { return x.id === d.id; }))
        Store.state.customIngredients.push(d);
    });
    (obj.customGarnishes || []).forEach(function (d) {
      registerCustomGarnish(d);
      if (!Store.state.customGarnishes.some(function (x) { return x.id === d.id; }))
        Store.state.customGarnishes.push(d);
    });
    (obj.customLibrary || []).forEach(function (c) {
      if (!Store.state.customLibrary.some(function (x) { return x.id === c.id; })) Store.state.customLibrary.push(c);
    });
    Store.save(); UI.tab = 'project'; UI.page = 0; render();
    toast('Projekt „' + proj.name + '“ geladen.');
  };
  fr.readAsText(file);
}

/* ---------- Deeplink ---------- */
function checkDeepLink() {
  var h = location.hash || '';
  if (h.indexOf('#p=') !== 0) return;
  var payload = h.slice(3);
  var obj;
  try { obj = JSON.parse(decompressFromUrl(payload)); }
  catch (e) { toast('Der geteilte Link konnte nicht gelesen werden.'); return; }
  try {
    var r = unpackProject(obj);
    if (!confirm('Der Link enthält das Projekt „' + r.project.name + '“ mit ' +
        r.project.cocktails.length + ' Cocktails. Als neues Projekt hinzufügen?')) {
      history.replaceState(null, '', location.pathname); return;
    }
    Store.state.projects.push(r.project);
    Store.state.activeId = r.project.id;
    (r.ingredients || []).forEach(function (d) {
      if (!Store.state.customIngredients.some(function (x) { return x.id === d.id; }))
        Store.state.customIngredients.push(d);
    });
    (r.garnishes || []).forEach(function (d) {
      if (!Store.state.customGarnishes.some(function (x) { return x.id === d.id; }))
        Store.state.customGarnishes.push(d);
    });
    r.library.forEach(function (c) { Store.state.customLibrary.push(c); });
    Store.save();
    history.replaceState(null, '', location.pathname);
    UI.tab = 'project';
    toast('Projekt aus dem Link übernommen.');
  } catch (e) { toast('Der geteilte Link ist beschädigt.'); }
}

/* ---------- Start ---------- */
function render() {
  renderBar();
  var root = clear($('#view'));
  if (UI.tab === 'fundus') renderFundus(root);
  else if (UI.tab === 'project') renderProject(root);
  else renderOutput(root);
}
function boot() {
  Store.load();
  checkDeepLink();
  render();
  $('#fileimp').addEventListener('change', function (e) {
    if (e.target.files && e.target.files[0]) importJsonFile(e.target.files[0]);
    e.target.value = '';
  });
  $('#dlg').addEventListener('cancel', function (e) { e.preventDefault(); $('#dlg').close(); render(); });
  window.addEventListener('afterprint', function () { clear($('#printarea')); });
}
if (typeof document !== 'undefined') {
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
}

  return opsToSvg(drw.ops, w, h, { style:'width:100%;height:100%;display:block' });
}
function garnishPreviewSvg(pic, size) {

  drawPic(drw, pic, size / 2, size / 2, size * 0.82, 0.22);

function hexToCss(h) {
  var x = h.replace('#', '');

}

      text:'Eigene Definitionen werden mit exportiert und über den Link mitgegeben, damit Empfänger dieselben Muster und Kennbuchstaben sehen.' }));
    dlg.appendChild(body);
  }
  build();
  dlg.showModal();
}
</script>
</body>
</html>
