<style>*{box-sizing:border-box}
:root{
  --desk:#D6D7CE;      /* Zeichentisch */
  --desk-dk:#BFC1B6;
  --panel:#FFFFFF;
  --ink:#000000;
  --ink-2:#4A4C46;
  --ink-3:#7C7F76;
  --rule:#B9BBB1;
  --rule-2:#E2E3DC;
  --signal:#C8102E;    /* Revisionsrot – einziger Akzent */
  --focus:#1D4ED8;
  --font:'Helvetica Neue',Helvetica,Arial,sans-serif;
}
html,body{margin:0;height:100%}
body{
  font-family:var(--font);font-size:14px;line-height:1.45;color:var(--ink);
  background:var(--desk);
  -webkit-text-size-adjust:100%;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--focus)}
:focus-visible{outline:2px solid var(--focus);outline-offset:1px}

/* ---------- Kopfleiste ---------- */
.bar{
  position:sticky;top:0;z-index:30;background:var(--panel);
  border-bottom:1px solid var(--rule);
  display:flex;align-items:stretch;flex-wrap:wrap;gap:0;
}
.brand{display:flex;align-items:center;gap:10px;padding:10px 14px;border-right:1px solid var(--rule-2)}
.brand b{font-size:15px;letter-spacing:.02em}
.brand span{font-size:11px;color:var(--ink-3)}
.brand svg{display:block}
.bar .projsel{display:flex;align-items:center;gap:6px;padding:8px 12px;border-right:1px solid var(--rule-2);flex:1 1 200px;min-width:0}
.bar .projsel select{flex:1;min-width:0}
.tabs{display:flex;margin-left:auto}
.tabs button{
  appearance:none;background:none;border:0;border-left:1px solid var(--rule-2);
  padding:12px 18px;font-size:13px;color:var(--ink-2);position:relative;white-space:nowrap;
}
.tabs button[aria-selected="true"]{color:var(--ink);font-weight:700}
.tabs button[aria-selected="true"]::after{
  content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;background:var(--signal);
}
.tabs .cnt{display:inline-block;margin-left:6px;font-size:11px;color:var(--ink-3);font-weight:400}

/* ---------- Grundraster ---------- */
main{padding:14px;max-width:1500px;margin:0 auto}
.panel{background:var(--panel);border:1px solid var(--rule)}
.panel>h2{
  margin:0;padding:9px 12px;font-size:12px;letter-spacing:.06em;font-weight:700;
  border-bottom:1px solid var(--rule-2);display:flex;align-items:center;gap:8px;
}
.panel>h2 .sub{font-weight:400;color:var(--ink-3);letter-spacing:0}
.pad{padding:12px}
.split{display:grid;grid-template-columns:340px 1fr;gap:14px;align-items:start}
@media(max-width:900px){.split{grid-template-columns:1fr}}

/* ---------- Bedienelemente ---------- */
.field{display:block;margin-bottom:10px}
.field>span{display:block;font-size:11px;color:var(--ink-3);margin-bottom:3px}
input[type=text],input[type=number],input[type=date],select,textarea{
  width:100%;padding:6px 8px;border:1px solid var(--rule);background:#FBFBF9;border-radius:2px;
}
textarea{min-height:64px;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1;min-width:0}
.btn{
  border:1px solid var(--ink);background:var(--panel);padding:7px 12px;border-radius:2px;
  font-size:13px;line-height:1.2;
}
.btn:hover{background:#F0F0EA}
.btn.primary{background:var(--ink);color:#fff}
.btn.primary:hover{background:#222}
.btn.danger{border-color:var(--signal);color:var(--signal)}
.btn.small{padding:4px 8px;font-size:12px}
.btn.ghost{border-color:var(--rule)}
.btn[disabled]{opacity:.4;cursor:default}
.chk{display:flex;align-items:center;gap:7px;margin-bottom:7px;font-size:13px}
.chk input{width:16px;height:16px;flex:none}
.hint{font-size:12px;color:var(--ink-3)}

/* ---------- Fundus ---------- */
.filters{display:flex;gap:8px;flex-wrap:wrap;padding:12px;border-bottom:1px solid var(--rule-2)}
.filters input[type=text]{flex:2 1 200px}
.filters select{flex:1 1 130px}
.grid{
  display:grid;gap:1px;background:var(--rule-2);
  grid-template-columns:repeat(auto-fill,minmax(168px,1fr));
}
.tile{background:var(--panel);padding:8px;display:flex;flex-direction:column;gap:6px}
.tile .art{background:#fff;height:150px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.tile .art svg{max-height:100%;width:auto}
.tile h3{margin:0;font-size:13px;line-height:1.25}
.tile .meta{font-size:11px;color:var(--ink-3);margin-top:-2px}
.tile .acts{display:flex;gap:5px;margin-top:auto}
.tile .acts .btn{flex:1;text-align:center}
.tile.inproj{box-shadow:inset 3px 0 0 var(--signal)}
.badge{display:inline-block;font-size:10px;border:1px solid var(--rule);padding:0 4px;color:var(--ink-3)}

/* ---------- Projektliste ---------- */
.plist{list-style:none;margin:0;padding:0}
.plist li{display:flex;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--rule-2)}
.plist .num{font-size:11px;color:var(--ink-3);width:22px;text-align:right;flex:none;font-variant-numeric:tabular-nums}
.plist .thumb{width:44px;height:56px;flex:none;background:#fff;border:1px solid var(--rule-2)}
.plist .thumb svg{width:100%;height:100%}
.plist .txt{flex:1;min-width:0}
.plist .txt b{font-size:13px;display:block}
.plist .txt small{color:var(--ink-3);font-size:11px}
.plist .acts{display:flex;gap:4px;flex:none;flex-wrap:wrap;justify-content:flex-end}
.empty{padding:28px 16px;text-align:center;color:var(--ink-3)}

/* ---------- Blattvorschau ---------- */
.viewer{background:var(--desk-dk);padding:12px;overflow:auto;max-height:76vh}
.viewer .sheet{
  background:#fff;margin:0 auto;box-shadow:0 1px 0 rgba(0,0,0,.25),0 6px 18px rgba(0,0,0,.16);
}
.viewer .sheet svg{display:block;width:100%;height:auto}
.vbar{display:flex;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--rule-2);flex-wrap:wrap}
.vbar .sp{flex:1}
.pagenav{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2)}

/* ---------- Zutatenzeilen im Editor ---------- */
.ings{display:flex;flex-direction:column;gap:6px}
.ing{display:grid;grid-template-columns:20px 1fr 62px 84px 74px 30px;gap:5px;align-items:center}
.ing .h{font-size:10px;color:var(--ink-3)}
.ing .pos{font-size:11px;color:var(--ink-3);text-align:right;font-variant-numeric:tabular-nums}
@media(max-width:640px){
  .ing{grid-template-columns:20px 1fr 30px;grid-auto-rows:auto}
  .ing>select.u,.ing>input.a,.ing>select.p{grid-column:2/4}
}
.garnpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px;max-height:190px;overflow:auto;border:1px solid var(--rule);padding:8px;background:#FBFBF9}
.garnpick label{display:flex;gap:6px;align-items:center;font-size:12px}

/* ---------- Dialog ---------- */
dialog{
  border:1px solid var(--ink);padding:0;background:var(--panel);width:min(980px,96vw);
  max-height:92vh;overflow:auto;border-radius:2px;
}
dialog::backdrop{background:rgba(30,32,28,.55)}
.dlg-head{position:sticky;top:0;background:var(--panel);border-bottom:1px solid var(--rule);
  padding:10px 14px;display:flex;align-items:center;gap:10px;z-index:2}
.dlg-head h2{margin:0;font-size:15px;flex:1}
.dlg-body{padding:14px}
.dlg-foot{position:sticky;bottom:0;background:var(--panel);border-top:1px solid var(--rule);
  padding:10px 14px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.edsplit{display:grid;grid-template-columns:1fr 260px;gap:16px;align-items:start}
@media(max-width:760px){.edsplit{grid-template-columns:1fr}}
.livebox{background:#fff;border:1px solid var(--rule);position:sticky;top:56px}
.livebox svg{display:block;width:100%;height:auto}

/* ---------- Meldungen ---------- */
#toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:20px;z-index:60;
  background:var(--ink);color:#fff;padding:9px 15px;border-radius:2px;font-size:13px;
  opacity:0;pointer-events:none;transition:opacity .18s;max-width:92vw;
}
#toast.on{opacity:1}
.revtable{width:100%;border-collapse:collapse;font-size:12px}
.revtable th,.revtable td{border:1px solid var(--rule-2);padding:3px 5px;text-align:left}
.revtable th{font-size:10px;color:var(--ink-3);font-weight:600}
.notelist{list-style:none;margin:0;padding:0}
.notelist li{display:flex;gap:6px;align-items:flex-start;margin-bottom:5px}
.notelist .n{font-size:11px;color:var(--ink-3);width:16px;flex:none;padding-top:7px;text-align:right}
.qrbox{text-align:center;padding:8px}
.qrbox svg{max-width:100%;height:auto;border:1px solid var(--rule-2)}
.linkout{width:100%;font-size:11px;word-break:break-all;background:#FBFBF9;border:1px solid var(--rule);padding:6px;max-height:96px;overflow:auto}

@media print{
  body{background:#fff}
  .bar,main,#toast{display:none !important}
  #printarea{display:block !important}
  #printarea .sheet{page-break-after:always;break-after:page}
  #printarea .sheet:last-child{page-break-after:auto;break-after:auto}
  #printarea svg{width:100%;height:auto;display:block}
}
#printarea{display:none}
</style>

function C(id, name, cat, base, glass, ice, method, desc, ings, garn, tags, extra) {
  var o = {
    id:id, name:name, category:cat, baseSpirit:base, glass:glass, ice:ice,
    method:method, description:desc,
    ingredients: ings.map(function(a, i) {
      return { pos:i+1, ingredientId:a[0], name:(ING_BY_ID[a[0]]||{}).name || a[0],
               amount:(a[1]===null?null:a[1]), unit:a[2], prep:a[3]||'b' };
    }),
    garnish: (garn||[]).map(function(g) {
      return (typeof g === 'string') ? { id:g, count:1 } : { id:g[0], count:g[1] };
    }),
    tags: tags||[], altName:null, note:null, noteRef:null
  };
  if (extra) for (var k in extra) o[k] = extra[k];
  return o;
}

/* ---------- Geometrie ---------- */
function catmull(pts, samples) {
  /* Catmull-Rom durch alle Punkte, gibt dichte Punktfolge zurück */
  if (pts.length < 3) return pts.slice();
  var p = [pts[0]].concat(pts, [pts[pts.length - 1]]), out = [];
  for (var i = 0; i < p.length - 3; i++) {
    var p0 = p[i], p1 = p[i+1], p2 = p[i+2], p3 = p[i+3];
    for (var j = 0; j < samples; j++) {
      var t = j / samples, t2 = t*t, t3 = t2*t;
      out.push([
        0.5*((2*p1[0]) + (-p0[0]+p2[0])*t + (2*p0[0]-5*p1[0]+4*p2[0]-p3[0])*t2 + (-p0[0]+3*p1[0]-3*p2[0]+p3[0])*t3),
        0.5*((2*p1[1]) + (-p0[1]+p2[1])*t + (2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*t2 + (-p0[1]+3*p1[1]-3*p2[1]+p3[1])*t3)
      ]);
    }
  }
  out.push(pts[pts.length - 1]);
  return out;
}
function bboxOf(pts) {
  var x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (var i = 0; i < pts.length; i++) {
    if (pts[i][0] < x0) x0 = pts[i][0]; if (pts[i][0] > x1) x1 = pts[i][0];
    if (pts[i][1] < y0) y0 = pts[i][1]; if (pts[i][1] > y1) y1 = pts[i][1];
  }
  return { x0:x0, y0:y0, x1:x1, y1:y1 };
}

  if (close) s.push(['Z']);

}

/* ---------- Schraffuren (Anhang E) ---------- */
var HATCH_DEF = {
  diag45:  { kind:'lines', ang:45,  sp:1.15 },
  diag45w: { kind:'lines', ang:45,  sp:2.10 },
  diag135: { kind:'lines', ang:135, sp:1.25 },
  cross:   { kind:'cross', ang:45,  sp:1.90 },
  horiz:   { kind:'lines', ang:0,   sp:1.30 },
  dots:    { kind:'dots',  sp:1.70, r:0.20 },
  dense:   { kind:'dots',  sp:0.95, r:0.22 },
  wave:    { kind:'wave',  sp:1.60 },
  tri:     { kind:'tri',   sp:2.20 }
};

function hatchLines(bb, ang, sp) {
  var out = [], a = ang * Math.PI / 180;
  var dx = Math.cos(a), dy = Math.sin(a);
  var nx = -dy, ny = dx;                  /* Normale */
  var cx = (bb.x0 + bb.x1) / 2, cy = (bb.y0 + bb.y1) / 2;
  var diag = Math.hypot(bb.x1 - bb.x0, bb.y1 - bb.y0) / 2 + sp;
  var n = Math.ceil(diag / sp);
  for (var i = -n; i <= n; i++) {
    var ox = cx + nx * i * sp, oy = cy + ny * i * sp;
    out.push([[ox - dx * diag, oy - dy * diag], [ox + dx * diag, oy + dy * diag]]);
  }
  return out;
}

    for (i = 0; i < L.length; i++) drw.line(L[i][0][0], L[i][0][1], L[i][1][0], L[i][1][1], { w:lw, c:hc });
    if (def.kind === 'cross') {
      L = hatchLines(bb, def.ang + 90, sp);
      for (i = 0; i < L.length; i++) drw.line(L[i][0][0], L[i][0][1], L[i][1][0], L[i][1][1], { w:lw, c:hc });

    for (var ty = bb.y0; ty <= bb.y1; ty += sp) {
      var toff = (Math.round((ty - bb.y0) / sp) % 2) * sp / 2;
      for (var tx = bb.x0 - sp; tx <= bb.x1 + sp; tx += sp)
        drw.poly([[tx + toff, ty + h/2], [tx + toff + h*0.6, ty - h/2], [tx + toff - h*0.6, ty - h/2]],
                 { close:true, w:lw, c:hc });
    }
  }
  drw.unclip();
  drw.path(segs, { w:lw, c:hc });
}

/* Musterfeld für die Legende */
function hatchSwatch(drw, x, y, w, h, cls, color, opt) {
  fillHatched(drw, [[x,y],[x+w,y],[x+w,y+h],[x,y+h]], cls, color,
    Object.assign({ scale:1, lw:0.12 }, opt || {}));
}

/* ---------- Zahlformat ---------- */
function fmtNum(n) {
  if (n === null || n === undefined) return '';
  var r = Math.round(n * 100) / 100;
  return String(r).replace('.', ',');
}
function amountLabel(ing, unit) {
  /* Liefert die Beschriftung einer Bezugslinie */
  var u = UNIT_BY_ID[ing.unit] || { name:ing.unit, ml:10 };
  if (ing.unit === 'fill') return 'auffüllen';
  if (ing.unit === 'cl') {
    var ml = ing.amount * 10;
    if (unit === 'ml') return fmtNum(ml) + ' ml';
    if (unit === 'oz') return fmtNum(Math.round(ml / 2.957) / 10) + ' oz. (' + fmtNum(ml) + ' ml)';
    return fmtNum(ing.amount) + ' cl (' + fmtNum(ml) + ' ml)';
  }
  if (ing.unit === 'ml') return fmtNum(ing.amount) + ' ml';
  return fmtNum(ing.amount) + ' ' + u.name;
}
function volLabel(ml, unit) {
  if (unit === 'ml') return fmtNum(ml) + ' ml';
  if (unit === 'oz') return fmtNum(Math.round(ml / 2.957) / 10) + ' oz. (' + fmtNum(ml) + ' ml)';
  return fmtNum(ml / 10) + ' cl (' + fmtNum(ml) + ' ml)';
}
function mlOf(ing) {
  var u = UNIT_BY_ID[ing.unit];
  if (!u || ing.amount === null) return 0;
  return ing.amount * u.ml;
}

/* ============================================================
   Piktogramme (Garnitur/Zusätze) und Methodensymbole
   Alle zeichnen zentriert um (x,y) in eine Box der Höhe s.
   ============================================================ */
function arcPts(cx, cy, r, a0, a1, n) {
  var p = [], i;
  for (i = 0; i <= n; i++) {
    var a = a0 + (a1 - a0) * i / n;
    p.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]);
  }
  return p;
}
function leaf(drw, x, y, len, ang, lw) {
  var a = ang * Math.PI / 180, dx = Math.cos(a) * len, dy = Math.sin(a) * len;
  var mx = x + dx / 2, my = y + dy / 2, w = len * 0.34;
  var px = -Math.sin(a) * w, py = Math.cos(a) * w;
  drw.path([['M', x, y], ['C', mx + px, my + py, mx + px, my + py, x + dx, y + dy],
            ['C', mx - px, my - py, mx - px, my - py, x, y]], { w:lw, c:INK });
}

function drawPic(drw, type, x, y, s, lw) {
  lw = lw || 0.15;
  var o = { w:lw, c:INK }, of = { w:lw, c:INK, fill:'#FFFFFF' }, i, p;
  switch (type) {

    case 'cherry':
      drw.circ(x - s*0.06, y + s*0.18, s*0.28, of);
      drw.path([['M', x - s*0.06, y - s*0.10], ['C', x + s*0.10, y - s*0.28, x + s*0.22, y - s*0.36, x + s*0.34, y - s*0.44]], o);
      leaf(drw, x + s*0.30, y - s*0.44, s*0.26, -20, lw);
      break;

    case 'olive':
      drw.path(segsFromPts(arcPts(x, y, s*0.30, 0, Math.PI*2, 22).map(function(q){ return [x + (q[0]-x)*0.86, q[1]]; }), true), of);
      drw.circ(x, y, s*0.10, { w:lw, c:INK, fill:'#FFFFFF' });
      break;

    case 'onion':
      drw.circ(x, y, s*0.28, of);
      drw.path([['M', x - s*0.18, y - s*0.14], ['L', x + s*0.02, y - s*0.30]], o);
      drw.path([['M', x - s*0.02, y + s*0.26], ['L', x + s*0.16, y + s*0.10]], o);
      break;

    case 'orange': case 'lemon': case 'lime': {
      /* Achtelsegment */
      var r = s*0.44, a0 = -Math.PI*0.72, a1 = -Math.PI*0.28;
      p = [[x, y + r*0.42]].concat(arcPts(x, y + r*0.42, r, a0, a1, 10));
      drw.path(segsFromPts(p, true), of);
      drw.path(segsFromPts(arcPts(x, y + r*0.42, r*0.80, a0 + 0.10, a1 - 0.10, 8), false), { w:lw*0.8, c:INK });
      for (i = 1; i <= 3; i++) {
        var aa = a0 + (a1 - a0) * i / 4;
        drw.line(x + Math.cos(aa)*r*0.14, y + r*0.42 + Math.sin(aa)*r*0.14,
                 x + Math.cos(aa)*r*0.76, y + r*0.42 + Math.sin(aa)*r*0.76, { w:lw*0.7 });
      }
      break;
    }

    case 'limeslice': case 'orangefull': case 'lemonfull':
      drw.circ(x, y, s*0.40, of);
      drw.circ(x, y, s*0.31, { w:lw*0.8, c:INK });
      for (i = 0; i < 6; i++) {
        var ang = i * Math.PI / 3 + 0.3;
        drw.line(x + Math.cos(ang)*s*0.05, y + Math.sin(ang)*s*0.05,
                 x + Math.cos(ang)*s*0.29, y + Math.sin(ang)*s*0.29, { w:lw*0.7 });
      }
      break;

    case 'dash':
      drw.path([['M', x, y - s*0.34], ['C', x + s*0.24, y + s*0.02, x + s*0.18, y + s*0.30, x, y + s*0.30],
                ['C', x - s*0.18, y + s*0.30, x - s*0.24, y + s*0.02, x, y - s*0.34]], of);
      break;

    case 'icecube':
      drw.poly([[x - s*0.34, y - s*0.14],[x - s*0.06, y - s*0.34],[x + s*0.34, y - s*0.34],
                [x + s*0.34, y + s*0.16],[x + s*0.06, y + s*0.34],[x - s*0.34, y + s*0.34]], Object.assign({close:true}, of));
      drw.line(x - s*0.34, y - s*0.14, x + s*0.06, y - s*0.14, o);
      drw.line(x + s*0.06, y - s*0.14, x + s*0.34, y - s*0.34, o);
      drw.line(x + s*0.06, y - s*0.14, x + s*0.06, y + s*0.34, o);
      break;

    case 'iceball':
      drw.circ(x, y, s*0.36, of);
      drw.path(segsFromPts(arcPts(x, y, s*0.24, Math.PI*1.05, Math.PI*1.45, 6), false), { w:lw*0.8 });
      break;

    case 'crushed':
      var cp = [[-0.30,-0.22],[0.02,-0.30],[0.28,-0.06],[-0.10,0.02],[0.16,0.24],[-0.26,0.18]];
      for (i = 0; i < cp.length; i++)
        drw.poly([[x + cp[i][0]*s, y + cp[i][1]*s],
                  [x + cp[i][0]*s + s*0.15, y + cp[i][1]*s + s*0.04],
                  [x + cp[i][0]*s + s*0.07, y + cp[i][1]*s + s*0.15]], Object.assign({close:true}, of));
      break;

    case 'sugarcube':
      drw.poly([[x - s*0.30, y - s*0.10],[x - s*0.06, y - s*0.30],[x + s*0.30, y - s*0.30],
                [x + s*0.30, y + s*0.12],[x + s*0.06, y + s*0.30],[x - s*0.30, y + s*0.30]], Object.assign({close:true}, of));
      drw.line(x - s*0.30, y - s*0.10, x + s*0.06, y - s*0.10, o);
      drw.line(x + s*0.06, y - s*0.10, x + s*0.30, y - s*0.30, o);
      drw.line(x + s*0.06, y - s*0.10, x + s*0.06, y + s*0.30, o);
      for (i = 0; i < 5; i++) drw.circ(x - s*0.22 + (i%3)*s*0.11, y + s*0.06 + Math.floor(i/3)*s*0.12, s*0.025, { w:0, fill:INK });
      break;

    case 'sugar':
      drw.path(segsFromPts(arcPts(x, y + s*0.20, s*0.32, Math.PI, Math.PI*2, 12), false), o);
      drw.line(x - s*0.32, y + s*0.20, x + s*0.32, y + s*0.20, o);
      for (i = 0; i < 6; i++) drw.circ(x - s*0.20 + (i%3)*s*0.16, y - s*0.04 + Math.floor(i/3)*s*0.12, s*0.03, { w:0, fill:INK });
      break;

    case 'peel':
      drw.path([['M', x - s*0.30, y - s*0.26], ['C', x + s*0.30, y - s*0.34, x - s*0.30, y + s*0.18, x + s*0.30, y + s*0.10]], o);
      drw.path([['M', x - s*0.28, y - s*0.10], ['C', x + s*0.28, y - s*0.18, x - s*0.28, y + s*0.34, x + s*0.30, y + s*0.26]], o);
      break;

    case 'mint':
      drw.line(x, y + s*0.34, x, y - s*0.20, o);
      leaf(drw, x, y + s*0.10, s*0.30, -140, lw);
      leaf(drw, x, y + s*0.10, s*0.30, -40, lw);
      leaf(drw, x, y - s*0.12, s*0.26, -150, lw);
      leaf(drw, x, y - s*0.12, s*0.26, -30, lw);
      break;

    case 'basil':
      leaf(drw, x - s*0.02, y + s*0.16, s*0.40, -110, lw);
      leaf(drw, x + s*0.02, y + s*0.16, s*0.36, -55, lw);
      break;

    case 'rosemary':
      drw.line(x - s*0.22, y + s*0.32, x + s*0.16, y - s*0.32, o);
      for (i = 0; i < 5; i++) {
        var t = i / 5, bx = x - s*0.22 + (s*0.38)*t, by = y + s*0.32 - (s*0.64)*t;
        drw.line(bx, by, bx - s*0.16, by - s*0.06, { w:lw*0.8 });
        drw.line(bx, by, bx + s*0.14, by + s*0.02, { w:lw*0.8 });
      }
      break;

    case 'umbrella':
      drw.path(segsFromPts(arcPts(x, y - s*0.02, s*0.36, Math.PI, Math.PI*2, 14), true), of);
      for (i = 1; i < 4; i++) drw.line(x, y - s*0.02, x - s*0.36 + i*s*0.24, y - s*0.02 + Math.sin(i/4*Math.PI)*0 - 0, { w:lw*0.7 });
      drw.line(x, y - s*0.02, x, y + s*0.36, o);
      break;

    case 'pineapple':
      drw.poly([[x - s*0.26, y + s*0.24],[x + s*0.26, y + s*0.24],[x + s*0.16, y - s*0.18],[x - s*0.16, y - s*0.18]], Object.assign({close:true}, of));
      for (i = 0; i < 3; i++) drw.line(x - s*0.22 + i*s*0.16, y + s*0.24, x - s*0.10 + i*s*0.10, y - s*0.18, { w:lw*0.6 });
      drw.line(x - s*0.10, y - s*0.18, x - s*0.20, y - s*0.36, { w:lw*0.8 });
      drw.line(x, y - s*0.18, x, y - s*0.40, { w:lw*0.8 });
      drw.line(x + s*0.10, y - s*0.18, x + s*0.20, y - s*0.36, { w:lw*0.8 });
      break;

    case 'celery':
      drw.path([['M', x - s*0.14, y + s*0.40], ['C', x - s*0.20, y, x - s*0.16, y - s*0.20, x - s*0.20, y - s*0.40],
                ['L', x + s*0.10, y - s*0.40], ['C', x + s*0.14, y - s*0.10, x + s*0.12, y + s*0.10, x + s*0.14, y + s*0.40], ['Z']], of);
      drw.line(x - s*0.04, y + s*0.36, x - s*0.06, y - s*0.36, { w:lw*0.7 });
      break;

    case 'cucumber':
      drw.circ(x, y, s*0.36, of);
      drw.circ(x, y, s*0.24, { w:lw*0.8 });
      for (i = 0; i < 5; i++) {
        var ca = i * Math.PI * 2 / 5;
        drw.circ(x + Math.cos(ca)*s*0.11, y + Math.sin(ca)*s*0.11, s*0.035, { w:0, fill:INK });
      }
      break;

    case 'ginger':
      drw.path(segsFromPts(arcPts(x, y, s*0.32, 0, Math.PI*2, 16).map(function(q, k){
        return [q[0] + (k%3?0.01:-0.02)*s, q[1]]; }), true), of);
      drw.circ(x, y, s*0.18, { w:lw*0.7 });
      break;

    case 'pick':
      drw.line(x - s*0.30, y + s*0.34, x + s*0.30, y - s*0.34, o);
      drw.circ(x + s*0.30, y - s*0.34, s*0.08, of);
      drw.circ(x - s*0.02, y + s*0.02, s*0.14, of);
      break;

    case 'straw':
      drw.line(x - s*0.16, y + s*0.38, x + s*0.10, y - s*0.20, o);
      drw.line(x - s*0.04, y + s*0.40, x + s*0.22, y - s*0.18, o);
      drw.line(x + s*0.10, y - s*0.20, x + s*0.22, y - s*0.18, o);
      break;

    case 'beans':
      for (i = 0; i < 3; i++) {
        var bx2 = x - s*0.20 + i*s*0.20, by2 = y - s*0.10 + (i%2)*s*0.20;
        drw.path(segsFromPts(arcPts(bx2, by2, s*0.13, 0, Math.PI*2, 14).map(function(q){
          return [bx2 + (q[0]-bx2)*0.78, q[1]]; }), true), of);
        drw.line(bx2, by2 - s*0.12, bx2, by2 + s*0.12, { w:lw*0.7 });
      }
      break;

    case 'grated':
      for (i = 0; i < 9; i++)
        drw.circ(x - s*0.30 + (i%3)*s*0.30 + (Math.floor(i/3)%2)*s*0.08,
                 y - s*0.24 + Math.floor(i/3)*s*0.24, s*0.045, { w:0, fill:INK });
      break;

    case 'rimsalt': case 'rimsugar':
      drw.path(segsFromPts(arcPts(x, y + s*0.34, s*0.40, Math.PI*1.15, Math.PI*1.85, 10), false), o);
      for (i = 0; i < 7; i++) {
        var rx = x - s*0.34 + i*s*0.113, ry = y + s*0.34 - Math.sqrt(Math.max(0, 0.16 - Math.pow((rx-x)/s,2)))*s - s*0.06;
        if (type === 'rimsalt') drw.circ(rx, ry, s*0.045, { w:0, fill:INK });
        else drw.rect(rx - s*0.04, ry - s*0.04, s*0.08, s*0.08, { w:lw*0.7 });
      }
      break;

    case 'cream':
      drw.path([['M', x - s*0.30, y + s*0.26], ['C', x - s*0.26, y - s*0.10, x - s*0.06, y - s*0.10, x - s*0.02, y + s*0.06],
                ['C', x + s*0.02, y - s*0.20, x + s*0.26, y - s*0.16, x + s*0.30, y + s*0.26], ['Z']], of);
      break;

    case 'cinnamon':
      drw.poly([[x - s*0.30, y - s*0.12],[x + s*0.30, y - s*0.12],[x + s*0.30, y + s*0.12],[x - s*0.30, y + s*0.12]], Object.assign({close:true}, of));
      drw.circ(x - s*0.30, y, s*0.12, of);
      drw.circ(x - s*0.30, y, s*0.05, { w:lw*0.7 });
      break;

    case 'physalis':
      drw.circ(x, y + s*0.10, s*0.24, of);
      for (i = 0; i < 3; i++) leaf(drw, x, y + s*0.02, s*0.30, -150 + i*45, lw);
      break;

    case 'berry':
      drw.path([['M', x, y - s*0.26], ['C', x + s*0.30, y - s*0.20, x + s*0.24, y + s*0.34, x, y + s*0.36],
                ['C', x - s*0.24, y + s*0.34, x - s*0.30, y - s*0.20, x, y - s*0.26]], of);
      for (i = 0; i < 5; i++) drw.circ(x - s*0.12 + (i%3)*s*0.12, y - s*0.04 + Math.floor(i/3)*s*0.14, s*0.03, { w:0, fill:INK });
      leaf(drw, x, y - s*0.24, s*0.20, -150, lw); leaf(drw, x, y - s*0.24, s*0.20, -30, lw);
      break;

    case 'ribbon':
      drw.path([['M', x - s*0.34, y - s*0.10], ['C', x - s*0.10, y - s*0.34, x + s*0.10, y + s*0.14, x + s*0.34, y - s*0.10]], o);
      drw.path([['M', x - s*0.34, y + s*0.12], ['C', x - s*0.10, y - s*0.12, x + s*0.10, y + s*0.36, x + s*0.34, y + s*0.12]], o);
      break;

    default:
      drw.circ(x, y, s*0.30, of);
  }
}

/* ---------- Methodensymbole über dem Glas ---------- */
function drawMethodSym(drw, sym, x, y, s, lw) {
  lw = lw || 0.18;
  var o = { w:lw, c:INK }, i, p;
  function wave(yy, amp, n, wdt) {
    var pts = [], steps = n * 8;
    for (var k = 0; k <= steps; k++) {
      var t = k / steps;
      pts.push([x - wdt/2 + wdt*t, yy + Math.sin(t * n * Math.PI * 2) * amp]);
    }
    drw.path(segsFromPts(pts, false), o);
  }
  switch (sym) {
    case 'shake':
      wave(y - s*0.30, s*0.10, 2, s*0.95);
      wave(y,          s*0.10, 2, s*0.95);
      wave(y + s*0.30, s*0.10, 2, s*0.95);
      break;
    case 'stir':
      drw.circ(x, y, s*0.42, o);
      p = [];
      for (i = 0; i <= 40; i++) {
        var a = i / 40 * Math.PI * 3.2, r = s*0.06 + (s*0.28) * (i/40);
        p.push([x + Math.cos(a)*r, y + Math.sin(a)*r]);
      }
      drw.path(segsFromPts(p, false), { w:lw*0.85 });
      break;
    case 'swizzle':
      drw.circ(x, y, s*0.42, o);
      p = [];
      for (i = 0; i <= 40; i++) {
        var a2 = i / 40 * Math.PI * 3.2, r2 = s*0.06 + (s*0.24) * (i/40);
        p.push([x + Math.cos(a2)*r2, y + Math.sin(a2)*r2]);
      }
      drw.path(segsFromPts(p, false), { w:lw*0.85 });
      for (i = 0; i < 4; i++)
        drw.circ(x - s*0.28 + (i%2)*s*0.56, y - s*0.28 + Math.floor(i/2)*s*0.56, s*0.06, { w:0, fill:INK });
      break;
    case 'layer':
      drw.line(x, y - s*0.42, x, y + s*0.22, o);
      drw.poly([[x - s*0.14, y + s*0.14],[x + s*0.14, y + s*0.14],[x, y + s*0.42]], { close:true, w:lw, c:INK, fill:INK });
      drw.line(x - s*0.42, y + s*0.50, x + s*0.42, y + s*0.50, o);
      break;
    case 'build':
      drw.line(x - s*0.30, y - s*0.44, x - s*0.30, y + s*0.34, o);
      drw.line(x + s*0.30, y - s*0.44, x + s*0.30, y + s*0.34, o);
      drw.line(x - s*0.30, y + s*0.34, x + s*0.30, y + s*0.34, o);
      drw.line(x, y - s*0.52, x, y - s*0.06, { w:lw*0.9 });
      drw.poly([[x - s*0.11, y - s*0.16],[x + s*0.11, y - s*0.16],[x, y + s*0.10]], { close:true, w:lw, c:INK, fill:INK });
      break;
    case 'muddle':
      drw.rect(x - s*0.10, y - s*0.46, s*0.20, s*0.52, o);
      drw.rect(x - s*0.24, y + s*0.06, s*0.48, s*0.20, o);
      drw.line(x - s*0.40, y + s*0.42, x + s*0.40, y + s*0.42, o);
      break;
    case 'blend':
      drw.poly([[x - s*0.26, y - s*0.44],[x + s*0.26, y - s*0.44],[x + s*0.18, y + s*0.30],[x - s*0.18, y + s*0.30]], Object.assign({close:true}, o));
      drw.line(x - s*0.20, y + s*0.30, x + s*0.20, y + s*0.30, o);
      drw.line(x - s*0.10, y + s*0.10, x + s*0.10, y - s*0.06, { w:lw*0.8 });
      drw.line(x - s*0.10, y - s*0.06, x + s*0.10, y + s*0.10, { w:lw*0.8 });
      break;
  }
}

/* ============================================================

var BASE_CELL_W = 70, BASE_CELL_H = 78;

/* Dichte Profilstützpunkte eines Glases (unskaliert) */
function glassSamples(g) {
  if (g._smp) return g._smp;
  var pts = g.prof.map(function (p) { return [p[0], p[1]]; });
  var s;
  if (g.smooth && pts.length > 2) {
    s = catmull(pts, 10);
    s.sort(function (a, b) { return a[0] - b[0]; });
  } else if (pts.length === 2) {
    s = []; for (var i = 0; i <= 16; i++) {
      var t = i / 16;
      s.push([pts[0][0] + (pts[1][0] - pts[0][0]) * t, pts[0][1] + (pts[1][1] - pts[0][1]) * t]);
    }
  } else {
    s = []; for (var k = 0; k < pts.length - 1; k++) {
      for (var j = 0; j < 8; j++) {
        var tt = j / 8;
        s.push([pts[k][0] + (pts[k+1][0] - pts[k][0]) * tt, pts[k][1] + (pts[k+1][1] - pts[k][1]) * tt]);
      }
    }
    s.push(pts[pts.length - 1]);
  }
  g._smp = s; return s;
}
function hwAt(g, y) {
  var s = glassSamples(g);
  if (y <= s[0][0]) return s[0][1];
  if (y >= s[s.length-1][0]) return s[s.length-1][1];
  for (var i = 1; i < s.length; i++) {
    if (s[i][0] >= y) {
      var t = (y - s[i-1][0]) / Math.max(1e-6, s[i][0] - s[i-1][0]);
      return s[i-1][1] + (s[i][1] - s[i-1][1]) * t;
    }
  }
  return s[s.length-1][1];
}
function glassCavityTop(g) { var s = glassSamples(g); return s[s.length-1][0]; }
function glassMaxHw(g) {
  var s = glassSamples(g), m = 0;
  for (var i = 0; i < s.length; i++) m = Math.max(m, s[i][1]);
  return m;
}
function glassTotalHeight(g) {
  var h = glassCavityTop(g);
  if (g.kind === 'stem') return h + (g.stem || 0) + (g.footH || 0) + (g.base || 0);
  return h + (g.base || 0) + (g.wall || 0);
}

/* ---------- Schichtberechnung ---------- */
function computeLayers(ck, cavTop) {
  var g = GLASS_BY_ID[ck.glass] || GLASSES[0];
  var ings = ck.ingredients.filter(function (i) { return i.ingredientId || i.name; });
  if (!ings.length) return [];
  var fillMax = cavTop * FILL_RATIO;
  var vols = ings.map(function (i) { return Math.max(mlOf(i), 0); });
  var fillIdx = -1;
  ings.forEach(function (i, k) { if (i.unit === 'fill') fillIdx = k; });
  var known = vols.reduce(function (a, b) { return a + b; }, 0);
  if (fillIdx >= 0) {
    var target = g.vol * 0.86;
    vols[fillIdx] = Math.max(target - known, g.vol * 0.18);
  }
  var total = vols.reduce(function (a, b) { return a + b; }, 0);
  if (total <= 0) return [];
  var height;
  if (fillIdx >= 0) height = fillMax;
  else {
    var frac = total / (g.vol * 0.52);
    height = fillMax * Math.max(0.46, Math.min(1, frac));
  }
  var minH = Math.min(1.5, height / (ings.length * 1.6));
  var h = vols.map(function (v) { return height * v / total; });
  /* Mindesthöhen durchsetzen */
  for (var pass = 0; pass < 6; pass++) {
    var deficit = 0, freeSum = 0;
    for (var i = 0; i < h.length; i++) {
      if (h[i] < minH) deficit += (minH - h[i]); else freeSum += (h[i] - minH);
    }
    if (deficit <= 0.0001 || freeSum <= 0.0001) break;
    var f = Math.max(0, 1 - deficit / freeSum);
    for (var j = 0; j < h.length; j++) h[j] = h[j] < minH ? minH : minH + (h[j] - minH) * f;
  }
  var out = [], y = 0;
  for (var m = 0; m < ings.length; m++) {
    out.push({ ing: ings[m], y0: y, y1: y + h[m], ml: vols[m] });
    y += h[m];
  }
  return out;
}

/* Polygon einer Schicht im Innenraum */
function layerPolygon(g, y0, y1, S, cx, baseY) {
  var pts = [], step = Math.max(0.35, (y1 - y0) / 14), y;
  for (y = y0; y < y1; y += step) pts.push([cx - hwAt(g, y) * S, baseY - y * S]);
  pts.push([cx - hwAt(g, y1) * S, baseY - y1 * S]);
  var right = [];
  for (y = y0; y < y1; y += step) right.push([cx + hwAt(g, y) * S, baseY - y * S]);
  right.push([cx + hwAt(g, y1) * S, baseY - y1 * S]);
  right.reverse();
  return pts.concat(right);
}

/* ---------- Glasumriss ---------- */
function drawGlassOutline(drw, g, S, cx, baseY, lw) {
  var smp = glassSamples(g), wall = (g.wall || 1.2), i, p;
  var outL = [], outR = [];
  for (i = 0; i < smp.length; i++) {
    outL.push([cx - (smp[i][1] + wall) * S, baseY - smp[i][0] * S]);
    outR.push([cx + (smp[i][1] + wall) * S, baseY - smp[i][0] * S]);
  }
  var innL = [], innR = [];
  for (i = 0; i < smp.length; i++) {
    innL.push([cx - smp[i][1] * S, baseY - smp[i][0] * S]);
    innR.push([cx + smp[i][1] * S, baseY - smp[i][0] * S]);
  }
  var o = { w:lw, c:INK };
  if (g.kind === 'stem') {
    var stemW = 2.6, sy = baseY + (g.stem || 10) * S, fy = sy + (g.footH || 2) * S;
    var bowlBotL = outL[0], bowlBotR = outR[0];
    var pathPts = outL.slice().reverse();      /* Kelch links von oben nach unten */
    pathPts = outL.slice();                     /* unten -> oben links */
    var seg = [['M', outL[outL.length-1][0], outL[outL.length-1][1]]];
    for (i = outL.length - 2; i >= 0; i--) seg.push(['L', outL[i][0], outL[i][1]]);
    seg.push(['C', cx - stemW/2*S - 1.2*S, baseY + 1.0*S, cx - stemW/2*S, baseY + 1.4*S, cx - stemW/2*S, baseY + 2.4*S]);
    seg.push(['L', cx - stemW/2*S, sy - 0.8*S]);
    seg.push(['C', cx - stemW/2*S, sy, cx - (g.foot||11)*0.5*S, sy + 0.2*S, cx - (g.foot||11)*S, sy + 0.9*S]);
    seg.push(['L', cx - (g.foot||11)*S, fy]);
    seg.push(['L', cx + (g.foot||11)*S, fy]);
    seg.push(['L', cx + (g.foot||11)*S, sy + 0.9*S]);
    seg.push(['C', cx + (g.foot||11)*0.5*S, sy + 0.2*S, cx + stemW/2*S, sy, cx + stemW/2*S, sy - 0.8*S]);
    seg.push(['L', cx + stemW/2*S, baseY + 2.4*S]);
    seg.push(['C', cx + stemW/2*S, baseY + 1.4*S, cx + stemW/2*S + 1.2*S, baseY + 1.0*S, outR[0][0], outR[0][1]]);
    for (i = 1; i < outR.length; i++) seg.push(['L', outR[i][0], outR[i][1]]);
    drw.path(seg, o);
    /* Innenkontur */
    var si = [['M', innL[innL.length-1][0], innL[innL.length-1][1]]];
    for (i = innL.length - 2; i >= 0; i--) si.push(['L', innL[i][0], innL[i][1]]);
    for (i = 0; i < innR.length; i++) si.push(['L', innR[i][0], innR[i][1]]);
    drw.path(si, { w:lw*0.7, c:INK });
    drw.line(outL[outL.length-1][0], outL[outL.length-1][1], innL[innL.length-1][0], innL[innL.length-1][1], o);
    drw.line(outR[outR.length-1][0], outR[outR.length-1][1], innR[innR.length-1][0], innR[innR.length-1][1], o);
  } else {
    var bot = baseY + (g.base || 3) * S;
    var seg2 = [['M', outL[outL.length-1][0], outL[outL.length-1][1]]];
    for (i = outL.length - 2; i >= 0; i--) seg2.push(['L', outL[i][0], outL[i][1]]);
    seg2.push(['L', outL[0][0], bot]);
    seg2.push(['L', outR[0][0], bot]);
    for (i = 0; i < outR.length; i++) seg2.push(['L', outR[i][0], outR[i][1]]);
    drw.path(seg2, o);
    var si2 = [['M', innL[innL.length-1][0], innL[innL.length-1][1]]];
    for (i = innL.length - 2; i >= 0; i--) si2.push(['L', innL[i][0], innL[i][1]]);
    si2.push(['L', innR[0][0], innR[0][1]]);
    for (i = 1; i < innR.length; i++) si2.push(['L', innR[i][0], innR[i][1]]);
    drw.path(si2, { w:lw*0.7, c:INK });
    drw.line(outL[outL.length-1][0], outL[outL.length-1][1], innL[innL.length-1][0], innL[innL.length-1][1], o);
    drw.line(outR[outR.length-1][0], outR[outR.length-1][1], innR[innR.length-1][0], innR[innR.length-1][1], o);
    if (g.handle) {
      var hx = outR[Math.floor(outR.length*0.7)][0], hy1 = baseY - glassCavityTop(g)*0.72*S, hy2 = baseY - glassCavityTop(g)*0.22*S;
      drw.path([['M', hx, hy1], ['C', hx + 7*S, hy1, hx + 7*S, hy2, hx, hy2]], { w:lw, c:INK });
      drw.path([['M', hx, hy1 + 1.2*S], ['C', hx + 5*S, hy1 + 1.2*S, hx + 5*S, hy2 - 1.2*S, hx, hy2 - 1.2*S]], { w:lw*0.7, c:INK });
    }
    if (g.relief) {
      for (i = 1; i <= 3; i++) {
        var ry = baseY - glassCavityTop(g) * (i / 4) * S;
        drw.line(cx - (hwAt(g, glassCavityTop(g)*(i/4)) + wall*0.4) * S, ry,
                 cx + (hwAt(g, glassCavityTop(g)*(i/4)) + wall*0.4) * S, ry, { w:lw*0.6, c:INK });
      }
    }
  }
}

/* ---------- Eisdarstellung ---------- */
function drawIce(drw, ck, g, S, cx, baseY, topY, lw, st) {
  if (!ck.ice || ck.ice === 'none') return null;
  var cav = glassCavityTop(g), i;
  var yTop = Math.min(cav * FILL_RATIO, topY);
  var anchor = null;
  if (ck.ice === 'crushed') {
    var n = 26;
    for (i = 0; i < n; i++) {
      var fy = cav * 0.12 + (yTop - cav * 0.12) * (i / n) + ((i % 3) * 0.6);
      var hwc = hwAt(g, Math.min(fy, cav)) * 0.82;
      var fx = (((i * 37) % 100) / 100 - 0.5) * 2 * hwc;
      var px = cx + fx * S, py = baseY - fy * S, sz = 1.5 * S;
      drw.poly([[px, py - sz*0.5], [px + sz*0.55, py - sz*0.1], [px + sz*0.25, py + sz*0.5], [px - sz*0.45, py + sz*0.3]],
        { close:true, w:lw*0.7, c:INK, fill:'#FFFFFF' });
      if (i === n - 3) anchor = [px, py];
    }
  } else if (ck.ice === 'ball') {
    var r = Math.min(hwAt(g, cav*0.3) * 0.58, cav * 0.20, topY * 0.62);
    var py2 = baseY - Math.max(r * 1.05, topY * 0.55) * S;
    drw.circ(cx, py2, r * S, { w:lw, c:INK, fill:'#FFFFFF' });
    drw.path(segsFromPts(arcPts(cx, py2, r*0.62*S, Math.PI*1.05, Math.PI*1.42, 6), false), { w:lw*0.7, c:INK });
    anchor = [cx + r*0.7*S, py2 - r*0.5*S];
  } else {
    var cnt = st.iceCount || 3;
    for (i = 0; i < cnt; i++) {
      var lvl = 0.20 + i * 0.24;
      var yy = cav * lvl, hw2 = hwAt(g, yy);
      var side = (i % 2 ? 0.34 : -0.30);
      var pxc = cx + hw2 * side * S, pyc = baseY - yy * S;
      var cs = Math.min(hw2 * 0.86, 5.4) * S;
      drw.poly([[pxc - cs*0.5, pyc - cs*0.18], [pxc - cs*0.12, pyc - cs*0.5],
                [pxc + cs*0.5, pyc - cs*0.5], [pxc + cs*0.5, pyc + cs*0.18],
                [pxc + cs*0.12, pyc + cs*0.5], [pxc - cs*0.5, pyc + cs*0.5]],
        { close:true, w:lw*0.8, c:INK, fill:'#FFFFFF' });
      drw.line(pxc - cs*0.5, pyc - cs*0.18, pxc + cs*0.12, pyc - cs*0.18, { w:lw*0.6, c:INK });
      drw.line(pxc + cs*0.12, pyc - cs*0.18, pxc + cs*0.5, pyc - cs*0.5, { w:lw*0.6, c:INK });
      drw.line(pxc + cs*0.12, pyc - cs*0.18, pxc + cs*0.12, pyc + cs*0.5, { w:lw*0.6, c:INK });
      if (i === cnt - 1) anchor = [pxc, pyc - cs*0.3];
    }
  }
  return anchor;
}

/* ---------- Hauptfunktion ---------- */
/* opts: {scale, mono, showTable, unit, marks (Sammler für Legende)} */
function drawCocktail(drw, ck, cellX, cellY, cellW, cellH, opts) {
  opts = opts || {};
  var S = opts.scale || 1;
  var g = GLASS_BY_ID[ck.glass] || GLASSES[0];
  var lw = Math.max(0.12, 0.20 * Math.min(1.15, Math.max(0.75, S)));
  var fs = Math.max(1.55, Math.min(3.0, 2.50 * Math.pow(S, 0.40)));
  var st = { iceCount: 3 }, plain = !!opts.plain;
  var mxW = BASE_CELL_W * S, mxH = BASE_CELL_H * S;
  if (cellW > mxW) { cellX += (cellW - mxW) / 2; cellW = mxW; }
  if (cellH > mxH) { cellY += (cellH - mxH) / 2; cellH = mxH; }
  var cav = glassCavityTop(g), maxHw = glassMaxHw(g), wall = g.wall || 1.2;
  var Hg = glassTotalHeight(g) * S;
  var cx = cellX + cellW * 0.5 - 1.5 * S;

  var titleH = fs * 2.6 + (ck.altName ? fs * 1.4 : 0) + (ck.note ? fs * 2.6 : 0);
  var methodH = 8 * S;
  var usedH = methodH + Hg + titleH + 3;
  var top = cellY + Math.max(1, (cellH - usedH) / 2);
  var rimY = top + methodH;
  var baseY = rimY + cav * S;          /* y des Kavitätsbodens */

  /* --- Methodensymbol --- */
  var meth = METHOD_BY_ID[ck.method] || METHOD_BY_ID['b'];
  drawMethodSym(drw, meth.sym, cx, top + methodH * 0.42, 6.2 * S, lw);
  if (opts.marks) opts.marks.methods[ck.method] = true;

  /* --- Schichten --- */
  var layers = computeLayers(ck, cav);
  for (var i = 0; i < layers.length; i++) {
    var L = layers[i];
    var ing = ING_BY_ID[L.ing.ingredientId] || { cls:(L.ing.cls || 'other'), color:(L.ing.color || '#DDDDDD'), name:L.ing.name };
    var poly = layerPolygon(g, L.y0, L.y1, S, cx, baseY);
    fillHatched(drw, poly, ing.cls, ing.color, { scale:S, lw:lw*0.62, mono:opts.mono, color:!opts.mono, noHatch:opts.noHatch });
    if (opts.marks) opts.marks.ings[L.ing.ingredientId || L.ing.name] =
      { name: L.ing.name || ing.name, cls: ing.cls, color: ing.color, abbr: ing.abbr || '' };
  }

  /* --- Eis --- */
  var topLayerY = layers.length ? layers[layers.length-1].y1 : cav * 0.5;
  var iceAnchor = drawIce(drw, ck, g, S, cx, baseY, topLayerY, lw, st);

  /* --- Glasumriss --- */
  drawGlassOutline(drw, g, S, cx, baseY, lw);

  /* --- Bezugslinien der Zutaten --- */
  var outerHw = (maxHw + wall) * S;
  var leftX  = cx - outerHw - 3.0 * S, rightX = cx + outerHw + 3.0 * S;
  var lab = { l: [], r: [] };
  for (var k = 0; !plain && k < layers.length; k++) {
    var Ly = baseY - (layers[k].y0 + layers[k].y1) / 2 * S;
    var side = (k % 2 === 0) ? 'l' : 'r';
    lab[side].push({ y: Ly, txt: amountLabel(layers[k].ing, opts.unit || 'cl'),
                     prep: layers[k].ing.prep, yc: (layers[k].y0 + layers[k].y1) / 2 });
  }
  var lineH = fs * 1.06, blockH = lineH * 2 + 0.5;
  ['l','r'].forEach(function (side) {
    var arr = lab[side];
    arr.sort(function (a, b) { return a.y - b.y; });
    for (var q = 1; q < arr.length; q++)
      if (arr[q].y - arr[q-1].y < blockH) arr[q].y = arr[q-1].y + blockH;
    var overflow = arr.length ? (arr[arr.length-1].y - (cellY + cellH - 4)) : 0;
    if (overflow > 0) for (var q2 = 0; q2 < arr.length; q2++) arr[q2].y -= overflow;
  });
  var dimXpre = cellX + cellW - 2.2;
  ['l','r'].forEach(function (side) {
    var sx = side === 'l' ? -1 : 1;
    var maxw = 0;
    lab[side].forEach(function (it) {
      var p = it.txt.split(' (');
      maxw = Math.max(maxw, textWidth(p[0] + (it.prep ? ' (' + it.prep + ')' : ''), fs),
                            textWidth(p.length > 1 ? '(' + p[1] : '', fs));
    });
    var tx = side === 'l' ? (cellX + 1.2 + maxw) : (dimXpre - 3.2 - maxw);
    var edge = side === 'l' ? Math.min(tx + 1.4 * S, leftX) : Math.max(tx - 1.4 * S, rightX);
    lab[side].forEach(function (it) {
      var innerHw = hwAt(g, it.yc) * S;
      var p0x = cx + sx * innerHw * 0.55, p0y = baseY - it.yc * S;
      var p1x = cx + sx * (hwAt(g, it.yc) + wall) * S, p1y = p0y;
      drw.circ(p0x, p0y, lw * 1.5, { w:0, fill:INK });
      drw.path([['M', p0x, p0y], ['L', p1x, p1y], ['L', edge, it.y], ['L', tx, it.y]], { w:lw*0.8, c:INK });
      var parts = it.txt.split(' (');
      var l1 = parts[0], l2 = parts.length > 1 ? '(' + parts[1] : '';
      if (it.prep) l1 += ' (' + it.prep + ')';
      drw.text(tx, it.y - 0.3, l1, { size:fs, anchor: side==='l' ? 'end' : 'start' });
      if (l2) drw.text(tx, it.y - 0.3 + lineH, l2, { size:fs, anchor: side==='l' ? 'end' : 'start' });
    });
  });

  /* --- Maßlinie Glasvolumen --- */
  var dimX = cellX + cellW - 2.2;
  if (!plain) {
  var yTopDim = rimY, yBotDim = baseY;
  drw.line(dimX, yTopDim, dimX, yBotDim, { w:lw*0.8, c:INK });
  [[yTopDim, 1], [yBotDim, -1]].forEach(function (a) {
    drw.poly([[dimX, a[0]], [dimX - 0.55*S, a[0] + a[1]*1.5*S], [dimX + 0.55*S, a[0] + a[1]*1.5*S]],
      { close:true, w:lw*0.6, c:INK, fill:INK });
  });
  drw.line(dimX - 3.5, yTopDim, dimX + 0.9, yTopDim, { w:lw*0.5, c:INK, d:[0.8,0.8] });
  drw.line(dimX - 3.5, yBotDim, dimX + 0.9, yBotDim, { w:lw*0.5, c:INK, d:[0.8,0.8] });
  drw.text(dimX - 0.9, (yTopDim + yBotDim) / 2, volLabel(g.vol, opts.unit || 'cl'),
    { size:fs, anchor:'middle', rot:-90 });
  }

  /* --- Eis-Beschriftung --- */
  if (!plain && iceAnchor && ck.ice && ck.ice !== 'none') {
    var gi = GAR_BY_ID[(ICE_BY_ID[ck.ice] || {}).gid];
    if (gi) {
      var cnt = ck.ice === 'cubes' ? 3 : 1;
      var sgn = iceAnchor[0] >= cx ? 1 : -1;
      var lx = cx + sgn * (outerHw + 2.2 * S);
      var ly = Math.max(rimY + 1.5 * S, iceAnchor[1] - 2.0 * S);
      drw.path([['M', iceAnchor[0], iceAnchor[1]], ['L', lx - sgn * 2.0*S, ly], ['L', lx, ly]], { w:lw*0.7, c:INK });
      drw.circ(iceAnchor[0], iceAnchor[1], lw*1.4, { w:0, fill:INK });
      drw.text(lx + sgn * 0.6, ly + fs*0.35, (ck.ice === 'crushed' ? '' : cnt + ' ') + '(' + gi.key + ')',
        { size:fs, anchor: sgn > 0 ? 'start' : 'end' });
      if (opts.marks) opts.marks.gars[gi.id] = true;
    }
  }

  /* --- Garnituren am Glasrand --- */
  var rimHw = (hwAt(g, cav) + wall) * S;
  var gcount = 0;
  (ck.garnish || []).forEach(function (gr) {
    var G = GAR_BY_ID[gr.id]; if (!G) return;
    if (opts.marks) opts.marks.gars[G.id] = true;
    var side = (gcount % 2 === 0) ? 1 : -1, idx = Math.floor(gcount / 2);
    var ps = 5.4 * S;
    var gx = cx + side * (rimHw * 0.92 + idx * ps * 1.15);
    var gy = rimY - ps * 0.22;
    if (G.at === 'in') {
      gy = baseY - topLayerY * S + ps * 0.45;
      gx = cx + side * Math.max(1, hwAt(g, topLayerY) * S - ps * 0.55);
    } else if (G.at === 'side') {
      gx = cx + side * (rimHw + ps * 0.7); gy = rimY + ps * 0.4;
    }
    drawPic(drw, G.pic, gx, gy, ps, lw * 0.8);
    var tx2 = gx + side * ps * 0.62, tyG = gy - ps * 0.52;
    if (G.at === 'in' && !plain) {
      var ox = cx + side * (rimHw + 2.2 * S), oy = gy - ps * 0.75;
      drw.path([['M', gx + side * ps * 0.35, gy], ['L', ox - side * 1.5 * S, oy], ['L', ox, oy]],
        { w:lw*0.7, c:INK });
      tx2 = ox + side * 0.6; tyG = oy + fs * 0.35;
    }
    if (!plain) drw.text(tx2, tyG, (gr.count || 1) + ' (' + G.key + ')',
      { size:fs*0.95, anchor: side > 0 ? 'start' : 'end' });
    gcount++;
  });

  /* --- Titel --- */
  var ty = baseY + (g.kind === 'stem' ? ((g.stem||0) + (g.footH||0)) * S : (g.base||3) * S) + fs * 2.1;
  var title = (ck.name || '').toUpperCase();
  drw.text(cx, ty, title, { size:fs*1.2, anchor:'middle', bold:true });
  var tw = textWidth(title, fs*1.2, true);
  drw.line(cx - tw/2, ty + fs*0.42, cx + tw/2, ty + fs*0.42, { w:lw*0.8, c:INK });
  var ny = ty + fs*1.7;
  if (ck.altName && !plain) {
    drw.text(cx, ny, '(Alternativname: ' + ck.altName + ')', { size:fs*0.9, anchor:'middle' });
    ny += fs*1.3;
  }
  if (ck.note && !plain) {
    var words = ck.note.split(' '), line = '', lines = [], maxw = cellW - 6;
    words.forEach(function (w) {
      var t = line ? line + ' ' + w : w;
      if (textWidth(t, fs*0.85) > maxw) { lines.push(line); line = w; } else line = t;
    });
    if (line) lines.push(line);
    lines.slice(0, 3).forEach(function (l, li) {
      drw.text(cx, ny + li * fs, l, { size:fs*0.85, anchor:'middle' });
    });
    ny += Math.min(3, lines.length) * fs;
  }
  if (ck.noteRef) {
    var hx2 = cx + textWidth(title, fs*1.2, true)/2 + fs*1.4, hy3 = ty - fs*0.3;
    drw.poly([[hx2, hy3 - fs*0.85], [hx2 + fs*0.85, hy3 + fs*0.6], [hx2 - fs*0.85, hy3 + fs*0.6]],
      { close:true, w:lw*0.8, c:INK });
    drw.text(hx2, hy3 + fs*0.35, String(ck.noteRef), { size:fs*0.8, anchor:'middle' });
  }

  /* --- optionale Zutatentabelle --- */
  if (opts.showTable) {
    var tyy = ny + fs * 1.4, colX = cellX + 3;
    ck.ingredients.forEach(function (ing, ii) {
      var y2 = tyy + ii * fs * 1.15;
      drw.text(colX, y2, String(ii+1), { size:fs*0.85 });
      drw.text(colX + 4, y2, amountLabel(ing, 'cl').split(' (')[0], { size:fs*0.85 });
      drw.text(colX + 17, y2, ing.name, { size:fs*0.85 });
      drw.text(cellX + cellW - 3, y2, '(' + (ing.prep||'') + ')', { size:fs*0.85, anchor:'end' });
    });
  }
}

/* Sammler für die Legenden eines Blattes */
function newMarks() { return { ings:{}, gars:{}, methods:{}, glasses:{} }; }


/* ===== 13_draw_sheet.js ===== */

/* ============================================================
   Zeichnungsblatt ("Plan")
   ============================================================ */
var SHEET_SIZES = {
  A4: [297, 210], A3: [420, 297], A2: [594, 420], A1: [841, 594], A0: [1189, 841]
};
function sheetDims(fmt, orientation) {
  var d = SHEET_SIZES[fmt] || SHEET_SIZES.A2;
  return orientation === 'portrait' ? { w:d[1], h:d[0] } : { w:d[0], h:d[1] };
}

function wrapText(s, maxw, size, bold) {
  var words = String(s).split(/\s+/), line = '', out = [];
  for (var i = 0; i < words.length; i++) {
    var t = line ? line + ' ' + words[i] : words[i];
    if (textWidth(t, size, bold) > maxw && line) { out.push(line); line = words[i]; }
    else line = t;
  }
  if (line) out.push(line);
  return out;
}

/* Marks über das ganze Projekt sammeln (für die Legenden) */
function collectMarks(cocktails) {
  var m = newMarks();
  cocktails.forEach(function (ck) {
    m.methods[ck.method || 'b'] = true;
    m.glasses[ck.glass] = true;
    (ck.ingredients || []).forEach(function (ing) {
      var I = ING_BY_ID[ing.ingredientId] || { cls:ing.cls || 'other', color:ing.color || '#DDDDDD', abbr:'' };
      m.ings[ing.ingredientId || ing.name] = { name: ing.name || I.name, cls: I.cls, color: I.color, abbr: I.abbr || '' };
    });
    (ck.garnish || []).forEach(function (gr) { if (GAR_BY_ID[gr.id]) m.gars[gr.id] = true; });
    var ic = ICE_BY_ID[ck.ice];
    if (ic && ic.gid) m.gars[ic.gid] = true;
  });
  return m;
}

/* ---------- Layout ---------- */
function computeSheetLayout(project) {
  var s = project.settings, d = sheetDims(s.sheetFormat, s.orientation);
  var W = d.w, H = d.h;
  var ml = 20, mr = 10, mt = 10, mb = 10;                 /* Innenrahmen */
  var RC = Math.max(112, Math.min(190, W * 0.255));       /* Legendenspalte */
  var TB_H = Math.max(30, Math.min(42, H * 0.085));       /* Schriftfeld-Höhe */
  var innerX = ml, innerY = mt, innerW = W - ml - mr, innerH = H - mt - mb;
  var areaX = innerX, areaY = innerY;
  var areaW = innerW - RC - 3;
  var areaH = innerH - TB_H - 3;

  var n = Math.max(1, project.cocktails.length);
  var best = null;
  for (var cols = 1; cols <= 14; cols++) {
    var rows = Math.ceil(n / cols);
    var cw = areaW / cols, chh = areaH / rows;
    var sc = Math.min(cw / BASE_CELL_W, chh / BASE_CELL_H);
    if (!best || sc > best.scale) best = { cols:cols, rows:rows, scale:sc };
  }
  var minScale = 0.85, maxScale = 1.35;
  var pages = [];
  if (best.scale >= minScale || project.settings.fitToOneSheet) {
    best.scale = Math.max(project.settings.fitToOneSheet ? 0.34 : minScale, Math.min(maxScale, best.scale));
    pages = [project.cocktails.slice()];
  } else {
    /* Kapazität bei Mindestmaßstab bestimmen */
    var colsC = Math.max(1, Math.floor(areaW / (BASE_CELL_W * minScale)));
    var rowsC = Math.max(1, Math.floor(areaH / (BASE_CELL_H * minScale)));
    var cap = colsC * rowsC;
    for (var i = 0; i < project.cocktails.length; i += cap) pages.push(project.cocktails.slice(i, i + cap));
    best = { cols:colsC, rows:rowsC, scale:minScale };
    var nn = Math.max(1, pages[0].length), b2 = null;
    for (var c2 = 1; c2 <= 14; c2++) {
      var r2 = Math.ceil(nn / c2);
      if (r2 > rowsC) continue;
      var sc2 = Math.min(areaW / c2 / BASE_CELL_W, areaH / r2 / BASE_CELL_H);
      if (!b2 || sc2 > b2.scale) b2 = { cols:c2, rows:r2, scale:Math.min(maxScale, sc2) };
    }
    if (b2) best = b2;
  }
  if (!pages.length) pages = [[]];
  return { W:W, H:H, ml:ml, mr:mr, mt:mt, mb:mb, RC:RC, TB_H:TB_H,
           areaX:areaX, areaY:areaY, areaW:areaW, areaH:areaH,
           cols:best.cols, rows:best.rows, scale:best.scale, pages:pages };
}

/* ---------- Rahmen mit Zonenkennzeichnung ---------- */
function drawFrame(drw, L) {
  var W = L.W, H = L.H;
  drw.rect(5, 5, W - 10, H - 10, { w:0.35 });
  drw.rect(L.ml, L.mt, W - L.ml - L.mr, H - L.mt - L.mb, { w:0.5 });
  var zx = Math.max(4, Math.round((W - L.ml - L.mr) / 105)),
      zy = Math.max(3, Math.round((H - L.mt - L.mb) / 105));
  var i, x, y, letters = 'ABCDEFGHIJ';
  for (i = 0; i < zx; i++) {
    x = L.ml + (W - L.ml - L.mr) * (i + 0.5) / zx;
    drw.text(x, L.mt - 2.6, String(i + 1), { size:3, anchor:'middle' });
    drw.text(x, H - L.mb + 4.6, String(i + 1), { size:3, anchor:'middle' });
    if (i > 0) {
      var xd = L.ml + (W - L.ml - L.mr) * i / zx;
      drw.line(xd, 5, xd, L.mt, { w:0.25 }); drw.line(xd, H - L.mb, xd, H - 5, { w:0.25 });
    }
  }
  for (i = 0; i < zy; i++) {
    y = L.mt + (H - L.mt - L.mb) * (i + 0.5) / zy;
    drw.text(L.ml - 5.5, y + 1, letters[i], { size:3, anchor:'middle' });
    drw.text(W - L.mr + 5.5, y + 1, letters[i], { size:3, anchor:'middle' });
    if (i > 0) {
      var yd = L.mt + (H - L.mt - L.mb) * i / zy;
      drw.line(5, yd, L.ml, yd, { w:0.25 }); drw.line(W - L.mr, yd, W - 5, yd, { w:0.25 });
    }
  }
}

function boxTitle(drw, x, y, w, txt) {
  drw.text(x + 1.6, y + 4.0, txt, { size:3.0, bold:true, ls:0.25 });
  drw.line(x, y + 5.4, x + w, y + 5.4, { w:0.25 });
  return y + 5.4;
}

/* ---------- Legenden ---------- */
function drawGarnishLegend(drw, x, y, w, marks) {
  var ids = GARNISHES.filter(function (g) { return marks.gars[g.id]; });
  if (!ids.length) return y;
  var cols = Math.max(2, Math.floor(w / 46));
  var colw = w / cols, rowh = 9.2;
  var rows = Math.ceil(ids.length / cols);
  var h = 5.4 + rows * rowh + 2;
  drw.rect(x, y, w, h, { w:0.35 });
  var yy = boxTitle(drw, x, y, w, 'GARNITUREN UND ZUSÄTZE');
  ids.forEach(function (g, i) {
    var c = i % cols, r = Math.floor(i / cols);
    var gx = x + c * colw + 5.5, gy = yy + 1.5 + r * rowh + rowh * 0.42;
    drawPic(drw, g.pic, gx, gy, 7.0, 0.16);
    var lines = wrapText('1 – ' + g.name + ' (' + g.key + ')', colw - 12, 2.5);
    lines.slice(0, 2).forEach(function (l, li) {
      drw.text(gx + 5.4, gy - 0.6 + li * 2.9, l, { size:2.5 });
    });
  });
  return y + h + 3;
}

function drawMethodLegend(drw, x, y, w, marks) {
  var ms = METHODS.filter(function (m) { return marks.methods[m.id]; });
  if (!ms.length) return y;
  var rowh = 10.5, h = 5.4 + ms.length * rowh + 2;
  drw.rect(x, y, w, h, { w:0.35 });
  var yy = boxTitle(drw, x, y, w, 'ZUBEREITUNGSMETHODEN');
  ms.forEach(function (m, i) {
    var gy = yy + 2 + i * rowh + rowh * 0.42;
    drawMethodSym(drw, m.sym, x + 8, gy, 7.5, 0.2);
    drw.text(x + 16, gy + 0.9, '(' + m.id + ')  ' + m.name, { size:2.6 });
  });
  return y + h + 3;
}

function drawPrepLegend(drw, x, y, w, usedPreps) {
  var ps = PREPS.filter(function (p) { return usedPreps[p.id]; });
  if (!ps.length) return y;
  var cols = Math.max(1, Math.floor(w / 62)), colw = w / cols;
  var rows = Math.ceil(ps.length / cols), rowh = 3.6;
  var h = 5.4 + rows * rowh + 2.5;
  drw.rect(x, y, w, h, { w:0.35 });
  var yy = boxTitle(drw, x, y, w, 'ZUBEREITUNGSKÜRZEL JE ZUTAT');
  ps.forEach(function (p, i) {
    var c = i % cols, r = Math.floor(i / cols);
    drw.text(x + 2 + c * colw, yy + 4.6 + r * rowh, '(' + p.id + ')  ' + p.name, { size:2.5 });
  });
  return y + h + 3;
}

function drawIngredientLegend(drw, x, y, w, marks, mono, maxH) {
  var list = Object.keys(marks.ings).map(function (k) {
    var v = marks.ings[k]; return { id:k, name:v.name, cls:v.cls, color:v.color, abbr:v.abbr };
  });
  if (!list.length) return y;
  list.sort(function (a, b) { return a.name.localeCompare(b.name, 'de'); });
  var cols = Math.max(1, Math.floor(w / 56)), rowh = 5.2, rows, h;
  function calc() { rows = Math.ceil(list.length / cols); h = 5.4 + rows * rowh + 2.5; }
  calc();
  while (maxH && h > maxH && cols < 5) { cols++; calc(); }
  while (maxH && h > maxH && rowh > 3.6) { rowh -= 0.2; calc(); }
  if (maxH && h > maxH) {                     /* Notfall: Liste kürzen */
    var fit = Math.max(1, Math.floor((maxH - 8) / rowh) * cols);
    if (list.length > fit) list = list.slice(0, fit - 1).concat([{ name:'… weitere', cls:'other', color:'#FFFFFF', abbr:'' }]);
    calc();
  }
  var colw = w / cols;
  drw.rect(x, y, w, h, { w:0.35 });
  var yy = boxTitle(drw, x, y, w, 'ZUTATEN – FARBE UND SCHRAFFUR');
  list.forEach(function (it, i) {
    var c = i % cols, r = Math.floor(i / cols);
    var sx = x + 2 + c * colw, sy = yy + 2.2 + r * rowh;
    hatchSwatch(drw, sx, sy, 12, rowh - 1.6, it.cls, it.color, { mono:mono, color:!mono, lw:0.12 });
    if (it.abbr && mono) drw.text(sx + 6, sy + rowh * 0.55, it.abbr, { size:2.1, anchor:'middle', bold:true });
    var nm = it.name;
    while (textWidth(nm, 2.5) > colw - 17 && nm.length > 4) nm = nm.slice(0, -2);
    if (nm !== it.name) nm = nm + '.';
    drw.text(sx + 13.6, sy + rowh * 0.62, nm, { size:2.5 });
  });
  return y + h + 3;
}

function drawGeneralNotes(drw, x, y, w, h, notes) {
  drw.rect(x, y, w, h, { w:0.35 });
  var yy = boxTitle(drw, x, y, w, 'ALLGEMEINE HINWEISE');
  var cy = yy + 4.2;
  (notes || []).forEach(function (n, i) {
    var lines = wrapText(n, w - 12, 2.5);
    lines.forEach(function (l, li) {
      if (cy > y + h - 1.5) return;
      if (li === 0) {
        drw.poly([[x + 3.2, cy - 2.4], [x + 6.4, cy + 0.6], [x + 0.0 + 0.0, cy + 0.6]], { close:true, w:0.2 });
        drw.text(x + 3.2, cy + 0.1, String(i + 1), { size:1.9, anchor:'middle' });
      }
      drw.text(x + 8.4, cy, l, { size:2.5 });
      cy += 3.2;
    });
    cy += 0.8;
  });
  return y + h;
}

/* ---------- Schriftfeld ---------- */
function drawTitleBlock(drw, L, project, page, pages, qrMatrix) {
  var tb = project.settings.titleBlock || {};
  var x1 = L.W - L.mr, y1 = L.H - L.mb;
  var w = L.RC + 92, h = L.TB_H;
  var x = x1 - w, y = y1 - h;
  drw.rect(x, y, w, h, { w:0.5 });

  /* Aufteilung: links Titel, rechts Nummer/Blatt, ganz links QR */
  var qrW = (qrMatrix ? h - 4 : 0);
  var cx0 = x + (qrW ? qrW + 3 : 0);
  if (qrMatrix) drawQrMatrix(drw, qrMatrix, x + 2, y + 2, h - 4);

  var colR = 62;                        /* rechte Spalte: Nummer, Blatt, Rev */
  var midX = x1 - colR;
  drw.line(midX, y, midX, y1, { w:0.35 });

  /* Titel */
  var titleLines = wrapText(tb.title || 'HAPPY HOUR', midX - cx0 - 4, 5.0, true);
  var ty = y + 6.4;
  titleLines.slice(0, 3).forEach(function (l, i) {
    drw.text(cx0 + 2.5, ty + i * 5.6, l, { size:5.0, bold:true, ls:0.3 });
  });
  var subY = ty + Math.min(3, titleLines.length) * 5.6;
  if (project.subtitle) drw.text(cx0 + 2.5, subY, project.subtitle, { size:3.2 });

  /* Fußzeile im Schriftfeld */
  var fy = y1 - 3.0;
  drw.line(cx0, fy - 4.2, midX, fy - 4.2, { w:0.25 });
  var f1 = 'REZEPTE VON: ' + (tb.recipesBy || '—');
  var f2 = 'ORT: ' + (tb.location || '—');
  var f3 = 'DATUM: ' + (tb.date || '');
  drw.text(cx0 + 2.5, fy, f1, { size:2.7 });
  drw.text(cx0 + 2.5 + Math.max(58, textWidth(f1, 2.7) + 6), fy, f2, { size:2.7 });
  drw.text(midX - 2.5, fy, f3, { size:2.7, anchor:'end' });

  /* rechte Spalte */
  var r1 = y + h * 0.34, r2 = y + h * 0.62;
  drw.line(midX, r1, x1, r1, { w:0.25 });
  drw.line(midX, r2, x1, r2, { w:0.25 });
  drw.text(midX + 2, y + 3.6, 'MASSSTAB', { size:2.2 });
  drw.text(midX + 2, y + 7.4, 'OHNE', { size:3.2, bold:true });
  drw.text(midX + 30, y + 3.6, 'BLATTFORMAT', { size:2.2 });
  drw.text(midX + 30, y + 7.4, project.settings.sheetFormat +
    (project.settings.orientation === 'portrait' ? ' hoch' : ' quer'), { size:3.2, bold:true });
  drw.text(midX + 2, r1 + 3.6, 'ZEICHNUNGSNUMMER', { size:2.2 });
  drw.text(midX + 2, r1 + 8.2, tb.drawingNumber || '—', { size:4.0, bold:true });
  drw.text(midX + 2, r2 + 3.6, 'BLATT', { size:2.2 });
  drw.text(midX + 2, r2 + 7.6, page + ' von ' + pages, { size:3.0, bold:true });
  drw.text(midX + 30, r2 + 3.6, 'REV.', { size:2.2 });
  drw.text(midX + 30, r2 + 7.6, String(tb.revision === undefined ? '0' : tb.revision), { size:3.0, bold:true });
  return { x:x, y:y, w:w, h:h };
}

function drawRevisionTable(drw, L, project, tbBox) {
  var revs = (project.settings.revisions || []).slice(-6);
  if (!revs.length) return;
  var rowh = 4.4, headH = 4.6;
  var w = 108, h = headH + revs.length * rowh;
  var x = tbBox.x - w - 3, y = tbBox.y + tbBox.h - h;
  drw.rect(x, y, w, h, { w:0.35 });
  var cols = [0, 10, 62, 84, w];
  drw.line(x, y + headH, x + w, y + headH, { w:0.25 });
  var heads = ['REV', 'BESCHREIBUNG', 'DATUM', 'NAME'];
  heads.forEach(function (t, i) {
    drw.text(x + cols[i] + 1.4, y + 3.3, t, { size:2.2, bold:true });
    if (i > 0) drw.line(x + cols[i], y, x + cols[i], y + h, { w:0.25 });
  });
  revs.slice().reverse().forEach(function (r, i) {
    var ry = y + headH + i * rowh + 3.1;
    drw.text(x + 1.4, ry, String(r.rev), { size:2.4 });
    var d = r.text || '';
    while (textWidth(d, 2.4) > cols[2] - cols[1] - 3 && d.length > 3) d = d.slice(0, -2);
    drw.text(x + cols[1] + 1.4, ry, d, { size:2.4 });
    drw.text(x + cols[2] + 1.4, ry, r.date || '', { size:2.4 });
    drw.text(x + cols[3] + 1.4, ry, r.by || '', { size:2.4 });
    if (i < revs.length - 1) drw.line(x, y + headH + (i+1)*rowh, x + w, y + headH + (i+1)*rowh, { w:0.15 });
  });
}

/* ---------- QR-Matrix ins Schriftfeld ---------- */
function drawQrMatrix(drw, m, x, y, size) {
  var n = m.length, c = size / n;
  drw.rect(x - 0.8, y - 0.8, size + 1.6, size + 1.6, { w:0, fill:'#FFFFFF' });
  for (var r = 0; r < n; r++) {
    var run = -1;
    for (var q = 0; q <= n; q++) {
      var on = q < n && m[r][q];
      if (on && run < 0) run = q;
      if (!on && run >= 0) {
        drw.rect(x + run * c, y + r * c, (q - run) * c + 0.02, c + 0.02, { w:0, fill:INK });
        run = -1;
      }
    }
  }
}

/* ---------- Blatt zeichnen ---------- */
function drawSheet(project, pageIdx, layout, qrMatrix) {
  var L = layout || computeSheetLayout(project);
  var drw = new Drw();
  var s = project.settings, mono = s.colorMode === 'bw';
  drw.rect(0, 0, L.W, L.H, { w:0, fill:'#FFFFFF' });
  drawFrame(drw, L);

  var list = L.pages[pageIdx] || [];
  var marks = collectMarks(project.cocktails);
  var usedPreps = {};
  project.cocktails.forEach(function (ck) {
    (ck.ingredients || []).forEach(function (i) {
      String(i.prep || '').split('').forEach(function (p) { if (PREP_BY_ID[p]) usedPreps[p] = true; });
    });
  });

  /* Cocktail-Raster */
  var cw = L.areaW / L.cols, ch = L.areaH / L.rows;
  list.forEach(function (ck, i) {
    var c = i % L.cols, r = Math.floor(i / L.cols);
    if (r >= L.rows) return;
    drawCocktail(drw, ck, L.areaX + c * cw, L.areaY + r * ch, cw, ch, {
      scale: L.scale, mono: mono, showTable: s.showNotesTable, unit: s.unit, marks: null
    });
  });

  /* Legendenspalte */
  var lx = L.W - L.mr - L.RC, ly = L.mt + 1, lw = L.RC;
  ly = drawGarnishLegend(drw, lx, ly, lw, marks);
  ly = drawMethodLegend(drw, lx, ly, lw, marks);
  ly = drawPrepLegend(drw, lx, ly, lw, usedPreps);
  var notesH = Math.min(60, 12 + (s.generalNotes || []).length * 6.6);
  var notesY = L.H - L.mb - L.TB_H - 3 - notesH;
  ly = drawIngredientLegend(drw, lx, ly, lw, marks, mono, notesY - ly - 3);
  drawGeneralNotes(drw, lx, notesY, lw, notesH, s.generalNotes);

  var tbBox = drawTitleBlock(drw, L, project, pageIdx + 1, L.pages.length, qrMatrix);
  drawRevisionTable(drw, L, project, tbBox);
  return drw;
}


/* ===== 14_render_svg.js ===== */

/* ============================================================

/* pages: [{ ops, W, H }] */
async function buildPdf(pages, meta) {

      '/Contents ' + contentIds[q] + ' 0 R >>';

    (meta.date || '20260101000000') + ') >>'));

    glass: src.glass, ice: src.ice || 'none', method: src.method || 'b',
    ingredients: (src.ingredients || []).map(function (i, k) {

        var s = JSON.parse(raw);

      } catch (e) { /* defekter Stand wird verworfen */ }

    s.projects.forEach(function (p) {
      p.settings = p.settings || newProject().settings;
      p.settings.generalNotes = p.settings.generalNotes || DEFAULT_NOTES.slice();
      p.settings.revisions = p.settings.revisions || [];
      p.settings.titleBlock = p.settings.titleBlock || newProject().settings.titleBlock;
      p.cocktails = p.cocktails || [];

  save: function () {

      localStorage.setItem(STORE_KEY, JSON.stringify(this.state));

    this.state.activeId = p.id;
    this.save();

  },
  removeProject: function (id) {
    this.state.projects = this.state.projects.filter(function (p) { return p.id !== id; });
    if (!this.state.projects.length) this.state.projects.push(newProject('Neues Projekt'));
    if (!this.state.projects.some(function (p) { return p.id === this.state.activeId; }, this))

}

function importJsonFile(file) {
  var fr = new FileReader();
  fr.onload = function () {
    var obj;
    try { obj = JSON.parse(fr.result); }
    catch (e) { toast('Die Datei ist keine gültige JSON-Datei.'); return; }
    var err = validateImport(obj);
    if (err) { toast(err); return; }
    var proj = normalizeImportedProject(obj.project);
    Store.state.projects.push(proj);
    Store.state.activeId = proj.id;
    (obj.customLibrary || []).forEach(function (c) {
      if (!Store.state.customLibrary.some(function (x) { return x.id === c.id; })) Store.state.customLibrary.push(c);
    });
    Store.save(); UI.tab = 'project'; UI.page = 0; render();
    toast('Projekt „' + proj.name + '“ geladen.');
  };
  fr.readAsText(file);
}

  dlg.appendChild(el('div', { class:'dlg-head' }, [
    el('h2', { text:'Projekt teilen' }),
    el('button', { class:'btn small ghost', onclick:function () { dlg.close(); }, text:'Schließen' })
  ]));
  var body = el('div', { class:'dlg-body' });
  body.appendChild(el('p', { class:'hint', text:'Der Link enthält das gesamte Projekt. Er funktioniert ohne Server – wer ihn öffnet, sieht dieselbe Übersicht.' }));
  body.appendChild(el('div', { class:'linkout', text:url }));
  body.appendChild(el('div', { class:'row', style:'margin:10px 0' }, [
    el('button', { class:'btn primary', onclick:function () {
      navigator.clipboard.writeText(url).then(function () { toast('Link kopiert.'); },
        function () { toast('Kopieren nicht möglich – Link bitte von Hand markieren.'); });
    }, text:'Link kopieren' }),
    navigator.share ? el('button', { class:'btn', onclick:function () {
      navigator.share({ title: Store.project().name, url:url }).catch(function () {});
    }, text:'Teilen' }) : null
  ]));
  if (tooBig) {
    body.appendChild(el('p', { class:'hint', text:'Für einen QR-Code ist dieses Projekt zu umfangreich. Der Link funktioniert weiterhin; alternativ das Projekt als JSON-Datei weitergeben.' }));
  } else {
    body.appendChild(el('div', { class:'qrbox', html: qrToSvg(qm, 260) }));
    body.appendChild(el('p', { class:'hint', text:'Der QR-Code enthält denselben Link (' + url.length + ' Zeichen).' }));
  }
  dlg.appendChild(body);
  dlg.showModal();
}

/* ---------- Editor ---------- */
function blankCocktail() {
  return { id:uid(), sourceId:null, name:'Neuer Cocktail', description:'', category:'Klassiker',
    baseSpirit:'Gin', glass:'coupe', ice:'none', method:'f',
    ingredients:[{ pos:1, ingredientId:'gin', name:'Gin', amount:5, unit:'cl', prep:'f' }],
    garnish:[], altName:null, note:null, noteRef:null, tags:[] };
}
function openEditor(src, opt) {
  opt = opt || {};
  var isNew = !src;
  var work = src ? (opt.inProject ? src : cloneCocktail(src)) : blankCocktail();
  var backup = JSON.parse(JSON.stringify(work));
  var undo = [], redo = [];
  function snap() { undo.push(JSON.stringify(work)); if (undo.length > 40) undo.shift(); redo.length = 0; }
  function restore(str) { var o = JSON.parse(str); for (var k in o) work[k] = o[k]; build(); }

  var dlg = $('#dlg'); clear(dlg);
  var head = el('div', { class:'dlg-head' }, [
    el('h2', { text: isNew ? 'Neuer Cocktail' : work.name }),
    el('button', { class:'btn small ghost', title:'Rückgängig', onclick:function () {
      if (!undo.length) return; redo.push(JSON.stringify(work)); restore(undo.pop());
    }, text:'↶' }),
    el('button', { class:'btn small ghost', title:'Wiederherstellen', onclick:function () {
      if (!redo.length) return; undo.push(JSON.stringify(work)); restore(redo.pop());
    }, text:'↷' })
  ]);
  dlg.appendChild(head);
  var body = el('div', { class:'dlg-body' });
  dlg.appendChild(body);
  var foot = el('div', { class:'dlg-foot' });
  dlg.appendChild(foot);

  function build() {
    clear(body); clear(foot);
    var live = el('div', { class:'livebox', html: cocktailPreviewSvg(work, 0, 0, { scale:1.0 }) });
    var form = el('div', {});

    form.appendChild(el('div', { class:'row' }, [
      field('Name', el('input', { type:'text', value:work.name, oninput:function (e) { work.name = e.target.value; live.innerHTML = cocktailPreviewSvg(work, 0, 0, { scale:1.0 }); } })),
      field('Alternativname', el('input', { type:'text', value:work.altName || '', placeholder:'optional',
        oninput:function (e) { work.altName = e.target.value || null; refresh(live); } }))
    ]));
    form.appendChild(field('Kurzbeschreibung', el('input', { type:'text', value:work.description || '',
      oninput:function (e) { work.description = e.target.value; } })));
    form.appendChild(el('div', { class:'row' }, [
      field('Kategorie', selectOf(CATEGORIES.map(function (c) { return [c, c]; }), work.category,
        function (e) { snap(); work.category = e.target.value; })),
      field('Basis', el('input', { type:'text', value:work.baseSpirit || '',
        oninput:function (e) { work.baseSpirit = e.target.value; } }))
    ]));
    form.appendChild(el('div', { class:'row' }, [
      field('Glas', selectOf(GLASSES.map(function (g) { return [g.id, g.name]; }), work.glass,
        function (e) { snap(); work.glass = e.target.value; refresh(live); })),
      field('Eis', selectOf(ICE_TYPES.map(function (i) { return [i.id, i.name]; }), work.ice,
        function (e) { snap(); work.ice = e.target.value; refresh(live); })),
      field('Methode', selectOf(METHODS.map(function (m) { return [m.id, m.name]; }), work.method,
        function (e) { snap(); work.method = e.target.value; refresh(live); }))
    ]));

    /* Zutaten */
    form.appendChild(el('h3', { style:'margin:16px 0 6px;font-size:13px', text:'Zutaten (von unten nach oben geschichtet)' }));
    var head2 = el('div', { class:'ing' }, [el('span', {}), el('span', { class:'h', text:'Zutat' }),
      el('span', { class:'h', text:'Menge' }), el('span', { class:'h', text:'Einheit' }),
      el('span', { class:'h', text:'Zubereitung' }), el('span', {})]);
    var ings = el('div', { class:'ings' }, [head2]);
    work.ingredients.forEach(function (ing, i) {
      var sel = selectOf(INGREDIENTS.map(function (x) { return [x.id, x.name]; }), ing.ingredientId, function (e) {
        snap(); ing.ingredientId = e.target.value;
        var I = ING_BY_ID[ing.ingredientId]; if (I) { ing.name = I.name; ing.cls = I.cls; ing.color = I.color; }
        refresh(live);
      });
      var amt = el('input', { class:'a', type:'number', step:'0.5', min:'0',
        value: ing.amount === null ? '' : ing.amount,
        disabled: ing.unit === 'fill' ? 'disabled' : null,
        oninput:function (e) { ing.amount = e.target.value === '' ? null : parseFloat(e.target.value); refresh(live); } });
      var un = selectOf(UNITS.map(function (u) { return [u.id, u.name]; }), ing.unit, function (e) {
        snap(); ing.unit = e.target.value;
        if (ing.unit === 'fill') ing.amount = null; else if (ing.amount === null) ing.amount = 1;
        build();
      }, 'u');
      var pr = selectOf(PREPS.map(function (x) { return [x.id, '(' + x.id + ') ' + x.name]; }), ing.prep || 'b',
        function (e) { snap(); ing.prep = e.target.value; refresh(live); }, 'p');
      ings.appendChild(el('div', { class:'ing' }, [
        el('span', { class:'pos', text:String(i + 1) }), sel, amt, un, pr,
        el('button', { class:'btn small ghost', title:'entfernen', onclick:function () {
          snap(); work.ingredients.splice(i, 1); build();
        }, text:'×' })
      ]));
    });
    form.appendChild(ings);
    form.appendChild(el('div', { class:'row', style:'margin-top:8px' }, [
      el('button', { class:'btn small', onclick:function () {
        snap();
        work.ingredients.push({ pos:work.ingredients.length + 1, ingredientId:'zuckersirup',
          name:'Zuckersirup', amount:1, unit:'cl', prep:'f' });
        build();
      }, text:'Zutat hinzufügen' }),
      el('span', { class:'hint', text:'Die erste Zutat liegt in der Zeichnung unten.' })
    ]));

    /* Garnituren */
    form.appendChild(el('h3', { style:'margin:16px 0 6px;font-size:13px', text:'Garnituren und Zusätze' }));
    var gp = el('div', { class:'garnpick' });
    GARNISHES.forEach(function (g) {
      var on = work.garnish.some(function (x) { return x.id === g.id; });
      var cb = el('input', { type:'checkbox', checked: on ? 'checked' : null });
      cb.addEventListener('change', function () {
        snap();
        if (cb.checked) work.garnish.push({ id:g.id, count:1 });
        else work.garnish = work.garnish.filter(function (x) { return x.id !== g.id; });
        refresh(live);
      });
      gp.appendChild(el('label', {}, [cb, el('span', { text:g.name + ' (' + g.key + ')' })]));
    });
    form.appendChild(gp);

    form.appendChild(el('div', { class:'row', style:'margin-top:12px' }, [
      field('Notiz unter der Zeichnung', el('input', { type:'text', value:work.note || '', placeholder:'optional',
        oninput:function (e) { work.note = e.target.value || null; refresh(live); } })),
      field('Hinweisnummer', el('input', { type:'number', min:'0', value:work.noteRef || '',
        oninput:function (e) { work.noteRef = e.target.value ? parseInt(e.target.value, 10) : null; refresh(live); } }))
    ]));

    body.appendChild(el('div', { class:'edsplit' }, [form, live]));

    foot.appendChild(el('button', { class:'btn ghost', onclick:function () {
      var base = work.sourceId && COCKTAIL_BY_ID[work.sourceId];
      if (!base) { toast('Für diesen Cocktail gibt es keine Vorlage zum Zurücksetzen.'); return; }
      snap();
      var fresh = cloneCocktail(base); fresh.id = work.id;
      for (var k in fresh) work[k] = fresh[k];
      build(); toast('Auf die Vorlage zurückgesetzt.');
    }, text:'Auf Vorlage zurücksetzen' }));
    foot.appendChild(el('span', { style:'flex:1' }));
    foot.appendChild(el('button', { class:'btn', onclick:function () {
      for (var k in backup) work[k] = backup[k];
      dlg.close(); render();
    }, text:'Abbrechen' }));
    if (!opt.inProject) {
      foot.appendChild(el('button', { class:'btn', onclick:function () {
        var copy = cloneCocktail(work); copy.sourceId = work.sourceId || null;
        Store.state.customLibrary.push(copy);
        Store.save(); dlg.close(); render(); toast('In der eigenen Sammlung gespeichert.');
      }, text:'In Sammlung speichern' }));
    }
    foot.appendChild(el('button', { class:'btn primary', onclick:function () {
      if (!String(work.name || '').trim()) { toast('Bitte einen Namen vergeben.'); return; }
      if (!work.ingredients.length) { toast('Mindestens eine Zutat ist nötig.'); return; }
      if (!opt.inProject) Store.project().cocktails.push(cloneCocktail(work));
      Store.save(); dlg.close(); UI.tab = 'project'; render();
      toast(opt.inProject ? 'Änderungen übernommen.' : work.name + ' ins Projekt übernommen.');
    }, text: opt.inProject ? 'Änderungen übernehmen' : 'Ins Projekt übernehmen' }));
  }
  function refresh(live) { live.innerHTML = cocktailPreviewSvg(work, 0, 0, { scale:1.0 }); }
  build();
  dlg.showModal();
}

/* ---------- Deeplink ---------- */
function checkDeepLink() {
  var h = location.hash || '';
  if (h.indexOf('#p=') !== 0) return;
  var payload = h.slice(3);
  var obj;
  try { obj = JSON.parse(decompressFromUrl(payload)); }
  catch (e) { toast('Der geteilte Link konnte nicht gelesen werden.'); return; }
  try {
    var r = unpackProject(obj);
    if (!confirm('Der Link enthält das Projekt „' + r.project.name + '“ mit ' +
        r.project.cocktails.length + ' Cocktails. Als neues Projekt hinzufügen?')) {
      history.replaceState(null, '', location.pathname); return;
    }
    Store.state.projects.push(r.project);
    Store.state.activeId = r.project.id;
    r.library.forEach(function (c) { Store.state.customLibrary.push(c); });
    Store.save();
    history.replaceState(null, '', location.pathname);
    UI.tab = 'project';
    toast('Projekt aus dem Link übernommen.');
  } catch (e) { toast('Der geteilte Link ist beschädigt.'); }
}

/* ---------- Start ---------- */
function render() {
  renderBar();
  var root = clear($('#view'));
  if (UI.tab === 'fundus') renderFundus(root);
  else if (UI.tab === 'project') renderProject(root);
  else renderOutput(root);
}
function boot() {
  Store.load();
  checkDeepLink();
  render();
  $('#fileimp').addEventListener('change', function (e) {
    if (e.target.files && e.target.files[0]) importJsonFile(e.target.files[0]);
    e.target.value = '';
  });
  $('#dlg').addEventListener('cancel', function (e) { e.preventDefault(); $('#dlg').close(); render(); });
  window.addEventListener('afterprint', function () { clear($('#printarea')); });
}
if (typeof document !== 'undefined') {
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
}
</script>
</body>
